 civiles sin fines de lucro.","Las Cajas Previsionales. Las Compañías de Seguros, de Reaseguros y Aseguradoras de Riesgos de Trabajo. Las personas humanas con patrimonio neto superior a 100.000 UVAs, acreditado ante el agente.","Las Sociedades del Estado y Empresas del Estado. Las personas jurídicas con patrimonio neto superior a 100.000 UVAs. Las personas humanas mayores de edad residentes en el país con perfil de riesgo agresivo."],"src":"I-111"},{"q":"¿Cuál de las siguientes facultades está expresamente prevista en la Ley N° 26.831 como atribución de la Comisión Nacional de Valores?","opts":["Establecer normas mínimas de capacitación, acreditación y registro para quienes brinden asesoramiento al público inversor.","Establecer los aranceles y comisiones máximos que podrán percibir los agentes registrados por las operaciones que realicen para sus clientes.","Autorizar la designación de los directores y síndicos de las sociedades emisoras admitidas al régimen de oferta pública.","Fijar el precio equitativo de las acciones en las ofertas públicas de adquisición cuando el oferente no lo determine en el anuncio."],"src":"I-112"},{"q":"Las emisoras pueden celebrar asambleas de accionistas a distancia:","opts":["Siempre y cuando se encuentre prevista la posibilidad en su estatuto. Siempre y cuando haya presentado el instructivo de asamblea a distancia ante la Comisión Nacional de Valores.","Siempre y cuando se encuentre prevista la posibilidad en su estatuto y la totalidad de los accionistas con derecho a voto preste conformidad previa a la celebración de cada asamblea.","Siempre y cuando hayan presentado el instructivo de asamblea a distancia ante el mercado en el que listen sus acciones, aun cuando el estatuto no prevea la modalidad.","Siempre y cuando la Comisión Nacional de Valores autorice expresamente cada convocatoria y la asamblea se grabe en soporte digital a disposición de los accionistas."],"src":"I-113"},{"q":"La asamblea ordinaria que trate los asuntos incluidos en el artículo 234, incisos 1º y 2º de la Ley Nº 19.550 y 71 de la Ley Nº 26.831, deberá celebrarse:","opts":["Dentro de los cuatro meses de la fecha de cierre del ejercicio.","Dentro de los seis meses de la fecha de cierre del ejercicio.","Dentro de los dos meses de la fecha de cierre del ejercicio.","Dentro de los doce meses de la fecha de cierre del ejercicio."],"src":"I-114"},{"q":"Agente de Custodia, Registro y Pago y transparencia: ¿cuál es el objetivo principal de exigir plataformas de acceso libre para información de pagos de instrumentos PyME?","opts":["Garantizar acceso público gratuito y actualizado, reduciendo asimetrías informativas.","Maximizar los ingresos del agente por servicios de custodia.","Centralizar toda la información en un sistema accesible solo para reguladores.","Restringir el acceso a la información a inversores calificados registrados."],"src":"I-115"},{"q":"Autorización Automática – Acciones: para acceder al mecanismo por Bajo/Mediano Impacto, el emisor debe:","opts":["Estar admitido al Régimen General y cumplir condiciones específicas de impacto.","Ser una sociedad PyME CNV con al menos un año de antigüedad en el mercado.","Tener calificación de riesgo vigente emitida por entidad registrada.","Contar con autorización previa del mercado donde listan sus acciones."],"src":"I-116"},{"q":"Autorización Automática – FCI: un FCI puede obtener autorización automática cuando:","opts":["Sea sustancialmente equivalente a otro ya aprobado por la misma sociedad gerente, sin cambios en objetivo/política de inversión.","Sea sustancialmente equivalente a otro ya aprobado por cualquier sociedad gerente registrada, siempre que mantenga el mismo objetivo y política de inversión.","Se trate de un fondo abierto de mercado de dinero cuya sociedad gerente cuente con al menos un fondo en funcionamiento, cualquiera sea su objetivo de inversión.","Modifique el objetivo o la política de inversión de un fondo ya aprobado por la misma sociedad gerente."],"src":"I-117"},{"q":"Nuevo Título I – definiciones: ¿cuál fue un cambio central de la RG 1097/2025?","opts":["Unificación/actualización de definiciones transversales (Inversor Calificado, DUVA, PyME CNV, Ratio CEDEAR, Precio Equitativo).","Incorporación de un capítulo de definiciones propias para Fondos Comunes de Inversión, trasladando las definiciones de Inversor Calificado y PyME CNV al Título V.","Eliminación de las figuras de Inversor Calificado y DUVA, reemplazadas por un régimen de inversores con perfil de riesgo verificado por el agente.","Actualización de las definiciones de Emisor Frecuente y Hacedor de Mercado, con derogación de los regímenes de autorización automática por bajo y mediano impacto."],"src":"I-118"},{"q":"Fideicomisos Financieros: ¿a qué responde la simplificación de la RG 1084/2025?","opts":["Simplificar y agilizar procesos de autorización/inscripción reduciendo requisitos.","Aumentar los requisitos de capital y de información periódica exigidos a los fiduciarios financieros registrados ante la Comisión Nacional de Valores.","Eliminar la obligación de inscripción ante la CNV.","Trasladar la regulación de fideicomisos al BCRA."],"src":"I-119"},{"q":"Oferta Privada: ¿qué elemento es clave para delimitar destinatarios habilitados?","opts":["La categoría del destinatario (Inversor Calificado/no calificado).","La residencia del destinatario (en el país/en el exterior).","El monto mínimo de suscripción por destinatario.","La relación previa del destinatario con el emisor o el colocador."],"src":"I-120"},{"q":"Mercados – difusión obligatoria:","opts":["Implementar un mecanismo gratuito y permanente de difusión de VN en circulación (datos identificatorios, fechas, montos y emisores).","Implementar un mecanismo de difusión de VN en circulación accesible a los agentes miembros del mercado (datos identificatorios, fechas, montos y emisores).","Implementar un mecanismo gratuito de difusión de los precios de cierre y volúmenes negociados, actualizado al cierre de cada rueda, para el público inversor.","Remitir mensualmente a la Comisión Nacional de Valores el detalle de los VN en circulación (datos identificatorios, fechas, montos y emisores) para su publicación en la AIF."],"src":"I-121"},{"q":"Representación Digital – alcance en el Título I:","opts":["Incorporar mecanismos basados en tecnología digital dentro del marco del VN, sin alterar requisitos legales de oferta pública.","Eliminar la necesidad de prospectos y documentación escrita.","Crear un mercado paralelo exclusivamente digital sin regulación de la CNV.","Reemplazar completamente los valores negociables físicos por activos digitales no regulados, con eliminación de los requisitos de oferta pública."],"src":"I-122"},{"q":"Tokenización – objetivo regulatorio:","opts":["Modernizar la operatoria del mercado mediante instrumentos digitales regulados.","Prohibir el uso de tecnología blockchain en el mercado de capitales hasta tanto se dicte una ley específica que la regule.","Permitir la emisión de criptomonedas sin regulación estatal.","Eliminar la intervención de la CNV en instrumentos digitales."],"src":"I-123"},{"q":"DUVA – finalidad según definiciones 2025:","opts":["Estandarizar el concepto de DUVA y alinearlo con retiro obligatorio y participaciones residuales.","Crear un nuevo tipo de valor negociable exclusivo para el mercado digital.","Eliminar el mecanismo de retiro obligatorio del régimen de oferta pública.","Permitir que cualquier accionista pueda forzar la adquisición de sus participaciones por la sociedad controlante, sin umbral mínimo de tenencia."],"src":"I-124"},{"q":"Una emisora realizó tres emisiones por suscripción bajo OP Automática (Acciones) en los últimos 12 meses por 2,2 millones, 2,4 millones y 2,6 millones de UVAs. ¿Califica una nueva emisión de 0,5 millones de UVAs como “Mediano Impacto”?","opts":["No, porque las emisiones se consideran como parte de una misma oferta y el total superaría 7 millones de UVAs.","Sí, porque cada emisión se evalúa de forma independiente.","Sí, porque el monto de 0,5 millones de UVAs está por debajo del umbral individual y las emisiones anteriores ya fueron autorizadas por la Comisión Nacional de Valores.","No aplica el régimen de Autorización Automática para acciones."],"src":"I-125"},{"q":"En una Oferta Privada, una emisora planea colocar a 28 adquirentes (20 calificados y 8 no calificados). ¿Cumple el límite?","opts":["Sí, porque no supera 35 adquirentes y los no calificados no exceden 15.","No, porque supera el máximo de 20 adquirentes totales.","No, porque los no calificados no pueden exceder 5 adquirentes.","No, porque la Oferta Privada solo admite Inversores Calificados."],"src":"I-126"},{"q":"Un Agente de Custodia, Registro y Pago publica información de pagos de instrumentos PyME sólo para usuarios registrados. ¿Cumple la RG 1054/2025?","opts":["No, la plataforma debe ser de acceso libre y gratuito para el público inversor.","Sí, cumple porque la normativa no exige acceso público a esa información.","Sí, porque la normativa admite el acceso mediante registro gratuito previo.","No, porque la información de pagos debe publicarse exclusivamente en la AIF de la CNV."],"src":"I-127"}],"2":[{"q":"¿Cuál es el objetivo principal del lavado de activos?","opts":["Simular la licitud del origen de los fondos.","Invertir fondos en activos de alto rendimiento.","Financiar actividades comerciales en el exterior.","Evadir obligaciones impositivas mediante sociedades."],"src":"II-1"},{"q":"¿Cuál de las siguientes NO es una etapa del lavado de activos?","opts":["Fiscalización.","Colocación.","Estratificación.","Integración."],"src":"II-2"},{"q":"¿Qué diferencia principal existe entre lavado de activos y financiamiento del terrorismo?","opts":["El financiamiento del terrorismo puede usar fondos lícitos.","El lavado de activos siempre involucra fondos del narcotráfico; el financiamiento del terrorismo no.","No existe diferencia, ambos delitos tienen el mismo origen de fondos.","El financiamiento del terrorismo requiere montos superiores al lavado de activos."],"src":"II-3"},{"q":"¿Quién es la autoridad de aplicación de la Ley 25.246?","opts":["UIF.","Comisión Nacional de Valores.","Banco Central de la República Argentina.","Ministerio de Seguridad de la Nación."],"src":"II-4"},{"q":"¿Cuál es el plazo para reportar una operación sospechosa según Resolución UIF 56/2024?","opts":["7 días hábiles.","15 días hábiles.","30 días corridos.","48 horas desde la detección."],"src":"II-5"},{"q":"¿Qué norma establece la obligación de reportar operaciones sospechosas?","opts":["Resolución UIF 29/2013.","Ley 25.246.","Resolución UIF 78/2023.","Normas CNV Título XI."],"src":"II-6"},{"q":"¿Cuál de los siguientes es un sujeto obligado según la Ley 25.246?","opts":["Agentes de liquidación y compensación.","Entidades deportivas sin fines de lucro.","Personas humanas que realizan operaciones ocasionales por cuenta propia.","Organismos internacionales con sede en Argentina."],"src":"II-7"},{"q":"¿Qué organismo supervisa el cumplimiento de la normativa de prevención en el mercado de capitales?","opts":["Comisión Nacional de Valores.","Unidad de Información Financiera.","Banco Central de la República Argentina.","Ministerio de Justicia de la Nación."],"src":"II-8"},{"q":"¿Qué significa PEP según la normativa UIF?","opts":["Persona Expuesta Políticamente.","Persona Económicamente Protegida.","Persona con Elevado Patrimonio.","Persona en Proceso de Evaluación."],"src":"II-9"},{"q":"¿Cuál es la finalidad de las 40 Recomendaciones del FATF-GAFI?","opts":["Establecer estándares internacionales contra lavado de activos y financiamiento del terrorismo.","Regular el sistema bancario argentino.","Establecer las penas para el delito de lavado de activos.","Definir las categorías de inversores en el mercado de capitales."],"src":"II-10"},{"q":"¿Cuál es la autoridad encargada de dictar normas sobre prevención de lavado en el mercado de capitales?","opts":["Comisión Nacional de Valores.","Unidad de Información Financiera.","Banco Central de la República Argentina.","Congreso Nacional a través de comisiones especiales."],"src":"II-11"},{"q":"¿Qué organismo centraliza la recepción de Reportes de Operaciones Sospechosas?","opts":["UIF.","Comisión Nacional de Valores.","Banco Central de la República Argentina.","Ministerio Público Fiscal."],"src":"II-12"},{"q":"¿Cuál es la finalidad del Decreto 918/2012?","opts":["Reglamentar la Ley 25.246.","Crear la Comisión Nacional de Valores.","Establecer las penas del delito de lavado de activos.","Regular el funcionamiento de los mercados de capitales."],"src":"II-13"},{"q":"¿Qué característica define al financiamiento del terrorismo?","opts":["Puede usar fondos lícitos.","Requiere fondos de origen ilícito.","Requiere la participación de una entidad financiera.","Se realiza mediante transferencias internacionales."],"src":"II-14"},{"q":"¿Cuál es el objetivo de las 40 Recomendaciones del GAFI?","opts":["Establecer estándares internacionales contra Lavado de Activos y Financiación del Terrorismo.","Definir el régimen sancionatorio del mercado de capitales argentino.","Regular la emisión de valores negociables.","Establecer los requisitos para la inscripción de agentes."],"src":"II-15"},{"q":"¿Qué norma define a las Personas Expuestas Políticamente (PEP)?","opts":["Resolución UIF 192/2024.","Ley 25.246.","Decreto 918/2012.","Resolución UIF 78/2023."],"src":"II-16"},{"q":"¿Cuál es la sanción por incumplir la obligación de reportar operaciones sospechosas?","opts":["Sanción penal y administrativa.","Únicamente sanción administrativa (multa).","Apercibimiento sin consecuencias penales.","Suspensión temporal de la matrícula por 6 meses."],"src":"II-17"},{"q":"¿Qué etapa del lavado implica mover fondos para ocultar su origen?","opts":["Estratificación.","Colocación.","Integración.","Detección."],"src":"II-18"},{"q":"¿Qué plazo tiene un sujeto obligado para conservar documentación respaldatoria?","opts":["5 años.","10 años.","3 años.","1 año."],"src":"II-19"},{"q":"¿Cuál es el objetivo del Reportes de Operaciones Sospechosas?","opts":["Comunicar operaciones sospechosas a la UIF.","Solicitar la apertura de una causa penal contra el cliente.","Informar al público sobre operaciones irregulares del mercado.","Bloquear preventivamente las cuentas del cliente sospechoso."],"src":"II-20"},{"q":"¿Qué norma establece la obligación de identificar al cliente?","opts":["Resolución UIF 3/2014.","Ley 25.246.","Resolución UIF 78/2023.","Normas CNV Título XI."],"src":"II-21"},{"q":"¿Qué autoridad supervisa el cumplimiento de la normativa UIF en el mercado de capitales?","opts":["Comisión Nacional de Valores.","Unidad de Información Financiera directamente.","Banco Central de la República Argentina.","Superintendencia de Seguros de la Nación."],"src":"II-22"},{"q":"¿Qué tipo de operaciones deben ser reportadas como sospechosas?","opts":["Operaciones que no se ajustan al perfil del cliente.","Operaciones que superen el monto fijado por la UIF.","Operaciones realizadas por PEPs, cualquiera sea su monto.","Operaciones en efectivo superiores a $1.000.000."],"src":"II-23"},{"q":"¿Qué norma establece los plazos para Reportes de Operaciones Sospechosas?","opts":["Resolución UIF 56/2024.","Resolución UIF 29/2013.","Ley 25.246.","Resolución UIF 78/2023."],"src":"II-24"},{"q":"¿Qué organismo dicta normas sobre prevención de Lavado de Activos y Financiación del Terrorismo en entidades financieras?","opts":["UIF.","Comisión Nacional de Valores.","Banco Central de la República Argentina.","Ministerio de Economía."],"src":"II-25"},{"q":"¿Qué norma regula la supervisión del cumplimiento de la normativa UIF?","opts":["Resolución UIF 72/2023.","Resolución UIF 78/2023.","Ley 25.246.","Resolución UIF 29/2013."],"src":"II-26"},{"q":"¿Qué norma regula la prevención de Lavado de Activos y la Financiación del Terrorismo en el mercado de capitales?","opts":["Normas CNV Título XI.","Ley 25.246.","Resolución UIF 78/2023.","Resolución UIF 29/2013."],"src":"II-27"},{"q":"¿Qué norma regula la obligación de informar PEP?","opts":["Decreto 918/2012.","Resolución UIF 78/2023.","Ley 25.246.","Normas CNV Título XI."],"src":"II-28"},{"q":"¿Qué norma establece la obligación de reportar operaciones sospechosas en el mercado de capitales?","opts":["Resolución UIF 78/2023.","Resolución UIF 29/2013.","Ley 25.246.","Normas CNV Título XI."],"src":"II-29"},{"q":"¿Qué norma incorpora la figura del encubrimiento y lavado como delito penal?","opts":["Ley 25.246.","Decreto 918/2012.","Resolución UIF 78/2023.","Ley 26.831."],"src":"II-30"},{"q":"¿Cuál de éstos no es uno de los pilares del Programa de Prevención de Lavado de Activos y Financiamiento al Terrorismo (PLAFT) para un Agente?","opts":["La recomendación de los activos en los que podrá operar el cliente, conforme el riesgo que éste desee asumir.","La identificación y conocimiento del cliente conforme al nivel de riesgo que el Sujeto Obligado le haya asignado.","La elaboración de un informe técnico de autoevaluación de riesgos aprobado por el órgano de administración.","La designación de un Oficial de Cumplimiento con acceso directo al órgano de administración del Sujeto Obligado."],"src":"II-31"},{"q":"¿Cuál de las siguientes opciones contempla las tres etapas del Lavado de Activos según GAFI?","opts":["Colocación, diversificación o estratificación e integración.","Colocación, integración y estratificación, en ese orden.","Identificación, colocación y diversificación.","Estratificación, integración y repatriación."],"src":"II-32"},{"q":"¿Cuándo se considera que hecho u operación es sospechosa de lavado de activos?","opts":["Se considera hecho u operación sospechosa aquella operación tentada o realizada que, por sus características o por no poder justificarse la inusualidad tras el análisis efectuado por el Sujeto Obligado, genere sospecha o motivos razonables de que los fondos provienen de un ilícito penal o se vinculan con Lavado de Activos y Financiación del Terrorismo.","Son aquellas operaciones tentadas o realizadas que ocasiona sospecha de LA/FT, o que habiéndose identificado previamente como inusuales, luego de requerirse información adicional al análisis y evaluación realizados por el sujeto obligado, no permitan justificar la inusualidad.","Son aquellas operaciones tentadas o realizadas por motivos que exceden en 50% el monto habitual mensual del comitente negociado a través de ese Sujeto Obligado.","Son aquellas operaciones tentadas o realizadas por motivos que son razonables para sospecha que los bienes o activos involucrados provienen o están vinculados con un ilícito penal o están relacionados a la financiación del terrorismo, o a el financiamiento de la proliferación de armas de destrucción masiva o que, habiéndose identificado previamente como inusuales, luego del análisis y evaluación realizados por el sujeto obligado, no permitan justificar la inusualidad."],"src":"II-33"},{"q":"¿Quién establece formalmente los listados de sanciones financieras dirigidas aplicables en materia de Financiamiento al Terrorismo (por ejemplo, las listas vinculadas a la Resolución 1267)?","opts":["Consejo de Seguridad de las Naciones Unidas.","La Unidad de Información Financiera (UIF).","La Comisión Nacional de Valores.","El Grupo de Acción Financiera Internacional (GAFI)."],"src":"II-34"},{"q":"¿Existe plazo máximo para reportar hechos u operaciones sospechosas de financiación de terrorismo, a partir de la operación realizada o tentada?","opts":["El establecido en la Ley N° 27.739 y en las resoluciones emitidas por la UIF pertinentes a cada tipo de Sujeto Obligado, en el marco de lo dispuesto por la Resolución UIF 56/2024.","Quince (15) días corridos desde que el Sujeto Obligado califica la operación como sospechosa, prorrogables por la UIF a pedido fundado del Oficial de Cumplimiento.","Ciento cincuenta (150) días corridos desde la operación realizada o tentada, conforme la Resolución UIF 78/2023, sin posibilidad de prórroga para los Sujetos Obligados del mercado de capitales.","No existe plazo máximo para la financiación de terrorismo; el plazo previsto en la Ley N° 27.739 y la Resolución UIF 56/2024 rige únicamente para el lavado de activos."],"src":"II-35"},{"q":"¿Existe plazo máximo para reportar hechos u operaciones sospechosas de lavado de activos, a partir de la operación realizada o tentada?","opts":["El establecido en la Ley N° 27.739 y en las resoluciones emitidas por la UIF pertinentes a cada tipo de Sujeto Obligado, en el marco de lo dispuesto por la Resolución UIF 56/2024.","Quince (15) días corridos desde que el Sujeto Obligado califica la operación como sospechosa, prorrogables por la UIF a pedido fundado del Oficial de Cumplimiento.","Ciento cincuenta (150) días corridos desde la operación realizada o tentada, conforme la Resolución UIF 78/2023, sin posibilidad de prórroga para los Sujetos Obligados del mercado de capitales.","El establecido en las Normas CNV (Título XI) para cada categoría de agente, con independencia de lo dispuesto por la Ley N° 27.739 y las resoluciones de la UIF."],"src":"II-36"},{"q":"¿Existe plazo para comunicar a la UIF una operación sospechosa de Financiación del Terrorismo cuando los bienes o dinero involucrados, las personas humanas o jurídicas que lleven a cabo la operación o el destinatario o beneficiario de la operación, se encuentren designados por el CONSEJO DE SEGURIDAD DE LAS NACIONES UNIDAS de conformidad con la Resolución 1267 (1999) y sus sucesivas?","opts":["Sí, sin demora alguna.","No, no existe plazo determinado.","Sí, dentro de los 30 días hábiles.","Sí, dentro de los 15 días corridos."],"src":"II-37"},{"q":"¿Qué es el Lavado de Dinero?","opts":["Es un proceso por el cual una persona que ha obtenido fondos por la comisión de un delito los incorpora a la economía formal, con la finalidad de darles una apariencia lícita.","Es un proceso por el cual una persona incorpora fondos en la economía formal para financiar el narcotráfico.","Es un proceso por el cual una persona que ha obtenido fondos por la comisión del delito de narcotráfico los incorpora a la economía formal.","Es un delito precedente del delito de narcotráfico."],"src":"II-38"},{"q":"¿Qué se entiende por operación inusual?","opts":["Operaciones tentadas o realizadas en forma aislada o reiterada, con independencia del monto, que carecen de justificación económica y/o jurídica, y/o no guardan relación con el nivel de riesgo del cliente o su perfil transaccional, y/o que, por su frecuencia, habitualidad, monto, complejidad, naturaleza y/u otras características particulares, se desvían de los usos y costumbres en las prácticas de mercado.","Operaciones tentadas o realizadas en forma reiterada, a partir del monto mínimo fijado por la UIF, que carecen de justificación económica y/o jurídica, y/o no guardan relación con el nivel de riesgo del cliente o su perfil transaccional, y/o que por su frecuencia, habitualidad, monto, complejidad o naturaleza se desvían de los usos y costumbres en las prácticas de mercado.","Operaciones tentadas o realizadas en forma aislada o reiterada, con independencia del monto, respecto de las cuales el Sujeto Obligado, tras el análisis correspondiente, haya concluido que presentan indicios de lavado de activos o financiación del terrorismo y que, por su frecuencia, habitualidad, monto o complejidad, deben ser reportadas a la UIF.","Operaciones realizadas en forma aislada, con independencia del monto, que carecen de justificación económica y/o jurídica y que, por su frecuencia, habitualidad, monto, complejidad, naturaleza y/u otras características particulares, han sido calificadas como tales por la Comisión Nacional de Valores o por el mercado en el que se concertaron."],"src":"II-39"},{"q":"Algunas de las obligaciones del Oficial de Cumplimiento son:","opts":["Evaluar y verificar la aplicación de las políticas y procedimientos implementados en el Sistema de Prevención de Lavado de Activos y Financiación del Terrorismo, incluyendo el monitoreo de operaciones, la detección oportuna y el Reporte de Operaciones Sospechosas.","Aprobar las políticas, procedimientos y controles del Sistema de Prevención de Lavado de Activos y Financiación del Terrorismo, incluyendo el manual de prevención, en reemplazo del órgano de administración del Sujeto Obligado.","Remitir a la UIF un informe anual con la totalidad de las operaciones inusuales detectadas en el año calendario, hayan sido o no reportadas como sospechosas, con el detalle del análisis efectuado en cada caso.","Verificar que las operaciones realizadas por los clientes del Sujeto Obligado se ajusten a su perfil de riesgo, reportando a la Comisión Nacional de Valores aquellas que lo excedan dentro de las 48 horas de detectadas."],"src":"II-40"},{"q":"Considerando que la matriz de riesgo arroja un nivel de riesgo Medio para un cliente, la debida diligencia a aplicar deberá ser:","opts":["Aplicar medidas de debida diligencia media y actualizar el legajo cada 3 años.","Aplicar medidas de debida diligencia continuada y actualizar el legajo cada año.","Aplicar medidas de debida diligencia simplificada y actualizar el legajo en forma semestral.","Aplicar medidas de debida diligencia simplificada que incluye que el comitente actualice el formulario con las actividades en las cuales se dedica."],"src":"II-41"},{"q":"Cuando una persona jurídica es Sujeto Obligado en los términos del artículo 20 de la Ley N° 25.246, debe designar un Oficial de Cumplimiento. Identifique a continuación quién puede ser designado como tal:","opts":["Un miembro del órgano de administración.","Un miembro del órgano de fiscalización.","Cualquier empleado que haya sido registrado como oficial de cumplimiento ante la CNV.","Cualquier empleado que haya sido designado como Oficial de Cumplimiento por el agente."],"src":"II-42"},{"q":"De acuerdo a las Normas CNV - Título XI NT 2013 y mod., los Sujetos Obligados solo podrán recibir por cliente y por día fondos en efectivo por un monto que no exceda:","opts":["El monto establecido en el artículo 1º de la Ley Nº 25.345.","Los pesos equivalentes a US$ 5.000 dólares estadounidenses al tipo de cambio vendedor del BNA.","Los pesos equivalentes a UVA 10.000 – UVA (Unidad Valor Adquisitivo creado por el BCRA en 2016).","$10.000."],"src":"II-43"},{"q":"Definición de “Beneficiario Final” (Resolución N° 112/2021):","opts":["Será considerado Beneficiario/a Final a la/s persona/s humana/s que posea/n como mínimo el diez por ciento (10 %) del capital o de los derechos de voto de una persona jurídica, un fideicomiso, un fondo de inversión, un patrimonio de afectación y/o de cualquier otra estructura jurídica; y/o a la/s persona/s humana/s que por otros medios ejerza/n el control final de las mismas.","La/s persona/s humana/s que posea/n como mínimo el veinte por ciento (20%) del capital o de los derechos de voto de una persona jurídica, un fideicomiso, un fondo de inversión, o de cualquier otra estructura jurídica; y/o la/s persona/s que ejerza/n control indirecto sobre ellas.","La persona jurídica o humana que reciba el control sobre los beneficios de una operación financiera o comercial y que posea una participación igual o mayor al cinco por ciento (5%).","La/s persona/s humana/s o jurídica/s que, sin importar su participación accionaria, ejerza/n influencia significativa en la toma de decisiones operativas o estratégicas de una entidad."],"src":"II-44"},{"q":"Desde que un hecho u operación es calificada como sospechosa, ¿existe plazo para reportarlo?","opts":["El plazo establecido en la Ley N° 27.739 y en las Resoluciones UIF pertinentes, en el marco de lo dispuesto por la Resolución UIF 56/2024.","Quince (15) días corridos desde la calificación como sospechosa, prorrogables por la UIF a pedido fundado del Oficial de Cumplimiento.","Treinta (30) días hábiles desde la calificación como sospechosa, conforme la Resolución UIF 78/2023, sin posibilidad de prórroga.","El plazo fijado por las Normas CNV (Título XI) para cada categoría de agente, con independencia de lo dispuesto por la Ley N° 27.739."],"src":"II-45"},{"q":"El comitente A es monotributista y realiza un depósito de dinero por la suma de $24.000.000 en su cuenta bancaria, que luego transfiere a su cuenta comitente. Luego de esto emite la orden de compra de un bono local siendo el vendedor de éste el agente encargado de la administración de la cuenta. Seguido de esto, emite una orden de transferencia a una cuenta de un tercero siendo el titular de la misma su cónyuge. La operación debería ser reportada en cualquiera de los siguientes casos:","opts":["Los bonos son vendidos inmediatamente por su cónyuge a un precio menor al observado en las cotizaciones vigentes de mercado al momento de concertarse la operación. Los bonos son colocados como garantía de una caución tomadora y se utilizan los fondos para una operación que no guarda relación con el perfil de riesgo del cliente. Los bonos vuelven a ser transferidos a otra cuenta de tercero sin justificación aparente.","Los bonos son vendidos por su cónyuge a un precio superior al observado en las cotizaciones vigentes de mercado al momento de concertarse la operación. Los bonos son colocados como garantía de una caución colocadora y los fondos se destinan a una operación acorde al perfil de riesgo del cliente. Los bonos permanecen en la cuenta del cónyuge por más de un año sin ser negociados.","Los bonos son vendidos por su cónyuge dentro de los 30 días, cualquiera sea el precio obtenido. Los bonos son colocados como garantía de una caución tomadora por un monto inferior al 50% de su valor de mercado. Los bonos vuelven a ser transferidos a la cuenta comitente original del comitente A con justificación documentada.","El comitente A no acredita el origen de los fondos ante la Comisión Nacional de Valores dentro de los 10 días. Los bonos son vendidos por su cónyuge y los fondos se depositan en una cuenta bancaria del exterior. El agente no cuenta con autorización de la UIF para operar con transferencias entre cuentas de terceros."],"src":"II-46"},{"q":"En el marco de las disposiciones contenidas en las Resoluciones emitidas por la UIF en la materia, el legajo del cliente debe contener, entre otras cosas, alguno de los siguientes puntos:","opts":["Verificación en el Listado de Terroristas Identificación del perfil tributario, económico, financiero y patrimonial.","Verificación en el Listado de Terroristas. Antecedentes crediticios del cliente ante el Banco Central de la República Argentina.","Identificación del perfil tributario, económico, financiero y patrimonial. Certificado de antecedentes penales del cliente emitido por el Registro Nacional de Reincidencia.","Verificación en el Listado de Terroristas. Constancia de inscripción del cliente ante la CNV."],"src":"II-47"},{"q":"El Manual de Prevención de Lavado de Activos y Financiación del Terrorismo deberá:","opts":["Ser aprobado por el órgano competente, mantenerse actualizado y ser accesible y conocido por todo el personal, dejando evidencia de su difusión y capacitación. Deberá encontrarse en domicilio físico y ser de conocimiento del personal.","Ser aprobado por la Unidad de Información Financiera antes de su implementación, mantenerse actualizado y ser accesible al personal del Sujeto Obligado, dejando evidencia de su difusión y capacitación. Deberá encontrarse en soporte papel en el domicilio registrado ante la UIF.","Ser aprobado por la Comisión Nacional de Valores, mantenerse actualizado y ser de conocimiento exclusivo del Oficial de Cumplimiento y del órgano de administración, dejando evidencia de su difusión. Deberá encontrarse en domicilio físico a disposición del organismo de control.","Ser aprobado por el órgano competente y mantenerse actualizado, pudiendo omitirse su difusión al personal cuando exista un Comité de Prevención. Deberá entregarse en copia al mercado en el que opera el agente."],"src":"II-48"},{"q":"El Sistema Anti Lavado/Contra Financiación del Terrorismo argentino:","opts":["Se compone de la UIF como autoridad de aplicación y de organismos supervisores sectoriales (CNV en mercado de capitales, entre otros), además de autoridades judiciales y de seguridad.","Se compone de la UIF como único organismo con facultades de supervisión y sanción, quedando la CNV y los demás organismos sectoriales limitados a funciones de registro.","Se compone de la Comisión Nacional de Valores como autoridad de aplicación en el mercado de capitales y de la UIF como organismo receptor de reportes, sin intervención de autoridades judiciales ni de seguridad.","Se compone de la PROCELAC como autoridad de aplicación y de la UIF como organismo supervisor sectorial, además de la Comisión Nacional de Valores en el mercado de capitales y las autoridades de seguridad."],"src":"II-49"},{"q":"El Sujeto Obligado, en el marco del análisis de una posible operación sospechosa, tiene la obligación de:","opts":["Abstenerse de revelarlas al cliente o a terceros.","Informar a su cliente.","Informar al Mercado donde se genera.","Suspender la operación hasta que la UIF se expida."],"src":"II-50"},{"q":"En caso de detectarse operaciones inusuales se deberá como primera medida:","opts":["Profundizar el análisis con el fin de obtener información que corrobore o revierta las operaciones inusuales detectadas.","Reportarla a la UIF como operación sospechosa dentro de las 24 horas, sin perjuicio de continuar el análisis.","Suspender la ejecución de la operación y notificar al cliente la causa de la suspensión para que aporte la documentación respaldatoria.","Comunicarla a la Comisión Nacional de Valores y al mercado en el que se concertó, para que dispongan las medidas que correspondan."],"src":"II-51"},{"q":"En el caso de tener un cliente extranjero que se declare como PEP, el Sujeto Obligado debe:","opts":["Segmentarlo como de Riesgo Alto.","Informar a la UIF el carácter de PEP del cliente.","Informar a la CNV el carácter de PEP del cliente.","Informar a la ARCA (ex AFIP) el carácter de PEP del cliente."],"src":"II-52"},{"q":"La aplicación de sanciones administrativas a los sujetos obligados que forman parte del Mercado de Capitales por incumplimiento a las obligaciones en materia PLavado de Activos y Financiación del Terrorismo contenidas en la Ley N° 27.739 y las Resoluciones emitidas por la UIF de aplicación en la materia:","opts":["Las efectúa la Unidad de Información Financiera.","Las efectúa la Comisión Nacional de Valores.","Las efectúa el Poder Judicial exclusivamente.","Las efectúan conjuntamente la UIF y el BCRA."],"src":"II-53"},{"q":"La Autoevaluación de Riesgo para un Sujeto Obligado inscripto en la categoría de Agente de Negociación podrá realizarse (Resolución UIF 78/2023):","opts":["Cada dos años.","Cada 4 (cuatro) años.","Cada 6 (seis) meses.","Cada 6 (seis) meses solo si entre sus comitentes tiene alguno declarado PEP."],"src":"II-54"},{"q":"El Informe Técnico de Autoevaluación de Riesgos deberá cumplir con los siguientes requisitos:","opts":["Ser aprobado por órgano de administración o máxima autoridad del S.O., conservarse, ser actualizado con la periodicidad que indique la normativa de aplicación y enviarse a la UIF y Comisión Nacional de Valores.","Ser aprobado por el Oficial de Cumplimiento, conservarse en el domicilio registrado ante la UIF, ser actualizado anualmente y enviarse únicamente a la UIF.","Ser aprobado por el órgano de administración o máxima autoridad del S.O., conservarse, ser actualizado con la periodicidad que indique la normativa de aplicación y enviarse a la UIF y a la Comisión Nacional de Valores.","Ser aprobado por la Comisión Nacional de Valores, conservarse y ser actualizado cada vez que la UIF publique una nueva Evaluación Nacional de Riesgo."],"src":"II-55"},{"q":"La Recomendación 1 del GAFI hace referencia al enfoque que deben tomar los países para las medidas de prevención de Lavado de Activos y Financiación del Terrorismo. Este enfoque debe estar basado en:","opts":["Riesgo.","En la existencia o no de un mercado único de cambios y libre movilidad de capitales.","En las condiciones macroeconómicas del país.","Los delitos."],"src":"II-56"},{"q":"La Revisión Externa Independiente en materia de Prevención de Lavado de Activos y Financiación del terrorismo para los sujetos obligados del mercado de capitales (Resolución UIF 78/2023) debe realizarse al menos:","opts":["Una vez al año.","Cada 3 (tres) meses.","Cada 6 (seis) meses.","Cada 2 (dos) años."],"src":"II-57"},{"q":"La Unidad de Información Financiera (UIF) puede actuar:","opts":["En cualquier jurisdicción del país.","Sólo en la Ciudad Autónoma de Buenos Aires.","En las jurisdicciones donde existan sujetos obligados registrados.","En la jurisdicción federal, con exclusión de las provinciales."],"src":"II-58"},{"q":"Los activos involucrados en el proceso de Lavado de Activos:","opts":["Pueden provenir de cualquier delito.","Provienen del narcotráfico.","Provienen de delitos contra la administración pública.","Provienen de delitos económicos tipificados en el Código Penal."],"src":"II-59"},{"q":"Los Sujetos Obligados deberán conservar la documentación (respecto de la identificación, conocimiento y operaciones) del cliente durante un período mínimo:","opts":["10 años desde la finalización de la relación con el cliente.","5 años desde la finalización de la relación con el cliente.","3 años desde la finalización de la relación con el cliente.","1 año desde la finalización de la relación con el cliente."],"src":"II-60"},{"q":"Los sujetos obligados que operan en el Mercado de Capitales deberán realizar el correspondiente Reporte de Operación Sospechosa ante:","opts":["La Unidad de Información Financiera.","El juzgado penal económico de la jurisdicción donde se hubiera registrado la operación sospechosa.","La Comisión Nacional de Valores.","La PROCELAC."],"src":"II-61"},{"q":"Recibida la notificación de la Resolución de la UIF que dispone el congelamiento administrativo de bienes o dinero en los términos de la Resolución UIF N° 29/2013, el Sujeto Obligado dispone de __________ para informar el resultado de su aplicación, en el caso que haya congelado bienes o dinero.","opts":["60 días.","30 días.","10 días hábiles.","48 horas."],"src":"II-62"},{"q":"Se entiende por Cliente según la Res. UIF 78/2023:","opts":["A toda persona humana, jurídica o estructura jurídica -nacional o extranjera- con la que se establece, de manera ocasional o permanente, una relación contractual de carácter financiero, económico o comercial.","A toda persona humana o jurídica -nacional o extranjera- con la que se establece una relación contractual de carácter permanente, quedando excluidas las relaciones ocasionales y las estructuras jurídicas sin personalidad.","A toda persona humana, jurídica o estructura jurídica nacional con la que se establece una relación contractual de carácter financiero, quedando las personas extranjeras sujetas al régimen de debida diligencia reforzada.","A toda persona humana o jurídica -nacional o extranjera- que haya realizado al menos una operación con el Sujeto Obligado en los últimos doce meses."],"src":"II-63"},{"q":"Según la Res. UIF 3/2014, cuando un sujeto obligado posee como cliente a otro sujeto obligado deberá:","opts":["Solicitar Declaración Jurada sobre el cumplimiento de las disposiciones vigentes en materia de PLD/FT.","Solicitar constancia de inscripción ante ARCA.","Solicitar la constancia de inscripción del Oficial de cumplimiento ante la UIF.","Solicitar una constancia emitida por la CNV de que no ha recibido sanciones de ese organismo regulador en los últimos 6 años."],"src":"II-64"},{"q":"Según Res. 78/2023, los legajos deben confeccionarse para:","opts":["Todos los clientes.","Presentarlo en forma anual al mercado en el cual opere el agente.","Presentarlo en forma anual a la UIF.","Clientes y proveedores."],"src":"II-65"},{"q":"Señale cuál de las siguientes afirmaciones es correcta:","opts":["Los fondos utilizados en el lavado de activos provienen exclusivamente de actividades ilícitas.","Los fondos utilizados en el lavado de activos pueden provenir tanto de actividades lícitas como ilícitas.","La financiación del terrorismo solo puede provenir de actividades ilícitas.","Los fondos utilizados en la financiación del terrorismo provienen exclusivamente de actividades ilícitas."],"src":"II-66"},{"q":"Pueden ser Personas Expuestas Políticamente (PEPs), de conformidad con lo dispuesto por la Resolución UIF 192/2024:","opts":["Personal del Poder Legislativo de la Nación. Funcionarios o empleados de entidades autárquicas, bancos oficiales, obras sociales estatales, empresas del Estado, o de sociedades con participación estatal mayoritaria. Funcionarios o empleados públicos con poder de decisión en comisiones de adjudicación.","Personal del Poder Legislativo de la Nación. Funcionarios o empleados de entidades autárquicas, bancos oficiales, obras sociales estatales, empresas del Estado, o de sociedades con participación estatal mayoritaria. Profesionales independientes que intervengan en operaciones patrimoniales por cuenta de dichas personas.","Personal del Poder Legislativo de la Nación y de las Provincias. Funcionarios o empleados de entidades autárquicas y bancos oficiales. Accionistas de sociedades con participación estatal minoritaria y sus cónyuges, con independencia de la función que ejerzan.","Funcionarios o empleados públicos con poder de decisión en comisiones de adjudicación. Directores y gerentes de los Sujetos Obligados registrados ante la Comisión Nacional de Valores. Funcionarios o empleados de obras sociales estatales y empresas del Estado."],"src":"II-67"},{"q":"Conforme surge de la Resolución UIF 78/2023, los Regímenes Informativos a reportar ante UIF deberán informarse:","opts":["De manera mensual: listado de cuentas comitentes diferenciando entre activos e inactivos, identificando asimismo las subcuentas correspondientes a la cartera propia de la sociedad.","De manera mensual: Información societaria/estructura, listado de cuentas comitentes diferenciando entre activas e inactivas y transferencias internacionales de valores negociables.","De manera mensual: las transferencias internacionales de valores negociables, información societaria/estructura e información de negocios (productos, servicios, etc.).","De manera anual: listado de cuentas comitentes diferenciando entre activos e inactivos y transferencias internacionales de valores negociables, dentro de los primeros 15 días de marzo."],"src":"II-68"},{"q":"Una Organización sin fines de lucro es cliente de una sociedad y recibe fondos de una donación. Con estos fondos realiza la compra de Bonos (Legislación Local), los cuáles transfiere inmediatamente después de su compra a una cuenta radicada en el exterior. El procedimiento de control a efectuar sería:","opts":["Determinar el origen de la donación y el destino de la cuenta a la cual son transferidos los fondos.","Reportar la operación como sospechosa de inmediato sin análisis previo.","Rechazar la operación y cancelar la cuenta del cliente.","Solicitar autorización judicial previa para procesar la donación."],"src":"II-69"},{"q":"Una de las obligaciones del Sujeto Obligado conforme los incs. a y b, art. 21, Ley N° 25.246 y mod., es:","opts":["Recabar de sus clientes, requirentes o aportantes documentos que prueben fehacientemente su identidad, personería jurídica, domicilio, residencia y demás datos que en cada caso se estipule, para realizar cualquier tipo de actividad de las que tienen por objeto.","Remitir a la UIF un listado exhaustivo de todos los clientes identificados como PEP (Persona Expuesta Políticamente), destacando las operaciones sospechosas realizadas durante el periodo.","Remitir a la CNV un listado consolidado de clientes PEP, acompañado de un informe que indique el perfil de riesgo asignado a cada cliente y las medidas de monitoreo adoptadas en cada caso.","Informar todas las operaciones detectadas como inusuales a las autoridades correspondientes, proporcionando detalles claros sobre las circunstancias."],"src":"II-70"},{"q":"La Autoevaluación de Riesgo para un Sujeto Obligado inscripto en la categoría de Agente Asesor Global de Inversión podrá realizarse (Resolución UIF 78/2023):","opts":["Cada dos años;","Cada un año.","Cada tres años.","Cada cinco años."],"src":"II-71"},{"q":"Se entiende por debida diligencia:","opts":["A los procedimientos de conocimiento aplicables a todos los Clientes, los que se llevarán a cabo teniendo en cuenta los niveles de riesgo asignados a cada uno de ellos.","A los procedimientos de conocimiento aplicables únicamente a los Clientes de riesgo alto, los que se llevarán a cabo con independencia del nivel de riesgo asignado al resto.","A los procedimientos de verificación de identidad que el Sujeto Obligado aplica al inicio de la relación comercial, sin que corresponda su actualización posterior.","A los procedimientos de monitoreo de operaciones que la Comisión Nacional de Valores aplica a los Sujetos Obligados, teniendo en cuenta el nivel de riesgo asignado a cada uno de ellos."],"src":"II-72"},{"q":"Conforme las Normas CNV se consideran como Sujetos Obligados que actúan en el ámbito de Mercado de Capitales a:","opts":["Agentes de Negociación, Agentes de Liquidación y Compensación, Agentes de colocación y distribución que actúen en la colocación de Fondos Comunes de Inversión o de otros productos de inversión colectiva, Agentes Asesores Globales de Inversión, Fiduciarios financieros que actúen en ese carácter en fideicomisos financieros con oferta pública autorizada por la Comisión, Plataformas de Financiamiento Colectivo y Proveedores de Servicios de Activos Virtuales;","Agentes de Negociación, Agentes de Liquidación y Compensación, Agentes Productores, Agentes Asesores Globales de Inversión, Agentes de Calificación de Riesgo, Sociedades Gerentes y Depositarias de Fondos Comunes de Inversión, Mercados y Cámaras Compensadoras, con exclusión de las Plataformas de Financiamiento Colectivo y de los Proveedores de Servicios de Activos Virtuales;","Agentes de Liquidación y Compensación, Agentes de colocación y distribución que actúen en la colocación de Fondos Comunes de Inversión, Fiduciarios financieros que actúen en fideicomisos con oferta pública autorizada por la Comisión y Proveedores de Servicios de Activos Virtuales, quedando excluidos los Agentes de Negociación y los Agentes Asesores Globales de Inversión por no administrar fondos de clientes;","Mercados, Cámaras Compensadoras, Agentes de Depósito Colectivo, Agentes de Custodia, Registro y Pago, Agentes de Calificación de Riesgo y Agentes de Negociación, Agentes de Liquidación y Compensación y Agentes Asesores Globales de Inversión, en tanto todos ellos se encuentran registrados ante la Comisión Nacional de Valores;"],"src":"II-73"},{"q":"Conforme las Normas CNV no se consideran como Sujetos Obligados que actúan en el ámbito de Mercado de Capitales a:","opts":["Agentes de Liquidación y Compensación Participantes Directos. Agentes Productores.","Los Agentes de Negociación registrados ante la CNV.","Todos los agentes del mercado de capitales sin excepción.","Los Agentes de Liquidación y Compensación Integrales."],"src":"II-74"},{"q":"Los Agentes de Liquidación y Compensación y las personas humanas y/o jurídicas registradas ante la Comisión que actúen en la colocación de Fondos Comunes de Inversión o de otros productos de inversión colectiva autorizados por el Organismo, en materia de recepción de fondos de sus Clientes deberán verificar que:","opts":["Sean efectuadas desde cuentas de titularidad o cotitularidad del cliente (CBU/CVU) abiertas en entidades del país autorizadas por el BCRA, que permitan la identificación y trazabilidad de transferencia;","Sean efectuadas desde cuentas bancarias del cliente o de terceros debidamente autorizados por éste (CBU/CVU) abiertas en entidades del país o del exterior, que permitan la identificación del ordenante;","Sean efectuadas desde cuentas de titularidad del cliente abiertas en entidades del país autorizadas por el BCRA, no admitiéndose las cuentas de cotitularidad ni las CVU de proveedores de servicios de pago;","Sean efectuadas desde cuentas de titularidad o cotitularidad del cliente abiertas en entidades del país, o bien en efectivo hasta el monto máximo fijado por la UIF, con constancia de la identificación del depositante;"],"src":"II-75"},{"q":"El capital de una sociedad asciende a $10.000.000 y se conforma de la siguiente manera: - Socio A:$ 2.000.000 - Socio B: $300.000 - Socio C:$ 7.700.000. De acuerdo a la normativa vigente, determinar quiénes son los beneficiarios finales.","opts":["Socio A y C.","Socio A y Socio B son beneficiarios finales.","Solo el Socio C es beneficiario final.","Socio A, B y C, por ser todos titulares de participaciones en el capital."],"src":"II-76"},{"q":"La Comisión Nacional de Valores requiere respecto de todas aquellas personas humanas o jurídicas que aspiren obtener la inscripción en sus registros el cumplimiento de requisitos de INTEGRIDAD, IDONEIDAD y SOLVENCIA. A los fines de acreditar el cumplimiento del requisito de INTEGRIDAD se deberá presentar:","opts":["Certificado de antecedentes penales y Declaración Jurada de PLAFT;","Certificado de antecedentes penales y constancia de inscripción en la AFIP.","Declaración Jurada de PLAFT y certificado de deudores morosos del BCRA.","Certificado de antecedentes penales y Declaración Jurada de bienes."],"src":"II-77"},{"q":"La Comisión Nacional de Valores requiere respecto de todas aquellas personas humanas o jurídicas que aspiren obtener la inscripción en sus registros el cumplimiento de requisitos de INTEGRIDAD, IDONEIDAD y SOLVENCIA. A los fines de acreditar el cumplimiento del requisito de SOLVENCIA se deberá presentar:","opts":["Informe de antecedentes comerciales actualizado.","Certificado de antecedentes penales actualizado.","Declaración Jurada de PLAFT firmada ante escribano público.","Certificado de libre deuda impositiva emitido por AFIP."],"src":"II-78"},{"q":"El manual de prevención de Lavado de Activos y Financiación del Terrorismo deberá ser revisado:","opts":["Anualmente.","Cada dos años.","Cada seis meses.","Solo cuando la UIF lo requiera expresamente."],"src":"II-79"},{"q":"Respecto del Código de Conducta:","opts":["Deberá contener los principios rectores y valores de integridad y de adecuada capacidad o conocimiento técnico. Deberá incluir el carácter obligatorio de las políticas, los procedimientos y los controles que integran su Sistema de Prevención de Lavado de Activos y Financiación del Terrorismo y su adecuada implementación, de acuerdo con la normativa vigente sobre la materia, debiendo ser cumplido por los directores, gerentes, empleados y colaboradores del Sujeto Obligado. Cada Sujeto Obligado deberá tener una constancia fehaciente del conocimiento que han tomado los directores, gerentes, empleados y colaboradores sobre el Código de Conducta. Cualquier incumplimiento a las políticas, procedimientos y controles del Sistema de Prevención de Lavado de Activos y Financiación del Terrorismo deberá ser contemplada como una falta interna en el Código de Conducta.","Deberá contener los principios rectores y valores de integridad y de adecuada capacidad o conocimiento técnico. Deberá incluir las políticas, procedimientos y controles del Sistema de Prevención de Lavado de Activos y Financiación del Terrorismo, con carácter orientativo para los directores, gerentes, empleados y colaboradores del Sujeto Obligado. Cada Sujeto Obligado deberá remitirlo a la UIF y a la Comisión Nacional de Valores para su aprobación previa. Los incumplimientos a las políticas del Sistema de Prevención serán tratados conforme el régimen disciplinario general, sin necesidad de contemplarlos en el Código de Conducta.","Deberá contener los principios rectores y valores de integridad y de adecuada capacidad o conocimiento técnico. Deberá incluir el carácter obligatorio de las políticas, procedimientos y controles del Sistema de Prevención de Lavado de Activos y Financiación del Terrorismo, debiendo ser cumplido por los directores y gerentes del Sujeto Obligado, no así por los empleados y colaboradores, que se rigen por el manual de prevención. Cada Sujeto Obligado deberá tener una constancia fehaciente del conocimiento del Código por parte de los directores y gerentes. Cualquier incumplimiento será reportado a la UIF como operación sospechosa.","Deberá contener las sanciones disciplinarias aplicables al personal y los principios rectores de integridad. Deberá incluir las políticas, procedimientos y controles del Sistema de Prevención de Lavado de Activos y Financiación del Terrorismo, de cumplimiento obligatorio para los directores, gerentes, empleados y colaboradores del Sujeto Obligado. Cada Sujeto Obligado deberá renovarlo anualmente con la conformidad del Comité de Prevención. Cualquier incumplimiento a las políticas del Sistema de Prevención deberá ser contemplado como falta interna y comunicado a la Comisión Nacional de Valores dentro de los 10 días."],"src":"II-80"},{"q":"El capital de una sociedad asciende a $5.000.000 y se conforma de la siguiente manera: - Socio A:$ 250.000 - Socio B: $500.000 - Socio C:$ 2.500.000 - Socio D: $ 1.750.000. De acuerdo a la normativa vigente determinar quiénes son los beneficiarios finales.","opts":["Socio B, C y D.","Socio A y Socio B son beneficiarios finales.","Todos los socios son beneficiarios finales.","Solo el Socio D es beneficiario final por tener la mayor participación."],"src":"II-81"},{"q":"El plan de capacitación en materia de Lavado de Activos y Financiación del Terrorismo deberá contener:","opts":["Normativa nacional y estándares internacionales vigentes sobre prevención de Lavado de Activos y Financiación del Terrorismo Definición de los delitos de Lavado de Activos y Financiación del Terrorismo.","Normativa nacional vigente sobre prevención de Lavado de Activos y Financiación del Terrorismo. Procedimientos internos del Sujeto Obligado, con exclusión de los estándares internacionales, que son de aplicación voluntaria.","Normativa nacional y estándares internacionales vigentes sobre prevención de Lavado de Activos y Financiación del Terrorismo. Nómina actualizada de los clientes calificados como de riesgo alto por el Sujeto Obligado.","Definición de los delitos de Lavado de Activos y Financiación del Terrorismo. Resumen de los Reportes de Operaciones Sospechosas presentados por el Sujeto Obligado en el último año calendario."],"src":"II-82"},{"q":"Son obligaciones del Oficial de Cumplimiento:","opts":["Proponer las políticas, procedimientos y controles para administrar y mitigar los riesgos de Lavado de Activos y Financiación del Terrorismo. Atender los requerimientos de información solicitados por la UIF y Comisión Nacional de Valores.","Aprobar las políticas, procedimientos y controles para administrar y mitigar los riesgos de Lavado de Activos y Financiación del Terrorismo, en reemplazo del órgano de administración.","Proponer las políticas, procedimientos y controles para administrar y mitigar los riesgos de Lavado de Activos y Financiación del Terrorismo. Atender los requerimientos de información solicitados por el BCRA y la AFIP.","Presentar los Reportes de Operaciones Sospechosas ante la Comisión Nacional de Valores, que los eleva a la UIF. Atender los requerimientos de información solicitados por los mercados."],"src":"II-83"},{"q":"Dos o más sujetos obligados vinculados entre sí por una relación de control o pertenecientes a una misma organización societaria:","opts":["Pueden designar un único Oficial de Cumplimiento titular y suplente. Pueden compartir legajos de Clientes.","Deben designar un Oficial de Cumplimiento titular por cada entidad. No pueden compartir legajos de Clientes.","Pueden designar un único Oficial de Cumplimiento titular y suplente, previa autorización de la UIF. Deben mantener legajos de Clientes separados por entidad.","Pueden compartir legajos de Clientes y el manual de prevención. Deben designar un Oficial de Cumplimiento titular distinto para cada entidad."],"src":"II-84"},{"q":"El Comité de Prevención de Lavado de Activos y Financiación del Terrorismo puede estar integrado por:","opts":["Oficial de Cumplimiento y funcionarios del primer nivel gerencial cuyas funciones se encuentren relacionadas con riesgos de Lavado de Activos y Financiación del Terrorismo.","Oficial de Cumplimiento y auditor externo designado por el Sujeto Obligado, con exclusión de los funcionarios de las áreas comerciales cuyas funciones generen riesgos de Lavado de Activos y Financiación del Terrorismo.","Oficial de Cumplimiento y al menos dos miembros del órgano de administración, no pudiendo integrarlo funcionarios del nivel gerencial del Sujeto Obligado.","Miembros del órgano de administración y funcionarios del primer nivel gerencial, con exclusión del Oficial de Cumplimiento, a fin de preservar la independencia de su función."],"src":"II-85"},{"q":"Los Sujetos Obligados pueden depender de otros Sujetos Obligados para la ejecución de las medidas de Debida Diligencia del Cliente, únicamente respecto de:","opts":["La identificación y verificación del Cliente; La identificación y verificación del beneficiario final; La comprensión del propósito y carácter de la relación comercial;","La identificación y verificación del Cliente; La presentación de los Reportes de Operaciones Sospechosas ante la UIF; La capacitación del personal;","La identificación y verificación del beneficiario final; La capacitación del personal en materia de prevención; La elaboración del informe técnico de autoevaluación de riesgos;","La identificación y verificación del Cliente; La identificación y verificación del beneficiario final; El monitoreo continuo de las operaciones del Cliente y su calificación de riesgo;"],"src":"II-86"},{"q":"De acuerdo con las definiciones receptadas en el artículo 4° bis de la Ley 25.246 y mod. y la Resolución UIF 49/2024, son Proveedores de Servicios de Activos Virtuales toda persona humana o jurídica que, como negocio, realice una o más de las siguientes actividades para o en nombre de terceros:","opts":["Custodia y/o administración de activos virtuales o instrumentos que permitan el control sobre los mismos;","Emisión de valores negociables digitales regulados por la CNV.","Operaciones de cambio de divisas realizadas en el mercado electrónico.","Compraventa de títulos públicos a través de plataformas digitales."],"src":"II-87"},{"q":"Considerando que la matriz de riesgo arroja un nivel de riesgo ALTO para un Cliente, la debida diligencia a aplicar deberá ser:","opts":["Aplicar medidas de debida diligencia reforzado y actualizar el legajo 1 año.","Aplicar medidas de debida diligencia simplificada y actualizar el legajo cada 5 años.","Solo monitorear las operaciones sin actualizar el legajo.","Dar de baja al cliente de forma inmediata."],"src":"II-88"},{"q":"Considerando que la matriz de riesgo arroja un nivel de riesgo BAJO para un Cliente, la debida diligencia a aplicar deberá ser:","opts":["Aplicar mediadas de debida diligencia simplificada y actualizar el legajo cada 5 años;","Aplicar medidas de debida diligencia reforzada y actualizar el legajo cada año.","No es necesario aplicar medidas de debida diligencia.","Reportar al cliente como sospechoso ante la UIF."],"src":"II-89"},{"q":"Conforme la Resolución 49/2024 se considera Proveedor de Servicios de Activos Virtuales:","opts":["Cualquier persona humana o jurídica que, como negocio, realiza una o más de las siguientes actividades u operaciones para o en nombre de otra persona humana o jurídica: i. intercambio entre activos virtuales y monedas de curso legal (monedas fiduciarias); ii. intercambio entre una o más formas de activos virtuales; iii. transferencia de activos virtuales; iv. custodia y/o administración de activos virtuales o instrumentos que permitan el control sobre los mismos; y v. participación y provisión de servicios financieros relacionados con la oferta de un emisor y/o venta de un activo virtual;","Cualquier persona jurídica constituida en el país que, como negocio, realiza una o más de las siguientes actividades para terceros: i. intercambio entre activos virtuales y monedas de curso legal; ii. intercambio entre una o más formas de activos virtuales; iii. custodia y/o administración de activos virtuales; quedando excluidas las personas humanas y la mera transferencia de activos virtuales, por no implicar control sobre los mismos.","Cualquier persona humana o jurídica que, por cuenta propia o de terceros, realiza una o más de las siguientes actividades: i. intercambio entre activos virtuales y monedas de curso legal; ii. transferencia de activos virtuales; iii. custodia de activos virtuales; iv. emisión de activos virtuales propios; v. minería de activos virtuales; con independencia de que la actividad se realice o no como negocio.","Cualquier entidad financiera autorizada por el BCRA o agente registrado ante la Comisión Nacional de Valores que, como negocio, realiza para terceros: i. intercambio entre activos virtuales y monedas de curso legal; ii. intercambio entre formas de activos virtuales; iii. transferencia de activos virtuales; iv. custodia y/o administración de activos virtuales; v. servicios financieros relacionados con la oferta de un emisor de activos virtuales."],"src":"II-90"},{"q":"El Sujeto Obligado debe realizar una declaración de tolerancia al riesgo, debidamente fundada y aprobada por el órgano de administración o la máxima autoridad que deberá ser enviada a:","opts":["La UIF y la Comisión Nacional de Valores;","La UIF, dentro de los 30 días de aprobada.","La Comisión Nacional de Valores y el mercado en el que opere.","El BCRA y la AFIP."],"src":"II-91"},{"q":"El Sujeto Obligado deberá adoptar, entre otras y como mínimo, políticas, procedimientos y controles a los efectos de:","opts":["Identificar, verificar y conocer en forma continua a los beneficiarios finales de sus clientes.","Monitorear las operaciones del mercado en tiempo real.","Reportar todas las operaciones de sus clientes a la UIF mensualmente.","Capacitar al personal del regulador en materia de prevención."],"src":"II-92"},{"q":"Conforme la Resolución 49/2024 se considera como Activos Virtuales a:","opts":["La representación digital de valor que se puede comercializar y/o transferir digitalmente y utilizar para pagos o inversiones.","La representación digital de valor emitida o respaldada por un banco central, utilizable para pagos.","La representación digital de un activo físico o financiero subyacente, que se puede comercializar en mercados autorizados por la Comisión Nacional de Valores.","La representación digital de valor que se puede comercializar y/o transferir digitalmente, con exclusión de las utilizadas para pagos, que se rigen por la normativa del BCRA."],"src":"II-93"},{"q":"El órgano de administración o máxima autoridad del Sujeto Obligado será el responsable de:","opts":["Entender y tomar en cuenta los riesgos de Lavado de Activos y Financiación del Terrorismo/FP al establecer sus objetivos comerciales;","Aprobar el Reporte de Operaciones Sospechosas antes de su presentación ante la UIF, evaluando en cada caso los riesgos de Lavado de Activos y Financiación del Terrorismo/FP;","Designar al Oficial de Cumplimiento y supervisar su gestión, sin intervenir en la evaluación de los riesgos de Lavado de Activos y Financiación del Terrorismo/FP;","Remitir a la Comisión Nacional de Valores los objetivos comerciales del Sujeto Obligado junto con la evaluación de riesgos de Lavado de Activos y Financiación del Terrorismo/FP;"],"src":"II-94"},{"q":"Conforme la Resolución 49/2024 los Proveedores de Servicios de Activos Virtuales deberán realizar de forma sistemática los siguientes reportes:","opts":["Reporte sistemático anual (RSA) que deberá ser remitido entre el día 2 de enero y el 15 de marzo inclusive de cada año, respecto del año calendario anterior;","Reporte sistemático mensual (RSM) que deberá ser remitido dentro de los primeros 15 días de cada mes, respecto de las operaciones del mes calendario anterior;","Reporte sistemático anual (RSA) que deberá ser remitido entre el 1 de marzo y el 30 de abril de cada año, respecto del año calendario anterior;","Reporte sistemático trimestral (RST) que deberá ser remitido a la Comisión Nacional de Valores dentro de los 30 días del cierre de cada trimestre calendario;"],"src":"II-95"},{"q":"En el Informe técnico de autoevaluación de riesgos, el Sujeto Obligado deberá:","opts":["Considerar los factores de riesgo previstos en el artículo 4° de la citada resolución, en cada una de sus líneas de negocio, el nivel de riesgo inherente, el nivel y tipo apropiado de administración y mitigación a aplicar; Tener en consideración e incorporar la información suministrada por la UIF u otras autoridades competentes acerca de los riesgos de Lavado de Activos y Financiación del Terrorismo/FP; Considerar los resultados de las Evaluaciones Nacionales de Riesgo de Lavado de Activos y Financiación del Terrorismo/FP y sus actualizaciones, como así también otros documentos en los que se identifiquen riesgos vinculados con el sector, tipologías y/o guías elaboradas por organismos nacionales e internacionales; Ser autosuficiente, estar documentado y conservarse junto con la metodología, la documentación, los datos estadísticos y la información que lo sustente, en el domicilio registrado ante la UIF.","Considerar los factores de riesgo previstos en el artículo 4° de la citada resolución a nivel global del Sujeto Obligado, sin necesidad de desagregarlos por línea de negocio, y el nivel de riesgo residual resultante; Tener en consideración la información suministrada por la UIF u otras autoridades competentes acerca de los riesgos de Lavado de Activos y Financiación del Terrorismo/FP; Considerar los resultados de las Evaluaciones Nacionales de Riesgo de Lavado de Activos y Financiación del Terrorismo/FP y sus actualizaciones; Ser remitido a la UIF para su aprobación previa junto con la metodología, la documentación y los datos estadísticos que lo sustenten.","Considerar los factores de riesgo previstos en el artículo 4° de la citada resolución, en cada una de sus líneas de negocio, el nivel de riesgo inherente y el nivel y tipo apropiado de administración y mitigación a aplicar; Tener en consideración la información suministrada por la Comisión Nacional de Valores y por los mercados acerca de los riesgos de Lavado de Activos y Financiación del Terrorismo/FP; Considerar las tipologías y guías elaboradas por organismos nacionales e internacionales; Ser elaborado por un auditor externo independiente y conservarse en el domicilio del Oficial de Cumplimiento.","Considerar los factores de riesgo previstos en el artículo 4° de la citada resolución únicamente respecto de los clientes calificados como de riesgo alto, el nivel de riesgo inherente y las medidas de mitigación aplicadas; Tener en consideración la información suministrada por la UIF acerca de los riesgos de Lavado de Activos y Financiación del Terrorismo/FP; Considerar los resultados de las Evaluaciones Nacionales de Riesgo; Ser autosuficiente, estar documentado y conservarse en el domicilio registrado ante la Comisión Nacional de Valores, con actualización semestral obligatoria."],"src":"II-96"},{"q":"Los Reportes de Operaciones Sospechosas deberán:","opts":["Estar fundados y contener una descripción de las razones y/o inusualidades por las cuales se considera que la operación presenta tal carácter;","Estar fundados y contener una descripción de la operación, sin consignar las razones por las cuales se la considera sospechosa, a fin de no condicionar el análisis de la UIF;","Contener la identificación del cliente y el monto de la operación, remitiéndose el análisis únicamente a requerimiento posterior de la UIF;","Estar fundados y ser comunicados previamente al cliente involucrado, a fin de que pueda aportar la documentación que justifique la operación antes de su presentación ante la UIF;"],"src":"II-97"},{"q":"Al Comitente A le fue asignado un perfil de riesgo Alto con un cupo operativo anual de $6.000.000. En el mes de mayo dicho Comitente opera por $900.000. En este caso el AlyC deberá:","opts":["Solicitar documentación de respaldo;","Reportar la operación como sospechosa de inmediato.","Rechazar la operación sin análisis adicional.","Bloquear la cuenta del comitente preventivamente."],"src":"II-98"},{"q":"Al Comitente A le fue asignado un perfil de riesgo Alto con un cupo operativo anual de $6.000.000. En el mes de mayo dicho Comitente ingresa dinero en la Cuenta Comitente por $18.000.000. Ante el requerimiento del AlyC, el Cliente informa que el dinero proviene de la venta de su automóvil. En este caso el AlyC deberá:","opts":["Solicitar documentación de respaldo;","Reportar la operación como sospechosa de inmediato.","Rechazar la operación sin análisis adicional.","Bloquear la cuenta del comitente preventivamente."],"src":"II-99"},{"q":"En el Registro de Operaciones Inusuales solo debe asentarse:","opts":["Múltiples elementos simultáneamente, entre ellos: datos completos del cliente, detalle de la operación, motivos por los que fue considerada inusual, análisis realizado, documentación respaldatoria, fecha de detección, decisión final (si se reporta o no como SOS), responsable interviniente, conclusiones motivadas.","Los datos completos del cliente, el detalle de la operación y la fecha de detección, remitiéndose el análisis realizado, la documentación respaldatoria y la decisión final únicamente a la UIF en el Reporte de Operación Sospechosa.","Las operaciones que hayan sido finalmente reportadas como sospechosas a la UIF, con los datos del cliente, el detalle de la operación, los motivos del reporte, el responsable interviniente y la fecha de presentación ante la UIF.","Las operaciones inusuales que superen el monto fijado por la UIF, con el detalle de la operación, los motivos por los que fue considerada inusual, la documentación respaldatoria y las conclusiones del Oficial de Cumplimiento."],"src":"II-100"},{"q":"Ley 27.739: ámbito sancionatorio. ¿Quién aplica sanciones administrativas por incumplimientos en PLavado de Activos y Financiación del Terrorismo?","opts":["UIF.","La Comisión Nacional de Valores.","El Poder Judicial a través de los juzgados penales.","El BCRA en coordinación con la AFIP."],"src":"II-101"},{"q":"El plazo para enviar un Reportes de Operaciones Sospechosas de Lavado de Activos se rige por:","opts":["Ley 27.739 y UIF 56/2024.","La Resolución UIF 78/2023 y las Normas CNV.","La Ley 25.246 y la Resolución UIF 192/2024.","Las Normas CNV Título XI y la Ley 27.739."],"src":"II-102"},{"q":"UIF 56/2024. Cuando se trata de Financiamiento de Terrorismo con personas/bienes listados por ONU, el Reportes de Operaciones Sospechosas debe enviarse:","opts":["Sin demora.","Dentro de los 7 días hábiles.","Dentro de los 30 días corridos.","No existe plazo específico para FT."],"src":"II-103"},{"q":"UIF 78/2023. La Revisión Externa Independiente para SO del mercado de capitales debe realizarse al menos:","opts":["Anualmente.","Cada dos años.","Cada cinco años.","Solo cuando la UIF lo requiera."],"src":"II-104"},{"q":"UIF 78/2023. La declaración de tolerancia al riesgo debe enviarse a:","opts":["UIF y Comisión Nacional de Valores.","UIF, dentro de los 30 días de aprobada.","Comisión Nacional de Valores y mercado en el que opere.","BCRA y AFIP."],"src":"II-105"},{"q":"Según UIF 192/2024, ¿cuál de las siguientes sí integra la definición de PEP?","opts":["Autoridades y funcionarios de la APN.","Funcionarios del Poder Judicial exclusivamente.","Empleados de empresas públicas de cualquier nivel.","Representantes de organizaciones internacionales con sede en Argentina."],"src":"II-106"},{"q":"UIF 49/2024. Se considera Proveedores de Servicios de Activos Virtuales a Personas Humanas o Jurídicas que, como negocio, realice una o más de las siguientes actividades incluyendo:","opts":["Transferencia, custodia, administración, participación, servicios financieros en oferta o venta de Activos Virutales.","Intercambio, transferencia y custodia de Activos Virtuales, con exclusión de los servicios financieros relacionados con la oferta de un emisor o venta de Activos Virtuales.","Emisión, minería y validación de Activos Virtuales, con exclusión de los servicios de custodia y administración, que se rigen por la normativa del BCRA.","Custodia, administración y asesoramiento sobre Activos Virtuales, siempre que se realicen por cuenta propia."],"src":"II-107"},{"q":"UIF 49/2024: “Activo Virtual” es:","opts":["Representación digital de valor que puede comercializarse/transferirse y utilizarse para pagos o inversiones.","Representación digital de valor emitida o respaldada por un banco central, utilizable para pagos.","Representación digital de un activo físico o financiero subyacente, que puede comercializarse en mercados autorizados por la CNV.","Representación digital de valor que puede comercializarse o transferirse, con exclusión de la utilizada para pagos, regida por el BCRA."],"src":"II-108"},{"q":"UIF 78/2023. Los SO pueden depender de terceros (CDD) para:","opts":["Verificar beneficiario final Identificar/verificar cliente Comprender propósito/naturaleza relación.","Presentar Reportes de Operaciones Sospechosas; Identificar/verificar cliente; Capacitar al personal en materia de prevención.","Verificar beneficiario final; Designar al Oficial de Cumplimiento; Capacitar al personal.","Identificar/verificar cliente; Verificar beneficiario final; Monitorear las operaciones y calificar el riesgo del cliente."],"src":"II-109"},{"q":"UIF 78/2023. El registro de operaciones inusuales debe contener al menos:","opts":["Descripción, análisis, documentación soporte, decisión y fundamento.","Descripción, monto, fecha y nombre del cliente, sin fundamentar la decisión.","Descripción, análisis y decisión, remitiéndose la documentación soporte a la UIF.","Fecha, monto, nombre del cliente y constancia del Reporte de Operación Sospechosa presentado."],"src":"II-110"},{"q":"UIF 78/2023: ¿cuál de los siguientes es mensual para SO de mercado de capitales?","opts":["Nómina de cuentas comitentes (activas/inactivas) y, cuando corresponda, transferencias internacionales de VN.","Nómina de cuentas comitentes (activas/inactivas), información societaria/estructura y transferencias internacionales de VN.","Transferencias internacionales de VN y nómina de clientes calificados como PEP, con el perfil de riesgo asignado a cada uno.","Nómina de cuentas comitentes abiertas en el mes y detalle de los ROS presentados."],"src":"II-111"},{"q":"Título XI Comisión Nacional de Valores. Los ALyC y colocadores de FCI deben recibir fondos de clientes exclusivamente desde:","opts":["CBU/CVU de titularidad o cotitularidad del cliente en entidades autorizadas por BCRA.","Cualquier cuenta bancaria, incluso de terceros no vinculados.","Exclusivamente desde cuentas del agente interviniente.","Desde cuentas radicadas en entidades financieras del exterior."],"src":"II-112"}],"3":[{"q":"¿Cuál es el objetivo del principio de transparencia en el mercado de capitales?","opts":["Asegurar información veraz, suficiente y oportuna para la toma de decisiones.","Maximizar la rentabilidad de los inversores.","Garantizar un rendimiento mínimo en las operaciones.","Proteger exclusivamente a los inversores institucionales."],"src":"III-1"},{"q":"¿Cuál de las siguientes conductas es contraria a la transparencia?","opts":["Difundir información falsa o engañosa sobre valores negociables.","Publicar estados contables auditados en tiempo y forma.","Informar hechos relevantes a la CNV dentro del plazo establecido.","Inscribir nuevas emisiones en el registro correspondiente."],"src":"III-2"},{"q":"¿Qué documento regula el régimen informativo periódico y ocasional?","opts":["Normas CNV Título IV.","Normas CNV Título XII.","Ley 25.246.","Normas CNV Título XVI."],"src":"III-3"},{"q":"¿Qué plazo tiene una emisora para informar un hecho relevante?","opts":["24 horas.","48 horas.","10 días hábiles.","5 días hábiles."],"src":"III-4"},{"q":"¿Qué órgano debe designar un Responsable de Relaciones con el Público Inversor?","opts":["Órgano de administración de la emisora.","La Comisión Nacional de Valores.","La asamblea de accionistas.","El síndico de la sociedad."],"src":"III-5"},{"q":"¿Dónde se pueden presentar denuncias por incumplimiento de normas de transparencia?","opts":["Ante la Comisión Nacional de Valores.","BYMA (Bolsas y Mercados Argentinos).","BCRA (Banco Central de la República Argentina).","Ante el mercado en el que opere el agente denunciado."],"src":"III-6"},{"q":"¿Qué obligación tienen los participantes respecto al Código de Conducta Profesional?","opts":["Actuar con lealtad, diligencia y transparencia frente a clientes y empleadores.","Presentar un informe anual ante la CNV sobre su actividad.","Inscribirse en el registro de auditores externos.","Publicar sus honorarios en la Autopista de la Información Financiera."],"src":"III-7"},{"q":"¿Qué norma regula el procedimiento de reclamos y consultas de inversores?","opts":["Normas CNV Título XIII.","Normas CNV Título XII.","Normas CNV Título IV.","Ley 26.831 exclusivamente."],"src":"III-8"},{"q":"¿Qué obligación tienen las emisoras respecto al gobierno corporativo?","opts":["Cumplir con principios de transparencia, equidad y responsabilidad en la gestión.","Solo presentar estados contables anuales.","Inscribir a todos sus directores en el registro de la CNV.","Obtener calificación de riesgo obligatoria."],"src":"III-9"},{"q":"¿Qué norma establece el deber de informar conflictos de interés?","opts":["Ley General de Sociedades, art. 272.","Ley 26.831, art. 72.","Normas CNV, Título XII, art. 1.","Ley 19.550, art. 59."],"src":"III-10"},{"q":"¿Qué norma establece el régimen informativo periódico para emisoras?","opts":["Normas CNV Título IV.","Normas CNV Título XII.","Normas CNV Título XVI.","Ley 26.831 exclusivamente."],"src":"III-11"},{"q":"¿Qué información debe incluir el régimen informativo ocasional?","opts":["Hechos relevantes y cambios societarios.","Hechos relevantes y estados contables trimestrales.","Cambios en el directorio y en el capital social.","Cambios societarios y cotización."],"src":"III-12"},{"q":"¿Qué plazo tiene la emisora para publicar sus estados contables anuales?","opts":["60 días corridos.","30 días corridos.","90 días corridos.","120 días corridos."],"src":"III-13"},{"q":"¿Qué conducta se considera contraria a la transparencia?","opts":["Ocultar información relevante para inversores.","Publicar la calificación de riesgo de los valores negociables.","Analizar los datos del volumen negociado en los mercados.","Difundir el prospecto por medios masivos."],"src":"III-14"},{"q":"¿Qué órgano recibe denuncias por incumplimiento de normas de transparencia?","opts":["Comisión Nacional de Valores.","Bolsas y Mercados Argentinos (BYMA).","Unidad de Información Financiera (UIF).","Bolsa de Comercio."],"src":"III-15"},{"q":"¿Qué norma regula el procedimiento de reclamos y consultas?","opts":["Normas CNV Título XIII.","Normas CNV Título XII.","Normas CNV Título IV.","Ley 25.246."],"src":"III-16"},{"q":"¿Qué obligación tienen los participantes respecto al Código de Conducta Profesional?","opts":["Actuar con lealtad, diligencia y transparencia.","Maximizar la rentabilidad de las operaciones del cliente.","Garantizar un retorno mínimo sobre las inversiones.","Informar solo cuando el cliente lo solicite expresamente."],"src":"III-17"},{"q":"¿Qué norma regula el gobierno corporativo en emisoras?","opts":["Normas CNV Título XII.","Normas CNV Título IV.","Normas CNV Título XIII.","Ley 26.831 exclusivamente."],"src":"III-18"},{"q":"¿Qué plazo tiene la emisora para informar designación de autoridades?",
