del régimen (arts. 97 y 98). Las obligatorias deben abarcar la totalidad de las acciones con voto y de los derechos de suscripción, opciones y valores convertibles, y no pueden sujetarse a condición alguna.","El artículo 86 fija los principios que rigen toda OPA: igualdad de trato entre los accionistas, precio equitativo, plazos razonables de aceptación, información suficiente y detallada, transparencia e irrevocabilidad de la oferta. El directorio de la sociedad objetivo debe emitir una opinión fundada sobre la razonabilidad del precio y abstenerse de medidas que frustren la oferta. El anuncio de la OPA debe identificar al oferente, indicar el tipo de oferta y sus condiciones esenciales (precio, cantidad, plazo). Existe toma de control cuando alguien, individualmente o en actuación concertada, alcanza de manera efectiva una participación de control; la actuación concertada (art. 2) es la actuación coordinada de dos o más personas, bajo un acuerdo formal o informal, para cooperar activamente en la adquisición, tenencia o disposición de acciones o valores convertibles de una sociedad con oferta pública. Desde la Ley 27.440 la OPA por toma de control se formula después de concretada la adquisición (OPA a posteriori) y a precio equitativo.","El precio equitativo (art. 88) es, como mínimo, el mayor entre el precio más alto que el oferente o quienes actúan concertadamente con él pagaron por los valores en los 12 meses previos y el precio promedio de cotización del semestre anterior al anuncio. Para el retiro se agregan otros criterios (valor patrimonial, valor de la compañía por flujos descontados o comparables, valor de liquidación, precio de una OPA previa en el último año), pero nunca por debajo de la cotización promedio del semestre. Según la guía, la CNV tiene 20 días hábiles para objetar el precio equitativo y 20 días hábiles para resolver la solicitud de autorización de la OPA. Una vez aprobada, el oferente publica el prospecto de la OPA dentro de los 5 días hábiles, y el plazo de aceptación por los accionistas no puede ser inferior a 10 días hábiles. El oferente debe acreditar una garantía emitida por una entidad financiera local o extranjera (estas últimas con sucursal o representación permanente en el país) o por una compañía de seguros fiscalizada por la SSN, previa autorización de la CNV.","Si quien toma el control no formula la OPA obligatoria, la CNV dispone la subasta de las participaciones adquiridas en infracción, sin perjuicio de la suspensión de los derechos políticos de esas acciones y de las sanciones del art. 132. El artículo 89 prevé excepciones (adquisiciones a título gratuito, por fusión o escisión, por reducción de capital, cuando la CNV lo autorice por no afectar a los minoritarios). Las controversias sobre el precio o el procedimiento pueden plantearse ante el tribunal arbitral del mercado o la justicia."],"puntos":["OPA obligatoria en tres casos: toma de control (art. 87), participaciones residuales (art. 91), retiro (arts. 97-98).","Principios (art. 86): igualdad de trato, precio equitativo, plazos razonables, información suficiente, transparencia, irrevocabilidad.","Anuncio: identificación del oferente, tipo de oferta, condiciones esenciales.","Precio equitativo (art. 88): el mayor entre precio más alto pagado en 12 meses y promedio del semestre.","Plazos (guía): CNV resuelve la OPA en 20 días hábiles; objeta el precio en 20 días hábiles; publicación del prospecto en 5 días hábiles; aceptación mínima 10 días hábiles.","Garantía: entidad financiera local/extranjera con sucursal o compañía de seguros bajo SSN, con autorización previa de la CNV.","Incumplir la OPA obligatoria: la CNV dispone la subasta de las participaciones adquiridas.","Actuación concertada: 2 o más personas, acuerdo formal o informal, cooperación activa sobre acciones de una sociedad con OP."]},{"titulo":"10. Participaciones residuales, DUVA y retiro del régimen de oferta pública","parrafos":["El régimen de participaciones residuales (art. 91) se activa cuando una persona, sola o en actuación concertada, es titular del 95% o más del capital con derecho a voto de una sociedad con oferta pública. A partir de ahí cualquier accionista minoritario puede intimar al controlante para que adquiera el remanente, y el controlante, ante la intimación o por propia iniciativa dentro de los 6 meses de alcanzado el 95%, puede emitir una Declaración Unilateral de Voluntad de Adquisición (DUVA, art. 92). La guía la llama también Declaración Unilateral de Adquisición: en el examen, si la opción menciona una declaración unilateral, es la DUVA.","La DUVA no es una oferta que el minoritario acepta o rechaza: es una declaración por la cual el controlante adquiere la totalidad de las acciones remanentes a precio equitativo, deposita el precio a disposición de los minoritarios y la sociedad queda fuera del régimen de oferta pública. Los minoritarios conservan el derecho a impugnar el precio ante el tribunal arbitral o la justicia, pero no pueden impedir la transferencia. La RG 1097/2025 estandarizó el concepto de DUVA en el Título I y lo alineó con el retiro obligatorio y el régimen de participaciones residuales.","El retiro voluntario del régimen de oferta pública (art. 97) lo decide la asamblea y obliga a la sociedad (o a su controlante) a formular una OPA por la totalidad de las acciones, derechos de suscripción y valores convertibles, al precio equitativo del art. 98. La única excepción relevante para el examen es la de las emisoras extranjeras que listan en otro mercado con liquidez igual o superior y garantizan a sus accionistas mantener o vender sus tenencias allí. También existe el retiro forzoso o cancelación de la autorización por decisión de la CNV, como sanción o por incumplimientos.","Dos situaciones que no son retiro: el paso de una emisora desde el Régimen de Autorización Automática de Acciones por Bajo Impacto al Régimen General (no implica retiro ni OPA) y la cancelación de la autorización por no colocar en plazo, que es una caducidad administrativa, no un retiro voluntario."],"puntos":["95% del capital con voto = régimen de participaciones residuales (art. 91).","DUVA (art. 92): Declaración Unilateral de Voluntad de Adquisición; plazo de 6 meses desde alcanzado el 95%.","Ante intimación del minoritario al 95%, corresponde que el controlante lance la DUVA.","DUVA = adquisición forzosa del remanente a precio equitativo; el minoritario solo puede discutir el precio.","Retiro voluntario (art. 97): OPA por el total de las acciones a precio equitativo (art. 98).","Excepción: extranjera listada en otro mercado con liquidez igual o superior y garantía de tenencias o venta.","Pasar de Bajo Impacto al Régimen General no es retiro ni exige OPA."]},{"titulo":"11. Régimen sancionatorio y procedimiento sumarial","parrafos":["El artículo 132 de la LMC enumera las sanciones que puede aplicar la CNV por infracciones a la Ley de Mercado de Capitales y a la Ley 24.083 de Fondos Comunes de Inversión: apercibimiento; multa de $100.000 a $500.000.000, que puede elevarse hasta el quíntuplo del beneficio obtenido o del perjuicio ocasionado si fuera mayor (por eso la guía identifica como sanción máxima la multa hasta el quíntuplo del beneficio); inhabilitación de hasta 5 años para actuar como directores, administradores, síndicos, auditores o agentes; suspensión de hasta 2 años para efectuar oferta pública o actuar como agente; y prohibición de efectuar oferta pública o de actuar como agente. Los directores, administradores y síndicos responden solidariamente por las multas de la persona jurídica. Las multas devengan intereses que no pueden superar en una vez y media la tasa que aplica el Banco de la Nación Argentina en sus operaciones de descuento de documentos comerciales.","Para graduar la sanción (art. 133) la CNV debe tener especialmente en cuenta: el daño a la confianza en el mercado de capitales, la magnitud de la infracción, los beneficios generados o perjuicios ocasionados, el volumen operativo del infractor, la actuación individual de los miembros de los órganos de administración y fiscalización y su vinculación con el grupo de control (en particular el carácter de miembro independiente o externo), y la reincidencia en los 6 años anteriores. Las acciones por infracciones prescriben a los 6 años de cometido el hecho (art. 139), y la prescripción se interrumpe por la resolución del Directorio que ordena la apertura del sumario y por los actos y diligencias inherentes a su sustanciación: apertura a prueba, cierre del período probatorio y convocatoria para alegar, con sus notificaciones. La existencia de causas penales por los mismos hechos no obsta a la prosecución y conclusión del sumario administrativo.","Toda sanción se aplica mediante resolución fundada del Directorio, previo sumario. Antes del sumario hay una investigación, que puede originarse por denuncia, de oficio cuando la CNV advierte presuntas irregularidades en el ejercicio de sus funciones, o a partir de informaciones periodísticas. Si el denunciante desiste, la CNV continúa de oficio hasta terminar la investigación; al denunciante se le notifica la decisión final. La investigación puede culminar con la desestimación (si no se comprobaron irregularidades), con la instrucción de un sumario administrativo o con un reporte de operación sospechosa a la UIF. El sumario se sustancia en una dependencia de la CNV separada e independiente de la que formuló la propuesta de cargos; antes de la apertura a prueba se convoca una audiencia preliminar para requerir explicaciones y reducir discrepancias sobre hechos, concentrando pasos del procedimiento (principios de concentración, economía procesal e inmediación). Los sumariados pueden recusar al conductor del sumario y a los integrantes del Directorio. Durante el sumario pueden incorporarse nuevos cargos por resolución del Directorio cuando se trate de incumplimientos en la presentación de documentación o información periódica que motivó el sumario. Puede sumariarse a emisoras, cámaras compensadoras, agentes y a cualquier persona que ofrezca comprar, vender u operar valores que debían contar con autorización de oferta pública y no la tenían.","El artículo 140 creó el procedimiento sumarial abreviado para las conductas incluidas en la Grilla de Conductas Infractoras de las Normas CNV: el Directorio puede disponerlo en la resolución que ordena el sumario, pero exige que todos los sumariados admitan los hechos y reconozcan expresamente las conductas infractoras y su responsabilidad. Las sanciones posibles son únicamente multa y/o apercibimiento, y la multa no puede superar los $10.000.000. El abreviado queda excluido en varios supuestos (gravedad del hecho, reincidencia, perjuicio a inversores, conductas vinculadas a abuso de mercado o lavado): cuando el examen lista esos supuestos, la respuesta es que todos son correctos. Contra la sanción procede el recurso directo (art. 143): se interpone y se funda ante la propia CNV dentro de los 10 días hábiles de notificado el acto, y lo resuelve la Cámara Nacional de Apelaciones en lo Contencioso Administrativo Federal (o la Cámara Federal con competencia en el domicilio del sancionado, en el interior). Se concede con efecto devolutivo, salvo el recurso contra la multa, que tiene efecto suspensivo. La competencia disciplinaria sobre los agentes es exclusiva de la CNV (art. 56); los mercados y cámaras deben denunciarle las infracciones que detecten."],"puntos":["Sanciones (art. 132): apercibimiento; multa $100.000 a $500.000.000 elevable hasta el quíntuplo del beneficio o perjuicio; inhabilitación hasta 5 años; suspensión hasta 2 años; prohibición.","Intereses de las multas: tope de 1,5 veces la tasa de descuento de documentos comerciales del Banco Nación.","Graduación (art. 133): daño a la confianza, magnitud, beneficios/perjuicios, volumen operativo, actuación individual de directores/síndicos (independientes), reincidencia en 6 años.","Prescripción: 6 años; se interrumpe con la apertura del sumario y los actos de sustanciación (apertura a prueba, cierre probatorio, convocatoria a alegar).","Sanción = resolución fundada previo sumario; la causa penal no frena el sumario; dependencia separada e independiente; audiencia preliminar antes de la prueba.","Investigación: por denuncia, de oficio o por informaciones periodísticas; termina en desestimación, sumario o reporte de operación sospechosa; desistimiento no detiene; se notifica la decisión final.","Sumario abreviado (art. 140): todos admiten hechos y responsabilidad; solo multa y/o apercibimiento; tope $10.000.000.","Recurso directo (art. 143): se interpone y funda ante la CNV en 10 días hábiles; efecto devolutivo, salvo multa (suspensivo)."]},{"titulo":"12. Buenas prácticas de gobierno corporativo: OCDE, Código de Gobierno Societario y LGS","parrafos":["Los Principios de Gobierno Corporativo del G20 y la OCDE son la referencia internacional. Se organizan en capítulos: bases para un marco eficaz de gobierno corporativo; derechos y trato equitativo de los accionistas y funciones clave de la propiedad; inversores institucionales, mercados de valores y otros intermediarios; rol de los grupos de interés (stakeholders); divulgación de información y transparencia; responsabilidades del directorio; y, desde la revisión 2023, sostenibilidad y resiliencia. La idea de fondo es que un buen gobierno reduce el costo de capital porque protege al accionista minoritario y hace creíble la información.","En Argentina la CNV tradujo esos principios en el Código de Gobierno Societario (RG 797/2019), que las emisoras aplican bajo el criterio cumpla o explique: cada año, en la memoria, informan si cumplen cada práctica recomendada y, si no lo hacen, por qué. El Código se organiza alrededor de la función del directorio, la presidencia y la secretaría corporativa, la composición del directorio, las remuneraciones, el ambiente de control (comité de auditoría, auditoría interna), la ética y el cumplimiento, y la participación de los accionistas. La transparencia se completa con la AIF, el régimen informativo periódico y el deber de informar hechos relevantes.","La LMC incorpora reglas concretas de gobierno corporativo para las emisoras: comité de auditoría integrado por al menos tres directores, con mayoría de independientes (art. 109); procedimiento para operaciones con partes relacionadas de monto relevante, que es el que supera el 1% del patrimonio neto, con pronunciamiento del comité de auditoría dentro de 5 días hábiles o dictamen de dos firmas evaluadoras independientes (arts. 72 y 73); posibilidad de remunerar a directores ejecutivos y gerentes con opciones sobre acciones aprobadas por la asamblea (art. 75); deber de lealtad y prohibición de aprovechar oportunidades de negocio de la sociedad (art. 78); comisión fiscalizadora integrada por síndicos independientes, cuya supresión requiere la presencia y el voto favorable del 75% de las acciones con derecho a voto (art. 79); y acción de responsabilidad del accionista (art. 76).","La LGS aporta la base orgánica que el temario pide: el art. 255 regula el directorio (elegido por la asamblea; en las sociedades con oferta pública debe tener al menos tres miembros), el art. 269 permite delegar la gestión ordinaria en un comité ejecutivo sin eximir de responsabilidad al directorio, el art. 274 fija la responsabilidad ilimitada y solidaria de los directores por mal desempeño del cargo, y el art. 280 regula el consejo de vigilancia como órgano de control integrado por accionistas. El art. 234 ordena tratar los estados contables y la designación de directores en asamblea ordinaria dentro de los cuatro meses del cierre."],"puntos":["Principios G20/OCDE: marco eficaz, derechos y trato equitativo de accionistas, inversores institucionales y mercados, stakeholders, transparencia, responsabilidades del directorio, sostenibilidad (2023).","Código de Gobierno Societario CNV (RG 797/2019): criterio cumpla o explique, informado en la memoria anual.","Comité de auditoría (art. 109 LMC): mínimo 3 directores, mayoría independientes.","Partes relacionadas (arts. 72-73 LMC): monto relevante = más del 1% del patrimonio neto; comité opina en 5 días hábiles o dos firmas evaluadoras.","Comisión fiscalizadora (art. 79 LMC): síndicos independientes; supresión con 75% de presencia y voto favorable.","LGS: art. 255 directorio (mínimo 3 en oferta pública), art. 269 comité ejecutivo, art. 274 responsabilidad de directores, art. 280 consejo de vigilancia.","Asamblea ordinaria (art. 234 LGS y art. 71 LMC): dentro de los 4 meses del cierre."]}],"datos_duros":[{"concepto":"Objeto de la Ley de Mercado de Capitales","valor":"Regular, supervisar y fiscalizar el mercado de capitales","fuente":"Ley 26.831, art. 1"},{"concepto":"Autoridad de aplicación de la Ley 26.831","valor":"Comisión Nacional de Valores (organismo autárquico)","fuente":"Ley 26.831, arts. 6 y 19"},{"concepto":"Directorio de la CNV","valor":"5 vocales designados por el PEN, mandato de 5 años","fuente":"Ley 26.831, art. 6"},{"concepto":"Reforma integral de la LMC","valor":"Ley 27.440 de Financiamiento Productivo (2018)","fuente":"Ley 27.440"},{"concepto":"Facultad expresa de la CNV sobre asesores","valor":"Fijar normas mínimas de capacitación, acreditación y registro para quienes asesoran al público inversor","fuente":"Ley 26.831, art. 19"},{"concepto":"Lo que NO es facultad de la CNV","valor":"Garantizar la rentabilidad de los inversores","fuente":"Ley 26.831, arts. 19 y 20"},{"concepto":"Control societario de las emisoras","valor":"Lo ejerce la CNV sobre todas las entidades de la Ley 22.169, excluidas las PyME CNV Garantizadas","fuente":"Ley 22.169 y Normas CNV"},{"concepto":"Inscripción registral ante la CNV","valor":"Miembros del Directorio de las emisoras bajo control societario","fuente":"Normas CNV, control societario"},{"concepto":"Secreto profesional en el mercado de capitales","valor":"Regulado por la Ley 26.831 (la guía lo cita como art. 24; en el texto, arts. 25-27 para la CNV y 53 para agentes)","fuente":"Ley 26.831"},{"concepto":"Levantamiento del secreto","valor":"Entre CNV, BCRA y SSN a pedido de sus máximas autoridades, y a requerimiento de la UIF","fuente":"Ley 26.831, art. 27"},{"concepto":"Tribunal arbitral","valor":"Permanente en cada mercado; obligatorio para las emisoras, optativo para accionistas e inversores; resuelve controversias entre participantes","fuente":"Ley 26.831, art. 46"},{"concepto":"Objetivos de IOSCO","valor":"Proteger a los inversores; mercados justos, eficientes y transparentes; reducir el riesgo sistémico","fuente":"Principios IOSCO"},{"concepto":"Definición de oferta pública","valor":"Invitación a personas en general o a sectores/grupos determinados para actos jurídicos con valores negociables, por cualquier medio de difusión","fuente":"Ley 26.831, art. 2"},{"concepto":"Ejemplos de valores negociables","valor":"Letras de cambio, obligaciones negociables, acciones, CPD, pagarés, cuotapartes de FCI, títulos de fideicomisos","fuente":"Ley 26.831, art. 2"},{"concepto":"Actuación concertada","valor":"2 o más personas, acuerdo formal o informal, cooperación activa en adquisición, tenencia o disposición de acciones de una sociedad con OP","fuente":"Ley 26.831, art. 2"},{"concepto":"Plazo de la CNV para resolver una autorización de oferta pública","valor":"30 días hábiles; pronto despacho + 15 días hábiles = autorización tácita; prórroga de hasta 15 días hábiles","fuente":"Ley 26.831, art. 84"},{"concepto":"Valores excluidos de la ley","valor":"Emitidos por Nación, provincias, CABA, municipios y organismos multilaterales de crédito","fuente":"Ley 26.831, art. 83"},{"concepto":"Oferta irregular","valor":"Oferta pública realizada sin autorización de la CNV","fuente":"Ley 26.831, arts. 19 inc. h y 82"},{"concepto":"Inversores institucionales","valor":"Compañías de seguros, FCI, entidades financieras, cajas y fondos previsionales; colocar entre ellos es oferta pública","fuente":"Decreto 1087/1993"},{"concepto":"Oferta privada: invitaciones máximas por emisión","valor":"30 potenciales inversores no calificados y 50 potenciales inversores calificados","fuente":"Normas CNV, RG 1088/2025"},{"concepto":"Oferta privada: operaciones máximas","valor":"35 adquirentes, de los cuales no más de 15 no calificados","fuente":"Normas CNV, RG 1088/2025"},{"concepto":"Oferta privada: reventa","valor":"Sin limitación cuando la transferencia se efectúa fuera de la República Argentina","fuente":"Normas CNV, RG 1088/2025"},{"concepto":"Oferta extraterritorial","valor":"Sin límite de cantidad de inversores, precio ni monto; sin requisitos ante la CNV","fuente":"Normas CNV, RG 1088/2025"},{"concepto":"ON con Autorización Automática por Bajo Impacto","valor":"Oferta pública autorizada y regular; exenta de sanciones por oferta irregular","fuente":"Normas CNV, régimen de autorización automática"},{"concepto":"Acciones Mediano Impacto: tope","valor":"7.000.000 de UVAs, sumando todas las emisiones por suscripción de los 12 meses anteriores","fuente":"Normas CNV, régimen de autorización automática"},{"concepto":"Excluidos del Mediano Impacto","valor":"Emisores sujetos a privatización, con participación estatal/FGS, entidades financieras, mercados autorizados y emisores de servicios públicos","fuente":"Normas CNV, régimen de autorización automática"},{"concepto":"Tipo de cambio para integración en moneda extranjera (Bajo Impacto)","valor":"Tipo de Cambio de Referencia Com. A 3500 BCRA; tipo vendedor BNA si no es dólar","fuente":"Normas CNV, régimen de autorización automática"},{"concepto":"Requisito para acceder a Bajo/Mediano Impacto de acciones","valor":"Estar admitido al Régimen General y cumplir condiciones específicas de impacto","fuente":"Normas CNV"},{"concepto":"FCI con autorización automática","valor":"Fondo sustancialmente equivalente a otro ya aprobado de la misma sociedad gerente, sin cambios en objetivo ni política","fuente":"Normas CNV"},{"concepto":"RG 1097/2025","valor":"Nuevo Título I: definiciones unificadas (Inversor Calificado, DUVA, PyME CNV, Ratio CEDEAR, Precio Equitativo)","fuente":"Normas CNV, Título I"},{"concepto":"RG 1084/2025","valor":"Simplificación y agilización de autorización e inscripción de fideicomisos financieros","fuente":"Normas CNV"},{"concepto":"RG 1054/2025","valor":"ACRyP: plataformas de acceso libre y gratuito con información de pagos de instrumentos PyME","fuente":"Normas CNV"},{"concepto":"Documento básico para solicitar oferta pública","valor":"Prospecto","fuente":"Normas CNV, Título II"},{"concepto":"Plazo para informar designación de autoridades","valor":"10 días hábiles","fuente":"Normas CNV, Título II"},{"concepto":"Asamblea ordinaria (balance y directores)","valor":"Dentro de los 4 meses del cierre del ejercicio","fuente":"Ley 19.550, art. 234; Ley 26.831, art. 71"},{"concepto":"Convocatoria a asamblea en emisoras","valor":"Entre 20 y 45 días corridos antes; información disponible 20 días antes; accionistas con 2% comentan hasta 5 días antes","fuente":"Ley 26.831, art. 70"},{"concepto":"Aportes irrevocables","valor":"Contrapartida en rubro de alta liquidez; asamblea trata la capitalización en 6 meses","fuente":"Normas CNV"},{"concepto":"Adquisición de acciones propias","valor":"Solo SA con OP de acciones; tope 10% del capital; enajenar en 3 años; trato igualitario","fuente":"Ley 26.831, arts. 64 a 67"},{"concepto":"Acciones de voto privilegiado","valor":"No pueden emitirse después de autorizada la OP, salvo ajuste de capital","fuente":"Ley 19.550, art. 216"},{"concepto":"Acciones preferidas con preferencia patrimonial","valor":"Votan si la sociedad está en mora en el pago de su preferencia","fuente":"Ley 19.550, art. 217"},{"concepto":"Registro de accionistas","valor":"La propia emisora, bancos o Caja de Valores","fuente":"Ley 19.550 y Normas CNV"},{"concepto":"Personalidad jurídica","valor":"Art. 146 del Código Civil y Comercial (criterio de la guía)","fuente":"CCyC, art. 146"},{"concepto":"Responsabilidad de administradores hacia la sociedad","valor":"Ilimitada y solidaria por mal desempeño, violación de ley o estatuto, dolo, abuso o culpa grave","fuente":"Ley 19.550, art. 274"},{"concepto":"Órganos en la LGS","valor":"Art. 255 directorio (mínimo 3 en OP); art. 269 comité ejecutivo; art. 280 consejo de vigilancia","fuente":"Ley 19.550"},{"concepto":"Responsables del prospecto","valor":"Emisores, oferentes, firmantes y expertos/terceros que opinan sobre partes del prospecto","fuente":"Ley 26.831, art. 119"},{"concepto":"Adenda al prospecto","valor":"Modificación de términos y condiciones, prórroga de vigencia o aumento de monto del programa","fuente":"Normas CNV, Título II"},{"concepto":"Actualización anual del prospecto","valor":"Optativa, con informe de contador público independiente","fuente":"Normas CNV, Título II"},{"concepto":"Mecanismos de colocación primaria","valor":"Formación de libro, subasta o licitación pública; difusión suficiente","fuente":"Normas CNV, Título VI"},{"concepto":"Refinanciación con ON sin OP o créditos preexistentes","valor":"Hasta 30% del monto efectivamente colocado","fuente":"Normas CNV, Título II"},{"concepto":"Ley de Obligaciones Negociables","valor":"Ley 23.576","fuente":"Ley 23.576"},{"concepto":"Inversor calificado: umbral patrimonial","valor":"Inversiones en valores negociables o depósitos superiores a 350.000 UVA","fuente":"Normas CNV, Título I"},{"concepto":"PyME CNV","valor":"Empresa con Certificado MiPyME inscripta en el Registro MiPyME (SEPyME, Ley 24.467)","fuente":"Normas CNV y Ley 24.467"},{"concepto":"PyME CNV Garantizada","valor":"Sin EECC tras la admisión; control societario en el Registro Público; régimen informativo menor","fuente":"Normas CNV, régimen PyME"},{"concepto":"Objeto principal de las SGR","valor":"Otorgar garantías a sus socios partícipes mediante contratos de garantía recíproca","fuente":"Ley 24.467, Título II"},{"concepto":"OPA: plazo mínimo de aceptación","valor":"10 días hábiles","fuente":"Normas CNV, Título III (criterio de la guía)"},{"concepto":"OPA: plazos de la CNV","valor":"20 días hábiles para resolver la autorización; 20 días hábiles para objetar el precio equitativo","fuente":"Normas CNV, Título III (criterio de la guía)"},{"concepto":"OPA: publicación del prospecto","valor":"Dentro de los 5 días hábiles de aprobada","fuente":"Normas CNV, Título III"},{"concepto":"Precio equitativo","valor":"El mayor entre el precio más alto pagado en los 12 meses previos y el promedio de cotización del semestre anterior","fuente":"Ley 26.831, art. 88"},{"concepto":"Garantía en una OPA","valor":"Entidad financiera local o extranjera con sucursal/representación, o compañía de seguros bajo SSN, previa autorización de la CNV","fuente":"Normas CNV, Título III"},{"concepto":"Incumplimiento de la OPA obligatoria","valor":"La CNV dispone la subasta de las participaciones adquiridas","fuente":"Ley 26.831, art. 87 y Normas CNV"},{"concepto":"Participaciones residuales","valor":"95% o más del capital con derecho a voto","fuente":"Ley 26.831, art. 91"},{"concepto":"DUVA","valor":"Declaración Unilateral de Voluntad de Adquisición; puede emitirse dentro de los 6 meses de alcanzado el 95%","fuente":"Ley 26.831, art. 92"},{"concepto":"Retiro voluntario del régimen de oferta pública","valor":"OPA por la totalidad de las acciones a precio equitativo","fuente":"Ley 26.831, arts. 97 y 98"},{"concepto":"Sanciones de la CNV","valor":"Apercibimiento; multa de $100.000 a $500.000.000 elevable hasta el quíntuplo del beneficio o perjuicio; inhabilitación hasta 5 años; suspensión hasta 2 años; prohibición","fuente":"Ley 26.831, art. 132"},{"concepto":"Intereses de las multas","valor":"No más de 1,5 veces la tasa de descuento de documentos comerciales del Banco Nación","fuente":"Ley 26.831, art. 146"},{"concepto":"Prescripción de las infracciones","valor":"6 años desde la comisión del hecho; se interrumpe por apertura del sumario y actos de sustanciación","fuente":"Ley 26.831, art. 139"},{"concepto":"Sumario abreviado","valor":"Todos los sumariados admiten hechos y responsabilidad; solo multa y/o apercibimiento; multa máxima $10.000.000","fuente":"Ley 26.831, art. 140 y Normas CNV"},{"concepto":"Recurso directo contra sanciones","valor":"Se interpone y funda ante la CNV dentro de 10 días hábiles; efecto devolutivo, salvo multa (suspensivo); resuelve la Cámara Contencioso Administrativo Federal","fuente":"Ley 26.831, art. 143"},{"concepto":"Comité de auditoría","valor":"Al menos 3 directores, mayoría independientes","fuente":"Ley 26.831, art. 109"},{"concepto":"Operaciones con partes relacionadas","valor":"Monto relevante = más del 1% del patrimonio neto; comité de auditoría opina en 5 días hábiles","fuente":"Ley 26.831, arts. 72 y 73"},{"concepto":"Código de Gobierno Societario","valor":"RG 797/2019, criterio cumpla o explique, informado en la memoria","fuente":"Normas CNV"}],"trampas":["OPA no es DUVA. La OPA es una oferta que cada accionista acepta o rechaza; la DUVA es una declaración unilateral del controlante con 95% o más que adquiere forzosamente el remanente. Si la pregunta habla del 95% y de intimación del minoritario, la respuesta es DUVA; si habla de toma de control o retiro, es OPA.","No confundir los plazos de 10, 20 y 5 días hábiles: aceptación mínima de la OPA = 10; publicación del prospecto de la OPA = 5; CNV resuelve la OPA y objeta el precio = 20; recurso directo = 10; informar designación de autoridades = 10. La autorización general de oferta pública (art. 84) es 30 días hábiles, no 20.","El recurso directo se interpone y se funda ante la CNV, aunque lo resuelve la Cámara. Y el efecto es devolutivo (la sanción se ejecuta) salvo la multa, que queda suspendida mientras se discute.","La sanción máxima no es un monto fijo: la multa puede elevarse hasta el quíntuplo del beneficio obtenido o del perjuicio ocasionado. El tope de $10.000.000 es solo para el sumario abreviado.","Prescripción: 6 años (no 2, 3 ni 5). El mismo número de 6 años aparece como ventana de reincidencia para graduar sanciones. Y la causa penal paralela no frena el sumario de la CNV.","Garantizar rentabilidad nunca es facultad de la CNV. Si una opción le atribuye garantizar resultados, asegurar ganancias o fijar precios, es la incorrecta.","Oferta pública no exige dirigirse al público en general: también lo es una invitación a sectores o grupos determinados si se usa un medio de difusión. Lo que convierte a una oferta en privada es cumplir los límites numéricos (30 no calificados / 50 calificados invitados; 35 adquirentes con máximo 15 no calificados) y la categoría del destinatario.","PyME CNV versus PyME CNV Garantizada: la Garantizada no presenta estados contables después de la admisión y sigue bajo el control societario del Registro Público; la PyME CNV común sí queda bajo la CNV. Y los valores del régimen PyME CNV solo pueden comprarlos inversores calificados.","La autorización automática de ON por Bajo Impacto es una oferta pública autorizada y regular, no una oferta irregular. Y pasar de Bajo Impacto al Régimen General no es retiro ni exige OPA.","En el Mediano Impacto se suman todas las emisiones por suscripción de los últimos 12 meses contra el tope de 7.000.000 de UVAs: no se evalúa cada emisión por separado.","El retiro de oferta pública exige OPA por el total como regla, pero la emisora extranjera que lista en otro mercado con liquidez igual o superior y garantiza tenencias o venta queda eximida. No generalizar ni la regla ni la excepción.","Los factores de riesgo siempre se incluyen en el prospecto: préstamos por vencer, apalancamiento en una fusión, dependencia de subsidiarias. Y el patrimonio neto negativo no impide el ingreso si los riesgos están explicados. La CNV no juzga el negocio, exige información.","Prospecto, suplemento y adenda son cosas distintas: el suplemento describe una serie dentro de un programa vigente; la adenda modifica el prospecto (términos, prórroga, aumento de monto); la actualización anual por nuevos estados financieros es optativa con informe de contador independiente.","La norma del secreto profesional es la Ley 26.831 (la guía dice art. 24). No elegir la Ley de Entidades Financieras, la LGS ni la Ley de FCI.","Plazos societarios que se mezclan: asamblea ordinaria dentro de 4 meses del cierre; capitalización de aportes irrevocables dentro de 6 meses; designación de autoridades informada en 10 días hábiles; convocatoria entre 20 y 45 días corridos."],"formulas":[]},"2":{"modulo":2,"titulo":"Prevención del lavado de activos y financiamiento del terrorismo","resumen":"El módulo cubre el sistema argentino de prevención del lavado de activos (LA), del financiamiento del terrorismo (FT) y de la proliferación (FP) aplicado al mercado de capitales: qué es el lavado y sus etapas, en qué se diferencia del FT, qué normas lo regulan (Ley 25.246 reformada por la 27.739, Decreto 918/2012, Ley 26.831, Normas CNV Título XI y resoluciones UIF, sobre todo la 78/2023) y qué obligaciones concretas tiene un agente como sujeto obligado. Las preguntas son casi todas de memoria: qué organismo hace qué (UIF vs CNV), qué resolución regula cada tema, plazos de actualización de legajos y de reportes, el porcentaje de beneficiario final y las definiciones textuales de cliente, operación inusual y operación sospechosa. Conviene estudiar las respuestas tal como las fija la guía oficial, incluso en los pocos puntos donde el texto literal de la norma dice otra cosa.","secciones":[{"titulo":"1. Concepto y características del lavado de activos","parrafos":["El lavado de activos (o lavado de dinero) es el proceso por el cual una persona que obtuvo fondos cometiendo un delito los incorpora a la economía formal para darles apariencia de origen legal. El objetivo central, y la respuesta que el examen espera siempre, es simular la licitud del origen de los fondos: no es evadir impuestos ni financiar nada, es disfrazar dinero sucio como limpio para poder usarlo sin levantar sospechas.","Los bienes involucrados provienen exclusivamente de actividades ilícitas, pero pueden provenir de cualquier delito: narcotráfico, corrupción, trata de personas, evasión, fraude, contrabando, delitos tributarios, etc. Desde la reforma de la Ley 26.683 (2011) el lavado es un delito autónomo contra el orden económico y financiero (art. 303 del Código Penal), por lo que no hace falta una condena previa por el delito precedente para perseguirlo.","La Ley 25.246 (año 2000) fue la que incorporó al ordenamiento argentino el encubrimiento y lavado de activos como figura penal específica, creó la Unidad de Información Financiera (UIF) y definió a los sujetos obligados. La Ley 27.739 (marzo de 2024) es la última gran reforma: actualizó el umbral del art. 303 CP, que pasó de un monto fijo en pesos a 150 salarios mínimos, vitales y móviles, incorporó el financiamiento de la proliferación de armas de destrucción masiva como delito, sumó a los proveedores de servicios de activos virtuales como sujetos obligados y creó el Registro Público de Beneficiarios Finales."],"puntos":["Objetivo del lavado: simular la licitud del origen de los fondos.","Los fondos lavados provienen siempre de un delito; cualquier delito puede ser precedente.","Ley 25.246: incorpora el encubrimiento y lavado como delito penal y crea la UIF.","Art. 303 CP: delito autónomo desde la Ley 26.683; umbral de 150 SMVM desde la Ley 27.739.","La sigla completa hoy es LA/FT/FP: lavado, financiamiento del terrorismo y financiamiento de la proliferación."]},{"titulo":"2. Las tres etapas del lavado","parrafos":["El GAFI describe el lavado en tres etapas: colocación, estratificación (que la guía también llama diversificación) e integración. Colocación es el ingreso del efectivo de origen ilícito al sistema financiero o a la economía formal: depósitos fraccionados en varias cuentas, compra de fichas de casino, compra de bienes con efectivo. Es la etapa más vulnerable para el lavador porque el dinero todavía está muy cerca del delito que lo generó.","Estratificación es mover los fondos a través de múltiples operaciones, cuentas, jurisdicciones o instrumentos para alejarlos de su origen y romper la trazabilidad: transferencias en cadena, compra y venta rápida de títulos valores, uso de sociedades pantalla, operaciones con el exterior. Es la etapa que el examen define como mover fondos para ocultar su origen. En el mercado de capitales, comprar bonos y transferirlos de inmediato a otra cuenta o al exterior es un caso de manual.","Integración es la reinserción de los fondos en la economía con apariencia legítima: inversiones inmobiliarias, participaciones en empresas reales, carteras de inversión declaradas. Cuando el examen pide identificar cuál NO es una etapa, la opción distractora típica es fiscalización, que es una tarea del Estado, no una fase del lavador."],"puntos":["Colocación: ingreso del dinero ilícito al circuito formal (del efectivo al sistema financiero).","Estratificación o diversificación: múltiples movimientos para ocultar el origen y cortar la trazabilidad.","Integración: los fondos vuelven al lavador como patrimonio aparentemente lícito.","Fiscalización NO es una etapa del lavado.","Orden lógico: colocación, luego estratificación, luego integración."]},{"titulo":"3. Lavado de activos vs financiamiento del terrorismo","parrafos":["La diferencia clave es el origen de los fondos. En el lavado el dinero siempre es ilícito y lo que se busca es blanquearlo. En el financiamiento del terrorismo los fondos pueden ser lícitos (donaciones, salarios, ganancias de empresas reales) y lo ilícito es el destino: sostener actos, organizaciones o personas terroristas. Por eso el FT se detecta mirando el destinatario y el propósito de la operación, no solo de dónde salió la plata.","El FT está tipificado en el art. 306 del Código Penal y la Ley 26.734 dio a la UIF la facultad de disponer el congelamiento administrativo de bienes. Los listados de personas y entidades sujetas a sanciones financieras dirigidas los establece formalmente el Consejo de Seguridad de las Naciones Unidas (Resolución 1267 de 1999 y sucesivas). En Argentina esas designaciones se consultan en el RePET (Registro Público de Personas y Entidades vinculadas a actos de Terrorismo), que el sujeto obligado debe verificar antes de iniciar cualquier relación comercial y de manera permanente.","La Resolución UIF 29/2013 reglamentó el reporte de operaciones sospechosas de FT (RFT) y el procedimiento de congelamiento administrativo. Ante una operación que involucre bienes, personas o beneficiarios designados por la ONU, el reporte se hace sin demora alguna. Recibida la notificación de la resolución de la UIF que ordena el congelamiento, el sujeto obligado congela los bienes y los que ingresen después, coteja su base de clientes, no informa al cliente los antecedentes de la medida e informa el resultado por el sistema Reporte Orden de Congelamiento. A efectos del examen, el plazo para informar el resultado de la aplicación del congelamiento es de 60 días.","El congelamiento basado en listas de la ONU rige mientras la persona siga listada o hasta que un juez lo revoque; el basado en una posible vinculación con el art. 306 CP dura hasta 6 meses, prorrogables por única vez por igual plazo. En noviembre de 2025 la Res. UIF 207/2025 reemplazó a la 29/2013 (RFT dentro de las 24 horas, congelamiento inmediato e inaudita parte), pero la guía del examen sigue citando la 29/2013, así que respondé con ella."],"puntos":["El FT puede usar fondos lícitos; el lavado usa solo fondos ilícitos.","Los listados de sanciones financieras dirigidas los fija el Consejo de Seguridad de la ONU (Res. 1267/1999).","Verificación obligatoria en el RePET antes de iniciar la relación y en forma permanente.","RFT por personas o bienes listados por la ONU: sin demora alguna.","Res. UIF 29/2013: reporte de FT y congelamiento administrativo; informar el resultado del congelamiento: 60 días (criterio de la guía).","Congelamiento por vinculación con terrorismo: hasta 6 meses, prorrogable una vez.","Financiamiento de la proliferación (FP): tercer riesgo, incorporado por la Ley 27.739."]},{"titulo":"4. Marco normativo: GAFI, leyes, decreto reglamentario y Normas CNV","parrafos":["El estándar internacional son las 40 Recomendaciones del GAFI (FATF en inglés), cuya finalidad es establecer estándares internacionales contra el lavado de activos y el financiamiento del terrorismo. No son un tratado, pero los países son evaluados periódicamente por su cumplimiento y una mala nota tiene costo reputacional y financiero. La Recomendación 1 exige que los países y los sujetos obligados adopten un enfoque basado en riesgo: identificar, evaluar y mitigar los riesgos de LA/FT aplicando más controles donde el riesgo es mayor y controles simplificados donde es menor.","En el nivel legal, la Ley 25.246 es la ley madre: tipifica el lavado, crea la UIF, enumera los sujetos obligados (art. 20), fija sus obligaciones (art. 21: recabar documentos que prueben identidad, personería, domicilio y residencia; reportar sin demora alguna las operaciones sospechosas; abstenerse de revelar al cliente o a terceros las actuaciones) y el régimen sancionatorio (Capítulo IV). Fue modificada por la Ley 26.683 (2011) y por la Ley 27.739 (2024), que reescribió el art. 21, definió operación sospechosa e inusual en la propia ley e incorporó a los PSAV (art. 4 bis). El Decreto 918/2012 es su reglamentación (reemplazó al Decreto 290/2007) y es la norma que la guía asocia con la obligación de informar la condición de PEP.","Para el mercado de capitales se suman la Ley 26.831 (Ley de Mercado de Capitales), que da a la CNV facultades de regulación, supervisión y sanción sobre los agentes, y las Normas CNV (N.T. 2013 y modificatorias), cuyo Título XI contiene las disposiciones de prevención de lavado y financiamiento del terrorismo: qué agentes son sujetos obligados, la exigencia de que los fondos ingresen desde cuentas del propio cliente, el tope de efectivo y la declaración jurada PLAFT para inscribirse en los registros.","La UIF completa el esquema con resoluciones y el examen pregunta mucho cuál regula cada tema. El mapa a memorizar: Res. 78/2023 (régimen integral vigente para el mercado de capitales, reemplazó a la 21/2018 que a su vez reemplazó a la 229/2011); Res. 56/2024 (plazos de ROS tras la Ley 27.739); Res. 29/2013 (ROS de FT y congelamiento; para la guía, la norma que establece la obligación de reportar operaciones sospechosas); Res. 3/2014 (identificación del cliente y declaración jurada cuando el cliente es otro sujeto obligado); Res. 72/2023 (supervisión y deber de colaboración de BCRA, CNV, SSN e INAES, derogó la 155/2018 y la 97/2018); Res. 112/2021 (beneficiario final); Res. 192/2024 (PEP, reemplazó a la 35/2023); Res. 49/2024 (PSAV); Res. 22/2011 (reglamentó a la CNV como organismo con deber de colaboración, hoy superada)."],"puntos":["40 Recomendaciones del GAFI: estándares internacionales ALA/CFT; Recomendación 1 = enfoque basado en riesgo.","Ley 25.246: delito de lavado, UIF, sujetos obligados (art. 20), obligaciones (art. 21), sanciones (Cap. IV).","Ley 26.683 (2011): lavado como delito autónomo; Ley 27.739 (2024): última reforma integral.","Decreto 918/2012: reglamenta la Ley 25.246; la guía lo asocia a la obligación de informar PEP.","Ley 26.831 y Normas CNV Título XI: regulación PLA/FT específica del mercado de capitales.","Res. UIF 78/2023: norma vigente para los sujetos obligados del mercado de capitales.","Res. 56/2024 plazos de ROS; 72/2023 supervisión; 192/2024 PEP; 112/2021 beneficiario final; 49/2024 PSAV; 3/2014 identificación del cliente; 29/2013 ROS/FT."]},{"titulo":"5. Autoridades: UIF, CNV y el sistema ALA/CFT argentino","parrafos":["La Unidad de Información Financiera (UIF) es la autoridad de aplicación de la Ley 25.246. Funciona con autonomía y autarquía financiera en el ámbito del Ministerio de Justicia y puede actuar en cualquier jurisdicción del país. Centraliza la recepción y el análisis de los Reportes de Operaciones Sospechosas, dicta las resoluciones que fijan las obligaciones de cada tipo de sujeto obligado (incluidas las entidades financieras, para las que la norma PLA/FT la dicta la UIF y no el BCRA), colabora con la Justicia y aplica las sanciones administrativas por incumplimiento de la ley y de sus resoluciones, también a los sujetos obligados del mercado de capitales.","La Comisión Nacional de Valores (CNV) es el organismo de contralor específico del mercado de capitales: supervisa el cumplimiento de la normativa de prevención por parte de los agentes y dicta normas propias en la materia (Título XI de sus Normas). Pero no reemplaza a la UIF: la CNV no recibe los ROS ni aplica las sanciones de la Ley 25.246. Colabora con la UIF, puede exigir acciones correctivas a los agentes y, bajo la Res. UIF 72/2023, participa de mesas de trabajo y eleva informes técnicos. Regla práctica: si la pregunta dice supervisa o dicta normas en el mercado de capitales, la respuesta es CNV; si dice autoridad de aplicación, recibe ROS, sanciona o actúa en todo el país, la respuesta es UIF.","El sistema argentino ALA/CFT se compone entonces de la UIF como autoridad de aplicación, los organismos supervisores sectoriales (CNV para mercado de capitales, BCRA para entidades financieras y cambiarias, SSN para seguros, INAES para cooperativas y mutuales), las autoridades judiciales (juzgados y fiscalías que investigan y juzgan el delito) y las fuerzas de seguridad. Incumplir la obligación de reportar expone a sanción penal (Código Penal) y administrativa (multas del Capítulo IV de la Ley 25.246, que aplica la UIF)."],"puntos":["UIF: autoridad de aplicación de la Ley 25.246; actúa en cualquier jurisdicción del país; recibe los ROS; aplica sanciones administrativas.","CNV: supervisa y dicta normas PLA/FT en el mercado de capitales; no recibe ROS ni sanciona por la Ley 25.246.","Las normas PLA/FT para entidades financieras las dicta la UIF.","Organismos de contralor específico (Res. UIF 72/2023): BCRA, CNV, SSN e INAES.","Sistema ALA/CFT = UIF + supervisores sectoriales + autoridades judiciales + fuerzas de seguridad.","No reportar una operación sospechosa: sanción penal y administrativa."]},{"titulo":"6. Sujetos obligados del mercado de capitales y requisitos de la CNV","parrafos":["El art. 20 de la Ley 25.246 enumera los sujetos obligados. En el mercado de capitales son los agentes de negociación y los agentes de liquidación y compensación (incisos 4 y 5), las personas registradas ante la CNV que colocan fondos comunes de inversión u otros productos de inversión colectiva, las plataformas de financiamiento colectivo, los agentes asesores globales de inversión, los fiduciarios financieros de fideicomisos con oferta pública autorizada (inciso 22) y, desde la Ley 27.739 y el art. 4 bis, los proveedores de servicios de activos virtuales (PSAV). La Res. UIF 78/2023 y las Normas CNV replican esta lista.","Quedan fuera, según las Normas CNV, los Agentes de Liquidación y Compensación Participantes Directos y los Agentes Productores, porque no administran cuentas de clientes ni reciben fondos de terceros. Los PSAV, según la Res. UIF 49/2024, son las personas humanas o jurídicas que, como negocio y para o en nombre de terceros, intercambian activos virtuales por moneda de curso legal o entre sí, transfieren activos virtuales, los custodian o administran (o administran instrumentos que permiten controlarlos), o participan en servicios financieros vinculados a la oferta de un emisor o venta de un activo virtual. Activo virtual es la representación digital de valor que puede comercializarse o transferirse digitalmente y usarse para pagos o inversiones. Los PSAV deben inscribirse ante la CNV y presentan a la UIF un Reporte Sistemático Anual (RSA) entre el 2 de enero y el 15 de marzo de cada año, por el año calendario anterior.","Para inscribirse en los registros de la CNV, las personas humanas y jurídicas deben acreditar integridad, idoneidad y solvencia. La integridad se acredita con el certificado de antecedentes penales y una declaración jurada de PLAFT; la solvencia con un informe de antecedentes comerciales actualizado (además del patrimonio neto mínimo que exige cada categoría); la idoneidad con la capacitación y los exámenes como este.","En materia de fondos, el Título XI exige que los ALyC y las personas que colocan FCI reciban los fondos de sus clientes exclusivamente desde cuentas bancarias o de pago (CBU/CVU) de titularidad o cotitularidad del cliente, abiertas en entidades del país autorizadas por el BCRA, que permitan identificar y trazar la transferencia. En efectivo solo pueden recibir, por cliente y por día, hasta el monto fijado en el art. 1 de la Ley 25.345 (Ley Antievasión); el examen pide esa referencia normativa, no una cifra."],"puntos":["Sujetos obligados del mercado de capitales: AN, ALyC, colocadores de FCI, AAGI, fiduciarios financieros con oferta pública, PFC y PSAV.","NO son sujetos obligados: ALyC Participantes Directos y Agentes Productores.","PSAV (Res. UIF 49/2024, art. 4 bis Ley 25.246): intercambio, transferencia, custodia/administración y servicios financieros sobre activos virtuales, por cuenta de terceros y como negocio.","Activo virtual: representación digital de valor comercializable o transferible digitalmente, usable para pagos o inversiones.","RSA de los PSAV: del 2 de enero al 15 de marzo de cada año.","Integridad = certificado de antecedentes penales + DJ PLAFT; Solvencia = informe de antecedentes comerciales actualizado.","Fondos de clientes: solo desde CBU/CVU de titularidad o cotitularidad del cliente en entidades autorizadas por el BCRA.","Efectivo por cliente y por día: hasta el monto del art. 1 de la Ley 25.345."]},{"titulo":"7. Enfoque basado en riesgo: autoevaluación, tolerancia al riesgo y matriz","parrafos":["La Res. UIF 78/2023 obliga a cada sujeto obligado a administrar sus riesgos de LA/FT/FP con un enfoque basado en riesgo. El punto de partida es la autoevaluación de riesgos: un ejercicio interno, por línea de negocio, que identifica el riesgo inherente, mide la calidad de los controles y determina el riesgo residual. Los factores de riesgo del art. 4 son cuatro: clientes, productos y servicios, canales de distribución y zona geográfica.","El resultado se vuelca en un Informe Técnico de Autoevaluación que debe ser aprobado por el órgano de administración o máxima autoridad, ser autosuficiente, conservarse junto con la metodología, los datos estadísticos y la documentación que lo sustentan en el domicilio registrado ante la UIF, incorporar la información que suministren la UIF y otras autoridades, considerar los resultados de la Evaluación Nacional de Riesgos y las tipologías y guías de organismos nacionales e internacionales, actualizarse con la periodicidad que fija la norma y enviarse a la UIF y a la CNV (antes del 30 de abril de cada año).","La periodicidad general es anual, pero los Agentes de Negociación y los Agentes Asesores Globales de Inversión (que no liquidan fondos propios ni de terceros) pueden realizarla cada dos años. Junto con el informe se envía, también a la UIF y a la CNV, la declaración de tolerancia al riesgo: el nivel de riesgo que el órgano de administración decide asumir en función de sus objetivos y plan de negocios, debidamente fundada y aprobada por ese órgano.","Con esa base, el sujeto obligado arma una matriz de riesgo que califica y segmenta a cada cliente en riesgo bajo, medio o alto, y de esa calificación se desprende el tipo de debida diligencia y la frecuencia de actualización del legajo. Un PEP extranjero, por ejemplo, se segmenta siempre como riesgo alto."],"puntos":["Factores de riesgo (art. 4 Res. 78/2023): clientes, productos y servicios, canales de distribución y zona geográfica.","Informe técnico de autoevaluación: aprobado por el órgano de administración, conservado, actualizado y enviado a la UIF y a la CNV.","Autoevaluación: anual en general; Agentes de Negociación y AAGI pueden hacerla cada dos años.","Declaración de tolerancia al riesgo: fundada, aprobada por el órgano de administración, enviada a la UIF y a la CNV.","El informe debe considerar la Evaluación Nacional de Riesgos, la información de la UIF y las tipologías de organismos nacionales e internacionales.","Matriz de riesgo: segmentación bajo/medio/alto que define el nivel de debida diligencia."]},{"titulo":"8. Gobierno del sistema: órgano de administración, oficial de cumplimiento, comité, manual, código y capacitación","parrafos":["El órgano de administración o máxima autoridad es el responsable último del sistema de prevención: debe entender y tomar en cuenta los riesgos de LA/FT/FP al establecer sus objetivos comerciales, aprobar el informe de autoevaluación, el manual, el código de conducta y el plan de capacitación, designar al oficial de cumplimiento titular y suplente, asignar recursos y revisar en forma continua el funcionamiento del sistema. Para la guía, los pilares del programa PLAFT de un agente son las políticas y procedimientos, el oficial de cumplimiento, la capacitación, la revisión independiente y la debida diligencia del cliente; recomendar activos según el riesgo que el cliente quiera asumir es asesoramiento de inversión, no un pilar PLAFT.","El oficial de cumplimiento es la persona que vela por la aplicación del sistema. Según la guía (siguiendo el histórico art. 20 bis de la Ley 25.246), cuando el sujeto obligado es una persona jurídica debe designarse como oficial de cumplimiento a un miembro del órgano de administración. Debe tener capacitación o experiencia en PLA/FT, domicilio en el país, autonomía, independencia y acceso irrestricto a la información, y se registra ante la UIF; hay un titular y un suplente, y el suplente actúa solo ante ausencia o impedimento del titular. Sus funciones incluyen proponer las políticas, procedimientos y controles para administrar y mitigar los riesgos; evaluar y verificar su aplicación, incluido el monitoreo de operaciones, la detección oportuna y el reporte de operaciones sospechosas; elaborar el informe de autoevaluación y el manual; atender los requerimientos de información de la UIF y de la CNV; y llevar el registro de capacitación.","Dos o más sujetos obligados vinculados por una relación de control o pertenecientes a una misma organización societaria pueden designar un único oficial de cumplimiento titular y suplente y compartir los legajos de clientes (con acuerdos de reciprocidad y autorización expresa del cliente). El Comité de Prevención de LA/FT lo preside el oficial de cumplimiento y lo integran funcionarios del primer nivel gerencial cuyas funciones se relacionan con riesgos de LA/FT; no pueden integrarlo el auditor interno ni el responsable de cumplimiento regulatorio y control interno. Si es inviable, el órgano de administración puede prescindir del comité dejándolo documentado y el oficial asume sus funciones.","El Manual de Prevención reúne las políticas y procedimientos; debe ser aprobado por el órgano competente, mantenerse actualizado, revisarse anualmente, encontrarse en el domicilio físico y ser accesible y conocido por todo el personal, dejando evidencia de su difusión y de la capacitación. El Código de Conducta fija los principios rectores y valores de integridad y de adecuada capacidad técnica, declara obligatorias las políticas, procedimientos y controles del sistema para directores, gerentes, empleados y colaboradores, exige constancia fehaciente de que lo conocen y trata cualquier incumplimiento como falta interna. El plan de capacitación es anual, alcanza a todo el personal (los nuevos ingresos dentro de los 60 días hábiles) y debe incluir como mínimo la definición de los delitos de LA/FT, la normativa nacional y los estándares internacionales vigentes, las políticas del sistema, los riesgos, tipologías y señales de alerta, el reporte de operaciones sospechosas y el deber de confidencialidad. Además, una Revisión Externa Independiente debe evaluar el sistema al menos una vez al año, y el control interno incluye el área PLA/FT en su programa anual."],"puntos":["Órgano de administración: entiende y considera los riesgos LA/FT/FP al fijar los objetivos comerciales; aprueba informe, manual, código y plan de capacitación.","Oficial de cumplimiento en una persona jurídica: un miembro del órgano de administración; hay titular y suplente; registrado ante la UIF.","Grupos económicos: pueden tener un único oficial de cumplimiento (titular y suplente) y compartir legajos de clientes.","Comité de prevención: oficial de cumplimiento más funcionarios del primer nivel gerencial vinculados a riesgos LA/FT.","Manual: aprobado, actualizado, revisado anualmente, en domicilio físico, conocido por todo el personal con evidencia de difusión.","Código de conducta: obligatorio para directores, gerentes, empleados y colaboradores; su incumplimiento es falta interna.","Plan de capacitación: normativa nacional y estándares internacionales + definición de los delitos de LA/FT como contenido mínimo.","Revisión externa independiente: al menos una vez al año."]},{"titulo":"9. Debida diligencia del cliente: legajo, niveles de riesgo, PEP y beneficiario final","parrafos":["Cliente es toda persona humana, jurídica o estructura jurídica, nacional o extranjera, con la que el sujeto obligado establece, de manera ocasional o permanente, una relación contractual de carácter financiero, económico o comercial; los meros proveedores no son clientes. La debida diligencia son los procedimientos de conocimiento aplicables a todos los clientes, graduados según el nivel de riesgo asignado a cada uno. El legajo se confecciona para todos los clientes sin excepción y debe contener la identificación, la verificación en el listado de terroristas (RePET) y el perfil tributario, económico, financiero y patrimonial que justifica la operatoria. El art. 21 inc. a) de la Ley 25.246 obliga a recabar documentos que prueben fehacientemente identidad, personería jurídica, domicilio, residencia y demás datos que se estipulen.","Los tres niveles son: riesgo bajo, debida diligencia simplificada y actualización del legajo cada 5 años; riesgo medio, debida diligencia media y actualización cada 3 años; riesgo alto, debida diligencia reforzada (documentación que acredite el origen de ingresos, fondos y patrimonio, monitoreo intensificado y aprobación del oficial de cumplimiento) y actualización cada 1 año. Un cliente de riesgo alto con cupo operativo anual asignado debe respaldar documentalmente el origen de los fondos de sus operaciones tanto si opera dentro del cupo como si lo excede con una explicación verbal (por ejemplo, dice que vendió el auto): la respuesta correcta es solicitar documentación de respaldo, no reportar de inmediato ni aceptar la explicación sin más.","PEP (Persona Expuesta Políticamente) es quien ocupa o ha ocupado funciones públicas relevantes en el país, en el exterior o en organizaciones internacionales, y quien está vinculado por parentesco o cercanía a esas personas. La norma vigente es la Res. UIF 192/2024 (reemplazó a la 35/2023). Para el examen integran la definición las autoridades y funcionarios de la Administración Pública Nacional, el personal del Poder Legislativo de la Nación, los funcionarios o empleados de entidades autárquicas, bancos oficiales, obras sociales estatales, empresas del Estado o sociedades con participación estatal mayoritaria, y los funcionarios públicos con poder de decisión en comisiones de adjudicación. Un cliente extranjero que se declara PEP se segmenta directamente como riesgo alto y necesita aprobación del oficial de cumplimiento para iniciar y continuar la relación. El Decreto 918/2012 es la norma que la guía asocia con la obligación de informar la condición de PEP (el cliente la declara bajo juramento).","Beneficiario final (Res. UIF 112/2021) es la persona humana que posee como mínimo el 10 por ciento del capital o de los derechos de voto de una persona jurídica, fideicomiso, fondo de inversión, patrimonio de afectación u otra estructura jurídica, o que por otros medios ejerce el control final; si nadie llega al 10 por ciento ni controla, se toma a quien ejerce la administración. El sujeto obligado debe identificar, verificar y conocer en forma continua a los beneficiarios finales de sus clientes. Ejemplos de examen: capital de 10 millones con socios de 2 millones (20%), 300 mil (3%) y 7,7 millones (77%): beneficiarios finales son el primero y el tercero; capital de 5 millones con socios de 250 mil (5%), 500 mil (10%), 2,5 millones (50%) y 1,75 millones (35%): son el segundo, el tercero y el cuarto, porque el 10 por ciento exacto cuenta. Si el cliente es a su vez sujeto obligado, la Res. UIF 3/2014 exige pedirle una declaración jurada de cumplimiento de las disposiciones vigentes en materia PLD/FT (con su constancia de inscripción ante la UIF). Un sujeto obligado puede apoyarse en otro sujeto obligado regulado y supervisado solo para identificar y verificar al cliente, identificar y verificar al beneficiario final y comprender el propósito y carácter de la relación; la responsabilidad sigue siendo propia. La documentación de identificación, conocimiento y operaciones del cliente se conserva al menos 10 años desde la finalización de la relación bajo la Res. 78/2023, mientras que la pregunta genérica de la guía sobre el plazo de conservación de la documentación respaldatoria se responde con 5 años."],"puntos":["Cliente: persona humana, jurídica o estructura, nacional o extranjera, relación ocasional o permanente de carácter financiero, económico o comercial.","Legajo para todos los clientes: identificación, verificación en listado de terroristas y perfil tributario, económico, financiero y patrimonial.","Riesgo bajo: DD simplificada y legajo cada 5 años; medio: DD media y cada 3 años; alto: DD reforzada y cada 1 año.","Cliente de riesgo alto que opera o ingresa fondos: solicitar documentación de respaldo.","PEP extranjero: riesgo alto. La Res. UIF 192/2024 define PEP; el Decreto 918/2012 se asocia a la obligación de informar PEP.","Beneficiario final: persona humana con al menos el 10% del capital o de los votos, o control final por otros medios (Res. UIF 112/2021).","Cliente que es sujeto obligado: pedirle declaración jurada de cumplimiento PLD/FT (Res. UIF 3/2014).","Dependencia en terceros solo para: identificar/verificar al cliente, identificar/verificar al beneficiario final y comprender el propósito de la relación."]},{"titulo":"10. Monitoreo: operaciones inusuales, registro y casos prácticos","parrafos":["Operación inusual es la tentada o realizada, en forma aislada o reiterada, con independencia del monto, que carece de justificación económica o jurídica, no guarda relación con el nivel de riesgo del cliente o su perfil transaccional, o que por su frecuencia, habitualidad, monto, complejidad, naturaleza u otras características se desvía de los usos y costumbres del mercado. Operación sospechosa es la tentada o realizada que, por sus características o porque la inusualidad no pudo justificarse tras el análisis del sujeto obligado, genera sospecha o motivos razonables de que los fondos provienen de un ilícito penal o se vinculan con LA/FT. La secuencia es: alerta, inusual, análisis, y recién entonces sospechosa (se reporta) o justificada (se archiva con fundamento).","Detectada una operación inusual, la primera medida es profundizar el análisis para obtener información que corrobore o revierta la inusualidad; no se reporta de inmediato ni se cierra la cuenta sin analizar. Todo ese proceso se vuelca en el Registro de Operaciones Inusuales, que debe asentar en forma simultánea los datos completos del cliente y su nivel de riesgo, el detalle de la operación, los motivos por los que se consideró inusual, el análisis realizado, la documentación de respaldo, la fecha de detección, el responsable interviniente, la decisión final (si se reporta o no como sospechosa) y las conclusiones motivadas. Mientras analiza, el sujeto obligado debe abstenerse de revelar al cliente o a terceros las actuaciones que está realizando.","Casos típicos del examen. Un monotributista deposita 24 millones en el banco, los transfiere a su cuenta comitente, compra un bono local al propio agente y lo transfiere a la cuenta de su cónyuge: corresponde reportar si el cónyuge vende de inmediato por debajo del precio de mercado, si los bonos se afectan como garantía de una caución tomadora para una operación ajena al perfil de riesgo, o si vuelven a transferirse a otro tercero sin justificación, es decir, en cualquiera de esos casos. Una organización sin fines de lucro recibe una donación, compra bonos locales y los transfiere en seguida a una cuenta en el exterior: el control es determinar el origen de la donación y el destino de la cuenta receptora. En general, las operaciones que deben evaluarse para reporte son las que no se ajustan al perfil del cliente."],"puntos":["Operación inusual: sin justificación económica o jurídica, fuera del perfil del cliente o de los usos del mercado, con independencia del monto.","Operación sospechosa: inusualidad no justificada tras el análisis, o motivos razonables de origen ilícito o vínculo con LA/FT.","Primera medida ante una operación inusual: profundizar el análisis.","Registro de operaciones inusuales: cliente, operación, motivos, análisis, documentación, fecha, responsable, decisión y fundamento.","Deber de reserva: no revelar al cliente ni a terceros las actuaciones.","Señales de alerta en el mercado: venta inmediata por debajo del precio, caución tomadora ajena al perfil, transferencias a terceros sin justificación, salida inmediata al exterior, monotributista con montos desproporcionados."]},{"titulo":"11. ROS y RFT: plazos, confidencialidad, sanciones y regímenes informativos","parrafos":["El Reporte de Operación Sospechosa (ROS) es la comunicación a la UIF de una operación calificada como sospechosa; su objetivo es justamente comunicar operaciones sospechosas a la UIF, que es el único destinatario, nunca la CNV ni el mercado. Debe estar fundado, con una descripción de las razones o inusualidades que llevaron a esa calificación, y acompañarse de los datos y documentos de soporte. Es confidencial: no se exhibe a revisores externos ni a organismos de control (salvo a la CNV en supervisiones in situ) y jamás se informa al cliente.","Plazos. La Ley 27.739 reformó el art. 21 de la Ley 25.246 y dispuso que el reporte se haga sin demora alguna, delegando los plazos concretos en las resoluciones UIF de cada sector. La Res. UIF 56/2024 adaptó todas esas resoluciones (para el mercado de capitales, sustituyó el art. 36 de la 78/2023). Cuando el examen pregunta si existe plazo máximo para reportar lavado de activos o financiamiento del terrorismo, la respuesta esperada es: el establecido en la Ley 27.739 y en las resoluciones UIF pertinentes a cada tipo de sujeto obligado, en el marco de la Res. 56/2024. Cuando pregunta en forma directa el plazo para reportar según la Res. 56/2024, la respuesta de la guía es 7 días hábiles. Cuando se trata de financiamiento del terrorismo con personas, bienes o beneficiarios designados por el Consejo de Seguridad de la ONU (Res. 1267), el reporte es sin demora alguna.","Para contexto, el texto literal de la 56/2024 habla de 24 horas desde que el sujeto obligado concluye que la operación es sospechosa de lavado, con un tope de 90 días corridos desde que la operación se realizó o tentó, y 24 horas desde la operación para FT y FP; antes, la 78/2023 original preveía 15 días corridos con tope de 150, y 48 horas para FT. No uses esos números en el examen si la pregunta ofrece las respuestas de la guía. Incumplir el deber de reportar acarrea sanción penal y administrativa; las administrativas las aplica la UIF, en el ámbito sancionatorio de la Ley 25.246 reformada por la 27.739.","Además de los ROS, los sujetos obligados del mercado de capitales cumplen regímenes informativos sistemáticos ante la UIF (art. 39 Res. 78/2023). De manera mensual, los ALyC y los AN informan el listado de cuentas comitentes diferenciando activas e inactivas (inactiva es la que no tuvo movimientos por más de un año calendario), identificando las subcuentas correspondientes a la cartera propia de la sociedad, y, cuando corresponda, las transferencias internacionales de valores negociables (tipo de operación, fecha, monto, moneda, país de origen y destino, cuentas). Anualmente se presenta el Reporte Sistemático Anual con información general, societaria, contable, de negocios y de clientes. Los PSAV presentan su RSA entre el 2 de enero y el 15 de marzo."],"puntos":["El ROS se presenta ante la UIF; su objetivo es comunicarle operaciones sospechosas.","ROS fundado, con descripción de las inusualidades y documentación de soporte; confidencial.","Plazo máximo genérico: el de la Ley 27.739 y las resoluciones UIF pertinentes, en el marco de la Res. 56/2024.","Plazo según la Res. 56/2024 (respuesta de la guía): 7 días hábiles.","FT con personas o bienes listados por la ONU: sin demora alguna.","Sanción por no reportar: penal y administrativa; la administrativa la aplica la UIF.","Régimen mensual: cuentas comitentes activas/inactivas con subcuentas de cartera propia y transferencias internacionales de valores negociables."]}],"datos_duros":[{"concepto":"Objetivo principal del lavado de activos","valor":"Simular la licitud del origen de los fondos","fuente":"Ley 25.246 / art. 303 CP"},{"concepto":"Etapas del lavado según GAFI","valor":"Colocación, estratificación (diversificación) e integración; fiscalización NO es etapa","fuente":"40 Recomendaciones GAFI"},{"concepto":"Origen de los fondos en el lavado","valor":"Exclusivamente ilícito, pero puede provenir de cualquier delito","fuente":"Art. 303 CP, Ley 26.683"},{"concepto":"Característica del financiamiento del terrorismo","valor":"Puede usar fondos lícitos","fuente":"Art. 306 CP / Ley 26.734"},{"concepto":"Umbral del delito de lavado (art. 303 CP)","valor":"150 salarios mínimos, vitales y móviles","fuente":"Ley 27.739 (2024)"},{"concepto":"Autoridad de aplicación de la Ley 25.246","valor":"UIF (Unidad de Información Financiera)","fuente":"Ley 25.246, arts. 5 y ss."},{"concepto":"Ámbito de actuación de la UIF","valor":"Cualquier jurisdicción del país","fuente":"Ley 25.246"},{"concepto":"Organismo que centraliza la recepción de ROS","valor":"UIF","fuente":"Ley 25.246, art. 21 inc. b"},{"concepto":"Organismo que aplica sanciones administrativas a sujetos obligados del mercado de capitales","valor":"UIF","fuente":"Ley 25.246 Cap. IV, reformada por Ley 27.739"},{"concepto":"Sanción por no reportar operaciones sospechosas","valor":"Penal y administrativa","fuente":"Ley 25.246 Cap. IV / Código Penal"},{"concepto":"Organismo que supervisa y dicta normas PLA/FT en el mercado de capitales","valor":"CNV","fuente":"Ley 26.831, Normas CNV Título XI, Res. UIF 72/2023"},{"concepto":"Organismo que dicta normas PLA/FT para entidades financieras","valor":"UIF","fuente":"Ley 25.246 art. 14"},{"concepto":"Composición del sistema ALA/CFT argentino","valor":"UIF (aplicación) + supervisores sectoriales (CNV, BCRA, SSN, INAES) + autoridades judiciales y de seguridad","fuente":"Ley 25.246 / Res. UIF 72/2023"},{"concepto":"Finalidad del Decreto 918/2012","valor":"Reglamentar la Ley 25.246 (reemplazó al Decreto 290/2007)","fuente":"Decreto 918/2012"},{"concepto":"Norma asociada a la obligación de informar PEP (criterio guía)","valor":"Decreto 918/2012","fuente":"Guía CNV / Decreto 918/2012"},{"concepto":"Norma que define a las PEP","valor":"Res. UIF 192/2024 (reemplazó a la 35/2023)","fuente":"Res. UIF 192/2024"},{"concepto":"Tratamiento de un cliente extranjero que se declara PEP","valor":"Segmentarlo como riesgo alto","fuente":"Res. UIF 78/2023 art. 29"},{"concepto":"Beneficiario final","valor":"Persona humana con al menos 10% del capital o de los derechos de voto, o que ejerce el control final por otros medios","fuente":"Res. UIF 112/2021"},{"concepto":"Norma CNV que regula PLA/FT en el mercado de capitales","valor":"Normas CNV (N.T. 2013) Título XI","fuente":"Normas CNV"},{"concepto":"Resolución UIF vigente para el mercado de capitales","valor":"Res. UIF 78/2023 (reemplazó a la 21/2018, que reemplazó a la 229/2011)","fuente":"Res. UIF 78/2023"},{"concepto":"Norma que establece la obligación de reportar operaciones sospechosas (criterio guía)","valor":"Res. UIF 29/2013","fuente":"Guía CNV / Res. UIF 29/2013"},{"concepto":"Norma que establece la obligación de reportar operaciones sospechosas en el mercado de capitales","valor":"Res. UIF 78/2023","fuente":"Res. UIF 78/2023 art. 36"},{"concepto":"Norma que establece los plazos de ROS","valor":"Res. UIF 56/2024","fuente":"Res. UIF 56/2024"},{"concepto":"Plazo para reportar una operación sospechosa según Res. 56/2024 (respuesta guía)","valor":"7 días hábiles","fuente":"Guía CNV / Res. UIF 56/2024"},{"concepto":"Plazo máximo para reportar LA o FT (pregunta genérica)","valor":"El establecido en la Ley 27.739 y en las resoluciones UIF de cada tipo de sujeto obligado, en el marco de la Res. 56/2024","fuente":"Ley 27.739 / Res. UIF 56/2024"},{"concepto":"Plazo del RFT cuando hay personas o bienes designados por el Consejo de Seguridad ONU (Res. 1267)","valor":"Sin demora alguna","fuente":"Res. UIF 29/2013 / 56/2024"},{"concepto":"Plazos literales de la Res. 56/2024 (contexto, no respuesta de examen)","valor":"LA: 24 hs desde que se concluye que es sospechosa, tope 90 días corridos desde la operación; FT y FP: 24 hs desde la operación","fuente":"Res. UIF 56/2024 art. 4 (sustituye art. 36 Res. 78/2023)"},{"concepto":"Quién establece los listados de sanciones financieras dirigidas en materia de FT","valor":"Consejo de Seguridad de las Naciones Unidas (Res. 1267/1999 y sucesivas)","fuente":"Res. CS ONU 1267 / Res. UIF 29/2013"},{"concepto":"Plazo para informar el resultado del congelamiento administrativo (criterio guía)","valor":"60 días","fuente":"Guía CNV / Res. UIF 29/2013"},{"concepto":"Duración del congelamiento por vinculación con terrorismo","valor":"Hasta 6 meses, prorrogable por única vez por igual plazo","fuente":"Res. UIF 29/2013 art. 11"},{"concepto":"Norma que establece la obligación de identificar al cliente y la DJ del cliente sujeto obligado","valor":"Res. UIF 3/2014","fuente":"Res. UIF 3/2014"},{"concepto":"Norma que regula la supervisión del cumplimiento de la normativa UIF","valor":"Res. UIF 72/2023 (derogó Res. 155/2018 y 97/2018)","fuente":"Res. UIF 72/2023"},{"concepto":"Organismos de contralor específico","valor":"BCRA, CNV, SSN e INAES","fuente":"Res. UIF 72/2023"},{"concepto":"Finalidad de las 40 Recomendaciones del GAFI","valor":"Establecer estándares internacionales contra el LA y el FT","fuente":"GAFI/FATF"},{"concepto":"Recomendación 1 del GAFI","valor":"Enfoque basado en riesgo","fuente":"40 Recomendaciones GAFI"},{"concepto":"Plazo de conservación de documentación respaldatoria (pregunta genérica guía)","valor":"5 años","fuente":"Guía CNV / Ley 25.246 y normativa UIF histórica"},{"concepto":"Conservación de documentación de identificación, conocimiento y operaciones del cliente","valor":"10 años desde la finalización de la relación con el cliente","fuente":"Res. UIF 78/2023 art. 17"},{"concepto":"Riesgo bajo","valor":"Debida diligencia simplificada; actualizar legajo cada 5 años","fuente":"Res. UIF 78/2023 arts. 27 y 30"},{"concepto":"Riesgo medio","valor":"Debida diligencia media; actualizar legajo cada 3 años","fuente":"Res. UIF 78/2023 arts. 28 y 30"},{"concepto":"Riesgo alto","valor":"Debida diligencia reforzada; actualizar legajo cada 1 año","fuente":"Res. UIF 78/2023 arts. 29 y 30"},{"concepto":"Periodicidad de la autoevaluación de riesgos","valor":"Anual en general; Agentes de Negociación y AAGI pueden hacerla cada 2 años","fuente":"Res. UIF 78/2023 art. 5"},{"concepto":"Destinatarios del informe de autoevaluación y de la declaración de tolerancia al riesgo","valor":"UIF y CNV (antes del 30 de abril de cada año)","fuente":"Res. UIF 78/2023 arts. 5 y 6"},{"concepto":"Factores de riesgo","valor":"Clientes, productos y servicios, canales de distribución, zona geográfica","fuente":"Res. UIF 78/2023 art. 4"},{"concepto":"Revisión externa independiente","valor":"Al menos una vez al año (informe a la UIF dentro de los 120 días corridos del vencimiento de la autoevaluación)","fuente":"Res. UIF 78/2023 art. 19"},{"concepto":"Revisión del manual de prevención","valor":"Anual","fuente":"Res. UIF 78/2023 art. 9"},{"concepto":"Capacitación de nuevos ingresos","valor":"Dentro de los 60 días hábiles","fuente":"Res. UIF 78/2023 art. 18"},{"concepto":"Quién puede ser oficial de cumplimiento en una persona jurídica (criterio guía)","valor":"Un miembro del órgano de administración","fuente":"Ley 25.246 art. 20 bis (histórico) / Guía CNV"},{"concepto":"Integración del Comité de Prevención LA/FT","valor":"Oficial de cumplimiento y funcionarios del primer nivel gerencial vinculados a riesgos LA/FT","fuente":"Res. UIF 78/2023 art. 14"},{"concepto":"Sujetos obligados vinculados por control o mismo grupo","valor":"Pueden designar un único oficial de cumplimiento (titular y suplente) y compartir legajos","fuente":"Res. UIF 78/2023 art. 13"},{"concepto":"Dependencia en terceros para la debida diligencia","valor":"Solo para identificar/verificar al cliente, identificar/verificar al beneficiario final y comprender el propósito de la relación","fuente":"Res. UIF 78/2023 art. 16"},{"concepto":"Legajos de clientes","valor":"Deben confeccionarse para todos los clientes","fuente":"Res. UIF 78/2023"},{"concepto":"Régimen informativo mensual ante la UIF","valor":"Listado de cuentas comitentes activas e inactivas con subcuentas de cartera propia; transferencias internacionales de valores negociables","fuente":"Res. UIF 78/2023 art. 39"},{"concepto":"Cuenta comitente inactiva","valor":"Sin movimientos por más de un año calendario","fuente":"Res. UIF 78/2023 art. 39"},{"concepto":"Reporte Sistemático Anual de los PSAV","valor":"Entre el 2 de enero y el 15 de marzo de cada año, por el año calendario anterior","fuente":"Res. UIF 49/2024"},{"concepto":"Definición de PSAV y de activo virtual","valor":"Res. UIF 49/2024 y art. 4 bis Ley 25.246: intercambio, transferencia, custodia/administración y servicios financieros sobre activos virtuales; activo virtual = representación digital de valor comercializable o transferible digitalmente para pagos o inversiones","fuente":"Res. UIF 49/2024 / Ley 27.739"},{"concepto":"Sujetos obligados del mercado de capitales según Normas CNV","valor":"AN, ALyC, agentes de colocación y distribución de FCI, AAGI, fiduciarios financieros con oferta pública, PFC y PSAV","fuente":"Normas CNV Título XI / Res. UIF 78/2023 art. 1"},{"concepto":"NO son sujetos obligados según Normas CNV","valor":"ALyC Participantes Directos y Agentes Productores","fuente":"Normas CNV Título XI"},{"concepto":"Recepción de fondos de clientes por ALyC y colocadores de FCI","valor":"Solo desde CBU/CVU de titularidad o cotitularidad del cliente en entidades del país autorizadas por el BCRA","fuente":"Normas CNV Título XI"},{"concepto":"Tope de efectivo por cliente y por día","valor":"El monto del art. 1 de la Ley 25.345 (Ley Antievasión)","fuente":"Normas CNV Título XI"},{"concepto":"Requisitos de inscripción CNV: integridad y solvencia","valor":"Integridad: certificado de antecedentes penales + DJ PLAFT; Solvencia: informe de antecedentes comerciales actualizado","fuente":"Normas CNV"},{"concepto":"Primera medida ante una operación inusual","valor":"Profundizar el análisis para corroborar o revertir la inusualidad","fuente":"Res. UIF 78/2023 art. 35"}],"trampas":["UIF vs CNV: si la pregunta dice supervisa, controla o dicta normas en el mercado de capitales, la respuesta es CNV; si dice autoridad de aplicación de la Ley 25.246, recibe los ROS, aplica sanciones admin
