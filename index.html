expresamente con él.","Deben registrarse en el sistema electrónico de registro de órdenes tanto las órdenes de clientes como las de cartera propia, sean para segmentos de concurrencia con prioridad precio-tiempo o para segmentos bilaterales. Se considera cartera propia no solo lo que opera la sociedad, sino también lo que operan sus directores, síndicos, consejeros de vigilancia, gerentes, socios, accionistas, empleados, administradores, apoderados y representantes.","Los boletos que se entregan al cliente deben explicitar comisiones y todo otro costo de intermediación. Hay rotación excesiva de cartera cuando la actividad no responde a órdenes del cliente y excede lo habitual. En ventas en contado normal, antes de cursar la orden el agente puede verificar que el cliente tenga los valores disponibles en su cuenta (o el esquema de préstamo que corresponda).","Para clientes con Acceso Directo al Mercado (ADM), la redistribución de market data en tiempo real por parte del agente está sujeta a los aranceles que fije el mercado."],"puntos":["Instrucción específica: especie, cantidad y precio o tasa.","Cartera propia incluye directivos, empleados, socios y apoderados.","Boletos: detallar comisiones y costos.","Rotación excesiva: sin órdenes del cliente y fuera de lo habitual.","Medios de contacto: los del convenio de apertura de cuenta.","ADM: market data en tiempo real sujeta a arancel del mercado."]},{"titulo":"Plataformas de Financiamiento Colectivo y PSAV","parrafos":["Las Plataformas de Financiamiento Colectivo (PFC) son sociedades anónimas registradas en la CNV que conectan inversores con emprendimientos. La regulación CNV abarca el esquema de equity (participación en el capital, a través de acciones, préstamos convertibles o fideicomisos), no el crowdfunding de donaciones o recompensas. Los proyectos deben revestir la calidad de Emprendimiento Argentino según la reglamentación del Ministerio de Economía. La PFC no puede asesorar, custodiar fondos ni asegurar retornos.","Los Proveedores de Servicios de Activos Virtuales (PSAV) deben inscribirse en el registro que lleva la CNV desde la Ley 27.739, que incorporó el art. 4 bis a la Ley 25.246 de prevención de lavado. Están obligadas las personas humanas residentes y las personas jurídicas constituidas en el país o extranjeras que hagan alguna actividad PSAV. Las sociedades extranjeras deben estar inscriptas según el art. 118 de la Ley 19.550 (sucursal o representación permanente).","El tipo societario por sí solo no impide la inscripción; lo que importa es cumplir los requisitos. El patrimonio neto mínimo depende de la categoría. Una persona humana puede inscribirse para actividades de intercambio entre activos virtuales y moneda de curso legal o entre activos virtuales. Un sujeto ya inscripto y fiscalizado por la CNV bajo la Ley 26.831 no puede inscribirse como PSAV: es causal de exclusión.","La CNV regula a los PSAV y supervisa los activos virtuales que califiquen como valores negociables. Al inversor se le recomienda operar solo con PSAV registrados y conocer los riesgos."],"puntos":["PFC: esquema equity; proyecto debe ser Emprendimiento Argentino.","PFC según la guía: Ley 27.440 (régimen original Ley 27.349).","PSAV: Ley 27.739, art. 4 bis Ley 25.246, registro en CNV.","Extranjeras: inscriptas por art. 118 Ley 19.550.","PN mínimo PSAV: según categoría.","Agente ya registrado bajo Ley 26.831: excluido como PSAV."]},{"titulo":"Valores negociables y acciones","parrafos":["Valores negociables son los títulos emitidos en serie, cartulares o escriturales, que pueden circular de manera generalizada e impersonal: acciones, cuotapartes, títulos de deuda, CPD, pagarés y contratos de derivados registrados en mercados. Se clasifican en renta variable (acciones, cuyo rendimiento depende de resultados y precio) y renta fija (títulos públicos, ON, cuyo flujo está pactado).","Las acciones ordinarias otorgan derecho a voto y a participar en las utilidades. Las preferidas tienen preferencia patrimonial (dividendo fijo o prioridad) y en general voto limitado. La política de dividendos y su distribución la decide la asamblea de accionistas.","En un aumento de capital por suscripción, el accionista tiene derecho de preferencia. Tras el aumento el precio de la acción se ajusta al precio paridad (promedio ponderado entre las acciones viejas al precio de mercado y las nuevas al precio de emisión, que es valor nominal más prima). La diferencia entre el precio antes del aumento y el precio paridad es el valor teórico del derecho de suscripción por cada acción vieja.","Si en una colocación por subasta las ofertas al precio de corte superan lo disponible, se asigna a prorrata entre todas las ofertas a ese precio, no por orden cronológico."],"puntos":["Ordinarias: voto y utilidades.","Dividendos: los define la asamblea.","Precio de emisión = VN + prima.","Derecho de suscripción = precio previo - precio paridad.","Subasta al precio de corte: prorrateo, no prioridad temporal."]},{"titulo":"Renta fija: títulos públicos, obligaciones negociables y matemática de bonos","parrafos":["Los títulos públicos son deuda del Estado nacional, provincial o municipal; su oferta pública está exceptuada de autorización de la CNV aunque se negocian en los mercados. Las obligaciones negociables son instrumentos de deuda emitidos por sociedades (y cooperativas, asociaciones civiles, entre otros), regulados por la Ley 23.576.","Cuando un bono cotiza a la par, la TIR, la tasa del cupón y el current yield coinciden. La duration modificada mide la sensibilidad del precio a la tasa: si se espera que bajen las tasas, los bonos que más suben son los de mayor duration modificada (no los de menor).","Para convertir tasas se pasa siempre por la tasa efectiva del período. Tasa adelantada (descuento) d y vencida i del mismo período se vinculan por i = d/(1-d). Una TNA se convierte en efectiva del período multiplicando por días/365, y luego se capitaliza al plazo deseado."],"puntos":["ON: deuda de sociedades, Ley 23.576.","A la par: TIR = cupón = current yield.","Baja de tasas: gana más el bono de mayor duration modificada.","Adelantada a vencida: i = d / (1 - d).","Año de 365 días para TNA en las respuestas de la guía."]},{"titulo":"Cheques de pago diferido, pagarés y facturas de crédito electrónicas","parrafos":["El CPD goza de oferta pública por la Ley 26.831 y se negocia en mercados bajo competencia de la CNV. Para negociarlo hay que endosarlo indicando que será negociado en mercados regulados por la CNV. En el segmento directo solo se negocian cheques que venzan a partir de 20 días corridos desde la decisión de negociarlos. El agente debe notificar fehacientemente, bajo su responsabilidad, las modalidades de negociación (avalado, garantizado, directo), sus esquemas de garantía y los riesgos ante rechazo por defectos formales o falta de fondos.","El pagaré bursátil se negocia en mercados registrados en la CNV, que es su autoridad de aplicación (Ley 27.440, arts. 195 a 199, que modifican la Ley 27.264). Puede amortizarse en cuotas, lleva cláusula sin protesto y la leyenda de negociación en mercados CNV, no exige nombre del beneficiario y se paga en el domicilio del custodio. Para negociarse debe cumplir los montos y plazos mínimos que fija la CNV. Si está en moneda extranjera sin tipo de cambio indicado, se toma el vendedor BNA del cierre del día anterior al vencimiento.","La Factura de Crédito Electrónica MiPyME (Ley 27.440, arts. 1 a 25) se emite a grandes empresas compradoras; aceptada expresa o tácitamente se vuelve título ejecutivo y valor no cartular negociable. Para negociarla en mercados, la PyME debe abrir una cuenta apta para ese instrumento y pedir la acreditación de la factura en ella. La cancelación se hace según el reglamento del Agente de Registro y Pago o de la entidad que haga de clearing, y si está en moneda extranjera la gran empresa la cancela en pesos conforme a ese reglamento."],"puntos":["CPD: endoso con leyenda de negociación en mercados CNV.","CPD segmento directo: vencimiento a partir de 20 días corridos.","Agente notifica modalidades, garantías y riesgos del CPD.","Pagaré: CNV autoridad de aplicación; montos y plazos mínimos CNV.","FCE: abrir cuenta apta y acreditar la factura.","FCE en moneda extranjera: se cancela en pesos según reglamento del agente.","FCE: aceptación tácita a los 15 días corridos (21 días temporalmente 2025-2026)."]},{"titulo":"Derivados: futuros, forwards, opciones, swaps y coberturas","parrafos":["Un futuro es un contrato estandarizado para comprar o vender un activo en una fecha futura a un precio pactado hoy, negociado en mercado y garantizado por la cámara. El forward es lo mismo pero a medida y bilateral, sin cámara. Un futuro agrícola es un contrato estandarizado para entregar o recibir mercadería en lugar y fecha determinados. Los márgenes de garantía sirven como garantía de cumplimiento y cubren el riesgo de incumplimiento.","La opción da al comprador el derecho, no la obligación, de comprar (call) o vender (put) a un precio de ejercicio; por ese derecho paga una prima, que es el costo del comprador y el ingreso del lanzador. El vendedor de un call está obligado a vender si el comprador ejerce. Una opción out of the money no tiene valor intrínseco pero sí temporal: no conviene ejercerla, pero el comprador puede venderla.","Un swap de tasa intercambia flujos a tasa fija por flujos a tasa variable. Para la guía, la estrategia que combina calls y puts es el spread, y el principal riesgo en derivados es el riesgo de base (diferencia entre precio contado y futuro que hace imperfecta la cobertura).","Cubrirse es tomar en el futuro la posición contraria a la que se tiene en contado. Quien está vendido en contado y espera que el precio baje ya está ganando con esa expectativa, así que no necesita cobertura en futuros."],"puntos":["Futuro: estandarizado, en mercado, con márgenes.","Prima: costo del comprador de la opción.","Vendedor de call: obligado a vender si ejercen.","Out of the money: sin valor intrínseco, con valor temporal.","Swap de tasa: fija contra variable.","Calls y puts combinados: spread (criterio guía).","Principal riesgo: riesgo de base (criterio guía)."]},{"titulo":"Tipos de operaciones: primaria, secundaria, caución, pase, plazo firme y préstamo","parrafos":["El mercado primario es la emisión inicial de valores por el emisor; la colocación primaria se hace por formación de libro (book building) o por subasta o licitación pública. El secundario es la negociación posterior entre inversores, regida por prioridad precio-tiempo: primero se ejecuta la mejor oferta de precio y, a igual precio, la más antigua.","En la caución bursátil el tomador obtiene fondos dejando valores en garantía, sin perder su propiedad, por lo que las acreencias (dividendos, rentas) devengadas durante la operación son del tomador. La garantía se valoriza al último precio de cierre de contado normal y se le aplica el aforo. En la apertura el colocador entrega y el tomador recibe el valor aforado menos los intereses; al vencimiento el tomador devuelve el valor aforado más gastos y el colocador cobra el valor aforado neto de gastos. El tomador puede cancelar anticipadamente pagando lo mismo que pagaría al vencimiento.","En el pase hay una compra al contado y una venta a plazo simultáneas: el tomador de fondos sí transfiere la propiedad de los valores, por eso las acreencias del período corresponden al colocador. El comprador a plazo firme puede cancelar anticipadamente pagando el importe del vencimiento. Pase y plazo firme solo se hacen sobre valores de renta fija y variable, excluidos CPD, letras de cambio, pagarés, certificados de depósito, warrants y plazos fijos.","En el préstamo de valores el agente debe contar con conformidad escrita del prestamista y autorización firmada por el tomador. La venta en corto es la venta de valores obtenidos mediante préstamo concertado en la misma jornada."],"puntos":["Primaria: book building, subasta o licitación.","Prioridad precio-tiempo: mejor precio, luego antigüedad.","Caución: no se transfiere propiedad; acreencias al tomador.","Pase: se transfiere propiedad; acreencias al colocador.","Garantía de caución: último cierre contado normal por aforo.","Cancelación anticipada: se paga el monto del vencimiento.","Pase y plazo firme: excluidos CPD, pagarés, letras, warrants, CD y plazos fijos.","Préstamo: conformidad escrita del prestamista y autorización del tomador."]},{"titulo":"Liquidación, compensación, garantías y fondo de garantía","parrafos":["La compensación determina las posiciones netas de cada agente y la liquidación es la entrega efectiva de fondos y valores. La cámara compensadora garantiza la liquidación de las operaciones garantizadas, como las de derivados en mercados autorizados y las de segmentos con prioridad precio-tiempo.","Las garantías (márgenes iniciales y de variación, aforos) aseguran el cumplimiento de los contratos y cubren el riesgo de incumplimiento. Si el valor de las posiciones se mueve en contra, se exige reponer márgenes.","El fondo de garantía obligatorio de los Mercados y Cámaras (art. 45 Ley 26.831) cubre compromisos no cumplidos entre agentes originados en operaciones con garantía del mercado o cámara. No cubre reclamos de clientes contra su agente: para eso existe un fondo distinto, el fondo de garantía para reclamos de clientes (Normas CNV Título VII)."],"puntos":["Cámara: garantiza la liquidación.","Garantías: cubren riesgo de incumplimiento.","Fondo de garantía del mercado: incumplimientos entre agentes en operaciones garantizadas.","Reclamos de clientes: fondo distinto (Título VII).","Liquidación y compensación: Normas CNV Título VI; garantizadas: Título XIV según la guía."]}],"datos_duros":[{"concepto":"Ley de Mercado de Capitales","valor":"Ley 26.831","fuente":"Ley 26.831"},{"concepto":"Ley de Financiamiento Productivo","valor":"Ley 27.440 (2018)","fuente":"Ley 27.440"},{"concepto":"Ley de obligaciones negociables","valor":"Ley 23.576","fuente":"Ley 23.576"},{"concepto":"Artículo asociado a la función de la CNV (criterio guía)","valor":"Art. 2","fuente":"Ley 26.831 art. 2"},{"concepto":"Inscripción obligatoria de agentes","valor":"Autorización y registro en CNV","fuente":"Ley 26.831 art. 47"},{"concepto":"Autoridad que sanciona a los agentes","valor":"CNV, en forma exclusiva","fuente":"Ley 26.831"},{"concepto":"Supervisión de agentes miembros","valor":"No exclusiva de CNV: también Mercados y Cámaras","fuente":"Ley 26.831 / Normas CNV Tít. VI"},{"concepto":"Liquidación y compensación","valor":"Normas CNV Título VI","fuente":"Normas CNV"},{"concepto":"Operaciones garantizadas","valor":"Normas CNV Título XIV (criterio guía)","fuente":"Normas CNV"},{"concepto":"Agentes de negociación y ALyC","valor":"Normas CNV Título VII","fuente":"Normas CNV"},{"concepto":"ADC y ACRyP","valor":"Normas CNV Título VIII","fuente":"Normas CNV"},{"concepto":"Agentes de calificación de riesgo","valor":"Normas CNV Título IX","fuente":"Normas CNV"},{"concepto":"Plataformas de financiamiento colectivo (criterio guía)","valor":"Ley 27.440","fuente":"Ley 27.440 / Ley 27.349"},{"concepto":"FCE MiPyME","valor":"Arts. 1 a 25","fuente":"Ley 27.440"},{"concepto":"Pagaré bursátil","valor":"Arts. 195 a 199 (modifican Ley 27.264)","fuente":"Ley 27.440"},{"concepto":"Autoridad de aplicación del pagaré negociado en mercados","valor":"CNV","fuente":"Ley 27.440 art. 198"},{"concepto":"Pagaré en moneda extranjera sin tipo de cambio indicado","valor":"Vendedor BNA al cierre del día anterior al vencimiento","fuente":"Ley 27.440 art. 195"},{"concepto":"FCE: plazo de aceptación tácita","valor":"15 días corridos (21 días entre 1/11/2025 y 31/10/2026)","fuente":"Ley 27.440 art. 6 / Res. SEPYME 219/2025"},{"concepto":"Fondo de garantía obligatorio de Mercados/Cámaras","valor":"Cubre incumplimientos entre agentes en operaciones garantizadas","fuente":"Ley 26.831 art. 45"},{"concepto":"CPD segmento directo: vencimiento mínimo","valor":"A partir de 20 días corridos desde la decisión de negociarlo","fuente":"Normas CNV Tít. VI"},{"concepto":"CPD: oferta pública","valor":"Sí, por Ley 26.831","fuente":"Ley 26.831 art. 2"},{"concepto":"Excepción a la limitación de actividades del ALyC","valor":"Bancos y entidades financieras Ley 21.526","fuente":"Normas CNV Tít. VII"},{"concepto":"Pueden ser hacedores de mercado","valor":"ALyC Integral, ALyC Propio, ALyC Agro y AN con convenio con ALyC Integral","fuente":"Normas CNV Tít. VI"},{"concepto":"Segmento del hacedor de mercado","valor":"Concurrencia de ofertas con prioridad precio-tiempo","fuente":"Normas CNV Tít. VI"},{"concepto":"Instrucción específica: contenido mínimo","valor":"Especie, cantidad y precio o rango de precio y/o tasa","fuente":"Normas CNV Tít. VII"},{"concepto":"Mecanismos de colocación primaria","valor":"Formación de libro, subasta o licitación pública","fuente":"Normas CNV Tít. VI Cap. IV"},{"concepto":"Valuación de garantía en caución","valor":"Último precio de cierre contado normal","fuente":"Reglamento de mercado / Normas CNV"},{"concepto":"Exclusiones en pase y plazo firme","valor":"CPD, letras, pagarés, certificados de depósito, warrants y plazos fijos","fuente":"Normas CNV Tít. VI Cap. V"},{"concepto":"Préstamo de valores: requisitos","valor":"Conformidad escrita del prestamista y autorización del tomador","fuente":"Normas CNV Tít. VI"},{"concepto":"Venta en corto","valor":"Con valores tomados en préstamo en la misma jornada","fuente":"Normas CNV Tít. VI"},{"concepto":"Canal oficial de avisos y hechos relevantes","valor":"Autopista de la Información Financiera (AIF)","fuente":"Normas CNV"},{"concepto":"Registro de PSAV","valor":"A cargo de la CNV","fuente":"Ley 27.739 / art. 4 bis Ley 25.246"},{"concepto":"PSAV extranjeras","valor":"Inscriptas por art. 118 Ley 19.550 (sucursal o representación permanente)","fuente":"Normas CNV"},{"concepto":"PSAV: patrimonio neto mínimo","valor":"Depende de la categoría","fuente":"Normas CNV"},{"concepto":"PSAV: exclusión","valor":"Sujetos ya registrados y fiscalizados por CNV bajo Ley 26.831","fuente":"Normas CNV"},{"concepto":"PFC: requisito del proyecto","valor":"Emprendimiento Argentino según Ministerio de Economía","fuente":"Normas CNV"},{"concepto":"PFC: forma jurídica","valor":"Sociedad anónima","fuente":"Normas CNV (RG 717)"},{"concepto":"Interés de caución de $100.000 al 30% a 30 días","valor":"$2.465,75 (año de 365 días)","fuente":"Cálculo guía"},{"concepto":"Bono a la par","valor":"TIR = tasa cupón = current yield","fuente":"Manual IAMC"},{"concepto":"Reclamo por saldos en el ADCVN","valor":"Ante el ADCVN, el agente y la CNV","fuente":"Normas CNV Tít. VIII"}],"trampas":["AN vs ALyC: el AN negocia pero no custodia fondos ni valores ni es depositante en Caja de Valores; el que custodia y liquida es el ALyC.","ALyC Integral vs Propio: solo el Integral liquida operaciones de AN con convenio; el Propio liquida solo lo suyo y lo de sus clientes.","Agente Productor: no custodia nada ni en nombre del cliente; si una opción dice que el AP recibe fondos, es falsa.","AAGI: puede operar con intermediarios del exterior, pero no puede ser cliente del AN con el que tiene convenio ni ofrecer valores sin oferta pública argentina.","Calificadoras: califican también valores con oferta privada, y su informe no es recomendación.","Hacedor de mercado: no actúa exclusivamente por cuenta de terceros (actúa por cartera propia), opera solo especies habilitadas y no puede delegar en clientes.","CCP: el mercado o cámara es contraparte central cuando garantiza, nunca cuando no garantiza.","Sanciones: exclusivas de la CNV; supervisión: compartida con mercados y cámaras. No confundir las dos afirmaciones verdadero/falso.","Caución vs pase: en la caución el tomador conserva la propiedad y cobra las acreencias; en el pase transfiere la propiedad y las acreencias son del colocador.","Caución: la garantía se valoriza al último cierre de contado normal, no al precio contado normal o inmediato del momento. Los otros precios del enunciado son distractores.","Caución al vencimiento: el tomador paga aforado más gastos; el colocador cobra aforado menos gastos (los intereses ya se descontaron en la apertura).","Fondo de garantía del mercado: cubre incumplimientos entre agentes, no reclamos de clientes contra su agente.","Duration: con baja de tasas suben más los bonos de mayor duration modificada.","Opción put con precio de mercado por encima del ejercicio: no se ejerce y se pierde solo la prima.","Subasta al precio de corte: se prorratea entre todas las ofertas a ese precio, no se asigna por orden de llegada."],"formulas":[{"nombre":"Valor aforado de la caución","formula":"Valor aforado = cantidad x precio último cierre contado normal x aforo","ejemplo":"1.000 acciones x $3,03 x 50% = $1.515"},{"nombre":"Flujos de la caución","formula":"Apertura: tomador recibe = aforado - intereses. Vencimiento: tomador paga = aforado + gastos; colocador cobra = aforado - gastos","ejemplo":"Intereses $20, gastos $3: tomador recibe 1.515 - 20 = $1.495; colocador cobra 1.515 - 3 = $1.512; tomador paga 1.515 + 3 = $1.518"},{"nombre":"Caución con VN distinto de 1","formula":"Valor aforado = cantidad x VN x precio (cotización por cada $1 de VN) x aforo","ejemplo":"1.000 acciones de VN $10 a $10,20 con aforo 50% = $51.000; el tomador recibe $51.000 menos intereses y el colocador cobra $51.000 menos gastos"},{"nombre":"Interés simple de caución","formula":"I = capital x TNA x días / 365","ejemplo":"100.000 x 0,30 x 30/365 = $2.465,75"},{"nombre":"Precio paridad en suscripción","formula":"Pp = (P x A + Pe x N) / (A + N), con Pe = VN + prima, A acciones viejas y N nuevas","ejemplo":"Aumento 100%, prima $2 (Pe = $3), P = $4: Pp = (4 + 3) / 2 = $3,50. Una nueva cada tres: (3 x 4 + 3) / 4 = $3,75"},{"nombre":"Valor del derecho de suscripción","formula":"D = P - Pp (por cada acción vieja)","ejemplo":"Aumento 200% a $1,20 con P = $1,50: Pp = (1,50 + 2 x 1,20) / 3 = 1,30; D = $0,20. Dos nuevas por una con prima $3 y P = $5: Pp = (5 + 2 x 4) / 3 = 4,333; D = $0,667"},{"nombre":"Prorrateo en subasta","formula":"Asignación de cada oferta = cantidad ofertada x (cantidad disponible / total ofertado al precio de corte)","ejemplo":"300 disponibles sobre 600 ofertadas (300, 50, 250): 50% a cada una = 150, 25 y 125"},{"nombre":"Tasa adelantada a vencida","formula":"i = d / (1 - d); TNA a efectiva del período: i = TNA x días / 365; efectiva a otro plazo: (1 + i)^(n2/n1) - 1","ejemplo":"d30 = 3,7%: i30 = 0,037/0,963 = 3,842%; i90 = 1,03842^3 - 1 = 11,975%; TNA 90 = 11,975% x 365/90 = 48,565%"},{"nombre":"Efectiva anual adelantada","formula":"d = i / (1 + i)","ejemplo":"TNA 48% a 182 días: i182 = 23,93%; i anual = 1,2393^(365/182) - 1 = 53,77%; d = 0,5377/1,5377 = 34,97%"},{"nombre":"Resultado de opciones","formula":"Call comprado: max(S - K; 0) - prima. Put comprado: max(K - S; 0) - prima","ejemplo":"Put K = $500, prima $4, S = $600: no se ejerce, resultado = -$4"},{"nombre":"Resultado de futuros","formula":"Comprado: (precio de cierre - precio pactado) x tamaño del contrato; vendido: al revés","ejemplo":"Compra a $100, cierre a $108, contrato de 10 unidades: ganancia $80"}]},"6":{"modulo":6,"titulo":"Fondos comunes de inversión y fideicomisos financieros","resumen":"El módulo cubre los dos grandes vehículos de inversión colectiva del mercado argentino: los fondos comunes de inversión (Ley 24.083 modificada por Ley 27.440 y Título V de las Normas CNV) y los fideicomisos financieros (CCyC arts. 1666 a 1707, Ley 24.441 y Normas CNV). El examen pregunta sobre todo quién hace qué (gerente vs depositaria, fiduciante vs fiduciario vs beneficiario vs fideicomisario), qué norma regula cada cosa, los límites porcentuales de inversión de los fondos abiertos, las reglas de los fondos de mercado de dinero y los plazos, mayorías y montos en UVA de los regímenes de fideicomisos financieros. Conviene memorizar los números y las funciones de cada órgano, porque muchas preguntas se resuelven sabiendo a quién le corresponde una tarea o cuál es el tope.","secciones":[{"titulo":"1. Qué es un fondo común de inversión: concepto, naturaleza, ventajas y desventajas","parrafos":["Un fondo común de inversión (FCI) es un patrimonio formado por los aportes de muchos inversores que comparten un mismo objetivo de inversión. Ese patrimonio pertenece en copropiedad a los cuotapartistas, en proporción a las cuotapartes que cada uno tiene, y está separado del patrimonio de la sociedad gerente que lo administra y de la sociedad depositaria que lo custodia. El fondo no es una sociedad ni tiene personería jurídica: la Ley 24.083 lo describe como un patrimonio indiviso de titularidad de diversas personas, a las que se les reconocen derechos de copropiedad representados por cuotapartes.","El inversor no compra directamente bonos, acciones o plazos fijos: compra cuotapartes y a través de ellas participa de una cartera armada y administrada por profesionales. Por eso se habla de inversión colectiva: muchos aportes chicos se juntan para acceder a una cartera diversificada que individualmente sería difícil o cara de replicar. Esa es la ventaja típica que el examen asocia al inversor minorista: acceso a carteras diversificadas con un monto mínimo bajo.","Otras ventajas que suelen aparecer como respuesta correcta son la administración profesional, la liquidez de los fondos abiertos (rescate en cualquier momento), la transparencia (valor de cuotaparte diario, régimen informativo, fiscalización de la CNV) y la diversificación. La desventaja clásica son los costos de administración: honorarios de la gerente y de la depositaria y gastos del fondo que se descuentan del patrimonio. Además el cuotapartista no decide inversión por inversión y asume el riesgo de mercado de la cartera: el fondo no garantiza rendimiento.","Comparado con el fideicomiso financiero, la guía oficial considera que el FCI tiene mayor transparencia normativa (reglamento de gestión tipo aprobado por la CNV, valuación diaria, información diaria) y que ambos vehículos comparten el riesgo de mercado y la obligación de contar con un prospecto. La diferencia estructural es que el FCI no tiene fiduciario: lo administra una sociedad gerente y lo custodia una depositaria, mientras que en el fideicomiso hay un fiduciario que recibe la propiedad fiduciaria de los bienes."],"puntos":["FCI = patrimonio indiviso y separado, en copropiedad de los cuotapartistas, administrado por una sociedad gerente; sin personería jurídica.","Instrumento de inversión colectiva: aportes de un grupo de inversores con los mismos objetivos.","Ventaja clave para el minorista: cartera diversificada con bajo monto mínimo; también administración profesional y liquidez.","Desventaja clave: costos de administración (honorarios y gastos).","Los cuotapartistas tienen derecho a la distribución de utilidades devengadas cuando el reglamento lo prevé.","FCI y fideicomiso financiero comparten el riesgo de mercado y la exigencia de prospecto; el FCI no tiene fiduciario.","El FCI ofrece mayor transparencia normativa que el fideicomiso según la guía oficial."]},{"titulo":"2. Marco normativo y fiscalización: Ley 24.083, Ley 27.440 y Normas CNV Título V","parrafos":["La ley madre de los FCI es la Ley 24.083 (año 1992). Fue modificada en profundidad por la Ley 27.440 de Financiamiento Productivo (2018), que reescribió el régimen de los fondos cerrados, amplió los activos admitidos, creó la posibilidad de fondos que inviertan en activos sin oferta pública (inmuebles, créditos, proyectos) y dio neutralidad fiscal a los cerrados que invierten en economía real. La reglamentación de detalle está en el Título V de las Normas CNV (N.T. 2013 y modificatorias): allí se regulan la gerente, la depositaria, los agentes colocadores, el reglamento de gestión, los límites de inversión, la custodia, las comisiones y honorarios, la publicidad, los prospectos y el régimen informativo.","La Comisión Nacional de Valores es la autoridad de fiscalización y registro tanto de los FCI como de los fideicomisos financieros con oferta pública. Autoriza cada fondo aprobando su reglamento de gestión, inscribe a las sociedades gerente y depositaria y a los agentes colocadores, controla su patrimonio, recibe la información periódica y puede sancionar. El BCRA no fiscaliza fondos, aunque muchas depositarias y gerentes sean bancos o pertenezcan a grupos bancarios.","Para responder preguntas del tipo 'qué norma regula tal cosa' conviene una regla práctica. Si la pregunta apunta a la figura básica del FCI (qué es, patrimonio separado, responsabilidad de la gerente, derecho al rescate), la respuesta es Ley 24.083. Si apunta a reglamentación operativa (publicidad y prospectos, custodia de activos, comisiones de administración, obligación de inscripción, régimen informativo), la respuesta es Normas CNV Título V. En fideicomisos la lógica es paralela: el contrato está en el Código Civil y Comercial (Ley 26.994, arts. 1666 a 1707, con el fideicomiso financiero en los arts. 1690 a 1692), la Ley 24.441 es la norma de 1995 que lo creó y que conserva vigentes partes útiles para la titulización, y las Normas CNV Título V Capítulo IV regulan la oferta pública.","En lo tributario, los fondos abiertos no son sujetos del impuesto a las ganancias (art. 25 Ley 24.083): tributa, en su caso, el cuotapartista. Los fondos cerrados que invierten en economía real tienen el régimen de transparencia fiscal de la Ley 27.440: el fondo no paga el impuesto y las utilidades se gravan en cabeza del cuotapartista cuando las percibe. Este detalle no suele preguntarse con profundidad, pero sirve para entender por qué la reforma de 2018 revitalizó a los cerrados."],"puntos":["Ley 24.083: ley marco de los FCI (patrimonio, órganos, responsabilidad, rescate).","Ley 27.440 (2018): reforma de fondos cerrados, nuevos activos y neutralidad fiscal.","Normas CNV Título V: reglamenta publicidad y prospectos, custodia, comisiones, límites e información.","CNV: organismo que fiscaliza FCI y fideicomisos financieros; aprueba el reglamento de gestión.","Responsabilidad de la sociedad gerente: regulada por la Ley 24.083 (art. 4, solidaria e ilimitada con la depositaria).","Fideicomisos: CCyC (Ley 26.994) arts. 1666 y ss. y 1690 y ss.; Ley 24.441; Normas CNV Título V Cap. IV."]},{"titulo":"3. Órganos del fondo: sociedad gerente, sociedad depositaria y agentes colocadores","parrafos":["La sociedad gerente dirige y administra el fondo. Define y ejecuta la política de inversión dentro de lo que permite el reglamento de gestión, decide qué comprar y vender, lleva la contabilidad del fondo, calcula el valor de cuotaparte, cumple el régimen informativo ante la CNV, representa a los cuotapartistas judicial y extrajudicialmente y controla que la depositaria haga su trabajo. Puede ser una sociedad anónima con objeto exclusivo de administrar fondos o una entidad financiera autorizada. Lo que la gerente no hace es la guarda y custodia de los valores y del dinero del fondo.","La sociedad depositaria es la contracara: tiene a su cargo la guarda y custodia de los valores negociables y demás instrumentos del fondo, percibe el importe de las suscripciones y paga los rescates, lleva el registro de cuotapartes escriturales y expide las constancias, y vigila que la gerente cumpla la ley y el reglamento. Debe ser una entidad financiera o una sociedad anónima de objeto especial. Lo que la depositaria no hace es confeccionar la contabilidad del fondo ni decidir inversiones: eso es de la gerente. El examen pregunta estas funciones en negativo (cuál NO corresponde), así que hay que tenerlas bien separadas.","Gerente y depositaria deben ser sociedades distintas e independientes, y ambas, junto con sus administradores, gerentes y miembros de los órganos de fiscalización, responden solidaria e ilimitadamente por los perjuicios causados a los cuotapartistas por incumplir la ley o el reglamento de gestión (art. 4 Ley 24.083). Las Normas CNV les exigen un patrimonio neto mínimo expresado en UVA: para la gerente, 150.000 UVA más 20.000 UVA por cada fondo adicional que administre, con al menos la mitad invertida como contrapartida líquida en activos elegibles. Así, una gerente con dos fondos necesita 170.000 UVA.","La colocación de cuotapartes de fondos abiertos la hacen la propia depositaria y los agentes colocadores inscriptos en la CNV: el Agente de Colocación y Distribución (ACyD), que solo intermedia, y el Agente de Colocación y Distribución Integral (ACDI), que además puede recibir fondos y llevar subcuentas de cuotapartistas (su patrimonio mínimo es de 170.000 UVA). En los fondos cerrados, como las cuotapartes se emiten y listan como un valor negociable, la colocación debe hacerla un Agente de Liquidación y Compensación (ALyC) o un Agente de Negociación. Un último dato que se pregunta: la fusión de fondos abiertos solo es posible entre fondos administrados por la misma sociedad gerente; no se pueden fusionar fondos de gerentes distintas."],"puntos":["Gerente: administra, decide inversiones, lleva la contabilidad, calcula el valor de cuotaparte, informa a la CNV, representa a los cuotapartistas. No custodia.","Depositaria: custodia valores y dinero, cobra suscripciones y paga rescates, lleva el registro de cuotapartes, vigila a la gerente. No lleva la contabilidad.","Responsabilidad solidaria e ilimitada de gerente y depositaria y de sus administradores (art. 4 Ley 24.083).","Patrimonio mínimo gerente: 150.000 UVA + 20.000 UVA por fondo adicional; con dos fondos, 170.000 UVA.","Colocadores de fondos abiertos: depositaria, ACyD y ACDI; de fondos cerrados: ALyC o Agente de Negociación.","La gerente no informa a la CNV una tasa de rendimiento esperada: no se prometen ni proyectan rendimientos.","Fusión de fondos abiertos: solo entre fondos de la misma gerente."]},{"titulo":"4. Reglamento de gestión, prospecto, contabilidad y régimen informativo","parrafos":["El reglamento de gestión es el documento central del FCI. Es un contrato entre la gerente y la depositaria que fija las reglas del fondo: objetivo y política de inversión, activos admitidos y límites, honorarios de la gerente y de la depositaria, tope de gastos, procedimiento de suscripción y rescate y sus plazos, criterios de valuación, régimen de distribución de utilidades, clases de cuotapartes y causales de liquidación. Debe ser aprobado por la CNV antes de que el fondo empiece a funcionar y se inscribe en el Registro Público. Cuando el examen pregunta qué documento describe las características del fondo, contiene su política de inversión o debe aprobar la CNV para autorizarlo, la respuesta es siempre el reglamento de gestión.","Las Normas CNV prevén un texto de cláusulas generales uniforme para todos los fondos abiertos y cláusulas particulares propias de cada fondo. Los fondos cerrados necesitan además un prospecto de emisión, porque sus cuotapartes se colocan por oferta pública como un valor negociable. La publicidad de los fondos y el contenido de los prospectos están regulados por el Título V de las Normas CNV: no se pueden prometer rendimientos ni usar información engañosa.","El régimen informativo de los fondos abiertos tiene tres capas. Diariamente la gerente informa y publica la cantidad de cuotapartes en circulación, el valor de cuotaparte y el patrimonio neto; también informa composición de cartera y honorarios con la periodicidad que fija la CNV. Trimestralmente se publican balances o estados trimestrales del fondo, y anualmente se presentan ante la CNV los estados contables auditados. En el examen aparecen las dos formulaciones: publicación de balances trimestrales como obligación de información periódica, y presentación anual de estados contables ante la CNV.","La contabilidad de los fondos abiertos debe llevarse obligatoriamente con el Plan y Manual de Cuentas de FCI que dispone la CNV, y el patrimonio neto se valúa con los criterios de valuación previstos en las Normas CNV (precio de mercado, devengamiento en los casos admitidos para fondos de dinero, etc.). El valor de la cuotaparte debe expresarse con al menos tres decimales."],"puntos":["Reglamento de gestión: contrato gerente-depositaria, aprobado por la CNV, describe el fondo y su política de inversión.","Fondo cerrado: reglamento de gestión más prospecto de emisión.","Publicidad y prospectos: Normas CNV Título V.","Información diaria: cantidad de cuotapartes, valor de cuotaparte y patrimonio neto.","Balances trimestrales publicados; estados contables anuales presentados ante la CNV.","Plan y Manual de Cuentas de FCI obligatorio; valuación según Normas CNV.","Valor de cuotaparte con al menos tres decimales."]},{"titulo":"5. Cuotapartes, suscripciones y rescates","parrafos":["La suscripción es la compra de cuotapartes por el inversor (ingreso de dinero al fondo) y el rescate es la venta o retiro de cuotapartes (salida de dinero del fondo). Ambas se hacen al valor de cuotaparte del día en que se cursa la solicitud, que se calcula al cierre de ese día dividiendo el patrimonio neto por la cantidad de cuotapartes. Por eso el inversor opera con un valor que todavía no conoce cuando ordena. Las comisiones de suscripción y de rescate, si existen, las paga el cuotapartista y no se imputan al resultado del fondo; en cambio los honorarios de la gerente y de la depositaria y los gastos ordinarios de gestión sí se cargan al fondo y bajan el valor de cuotaparte.","En los fondos abiertos el cuotapartista puede pedir el rescate en cualquier momento, en forma total o parcial y sin límite de monto ni de cantidad de operaciones. La regla general de la Ley 24.083 (art. 22) es que el rescate se paga dentro de los tres días hábiles de solicitado; el reglamento puede fijar plazos más cortos (los fondos de dinero pagan en el día, otros en 24 o 48 horas) y la suspensión del derecho de rescate por más de tres días hábiles requiere aprobación previa de la CNV. La regla es pagar en dinero, pero en casos excepcionales y con autorización previa de la CNV el rescate puede abonarse con valores de la cartera. Es falso que nunca pueda pagarse en especie.","Las cuotapartes pueden ser cartulares o escriturales (siempre nominativas) y el reglamento puede prever distintas clases, identificadas con letras (A, B, C, etc.), que se diferencian por tipo de inversor, monto mínimo, moneda, honorarios o política de distribución. En los fondos cerrados existen además cuotapartes de renta, que dan derecho a una renta periódica. Los cuotapartistas son quienes tienen derecho a la distribución de las utilidades devengadas por el fondo, cuando el reglamento lo establece; si no, las utilidades se capitalizan en el valor de cuotaparte.","Desde la RG 977/2023, las personas menores de edad pueden cursar órdenes de suscripción de fondos abiertos de mercado de dinero a partir de los 13 años, por internet, con una cuenta a su nombre vinculada a la de su representante legal; sin intervención del representante pueden invertir hasta un salario mínimo vital y móvil por mes con fondos de su caja de ahorro. Para el examen alcanza con recordar: 13 años y solo fondos de mercado de dinero."],"puntos":["Suscripción = compra de cuotapartes; rescate = venta de cuotapartes.","Valor de cuotaparte = patrimonio neto / cantidad de cuotapartes, calculado diariamente al cierre.","La comisión de suscripción (y de rescate) no se imputa al resultado del fondo; honorarios y gastos sí.","Rescates en fondos abiertos: totales o parciales, sin límite, en cualquier momento.","Pago del rescate: regla de tres días hábiles (art. 22 Ley 24.083); plazos menores según reglamento.","Pago en especie con valores de cartera: solo en casos excepcionales y con autorización previa de la CNV.","Clases de cuotapartes por tipo de inversor, monto, moneda u honorarios; cuotapartes de renta en cerrados.","Menores desde los 13 años: solo fondos abiertos de mercado de dinero (RG 977/2023)."]},{"titulo":"6. Clases de fondos: abiertos y cerrados, y categorías por objeto de inversión","parrafos":["La primera distinción es entre fondos abiertos y cerrados. En los abiertos la cantidad de cuotapartes es variable: crece con cada suscripción y baja con cada rescate, el fondo tiene duración indefinida y el inversor entra y sale contra el propio fondo al valor de cuotaparte del día. En los cerrados la cantidad de cuotapartes es fija, se emiten en una colocación primaria por oferta pública, tienen plazo determinado y no hay rescate anticipado contra el fondo: el inversor que quiere salir vende sus cuotapartes en el mercado secundario donde listan. La liquidez de un abierto la da el fondo; la de un cerrado, el mercado.","Por objeto de inversión, los fondos abiertos se clasifican en fondos de mercado de dinero (money market), de renta fija, de renta variable, de renta mixta y fondos con regímenes especiales: fondos PyME (al menos 75% del haber en valores negociables emitidos por PyMEs o por entidades cuya emisión financie PyMEs), fondos para el financiamiento de la infraestructura y la economía real, fondos ASG (ambientales, sociales y de gobernanza, con un plazo mínimo de conformación de cartera de 180 días corridos), fondos destinados exclusivamente a inversores calificados y fondos en moneda extranjera.","Otra clasificación relevante para los límites de inversión es la del público al que se dirige el fondo: fondos destinados al público en general, con límites más estrictos de diversificación, y fondos destinados exclusivamente a inversores calificados, con límites más holgados. La RG 1030/2024 creó un régimen especial de fondos abiertos para inversores calificados: los fondos en moneda extranjera bajo este régimen quedan exentos del piso de 75% de activos locales, pero solo pueden recibir suscripciones con fondos depositados en cuentas radicadas en el exterior. El fondo abierto de renta variable en dólares bajo régimen especial es el ejemplo que el examen usa de fondo que exige suscripción exclusivamente por inversores calificados.","La misma RG 1030/2024 habilitó, a partir de 2024, los CEDEARs de ETFs de gestión pasiva (fondos cotizados que replican índices de amplia difusión de renta variable, commodities o activos virtuales) como nuevo instrumento con oferta pública en la Argentina. Por último, los fondos pueden operar con instrumentos financieros derivados tanto con fines de cobertura como de inversión para administrar más eficientemente la cartera, con la condición de que la exposición total a riesgo de mercado no supere el patrimonio neto del fondo."],"puntos":["Abierto: cuotapartes variables, duración indefinida, rescate contra el fondo al valor del día.","Cerrado: cuotapartes fijas, plazo determinado, colocación primaria por oferta pública y negociación secundaria en mercado.","Categorías por objeto: mercado de dinero, renta fija, renta variable, mixtos, PyME, infraestructura y economía real, ASG, inversores calificados.","Fondo PyME: mínimo 75% del haber en valores de PyMEs o que financien PyMEs.","Fondo ASG: plazo mínimo de conformación de cartera de 180 días corridos.","RG 1030/2024: fondos abiertos para inversores calificados en moneda extranjera se suscriben con fondos depositados en el exterior.","Nuevo instrumento desde 2024: CEDEARs de ETFs de gestión pasiva.","Derivados permitidos con fines de cobertura o inversión si la exposición no supera el patrimonio neto."]},{"titulo":"7. Límites de inversión de los fondos abiertos","parrafos":["Los límites buscan diversificación y evitar conflictos de interés, y vienen de los arts. 6 y 7 de la Ley 24.083 reglamentados por las Normas CNV. Para un fondo abierto destinado al público en general: no se puede invertir más del 20% del patrimonio en valores negociables de una misma emisora (por ejemplo, obligaciones negociables de la misma empresa); las inversiones en una misma especie de títulos de deuda pública emitidos con iguales condiciones de emisión por el Estado nacional, provincial o municipal no pueden superar el 30% del patrimonio del fondo; y las inversiones en valores emitidos por la controlante de la gerente o por la controlante o las controladas de la depositaria no pueden exceder el 2% del capital o del pasivo obligacionario de esa controlante o controlada según su último balance. Está prohibido invertir en valores emitidos por la propia gerente o la propia depositaria, y la cartera no puede representar más del 10% del pasivo de una misma emisora.","Otro límite estructural: al menos el 75% del haber del fondo debe estar invertido en activos emitidos y negociados en el país (la ley asimila los de los Estados parte del MERCOSUR y Chile). Un CEDEAR es un certificado emitido y negociado en la Argentina, así que un fondo de renta variable para el público en general puede invertir hasta el 100% de su patrimonio en CEDEARs cuyo subyacente sean acciones chilenas. En cuanto a disponibilidades (dinero en cuenta), no existe un porcentaje máximo: el fondo puede quedarse líquido si la gerente lo decide, aunque un fondo especializado debe respetar el mínimo del 75% en los activos de su especialidad.","Inversión en otros fondos: un fondo abierto puede invertir en cuotapartes de otros fondos abiertos solo en fondos de mercado de dinero administrados por otra gerente y hasta el 5% de su haber. En cuotapartes de fondos cerrados, nunca puede invertir en cerrados administrados por su propia gerente; en cerrados de otra gerente con objeto compatible el tope depende del tipo de fondo: 10% del haber como regla (incluidos los fondos ASG y los de infraestructura y economía real), 5% para los fondos PyME y 25% para los fondos destinados exclusivamente a inversores calificados.","El examen suele dar carteras y preguntar cuál cumple. Un fondo especializado en renta fija debe tener al menos 75% en instrumentos de renta fija (títulos públicos, obligaciones negociables, letras, plazos fijos, cauciones, valores de deuda fiduciaria) y no puede llenar el resto con acciones en proporciones que rompan ese piso ni superar el 20% por emisora. Dos carteras con 25% o 15% de acciones y certificados de participación (que son renta variable) ya no cumplen con la especialización. Para resolverlo, sumá primero cuánto hay de renta variable y comparalo con el 25% máximo de activos ajenos a la especialidad."],"puntos":["Misma emisora: máximo 20% del patrimonio (por ejemplo, ON de una misma empresa).","Misma especie de título público con iguales condiciones de emisión: máximo 30% del patrimonio.","Controlante de la gerente o controlante/controladas de la depositaria: máximo 2% del capital o pasivo obligacionario de esa entidad.","Prohibido invertir en valores de la propia gerente o depositaria; tope 10% del pasivo de una emisora.","Mínimo 75% en activos emitidos y negociados en el país (más MERCOSUR y Chile); los CEDEARs cuentan como activo local, hasta 100%.","Disponibilidades: no hay porcentaje máximo.","Cuotapartes de otros fondos abiertos: solo fondos de dinero de otra gerente, hasta 5%.","Cuotapartes de fondos cerrados de otra gerente: 10% regla general (ASG, infraestructura), 5% PyME, 25% inversores calificados; 0% si son de la propia gerente."]},{"titulo":"8. Fondos de mercado de dinero (money market): clásicos y dinámicos","parrafos":["Los fondos de mercado de dinero invierten en instrumentos de muy corto plazo y alta liquidez: cuentas remuneradas, plazos fijos, cauciones, letras y títulos de deuda con vencimiento no mayor a un año, pactos de recompra. No pueden tener acciones ni activos de renta variable: una cartera con 25% en acciones emitidas en el país está directamente excedida, porque el límite para acciones en un fondo de dinero es cero. Su objetivo es preservar el capital con liquidez inmediata (rescate en el día), y por eso son los fondos que pueden suscribir los menores desde los 13 años.","Una parte de la cartera se valúa a devengamiento (acumulando intereses día a día en lugar de usar precio de mercado), lo que da un valor de cuotaparte estable. Para cubrir el riesgo de que esos activos no puedan liquidarse a ese valor, el fondo debe constituir un margen de liquidez sobre la porción de activos que valúan a devengamiento. Además, los fondos de dinero son los únicos para los que son obligatorias las pruebas de resistencia de mercado (stress tests) que simulan escenarios adversos de tasas y rescates.","La RG 1038/2024 distinguió dos subtipos. El fondo de dinero clásico puede tener hasta 35% del patrimonio en activos valuados a devengamiento, hasta 35% en plazos fijos precancelables y solo hasta 20% del patrimonio neto en títulos representativos de deuda con vencimiento final no mayor a un año desde su adquisición. El fondo de dinero dinámico puede tener hasta 30% a devengamiento, hasta 20% en plazos fijos precancelables y hasta el 100% del patrimonio neto en títulos de deuda con vencimiento no mayor a un año.","Como el dinámico puede llenarse de títulos de deuda a mercado, tiene más volatilidad, más sensibilidad a los cambios de tasa de interés y más exposición al riesgo que el clásico. La afirmación correcta es: los fondos de dinero clásicos presentan menor volatilidad, menor sensibilidad a la tasa y menor exposición al riesgo que los dinámicos. El examen la toma en las dos direcciones (verdadero/falso), así que hay que leer bien el sentido."],"puntos":["Activos admitidos: cuentas remuneradas, plazos fijos, cauciones, letras y deuda de corto plazo; prohibidas las acciones.","Margen de liquidez: se constituye sobre la porción de activos valuados a devengamiento.","Pruebas de resistencia de mercado: obligatorias solo para fondos abiertos de dinero.","Clásico: hasta 20% del PN en títulos de deuda con vencimiento no mayor a un año; hasta 35% a devengamiento.","Dinámico: hasta 100% del PN en títulos de deuda con vencimiento no mayor a un año; hasta 30% a devengamiento.","Clásico = menor volatilidad y menor riesgo que el dinámico.","Menores desde 13 años solo pueden suscribir fondos de dinero."]},{"titulo":"9. Fondos comunes de inversión cerrados (Ley 27.440)","parrafos":["El fondo cerrado emite una cantidad fija de cuotapartes mediante una colocación primaria con oferta pública autorizada por la CNV, tiene un plazo de duración determinado y sus cuotapartes deben listarse en un mercado autorizado. Como no hay rescate anticipado contra el fondo, el inversor puede adquirir cuotapartes en la colocación primaria y también en la negociación secundaria, y se desprende de ellas vendiéndolas en el mercado. Por eso el colocador debe ser un ALyC o un Agente de Negociación, y el fondo necesita reglamento de gestión y prospecto de emisión.","La Ley 27.440 relanzó la figura: los cerrados pueden invertir en activos sin oferta pública (desarrollos inmobiliarios, créditos, proyectos de infraestructura, empresas no listadas, capital emprendedor, activos agropecuarios) y los que invierten en economía real tienen transparencia fiscal, lo que los vuelve competitivos frente al fideicomiso financiero como vehículo de inversión directa. Pueden emitir cuotapartes de condominio y cuotapartes de renta, y en general se dirigen a inversores calificados cuando el objeto es un proyecto o activo ilíquido.","Los fondos abiertos pueden invertir en cuotapartes de fondos cerrados con los topes vistos (10%, 5% o 25% según el tipo de fondo abierto) y siempre que el cerrado sea administrado por otra gerente y tenga un objeto compatible. Es una pregunta frecuente: si el cerrado lo administra la misma gerente que el abierto, el tope es cero."],"puntos":["Cuotapartes fijas, plazo determinado, oferta pública y listado obligatorio.","Se adquieren en colocación primaria y en negociación secundaria; no hay rescate anticipado contra el fondo.","Requiere reglamento de gestión y prospecto de emisión.","Colocación a cargo de ALyC o Agente de Negociación.","Ley 27.440: activos sin oferta pública (inmobiliario, infraestructura, créditos) y transparencia fiscal.","Un abierto nunca invierte en cerrados de su propia gerente."]},{"titulo":"10. El fideicomiso en el Código Civil y Comercial: concepto, partes y tipos","parrafos":["El fideicomiso es el contrato por el cual una parte, el fiduciante, transmite o se obliga a transmitir la propiedad de bienes a otra, el fiduciario, que se obliga a ejercerla en beneficio de quien el contrato designa, el beneficiario, y a transmitir esos bienes al cumplirse un plazo o condición al fideicomisario (CCyC art. 1666). Lo regula el Código Civil y Comercial aprobado por la Ley 26.994, en los arts. 1666 a 1707 (Capítulo 30 del Título IV del Libro Tercero), que absorbió y derogó el Título I de la Ley 24.441 de 1995. De la Ley 24.441 siguen vigentes, entre otras, las normas sobre cesión de créditos sin notificación al deudor cedido (arts. 70 a 72), fundamentales para la titulización de carteras.","Las cuatro posiciones hay que tenerlas claras. Fiduciante: transmite los bienes y, en la práctica, es el originador de la cartera (una empresa de electrodomésticos que cede sus créditos). Fiduciario: recibe la propiedad fiduciaria y administra con la prudencia y diligencia del buen hombre de negocios; no puede ser dispensado de culpa o dolo y responde ante los inversores aun cuando delegue tareas. Beneficiario: quien recibe los beneficios durante la vida del fideicomiso; en el financiero, los titulares de los valores fiduciarios. Fideicomisario: a quien se le transmite lo que queda al concluir el fideicomiso; puede ser el fiduciante, el beneficiario o un tercero. Es frecuente que fiduciante y fideicomisario coincidan, y en fideicomisos cuyo activo es dinero u otros activos líquidos (fondos de inversión directa) el inversor que aporta dinero es fiduciante-beneficiario.","La característica central es el patrimonio separado (art. 1685): los bienes fideicomitidos forman un patrimonio distinto del patrimonio del fiduciario y del fiduciante, no responden por las deudas de ellos ni por las deudas del fideicomiso salvo con los propios bienes fideicomitidos. El fideicomiso no quiebra: si el patrimonio es insuficiente se liquida, y en el financiero decide la asamblea de beneficiarios. El plazo máximo es de 30 años, salvo que el beneficiario sea una persona incapaz o con capacidad restringida.","Tipos que menciona el temario: fideicomiso ordinario o de administración; fideicomiso de garantía (los bienes garantizan una obligación); fideicomiso financiero (el fiduciario es una entidad financiera o sociedad autorizada por la CNV y los beneficiarios son los titulares de los valores fiduciarios, arts. 1690 a 1692); fideicomiso PyME (destinado a financiar PyMEs); fideicomisos solidarios o con fines sociales; fideicomisos inmobiliarios, de infraestructura y de capital emprendedor, que en el ámbito de la CNV son variantes del financiero. El fideicomiso financiero es el instrumento típico de titulización de activos: convierte una cartera de créditos ilíquidos en valores negociables."],"puntos":["Fideicomiso: contrato por el cual se transmiten bienes a un fiduciario para un fin determinado en beneficio de un beneficiario (CCyC art. 1666).","Regulado por el CCyC (Ley 26.994) arts. 1666 a 1707; Ley 24.441 fue la norma original (1995) y conserva vigentes la cesión de créditos sin notificación y otras partes.","Fiduciante transmite; fiduciario administra y responde; beneficiario cobra; fideicomisario recibe el remanente final (puede ser el fiduciante, el beneficiario o un tercero).","Patrimonio separado del fiduciario y del fiduciante (art. 1685); el fideicomiso no quiebra, se liquida.","Plazo máximo 30 años, salvo beneficiario incapaz.","Fiduciario financiero: entidad financiera o sociedad inscripta en el Registro de Fiduciarios Financieros de la CNV.","Fideicomiso financiero = instrumento típico de titulización; en los de activos líquidos coinciden fiduciante y beneficiario."]},{"titulo":"11. Fideicomiso financiero con oferta pública: valores fiduciarios, administración, colocación, asambleas e información","parrafos":["Un fideicomiso financiero con oferta pública es aquel en el que el fiduciario está inscripto en el Registro de Fiduciarios Financieros de la CNV y los beneficiarios son los titulares de los valores fiduciarios colocados por oferta pública. Su funcionamiento lo regula el contrato de fideicomiso y la oferta se realiza mediante el prospecto (si hay programa global, prospecto del programa y suplemento de prospecto por cada serie), que es el documento básico de la oferta y el que se le entrega al inversor que pide los términos y condiciones junto con el contrato. Las Normas CNV admiten la constitución por acto unilateral, es decir, por la sola declaración de voluntad del fiduciante, sin necesidad de un contrato bilateral inicial. La obligación de inscripción y el régimen de oferta pública están en el Título V de las Normas CNV.","Los valores fiduciarios pueden ser valores de deuda fiduciaria (VDF), certificados de participación (CP) o valores fiduciarios atípicos creados al amparo del art. 1820 del CCyC. Los VDF son títulos de deuda garantizados con los bienes fideicomitidos y pueden ser emitidos por el fiduciario, por el fiduciante o por un tercero; suelen dividirse en clases senior (A), subordinadas (B, C) con prelación de cobro decreciente. Los CP solo los emite el fiduciario y representan el derecho al remanente: cobran último y absorben primero las pérdidas. Al inversor averso al riesgo se le recomienda el VDF senior (bajo riesgo, menor rentabilidad) y, entre estructuras, una serie con historial largo cuyo activo sean créditos ya originados (por ejemplo créditos de consumo de la serie 132) antes que un proyecto a desarrollar.","El fiduciario puede delegar la administración y cobranza de los créditos, típicamente en el fiduciante, pero sigue siendo el responsable frente a los inversores: si el administrador delegado no deposita las cobranzas, el reclamo se dirige al fiduciario. Cuando hay delegación, el agente de cobro debe depositar los fondos cobrados en una cuenta del fideicomiso operada exclusivamente por el fiduciario dentro de un plazo de 3 días hábiles. La custodia de los documentos que respaldan los bienes fideicomitidos también corresponde al fiduciario y solo puede delegarse en el fiduciante si éste es una entidad financiera; una empresa comercial (una casa de electrodomésticos) no puede ser agente de custodia.","La colocación primaria debe hacerse a través de los sistemas informáticos de los mercados autorizados por la CNV, por subasta o licitación pública o por formación de libro, con un tramo competitivo (ofertas con precio o tasa) y un tramo no competitivo (ofertas sin precio, al corte). La guía oficial considera incorrecta una subasta ciega o cerrada para el tramo competitivo combinada con una abierta para el no competitivo: la modalidad debe ser consistente y transparente. En materia de asambleas de tenedores: modificar una condición esencial de la emisión requiere el consentimiento unánime de los tenedores de valores emitidos y en circulación; si el patrimonio es insuficiente para cumplir las obligaciones, las decisiones se toman con al menos tres cuartas partes de los valores fiduciarios emitidos y en circulación; y una asamblea a distancia es válida si se graba en soporte digital y se garantiza la identificación de todos los participantes.","Régimen informativo. El fiduciario financiero acredita su requisito patrimonial presentando estados contables trimestrales dentro de los 42 días corridos de cerrado cada trimestre. El fideicomiso presenta estados contables por períodos anuales y, opcionalmente, trimestrales, salvo que sea un fondo de inversión directa (FID), donde los trimestrales son obligatorios y además debe actualizarse anualmente el PIPE (Plan de Inversión, Producción y Estratégico) junto con los estados contables anuales. Durante la vigencia se publican en la web de la CNV informes mensuales de control y revisión de los activos subyacentes y su flujo de fondos, dentro de los 20 días hábiles; la función puede ejercerla un contador público independiente con no menos de 5 años de matrícula. Ahí debe mirar el inversor que quiere saber cómo viene el fideicomiso. En el suplemento de prospecto, la descripción del fiduciante incluye información contable de los 3 últimos ejercicios anuales (o desde su constitución), y en los programas globales que prevean exclusivamente fondos de inversión directa los fiduciantes pueden no estar identificados si el objeto de inversión está expresamente delimitado."],"puntos":["FF con oferta pública: fiduciario inscripto en el Registro de Fiduciarios Financieros de la CNV; beneficiarios = titulares de los valores fiduciarios.","Documento básico de la oferta: prospecto / suplemento de prospecto; el funcionamiento lo rige el contrato de fideicomiso.","Constitución por acto unilateral admitida (declaración de voluntad del fiduciante).","VDF: deuda garantizada con los bienes, emitidos por fiduciario, fiduciante o tercero; CP: emitidos solo por el fiduciario, cobran último; atípicos: art. 1820 CCyC.","Averso al riesgo: VDF senior y series con historial de créditos ya originados.","Cobranzas delegadas: depósito en cuenta fiduciaria dentro de 3 días hábiles; el reclamo por incumplimiento va contra el fiduciario.","Custodia de documentos: delegable en el fiduciante solo si es entidad financiera.","Colocación por sistemas informáticos de mercados autorizados; tramo competitivo y no competitivo.","Asambleas: unanimidad para modificar condiciones esenciales; 3/4 de los valores en circulación ante insuficiencia patrimonial; a distancia con grabación e identificación.","Plazos: EECC trimestrales del fiduciario 42 días corridos; informe mensual de control y revisión 20 días hábiles; contador con 5 años de matrícula; descripción del fiduciante 3 ejercicios."]},{"titulo":"12. Regímenes especiales de fideicomisos financieros e inversores habilitados","parrafos":["Fideicomisos financieros PyME. Se consideran destinados al financiamiento de PyMEs cuando se cumple al menos una de estas condiciones: el o los fiduciantes califican como PyME CNV (en los fideicomisos para el fomento del desarrollo productivo y las economías regionales se admite que sean personas humanas con Certificado MiPyME); o, si el fiduciante no es PyME, al menos el 70% del valor nominal del activo fideicomitido está formado por créditos provenientes de operaciones con PyMEs CNV; o, con pluralidad de fiduciantes, al menos el 70% del activo proviene de fiduciantes PyME; o, si es un fondo de inversión directa, al menos el 70% del activo se aplica a operaciones con PyMEs. Es la respuesta para el cliente sin certificado MiPyME que tiene cheques de pago diferido de PyMEs: arma el fideicomiso con al menos 70% de esos cheques.","Productos de inversión colectiva para el desarrollo de infraestructura: son los fideicomisos financieros (y fondos cerrados) con oferta pública cuyo objeto es, directa o indirectamente, el desarrollo, inversión o financiamiento de infraestructura pública o privada; sus valores solo pueden ser adquiridos por inversores calificados. Fideicomisos para el desarrollo inmobiliario: pueden prever la reapertura del período de colocación de valores ya autorizados, siempre que esté previsto en el prospecto y el contrato, no se excedan los 5 años desde el inicio de la colocación original o hasta alcanzar el monto autorizado; al inversor que llega después de cerrada la colocación se le indica esperar la reapertura prevista en el suplemento. Fideicomisos para el fomento del desarrollo productivo y las economías regionales: lo que importa es el objeto (por ejemplo, la explotación de un negocio de producción agropecuaria en el litoral), no el tamaño de la empresa que lo lleva adelante. Fideicomisos de capital emprendedor: cuando el fiduciario no tiene la experiencia necesaria, el prospecto debe incluir un gestor profesional, que debe ser una persona jurídica regularmente constituida con antecedentes y especialización en el sector del vehículo (una sociedad con años de trayectoria en soluciones tecnológicas, para un vehículo tecnológico).","Inversores calificados (Normas CNV Título II Cap. VI Sección I art. 12): Estado nacional, provincias, municipios y entes autárquicos; entidades financieras, compañías de seguros, fondos, fideicomisos financieros; agentes registrados; personas jurídicas con patrimonio superior a cierto monto en UVA; personas humanas con inversiones superiores a 350.000 UVA; personas humanas inscriptas en el Registro de Idóneos de la CNV; y personas humanas o jurídicas no residentes. Por eso un fideicomiso PyME para inversores calificados puede ofrecerse a un municipio bonaerense, a una persona inscripta como idóneo y a un residente en Estados Unidos: los tres califican."],"puntos":["FF PyME: fiduciante PyME CNV, o al menos 70% del activo fideicomitido (valor nominal) de créditos con PyMEs; basta cumplir una condición.","Infraestructura (PICDI): fideicomisos financieros con oferta pública cuyo objeto es infraestructura pública o privada; solo inversores calificados.","Desarrollo inmobiliario: reapertura del período de colocación hasta 5 años desde la colocación original o hasta el monto autorizado, si lo prevén prospecto y contrato.","Desarrollo productivo y economías regionales: objeto productivo regional válido aunque la empresa sea multinacional.","Capital emprendedor: gestor profesional = persona jurídica con trayectoria y especialización en el sector.","Inversores calificados: entes públicos, idóneos inscriptos en CNV, no residentes, personas humanas con más de 350.000 UVA invertidos, entre otros."]},{"titulo":"13. Oferta pública de fideicomisos financieros con autorización automática: bajo impacto, mediano impacto y emisiones frecuentes","parrafos":["Desde 2025 la CNV admite que ciertos fideicomisos financieros accedan a la oferta pública sin autorización previa caso por caso. El régimen de bajo impacto (RG 1051/2025) aplica cuando el monto nominal total de los valores fiduciarios emitidos durante los 12 meses anteriores por el mismo fiduciante, sin distinción de activo subyacente, no supera 1.000.000 de UVA o su equivalente en pesos o moneda extranjera. No se presenta prospecto ante la CNV, pero el contrato de fideicomiso debe publicarse en la Autopista de la Información Financiera (AIF) con una leyenda especial que indique que se emite bajo este régimen, y el fiduciario debe cargar los datos estructurados del fideicomiso y, si se trata de valores negociables temáticos (verdes, sociales, sustentables), presentar el informe de revisión externa que acredite la etiqueta. Los valores se colocan y negocian en mercados autorizados y solo entre inversores calificados.","El régimen de mediano impacto llega hasta 7.000.000 de UVA. Requiere un prospecto con contenido mínimo (descripción del fiduciario y del fiduciante, flujo de fondos teórico, cronograma de pagos, contrato) que no es aprobado por la CNV pero debe publicarse al inicio del plazo de difusión a través de la AIF y en los sistemas de información de los mercados donde listen los valores. Los valores fiduciarios se consideran colocados por oferta pública siempre que sean efectivamente colocados mediante esfuerzos acreditables por cualquiera de los medios del art. 2 de la Ley 26.831. También es un régimen para inversores calificados, con régimen informativo (estados contables anuales e informes de control y revisión).","El régimen de emisiones frecuentes (RG 1063/2025, ajustado por RG 1074/2025) es para fiduciarios que ya tienen un historial: deben haber emitido al menos 7 fideicomisos financieros en total, de los cuales 3 en los últimos 12 meses, con autorización de oferta pública. Las nuevas series deben presentar en lo sustancial idénticas características: mismo programa global, mismo fiduciario, mismo fiduciante y similar composición del activo subyacente. Se presenta un suplemento de prospecto anual revisado por la CNV junto con los estados contables anuales del fiduciante y, por cada serie, un suplemento abreviado que se publica a más tardar el día de inicio de la difusión sin revisión previa.","Para el examen, los tres números que no se pueden confundir son: 1.000.000 UVA para bajo impacto (por fiduciante, últimos 12 meses), 7.000.000 UVA para mediano impacto y 7 fideicomisos en total con 3 en los últimos 12 meses para emisiones frecuentes. En todos los casos la CNV conserva sus facultades de fiscalización y sanción y se mantiene el régimen de transparencia (hechos relevantes, art. 117 Ley 26.831)."],"puntos":["Bajo impacto: hasta 1.000.000 UVA emitidos en los últimos 12 meses por el mismo fiduciante, sin distinción de activo subyacente.","Bajo impacto: contrato publicado en la AIF con leyenda especial; carga de datos estructurados; informe de revisión externa si es valor temático.","Mediano impacto: hasta 7.000.000 UVA; prospecto publicado al inicio del plazo de difusión en la AIF y en los mercados.","Mediano impacto: colocado por oferta pública si hay esfuerzos acreditables según el art. 2 de la Ley 26.831.","Emisiones frecuentes: 7 fideicomisos emitidos en total y 3 en los últimos 12 meses.","Emisiones frecuentes: idéntico programa, fiduciario y fiduciante, y similar activo subyacente.","Todos los regímenes automáticos: solo inversores calificados, colocación en mercados autorizados."]}],"datos_duros":[{"concepto":"Ley que regula los FCI","valor":"Ley 24.083 (modificada por Ley 27.440 de 2018)","fuente":"Ley 24.083"},{"concepto":"Reglamentación de FCI y FF (publicidad, prospectos, custodia, comisiones, inscripción)","valor":"Normas CNV Título V (N.T. 2013)","fuente":"Normas CNV Título V"},{"concepto":"Organismo que fiscaliza FCI y fideicomisos financieros","valor":"Comisión Nacional de Valores","fuente":"Ley 24.083 art. 32; CCyC art. 1691"},{"concepto":"Naturaleza jurídica del FCI","valor":"Patrimonio indiviso y separado, en copropiedad de los cuotapartistas; no es sociedad ni tiene personería","fuente":"Ley 24.083 art. 1"},{"concepto":"Responsabilidad de gerente y depositaria","valor":"Solidaria e ilimitada, junto con administradores y síndicos","fuente":"Ley 24.083 art. 4"},{"concepto":"Patrimonio neto mínimo de la sociedad gerente","valor":"150.000 UVA más 20.000 UVA por cada fondo adicional (dos fondos: 170.000 UVA)","fuente":"Normas CNV Título V (RG 1089/2025)"},{"concepto":"Patrimonio neto mínimo del ACDI","valor":"170.000 UVA","fuente":"Normas CNV Título V (RG 1089/2025)"},{"concepto":"Quién lleva la contabilidad del fondo","valor":"Sociedad gerente (no la depositaria)","fuente":"Ley 24.083 arts. 3 y 14"},{"concepto":"Quién custodia valores y paga rescates","valor":"Sociedad depositaria (no la gerente)","fuente":"Ley 24.083 art. 14"},{"concepto":"Colocadores de fondos cerrados","valor":"Agente de Liquidación y Compensación o Agente de Negociación","fuente":"Normas CNV Título V"},{"concepto":"Fusión de fondos abiertos","valor":"Solo entre fondos de la misma sociedad gerente","fuente":"Normas CNV Título V"},{"concepto":"Documento que la CNV aprueba para autorizar un FCI","valor":"Reglamento de gestión (celebrado entre gerente y depositaria)","fuente":"Ley 24.083 arts. 11 a 13"},{"concepto":"Documentación obligatoria de un fondo cerrado","valor":"Reglamento de gestión y prospecto de emisión","fuente":"Ley 24.083 / Normas CNV"},{"concepto":"Información diaria de fondos abiertos","valor":"Cantidad de cuotapartes, valor de cuotaparte y patrimonio neto","fuente":"Normas CNV Título V"},{"concepto":"Información periódica publicada","valor":"Balances trimestrales","fuente":"Normas CNV Título V"},{"concepto":"Presentación de estados contables de fondos abiertos ante CNV","valor":"Anual (auditados)","fuente":"Normas CNV Título V"},{"concepto":"Dato que la gerente NO informa a la CNV","valor":"Tasa de rendimiento esperada","fuente":"Normas CNV Título V"},{"concepto":"Contabilidad de fondos abiertos","valor":"Plan y Manual de Cuentas de FCI obligatorio; valuación según criterios de Normas CNV","fuente":"Normas CNV Título V"},{"concepto":"Decimales del valor de cuotaparte","valor":"Al menos tres decimales","fuente":"Normas CNV Título V"},{"concepto":"Plazo general de pago de rescates","valor":"Dentro de los 3 días hábiles de solicitado (plazos menores según reglamento)","fuente":"Ley 24.083 art. 22"},{"concepto":"Pago de rescates con valores de cartera","valor":"Permitido en casos excepcionales con autorización previa de la CNV","fuente":"Ley 24.083 art. 22 / Normas CNV"},{"concepto":"Rescates en fondos abiertos","valor":"Totales o parciales, sin límite, en cualquier momento","fuente":"Ley 24.083 art. 22"},{"concepto":"Cargo que no se imputa al resultado del fondo","valor":"Comisión de suscripción (la paga el cuotapartista)","fuente":"Normas CNV Título V"},{"concepto":"Derecho a utilidades devengadas","valor":"Cuotapartistas","fuente":"Ley 24.083"},{"concepto":"Edad mínima de menores para suscribir FCI","valor":"13 años, solo fondos abiertos de mercado de dinero, por internet","fuente":"RG CNV 977/2023"},{"concepto":"Derivados en FCI","valor":"Permitidos con fines de cobertura o inversión; exposición total a riesgo de mercado no mayor al patrimonio neto","fuente":"Normas CNV Título V"},{"concepto":"Límite por misma emisora (fondo abierto público en general)","valor":"20% del patrimonio","fuente":"Ley 24.083 art. 7 / Normas CNV"},{"concepto":"Límite misma especie de título público con iguales condiciones de emisión","valor":"30% del patrimonio del fondo","fuente":"Ley 24.083 art. 7 inc. e / Normas CNV"},{"concepto":"Límite en controlante de la gerente o controlante/controladas de la depositaria","valor":"2% del capital o pasivo obligacionario de la controlante o controlada","fuente":"Ley 24.083 art. 7 inc. c / Normas CNV"},{"concepto":"Activos emitidos y negociados en el país (más MERCOSUR y Chile)","valor":"Mínimo 75% del haber; CEDEARs (incluso de acciones chilenas) cuentan como activo local hasta 100%","fuente":"Ley 24.083 art. 6 / Normas CNV"},{"concepto":"Porcentaje máximo de disponibilidades en fondo abierto","valor":"No existe porcentaje máximo","fuente":"Normas CNV Título V"},{"concepto":"Inversión de un abierto en cuotapartes de otros fondos abiertos","valor":"Solo fondos de dinero de otra gerente, hasta 5% del haber","fuente":"Normas CNV Título V"},{"concepto":"Inversión de un abierto en fondos cerrados de la propia gerente","valor":"Prohibida (0%)","fuente":"Normas CNV Título V"},{"concepto":"Inversión en fondos cerrados de otra gerente: regla general, ASG e infraestructura","valor":"Hasta 10% del haber","fuente":"Normas CNV Título V"},{"concepto":"Inversión en fondos cerrados de otra gerente: fondo PyME","valor":"Hasta 5% del haber","fuente":"Normas CNV Título V"},{"concepto":"Inversión en fondos cerrados de otra gerente: fondo para inversores calificados","valor":"Hasta 25% del haber","fuente":"Normas CNV Título V"},{"concepto":"Fondo PyME: inversión mínima","valor":"75% del haber en valores de PyMEs o que financien PyMEs","fuente":"Normas CNV Título V"},{"concepto":"Fondo ASG: plazo mínimo de conformación de cartera","valor":"180 días corridos","fuente":"Normas CNV Título V"},{"concepto":"Fondo de dinero clásico: títulos de deuda con vencimiento no mayor a 1 año","valor":"Hasta 20% del patrimonio neto","fuente":"RG CNV 1038/2024"},{"concepto":"Fondo de dinero dinámico: títulos de deuda con vencimiento no mayor a 1 año","valor":"Hasta 100% del patrimonio neto","fuente":"RG CNV 1038/2024"},{"concepto":"Fondo de dinero: activos valuados a devengamiento","valor":"Clásico hasta 35%, dinámico hasta 30%; margen de liquidez sobre esa porción","fuente":"RG CNV 1038/2024"},{"concepto":"Pruebas de resistencia de mercado obligatorias","valor":"Solo para fondos abiertos de mercado de dinero","fuente":"Normas CNV Título V"},{"concepto":"Acciones en un fondo de mercado de dinero","valor":"No admitidas (cualquier porcentaje excede el límite)","fuente":"Normas CNV Título V"},{"concepto":"RG 1030/2024: FCI abiertos para inversores calificados en moneda extranjera","valor":"Deben suscribirse con fondos depositados en cuentas del exterior; el abierto de renta variable en dólares bajo régimen especial es solo para inversores calificados","fuente":"RG CNV 1030/2024"},{"concepto":"Nuevo instrumento con oferta pública desde 2024","valor":"CEDEARs de ETFs de gestión pasiva","fuente":"RG CNV 1030/2024"},{"concepto":"Código Civil y Comercial","valor":"Ley 26.994; fideicomiso en arts. 1666 a 1707; fideicomiso financiero arts. 1690 a 1692; valores atípicos art. 1820","fuente":"CCyC"},{"concepto":"Ley original del fideicomiso financiero","valor":"Ley 24.441 (1995), vigente en parte (cesión de créditos arts. 70 a 72)","fuente":"Ley 24.441"},{"concepto":"Plazo máximo del fideicomiso","valor":"30 años (salvo beneficiario incapaz)","fuente":"CCyC art. 1668"},{"concepto":"Fideicomisario","valor":"Recibe los bienes al concluir el fideicomiso; puede ser el fiduciante, el beneficiario o un tercero","fuente":"CCyC art. 1672"},{"concepto":"Emisores de valores de deuda fiduciaria","valor":"Fiduciario, fiduciante o un tercero; los certificados de participación solo el fiduciario","fuente":"CCyC art. 1693"},{"concepto":"Depósito de cobranzas por el agente de cobro delegado","valor":"Dentro de 3 días hábiles en cuenta del fideicomiso operada solo por el fiduciario","fuente":"Normas CNV Título V Cap. IV"},{"concepto":"Delegación de la custodia de documentos","valor":"Solo en el fiduciante si es entidad financiera (o en terceros habilitados)","fuente":"Normas CNV Título V Cap. IV"},{"concepto":"Modificación de condición esencial de emisión","valor":"Consentimiento unánime de los tenedores en circulación","fuente":"Normas CNV Título V Cap. IV"},{"concepto":"Mayoría ante insuficiencia del patrimonio fideicomitido","valor":"Al menos 3/4 de los valores fiduciarios emitidos y en circulación","fuente":"Normas CNV Título V Cap. IV / CCyC art. 1696"},{"concepto":"Asamblea a distancia","valor":"Grabación en soporte digital e identificación de todos los participantes","fuente":"Normas CNV"},{"concepto":"EECC trimestrales del fiduciario financiero (requisito patrimonial)","valor":"Dentro de los 42 días corridos de cerrado el trimestre","fuente":"Normas CNV Título V Cap. IV"},{"concepto":"EECC del fideicomiso financiero","valor":"Anuales y opcionalmente trimestrales; en fondos de inversión directa los trimestrales son obligatorios","fuente":"Normas CNV Título V Cap. IV"},{"concepto":"Informes de control y revisión","valor":"Mensuales, publicados en la web de la CNV dentro de 20 días hábiles; contador independiente con al menos 5 años de matrícula","fuente":"Normas CNV Título V Cap. IV"},{"concepto":"PIPE en fondos de inversión directa","valor":"Actualización anual con los EECC anuales","fuente":"Normas CNV Título V Cap. IV"},{"concepto":"Información contable del fiduciante en el suplemento de prospecto","valor":"Tres últimos ejercicios anuales (o desde su constitución)","fuente":"Normas CNV Título V Cap. IV"},{"concepto":"FF PyME con fiduciante no PyME","valor":"Al menos 70% del activo fideicomitido (valor nominal) en créditos con PyMEs CNV","fuente":"Normas CNV Título V Cap. IV"},{"concepto":"Inversores en productos de inversión colectiva para infraestructura","valor":"Solo inversores calificados (Tít. II Cap. VI Secc. I)","fuente":"Normas CNV"},{"concepto":"Reapertura del período de colocación en FF inmobiliarios","valor":"Hasta 5 años desde la colocación original o hasta el monto autorizado, si lo prevén prospecto y contrato","fuente":"Normas CNV Título V Cap. IV"},{"concepto":"Autorización automática de bajo impacto","valor":"Hasta 1.000.000 UVA emitidos en 12 meses por el mismo fiduciante; contrato en AIF con leyenda; datos estructurados; revisión externa si es temático","fuente":"RG CNV 1051/2025"},{"concepto":"Autorización automática de mediano impacto","valor":"Hasta 7.000.000 UVA; prospecto publicado al inicio de la difusión en AIF y mercados; esfuerzos de colocación art. 2 Ley 26.831","fuente":"RG CNV 1051/2025"},{"concepto":"Autorización automática de emis
