istrativas o actúa en todo el país, la respuesta es UIF. Los ROS nunca se presentan ante la CNV ni ante el mercado.","Origen de los fondos: en el lavado los fondos provienen exclusivamente de actividades ilícitas (de cualquier delito); en el financiamiento del terrorismo pueden ser lícitos. Una opción que diga que el lavado puede usar fondos lícitos es falsa.","Etapas: fiscalización no es etapa del lavado; diversificación es un sinónimo de estratificación, no una cuarta etapa. Estratificación es la que mueve fondos para ocultar su origen.","Plazos de ROS: hay tres respuestas según cómo esté redactada la pregunta. Pregunta genérica sobre si existe plazo máximo: el de la Ley 27.739 y las resoluciones UIF en el marco de la Res. 56/2024. Pregunta directa por el plazo según la Res. 56/2024: 7 días hábiles (criterio de la guía, aunque el texto literal diga 24 horas con tope de 90 días corridos). FT con personas o bienes listados por la ONU: sin demora alguna. No elijas 48 horas, 15 días ni 150 días, que eran los plazos viejos de la 78/2023.","Conservación de documentación: la pregunta genérica sobre documentación respaldatoria se responde 5 años; la pregunta sobre documentación de identificación, conocimiento y operaciones del cliente bajo la Res. 78/2023 se responde 10 años desde la finalización de la relación. Leé bien cuál de las dos es.","Actualización de legajos: bajo 5 años, medio 3 años, alto 1 año. A mayor riesgo, menor plazo. La opción invertida (bajo 1 año, alto 5 años) es el distractor clásico.","Autoevaluación cada dos años: solo para Agentes de Negociación y Agentes Asesores Globales de Inversión; para un ALyC es anual. La revisión externa independiente, en cambio, se responde siempre anual (al menos una vez al año).","Beneficiario final: el umbral es como mínimo 10%, así que un socio con exactamente el 10% sí es beneficiario final. Calculá cada participación sobre el capital total antes de contestar; no te guíes por quién parece grande o chico.","PEP: un PEP extranjero es riesgo alto de forma automática; un PEP nacional se evalúa. Para el examen siguen integrando la definición las autoridades y funcionarios de la Administración Pública Nacional, el personal del Poder Legislativo, los empleados de entidades autárquicas, bancos oficiales, obras sociales estatales y empresas del Estado, y los funcionarios con poder de decisión en comisiones de adjudicación, aunque la Res. 192/2024 haya recortado varias de esas categorías. La norma que define PEP es la 192/2024; la que la guía asocia a la obligación de informar PEP es el Decreto 918/2012.","Mapa de resoluciones: 29/2013 = obligación de reportar (criterio guía) y FT/congelamiento; 3/2014 = identificar al cliente y DJ del cliente sujeto obligado; 56/2024 = plazos de ROS; 78/2023 = ROS y régimen integral del mercado de capitales; 72/2023 = supervisión; 192/2024 = PEP; 112/2021 = beneficiario final; 49/2024 = PSAV; Decreto 918/2012 = reglamenta la ley. No mezcles números: la 155/2018 y la 22/2011 son normas viejas de deber de colaboración de la CNV, no la respuesta a supervisión vigente.","Oficial de cumplimiento: en una persona jurídica debe ser un miembro del órgano de administración (no un gerente cualquiera, no el auditor, no un asesor externo). El Comité de Prevención lo integran el oficial y gerentes de primer nivel vinculados a riesgos LA/FT, nunca el auditor interno.","Cliente de riesgo alto con cupo asignado: tanto si opera dentro del cupo como si ingresa fondos muy por encima con una explicación verbal, la respuesta es solicitar documentación de respaldo. Ni reportar de inmediato sin analizar, ni aceptar la explicación sin papeles, ni no hacer nada.","Operación inusual no es lo mismo que sospechosa: la inusual se analiza y se registra (primera medida: profundizar el análisis); la sospechosa es la que no pudo justificarse y se reporta. Ambas son con independencia del monto.","Congelamiento (Res. 29/2013): el examen toma 60 días como plazo para informar el resultado de la aplicación del congelamiento, aunque el texto de la norma hable de 24 horas. Contestá 60 días.","Pilares del programa PLAFT: políticas y procedimientos, oficial de cumplimiento, capacitación, revisión independiente y conocimiento del cliente. Recomendar los activos en los que puede operar el cliente según el riesgo que quiera asumir es asesoramiento de inversión, no un pilar PLAFT.","Sujetos obligados: los PSAV y las plataformas de financiamiento colectivo SÍ son sujetos obligados; los ALyC Participantes Directos y los Agentes Productores NO. La dependencia en terceros para la debida diligencia cubre solo tres cosas (identificar/verificar cliente, beneficiario final y propósito de la relación): nunca el monitoreo ni el reporte."],"formulas":[]},"3":{"modulo":3,"titulo":"Transparencia, denuncias y reclamos, régimen informativo e inversores","resumen":"El módulo trata las reglas que garantizan que el mercado funcione con información veraz, suficiente y oportuna: quiénes deben informar y qué, qué conductas están prohibidas (información privilegiada, manipulación, oferta irregular), cómo se denuncia y se investiga ante la CNV, y cómo se protege al inversor (RRP, Oficina de Atención al Inversor, idóneos, perfil de riesgo). El examen pregunta mucho qué Título de las Normas CNV regula cada tema, plazos (inmediato o 24 horas, 5 días hábiles, 2 años), porcentajes (10% despidos, 15% pérdidas) y gobierno societario (Comité de Auditoría, Código de Gobierno Societario, art. 272 LGS).","secciones":[{"titulo":"1. Principio de transparencia y ámbito de aplicación","parrafos":["La transparencia busca que todos los que participan del mercado tomen decisiones con información veraz, suficiente y oportuna. Sin información confiable no hay formación correcta de precios ni confianza del inversor, que es la base de la oferta pública.","Para la guía, el régimen de transparencia se encuentra en el Título XII de las Normas CNV y es oponible a cualquier persona humana o jurídica que intervenga en el mercado de capitales, incluidos los propios inversores. No alcanza solo a emisoras y agentes: el inversor que manipula precios también infringe.","La Ley 26.831 (Ley de Mercado de Capitales) contiene la base legal: el art. 99 fija el deber de informar hechos relevantes, el art. 102 el deber de reserva, el art. 117 las conductas contrarias a la transparencia y el art. 132 las sanciones. Los arts. 25 a 27 regulan el secreto de la información que la CNV obtiene en sus investigaciones y sus excepciones (cooperación con organismos extranjeros, BCRA, Superintendencia de Seguros y UIF)."],"puntos":["Objetivo: información veraz, suficiente y oportuna para decidir.","Título XII Normas CNV: transparencia en el ámbito de la oferta pública.","Se aplica a todos los intervinientes, incluidos los inversores.","Difundir información falsa u ocultar información relevante es contrario a la transparencia.","Emisores deben dar información completa y veraz también a inversores institucionales."]},{"titulo":"2. Obligaciones de los participantes: reserva, lealtad y diligencia","parrafos":["Quien por su cargo o actividad conoce un hecho no divulgado que puede afectar la colocación o la negociación de valores debe guardar estricta reserva y abstenerse de operar hasta que la información sea pública. El deber dura hasta ese momento, no un plazo fijo.","Están obligados, entre otros: directores, administradores, gerentes, síndicos, miembros del consejo de vigilancia, accionistas controlantes y profesionales de emisoras y mercados; quien formule una OPA o canje; directivos y empleados de calificadoras de riesgo; funcionarios y empleados de organismos de control públicos o privados, incluida la propia CNV; y quienes accedan por relación familiar, social o accidental.","El deber de lealtad y diligencia exige a los directores de emisoras hacer prevalecer, sin excepción, el interés social y el interés común de todos los socios, evitar beneficios personales fuera de su remuneración y prevenir conflictos de interés. A cámaras y agentes se les exige conducta ejemplar y priorizar el interés del cliente.","Los mercados deben realizar amplias tareas de inspección y control sobre sus agentes y, al igual que las cámaras compensadoras, deben denunciar siempre ante la CNV toda falta de sus agentes miembros."],"puntos":["Reserva estricta hasta que la información sea pública.","Directores: prevalece siempre el interés social y de todos los socios.","Mercados: amplias tareas de inspección y control sobre sus agentes.","Mercados y cámaras denuncian siempre las faltas de sus agentes.","Quien opera por cuenta de terceros debe estar registrado ante la CNV (art. 47 LMC).","Derechos, aranceles y comisiones: publicados en la AIF y de forma idéntica en la web institucional, en lugar destacado."]},{"titulo":"3. Conductas contrarias a la transparencia","parrafos":["Las tres grandes conductas prohibidas son el abuso de información privilegiada, la manipulación de mercado y el engaño. Usar información reservada para operar, recomendar o pasarla a terceros es abuso; no lo es comunicarla en el ejercicio normal del cargo, trabajo o función.","Manipulación es toda práctica que pretende o permite alterar precios o volumen. Incluye operaciones sin transferencia real de valores (ficticias) y también operaciones con transferencia real hechas para crear la apariencia falsa de oferta, demanda o mercado activo. El engaño abarca declaraciones falsas u omisión de información esencial que induzcan a error.","La publicidad no puede inducir a error sobre naturaleza, precio, rentabilidad o garantías de los valores; la CNV puede ordenar modificarla o suspenderla, además de sancionar. La publicidad de un FCI no puede dirigirse específica o exclusivamente a menores: debe darse el mismo contenido a todo el público.","Para graduar la sanción por abuso de información o manipulación, la CNV considera agravante que la conducta la cometa el accionista de control o los administradores, gerentes o síndicos de sujetos fiscalizados."],"puntos":["Abuso de información privilegiada, manipulación y engaño.","Excepción: comunicar la información en el ejercicio normal del cargo.","Manipulación: con o sin transferencia real si busca apariencia falsa de mercado.","Agravantes: accionista de control; administradores, gerentes, síndicos.","Publicidad engañosa: CNV ordena modificar o suspender, más sanciones.","Difundir a sabiendas noticias falsas es sancionable aunque no haya beneficio."]},{"titulo":"4. Oferta pública irregular y actuación sin registro (RG 1002/2024)","parrafos":["Solo puede invitar al público en general a comprar o vender valores quien tenga autorización previa de la CNV. Es oferta irregular la hecha por sujetos no autorizados o la que, bajo apariencia de oferta privada, usa medios masivos de difusión.","La RG 1002/2024 reformuló las obligaciones: abstenerse de intervenir sin autorización, de operar valores sin oferta pública autorizada, de hacer operaciones no autorizadas, de ofrecer asesoramiento sin estar registrado en alguna categoría de agente y de difundir o captar clientes para agentes registrados sin autorización.","No se considera asesoramiento dar opiniones genéricas, divulgar información o explicar riesgos, ni elaborar informes generales aunque contengan recomendaciones. Lo prohibido es el asesoramiento personalizado sin registro."],"puntos":["Invitación al público: solo con autorización previa de la CNV.","Oferta privada difundida por medios masivos = irregular.","Asesorar sin categoría de agente = conducta contraria (RG 1002/2024).","Captar clientes para agentes sin autorización = prohibido.","Opiniones genéricas e informes generales no son asesoramiento."]},{"titulo":"5. Procedimiento ante incumplimiento e investigaciones","parrafos":["Para la guía, el procedimiento aplicable ante incumplimientos se ubica en el Título XVI de las Normas y la recepción y tratamiento de denuncias en el Título XIII. Las investigaciones pueden iniciarse de oficio o a pedido de un particular.","Toda persona investigada o inspeccionada debe colaborar con la CNV sin excepciones y entregar la información y documentación requerida en forma fehaciente. Una conducta renuente y reiterada se toma como un elemento más de convicción en su contra para abrir sumario y resolver.","Si la CNV cita a declarar a un investigado que no es abogado, puede concurrir con o sin asistencia letrada. Los domicilios especiales constituidos por directores de emisoras siguen siendo válidos hasta 2 años después de que cesen en el cargo.","Las sanciones del art. 132 LMC (apercibimiento, multa, inhabilitación, suspensión, prohibición) las aplica el directorio de la CNV; las sedes regionales pueden tramitar sumarios por delegación (art. 23) pero no aplicar multas."],"puntos":["Investigación: de oficio o a petición de particular.","Deber de colaboración sin excepciones.","Renuencia reiterada = elemento de convicción en contra.","Comparecencia con o sin abogado.","Domicilio especial de directores: válido 2 años tras el cese.","Sanciones: art. 132 Ley 26.831."]},{"titulo":"6. Denuncias, reclamos y consultas","parrafos":["La denuncia se presenta ante la CNV (formulario web, mesa de entradas o correo). Puede ser anónima o con identificación del denunciante; la normativa actual pide que la anónima esté razonablemente circunstanciada y que la denuncia se ratifique en el plazo fijado, o puede tenerse por no presentada.","El denunciante no es parte del proceso sancionador ni puede tomar vista del expediente: la denuncia es un hecho externo al procedimiento. El denunciado tampoco es parte hasta la formulación de cargos; desde ahí puede ver el expediente y defenderse.","Antes de denunciar conviene agotar la vía con el agente: el reclamo va al Responsable de Relaciones con el Público de la ALyC o del agente de negociación (para AP o AGI, al RRP de la ALyC con la que operan; para FCI, a la sociedad gerente o depositaria). Las consultas y reclamos de inversores ante la CNV los atiende la Oficina de Atención al Inversor.","Para la guía, reclamos, consultas, denuncias y la Oficina de Atención al Inversor están regulados en el Título XIII de las Normas CNV (reemplazado en 2026 por la RG 1131/2026, que regula denuncias e investigaciones)."],"puntos":["Denuncias: ante la CNV.","Pueden ser anónimas o identificadas.","Denunciante no es parte ni toma vista.","Denunciado es parte desde la formulación de cargos.","Título XIII: denuncias, reclamos, consultas y OAI.","Primero el reclamo al RRP del agente."]},{"titulo":"7. Código de conducta, idóneos y protección del cliente","parrafos":["Los participantes deben actuar con lealtad, diligencia y transparencia frente a clientes y empleadores. Todo sujeto registrado debe tener un Código de Protección al Inversor o de Conducta que incluya: normas de transparencia y conductas prohibidas con procedimientos para prevenirlas; normas de protección al inversor, con los derechos del pequeño inversor minorista y cómo ejercerlos; y reglas de comportamiento del personal (confidencialidad, seguridad y prevención de conflictos de interés). Para la guía, estas obligaciones con clientes y empleadores están en el Título XII.","Deben inscribirse en el Registro de Idóneos quienes venden, promocionan o asesoran en contacto con el público. El alta la pide un agente matriculado; estar inscripto es condición suficiente para ejercer (aprobar el examen solo no alcanza). La idoneidad sirve para desempeñarse como idóneo en agentes y FCI.","No pueden inscribirse quienes no pueden ejercer el comercio, fallidos, concursados e inhabilitados por el BCRA, hasta 5 años después de su rehabilitación. Dos años de inactividad o no hacer los cursos de actualización implican baja definitiva y volver a cumplir los requisitos. El idóneo responde con sanciones del art. 132 LMC, sin perjuicio de la responsabilidad del agente y sus integrantes.","El perfil de riesgo del cliente considera experiencia, conocimiento de instrumentos, objetivo, situación financiera, horizonte, porcentaje de ahorro invertido y nivel de ahorro que acepta arriesgar; se actualiza al menos una vez al año o al primer intento de operar pasado ese plazo, y no se exige a inversores institucionales. Desde los 13 años una ALyC puede abrir subcuentas a menores adolescentes (RG 1023/2024), que solo operan contado de renta fija o variable y caución colocadora."],"puntos":["Conducta: lealtad, diligencia y transparencia.","Registro de Idóneos: venta, promoción o asesoramiento al público.","Inhabilitados BCRA, fallidos, concursados: 5 años desde la rehabilitación.","Baja definitiva: 2 años inactivo o sin cursos de actualización.","Perfil de riesgo: actualización anual; no aplica a institucionales.","Menores: desde 13 años, solo contado y caución colocadora.","Agente autorizado: verificar en el Registro Público de Agentes en la web de la CNV."]},{"titulo":"8. Responsable de Relaciones con el Público (RRP/RRPI) y Oficina de Atención al Inversor","parrafos":["El Responsable de Relaciones con el Público Inversor lo designa el órgano de administración de la emisora o del agente; para la guía la obligación surge del Título XII. Es el canal formal entre la entidad y los inversores.","El RRP del agente atiende reclamos y denuncias de clientes, los informa al órgano de administración y remite a la CNV por la AIF el detalle de cada uno dentro de los 5 días hábiles de recibido, con su estado y acciones adoptadas, y actualizaciones semanales hasta su cierre.","La Oficina de Atención al Inversor de la CNV recibe consultas y reclamos, orienta y educa al público. En las preguntas sobre la OAI, la opción correcta suele ser todas son correctas."],"puntos":["Designa: órgano de administración.","Informe a CNV por AIF: 5 días hábiles de recibido el reclamo.","Luego actualizaciones semanales hasta el cierre.","OAI: consultas y reclamos de inversores ante la CNV.","Tenencia: se consulta al Agente de Depósito Colectivo (Caja de Valores) por los medios que habilite."]},{"titulo":"9. Régimen informativo: hechos relevantes y periódico","parrafos":["El Título IV de las Normas regula el régimen informativo periódico (estados contables, memorias, actas) y ocasional (hechos relevantes y cambios societarios). Para la guía, la obligación de publicar hechos relevantes está en el Título IV.","Hecho relevante es todo hecho o situación que por su importancia pueda afectar sustancialmente la colocación de valores, su negociación o el desenvolvimiento de la actividad del sujeto. Se informa en forma inmediata por la AIF; cuando la pregunta pide un plazo numérico, la guía responde 24 horas.","Ejemplos que el examen toma: cambios en el objeto social o alteraciones importantes de la actividad; pérdidas superiores al 15% del patrimonio neto; despidos con o sin causa del 10% del personal; hechos fortuitos que obstaculicen seriamente la actividad, incluyendo afectaciones importantes al ambiente.","La emisora no puede dejar de publicar en la AIF las actas de asambleas anuales ni los estados contables trimestrales. Según la guía, los estados contables anuales se publican dentro de 60 días corridos (la norma vigente da 70 días corridos del cierre) y la designación de autoridades se informa en 10 días hábiles. Los prospectos se consultan en la AIF, en el link de la emisora."],"puntos":["Título IV: régimen informativo periódico y ocasional.","Hecho relevante: inmediato, por AIF (guía: 24 horas).","Pérdidas mayores al 15% del PN = hecho relevante.","Despidos del 10% del personal = informar de inmediato.","EECC anuales: 60 días corridos según la guía.","Designación de autoridades: 10 días hábiles según la guía.","Prospectos y actas: en la Autopista de la Información Financiera."]},{"titulo":"10. Gobierno corporativo","parrafos":["Gobierno societario es el conjunto de prácticas, procesos y estructuras con que se dirigen y controlan las compañías, basado en transparencia, equidad y responsabilidad. Para la guía, se regula en el Título XII.","Las emisoras del régimen general de oferta pública de acciones u obligaciones negociables presentan un Código de Gobierno Societario: un reporte anual, como anexo de la Memoria. Sus prácticas no son obligatorias, pero la emisora debe explicar cómo cumple los principios que las fundamentan (cumplir o explicar).","Las emisoras con oferta pública de acciones deben tener Comité de Auditoría, integrado por directores con mayoría de independientes. En las sociedades con oferta pública de acciones o deuda, todos los miembros de la Comisión Fiscalizadora deben ser independientes.","Para asistir a una asamblea, el accionista comunica su asistencia y deposita sus acciones (o constancia) ante la sociedad emisora. El art. 70 LMC fija la convocatoria entre 20 y 45 días antes de la asamblea."],"puntos":["CGS: obligatorio para el régimen general (acciones u ON).","CGS: anual, anexo de la Memoria; cumplir o explicar.","Comité de Auditoría: emisoras con OP de acciones.","Comité: directores, mayoría independientes.","Comisión Fiscalizadora: todos independientes.","Asistencia a asamblea: se comunica y deposita ante la emisora."]},{"titulo":"11. Conflicto de interés y partes relacionadas (LGS y LMC)","parrafos":["Según el art. 272 de la Ley 19.550, el director con interés contrario al de la sociedad debe hacerlo saber al directorio y a los síndicos y abstenerse de intervenir en la deliberación; si no, responde. Es la norma que el examen cita como fuente del deber de informar conflictos de interés.","El art. 59 LGS obliga a administradores y representantes a obrar con lealtad y la diligencia de un buen hombre de negocios; si fallan, responden ilimitada y solidariamente por los daños causados por acción u omisión.","El art. 72 LMC exige un procedimiento especial para actos con partes relacionadas por monto relevante (más del 1% del patrimonio neto): pronunciamiento previo del Comité de Auditoría o de dos firmas evaluadoras independientes. Según el art. 73, si las condiciones se califican razonablemente adecuadas al mercado, se requiere aprobación del Directorio indicando esos pronunciamientos; si no, aprobación previa de la asamblea."],"puntos":["Art. 272 LGS: informar a directorio y síndicos y abstenerse.","Art. 59 LGS: responsabilidad ilimitada y solidaria.","Partes relacionadas: procedimiento solo si el monto es relevante.","Monto relevante: más del 1% del patrimonio neto (art. 72 LMC).","Art. 73: aprobación del Directorio con pronunciamientos del Comité o evaluadoras."]}],"datos_duros":[{"concepto":"Regulación de la transparencia en la oferta pública y conductas contrarias","valor":"Título XII Normas CNV","fuente":"Normas CNV N.T. 2013"},{"concepto":"Régimen informativo periódico y ocasional; hechos relevantes","valor":"Título IV Normas CNV","fuente":"Normas CNV N.T. 2013"},{"concepto":"Denuncias, reclamos, consultas y Oficina de Atención al Inversor","valor":"Título XIII Normas CNV","fuente":"Normas CNV N.T. 2013 (criterio de la guía)"},{"concepto":"Procedimiento aplicable ante incumplimiento","valor":"Título XVI Normas CNV","fuente":"Normas CNV N.T. 2013 (criterio de la guía)"},{"concepto":"Gobierno corporativo, RRPI y obligaciones con clientes y empleadores","valor":"Título XII Normas CNV","fuente":"Normas CNV (criterio de la guía)"},{"concepto":"Agentes (ALyC, AN, AP, AGI)","valor":"Título VII Normas CNV","fuente":"Normas CNV N.T. 2013"},{"concepto":"Plazo para informar un hecho relevante","valor":"Inmediatamente (guía: 24 horas si pide número)","fuente":"Art. 99 Ley 26.831; Título XII/IV Normas CNV"},{"concepto":"Medio para informar hechos relevantes","valor":"Autopista de la Información Financiera (AIF)","fuente":"Normas CNV"},{"concepto":"Pérdidas que constituyen hecho relevante","valor":"Superiores al 15% del patrimonio neto","fuente":"Normas CNV Título XII"},{"concepto":"Despidos que deben informarse de inmediato","valor":"10% del total del personal, con o sin causa","fuente":"Normas CNV Título XII"},{"concepto":"Publicación de estados contables anuales","valor":"60 días corridos (respuesta de la guía)","fuente":"Normas CNV Título IV"},{"concepto":"Información de designación de autoridades","valor":"10 días hábiles (respuesta de la guía)","fuente":"Normas CNV Título IV/XII"},{"concepto":"Informe del RRP a la CNV por cada reclamo o denuncia","valor":"Dentro de 5 días hábiles de recibido, por AIF","fuente":"Normas CNV"},{"concepto":"Seguimiento del reclamo ante la CNV","valor":"Actualizaciones semanales hasta el cierre","fuente":"Normas CNV"},{"concepto":"Quién designa al Responsable de Relaciones con el Público","valor":"Órgano de administración","fuente":"Normas CNV Título XII"},{"concepto":"Órgano ante el que se presentan denuncias","valor":"Comisión Nacional de Valores","fuente":"Normas CNV Título XIII"},{"concepto":"Denuncia anónima","valor":"Admitida (anónima o con identificación)","fuente":"Normas CNV Título XIII"},{"concepto":"Denunciante como parte","valor":"No es parte ni toma vista del expediente","fuente":"Normas CNV Título XIII"},{"concepto":"Denunciado: momento en que es parte","valor":"Desde la formulación de cargos","fuente":"Normas CNV Título XIII"},{"concepto":"Inicio de investigaciones","valor":"De oficio o a petición de particular","fuente":"Normas CNV Título XIII"},{"concepto":"Comparecencia del investigado no abogado","valor":"Con o sin asistencia letrada","fuente":"Normas CNV"},{"concepto":"Validez del domicilio especial de directores","valor":"Hasta 2 años después del cese en el cargo","fuente":"Normas CNV"},{"concepto":"Agravantes en abuso de información y manipulación","valor":"Accionista de control; administradores, gerentes y síndicos","fuente":"Normas CNV Título XII"},{"concepto":"Deber de reserva","valor":"Hasta que la información sea pública","fuente":"Art. 102 Ley 26.831; Título XII"},{"concepto":"Conductas contrarias a la transparencia","valor":"Abuso de información privilegiada, manipulación y engaño","fuente":"Art. 117 Ley 26.831; Título XII"},{"concepto":"Asesoramiento y captación sin registro","valor":"Conductas prohibidas","fuente":"RG 1002/2024"},{"concepto":"Registro obligatorio para operar por cuenta de terceros","valor":"Registro ante la CNV","fuente":"Art. 47 Ley 26.831"},{"concepto":"Sanciones a sujetos e idóneos","valor":"Apercibimiento, multa, inhabilitación, suspensión, prohibición","fuente":"Art. 132 Ley 26.831"},{"concepto":"Secreto de las investigaciones de la CNV y excepciones","valor":"Secreto; excepciones con autoridades extranjeras, BCRA, SSN y UIF","fuente":"Arts. 25, 26 y 27 Ley 26.831"},{"concepto":"Baja definitiva del Registro de Idóneos","valor":"2 años de inactividad o no hacer cursos de actualización","fuente":"Normas CNV Título XII"},{"concepto":"Inhabilitados BCRA, fallidos y concursados para ser idóneos","valor":"Hasta 5 años después de la rehabilitación","fuente":"Normas CNV Título XII"},{"concepto":"Actualización del perfil de riesgo","valor":"Al menos una vez al año o al primer intento de operar luego","fuente":"Normas CNV"},{"concepto":"Perfil de riesgo: excepción","valor":"No se exige a inversores institucionales","fuente":"Normas CNV"},{"concepto":"Edad mínima para subcuenta comitente de menor","valor":"13 años (adolescentes de 13 a 17)","fuente":"RG 1023/2024"},{"concepto":"Operaciones permitidas a menores adolescentes","valor":"Contado (renta fija y variable) y caución colocadora","fuente":"RG 1023/2024"},{"concepto":"Publicación de aranceles y comisiones","valor":"AIF y, de forma idéntica, web institucional en lugar destacado","fuente":"Normas CNV Título XII"},{"concepto":"Consulta de prospectos de una emisora","valor":"AIF, en el link de la emisora","fuente":"Normas CNV"},{"concepto":"Consulta de tenencia de valores","valor":"Agente de Depósito Colectivo","fuente":"Normas CNV"},{"concepto":"Verificar si un agente está autorizado","valor":"Registro Público de Agentes en la web de la CNV","fuente":"CNV"},{"concepto":"Código de Gobierno Societario: periodicidad","valor":"Anual, como anexo de la Memoria","fuente":"Normas CNV"},{"concepto":"Código de Gobierno Societario: obligados","valor":"Emisoras del régimen general (acciones u ON)","fuente":"Normas CNV"},{"concepto":"Comité de Auditoría obligatorio","valor":"Emisoras con oferta pública de acciones; directores con mayoría independientes","fuente":"Ley 26.831 y Normas CNV"},{"concepto":"Comisión Fiscalizadora en sociedades con OP","valor":"Totalidad de miembros independientes","fuente":"Normas CNV"},{"concepto":"Monto relevante con partes relacionadas","valor":"Más del 1% del patrimonio neto","fuente":"Art. 72 Ley 26.831"},{"concepto":"Aprobación de contratos con partes relacionadas adecuados al mercado","valor":"Directorio, indicando pronunciamientos del Comité de Auditoría o evaluadoras independientes","fuente":"Art. 73 Ley 26.831"},{"concepto":"Conflicto de interés del director","valor":"Informar a directorio y síndicos y abstenerse de deliberar","fuente":"Art. 272 Ley 19.550"},{"concepto":"Responsabilidad de administradores desleales o negligentes","valor":"Ilimitada y solidaria por acción u omisión","fuente":"Art. 59 Ley 19.550"},{"concepto":"Convocatoria a asamblea en sociedades con OP","valor":"Entre 20 y 45 días corridos antes","fuente":"Art. 70 Ley 26.831"},{"concepto":"Asistencia a asamblea","valor":"Comunicar y depositar acciones ante la sociedad emisora","fuente":"Ley 19.550 / Normas CNV"}],"trampas":["Plazo del hecho relevante: si la opción dice inmediatamente o en forma inmediata, elegila; si solo hay plazos numéricos, la guía marca 24 horas. No confundir con 5 días hábiles (RRP) ni con 10 días hábiles (autoridades).","Títulos de las Normas: transparencia, gobierno corporativo, RRPI y conducta con clientes = Título XII; régimen informativo y hechos relevantes = Título IV; denuncias, reclamos, consultas y OAI = Título XIII; procedimiento ante incumplimiento = Título XVI.","El deber de informar conflictos de interés surge del art. 272 de la Ley General de Sociedades, no de la Ley 26.831.","El denunciante no es parte ni puede ver el expediente; el denunciado tampoco es parte hasta que le formulan cargos.","Las denuncias pueden ser anónimas: es falsa la opción que exige identificación obligatoria.","Comunicar información reservada en el ejercicio normal del cargo no es abuso de información privilegiada.","La manipulación incluye operaciones con transferencia real si buscan aparentar un mercado activo, no solo las ficticias.","El régimen de transparencia también alcanza a los inversores, no solo a emisoras y agentes.","Aprobar el examen no habilita a ejercer: la condición suficiente es estar inscripto en el Registro de Idóneos.","Las prácticas del Código de Gobierno Societario no son obligatorias, pero hay que explicar cómo se cumplen los principios; se presenta anualmente como anexo de la Memoria, no trimestralmente.","Comité de Auditoría: lo integran directores (no síndicos ni auditores externos) con mayoría independiente; en la Comisión Fiscalizadora son independientes todos.","Partes relacionadas: el procedimiento especial no rige siempre, solo para montos relevantes (más del 1% del PN).","Menores: desde 13 años y solo contado y caución colocadora; no caución tomadora ni operaciones apalancadas.","Perfil de riesgo: actualización anual; la excepción es para inversores institucionales, no para clientes con experiencia.","Mercados y cámaras deben denunciar siempre las faltas de sus agentes, no solo las graves o reiteradas."],"formulas":[]},"4":{"modulo":4,"titulo":"Análisis de inversiones, valuación, NIIF y régimen contable","resumen":"El módulo combina matemática financiera aplicada (VAN, TIR, precio y duration de bonos, futuros, opciones y ratios) con el régimen contable y de auditoría de las emisoras: NIIF, plazos de presentación ante la CNV, control societario y registro de auditores. El examen pregunta definiciones, plazos y organismos, y trae ejercicios numéricos cortos de bonos, ratios, futuros y estrategias con opciones.","secciones":[{"titulo":"1. Evaluación de inversiones: VAN y TIR","parrafos":["El Valor Actual Neto (VAN) es la diferencia entre el valor presente de los flujos futuros que genera un proyecto y la inversión inicial. Para calcularlo se descuenta cada flujo a una tasa de descuento (costo de oportunidad o costo de capital), por eso la tasa elegida afecta directamente el resultado: a mayor tasa, menor VAN.","La Tasa Interna de Retorno (TIR) es la tasa que hace que el VAN sea igual a cero, es decir, la que iguala el valor presente de los flujos con la inversión. En un bono, la TIR es el rendimiento al vencimiento: la tasa que iguala el precio con el valor actual de cupones y amortizaciones.","Regla de decisión: se acepta un proyecto con VAN mayor a cero, o con TIR mayor a la tasa de corte. La TIR supone implícitamente que los flujos intermedios se reinvierten a la misma TIR; si eso no ocurre aparece el riesgo de reinversión.","Para trabajar con tasas hay que distinguir la tasa nominal anual (TNA), que es una tasa proporcional, de la tasa efectiva anual (TEA), que incorpora la capitalización de intereses. Cuantas más capitalizaciones en el año, mayor es la TEA frente a la misma TNA."],"puntos":["VAN = valor presente de los flujos menos inversión inicial.","TIR = tasa que hace VAN = 0.","Mayor tasa de descuento implica menor VAN (y menor precio de un bono).","Criterio: VAN > 0 o TIR > tasa de corte, se acepta.","La TIR supone reinversión de flujos a la propia TIR.","TEA > TNA cuando hay más de una capitalización anual."]},{"titulo":"2. Renta fija: condiciones de emisión y marco legal","parrafos":["Los instrumentos de renta fija se caracterizan por pagar intereses preestablecidos (fijos o según una fórmula conocida) y tener un vencimiento definido. Sus condiciones de emisión incluyen moneda, valor nominal, tasa del cupón, periodicidad de pagos, sistema de amortización (bullet o en cuotas), garantías y ley aplicable.","Las obligaciones negociables (ON) se rigen por la Ley 23.576; su artículo 10 enumera el contenido mínimo de las condiciones de emisión. Cuando una ON se emite con oferta pública, el aviso de emisión se publica en la Autopista de la Información Financiera (AIF) de la CNV.","Desde 2025 la CNV incorporó el régimen de oferta pública con autorización automática para ON de bajo impacto (RG 1047/2025), con requisitos acotados y un tope de monto expresado en UVA (bajo impacto hasta 1 millón de UVA; mediano impacto hasta 7 millones de UVA). En fideicomisos financieros, la RG 1051/2025 sumó un régimen de oferta pública automática para supuestos definidos.","Un bono bullet devuelve todo el capital al vencimiento; un bono amortizable devuelve capital en cuotas. Un bono cupón cero no paga intereses periódicos: se compra con descuento y paga el valor nominal al vencimiento."],"puntos":["Renta fija: intereses preestablecidos y vencimiento definido.","ON: Ley 23.576 (art. 10, condiciones de emisión).","Aviso de emisión de ON con oferta pública: en la AIF.","ON de bajo impacto: autorización automática con tope en UVA (desde 2025).","RG 1051/2025: oferta pública automática en fideicomisos financieros en supuestos definidos.","Cupón cero: siempre cotiza bajo la par mientras la tasa sea positiva."]},{"titulo":"3. Valuación de bonos: precio, paridad, valor técnico y valor residual","parrafos":["El precio teórico de un bono es el valor actual de todos sus flujos futuros (cupones y amortizaciones) descontados a la TIR. Precio y tasa se mueven en sentido inverso: si sube la tasa de mercado, baja el precio, y viceversa.","El valor residual es el capital que todavía no fue amortizado. El valor técnico es el valor residual más los intereses corridos desde el último pago de cupón; es lo que el emisor debería pagar si rescatara el bono hoy. La paridad compara precio con valor técnico: paridad igual a 100% significa a la par, mayor es sobre la par y menor es bajo la par.","Un bono cotiza sobre la par cuando su precio es mayor al valor nominal (o técnico), lo que ocurre cuando el cupón es mayor que la TIR exigida. Si el cupón es igual a la TIR, cotiza a la par. Un cupón cero nunca puede cotizar sobre la par con tasas positivas, aunque bajen las tasas.","Si dos bonos tienen el mismo cupón, calendario y tasa de descuento, pero uno amortiza en cuotas y otro es bullet, ambos suman el mismo capital total pero el amortizable devuelve parte antes. A igual tasa, el bono que paga antes descuenta menos sus flujos; según el criterio de la guía, el valor actual de los flujos del amortizable (A) resulta mayor que el del bullet (B)."],"puntos":["Precio = VA de cupones + VA de amortizaciones a la TIR.","Valor residual = VN menos amortizaciones ya pagadas.","Valor técnico = valor residual + intereses corridos.","Paridad = precio / valor técnico x 100.","Sobre la par: precio > valor nominal (cupón > TIR).","Current yield = cupón anual / precio."]},{"titulo":"4. Duration, convexidad y riesgos de la renta fija","parrafos":["La duration de Macaulay es el plazo promedio ponderado de los flujos del bono, usando como ponderador el valor actual de cada flujo sobre el precio. La duration modificada (DM = D / (1 + TIR)) mide la sensibilidad porcentual del precio ante cambios en la tasa: variación % del precio aproximada igual a menos DM por variación de tasa.","La convexidad corrige el error de la aproximación lineal de la duration: con convexidad positiva, el precio cae menos ante subas de tasa y sube más ante bajas. La duration de una cartera es el promedio ponderado de las duration de cada bono según su peso en el valor de la cartera.","Los riesgos de la renta fija son: riesgo de precio o tasa (el precio cae si suben las tasas), riesgo de reinversión (los cupones se reinvierten a tasas menores que la TIR original), riesgo de crédito o default (el emisor no paga), riesgo de liquidez (no poder vender sin castigar el precio) y riesgo de tipo de cambio (cuando el flujo está en otra moneda).","El riesgo de precio y el de reinversión se compensan parcialmente: si suben las tasas, se pierde por precio pero se gana al reinvertir cupones. Un cupón cero no tiene riesgo de reinversión porque no paga cupones intermedios, y su duration coincide con su plazo."],"puntos":["Mayor duration = mayor sensibilidad a la tasa.","DM = D / (1 + TIR).","Duration de cartera = promedio ponderado por precio/valor.","Riesgos: precio, reinversión, crédito, liquidez, tipo de cambio.","Cupón cero: duration igual al plazo y sin riesgo de reinversión.","Convexidad positiva favorece al tenedor."]},{"titulo":"5. Renta variable y estructura del mercado","parrafos":["La acción representa una parte del capital de una sociedad; su precio se forma por la interacción entre oferta y demanda en el mercado. La posición larga (compra) tiene ganancia potencial ilimitada y pérdida máxima del 100% de lo invertido; la posición corta tiene ganancia máxima del 100% y pérdida potencialmente ilimitada.","La venta en corto es una venta concertada en el plazo de contado normal, cuya liquidación se hace con valores obtenidos en préstamo en la misma sesión de negociación. La orden iceberg o de divulgación parcial muestra el precio y solo una parte de la cantidad.","Los índices bursátiles pueden ponderarse por precio o por capitalización. Un split multiplica la cantidad de acciones y divide el precio, por lo que no cambia la capitalización: solo afecta al índice ponderado por precio, que debe ajustar su divisor.","El beta mide la sensibilidad de una acción frente al mercado. Si el beta sube, la volatilidad de la acción aumentó respecto de la del mercado (beta mayor a 1 indica una acción más volátil que el índice)."],"puntos":["Precio de la acción: oferta y demanda.","Largo: gana ilimitado, pierde hasta 100%. Corto: gana hasta 100%, pierde ilimitado.","Venta en corto: liquidada con títulos tomados en préstamo en la misma sesión.","Iceberg: muestra precio y parte de la cantidad.","Split: afecta solo al índice ponderado por precio.","Beta mayor: más volátil que el mercado."]},{"titulo":"6. Análisis fundamental y análisis técnico","parrafos":["El análisis fundamental busca el valor intrínseco de una acción evaluando estados financieros, perspectivas de la empresa, el sector y la economía (tasas, inflación, tipo de cambio). Compara ese valor con el precio de mercado para decidir si la acción está cara o barata.","El análisis técnico intenta predecir movimientos futuros del precio estudiando patrones históricos de precio y volumen en gráficos. Trabaja con tendencias (alcistas, bajistas, laterales), soportes (niveles donde la demanda frena la caída) y resistencias (niveles donde la oferta frena la suba), además de medias móviles y osciladores.","Los gráficos más usados son de líneas, de barras y de velas. El análisis técnico supone que el precio descuenta toda la información, que los precios se mueven en tendencias y que la historia tiende a repetirse por la psicología del inversor (miedo y codicia, comportamiento de manada)."],"puntos":["Fundamental: estados financieros y factores económicos.","Técnico: patrones históricos de precios y volumen.","Soporte: piso donde aparece demanda. Resistencia: techo donde aparece oferta.","Un soporte quebrado suele pasar a ser resistencia (y al revés).","Psicología del inversor: miedo, codicia, efecto manada."]},{"titulo":"7. Ratios bursátiles y contables","parrafos":["El PER (Price Earnings Ratio) relaciona el precio de la acción con la ganancia por acción. Un PER elevado indica que el mercado espera alto crecimiento de beneficios (paga muchos años de ganancias actuales). El valor libro de la acción es el patrimonio neto dividido la cantidad de acciones en circulación; el patrimonio neto es activo menos pasivo.","La rentabilidad del patrimonio o ROE (resultado del ejercicio sobre patrimonio neto) mide la tasa de retribución del capital aportado por los propietarios. El ROE sube si el resultado cae menos que el patrimonio: por ejemplo, ganancia neta -5% y patrimonio promedio -10% da un ROE 5,6% mayor (0,95/0,90). El ROA relaciona resultado con activo total.","Indicadores de la reseña informativa (Normas CNV Título IV Cap. III art. 4): liquidez corriente (activo corriente / pasivo corriente), solvencia (patrimonio neto / pasivo total), inmovilización del capital (activo no corriente / activo total) y rentabilidad (resultado neto / patrimonio neto). El endeudamiento es la inversa de la solvencia: pasivo total / patrimonio neto.","La liquidez indica la capacidad de cancelar obligaciones de corto plazo; una liquidez menor a 1 (por ejemplo 68%) significa que el activo corriente no alcanza a cubrir el pasivo corriente."],"puntos":["PER = precio / ganancia por acción.","Valor libro por acción = PN / acciones en circulación.","ROE = resultado / PN. ROA = resultado / activo.","Liquidez = AC / PC.","Solvencia = PN / pasivo total. Endeudamiento = pasivo total / PN.","Inmovilización = ANC / activo total.","Ecuación patrimonial: Activo - Pasivo = PN."]},{"titulo":"8. Futuros: cost of carry, márgenes y cobertura","parrafos":["Un futuro es un contrato estandarizado para comprar o vender un activo a un precio fijado hoy con entrega en una fecha futura; su principal objetivo es la cobertura contra variaciones de precio. La operatoria de derivados en mercados autorizados por la CNV se rige por la Ley 26.831.","El modelo cost of carry relaciona el precio spot con el futuro considerando el costo de financiación (y almacenamiento, menos rendimientos del activo): F = S x (1 + r x t). En el dólar, la diferencia entre futuro y spot refleja el diferencial de tasas entre pesos y dólares.","Al abrir una posición (compra o venta) se integra una garantía o margen inicial, y cada día se liquidan diferencias (mark to market): quien está comprado paga si el precio baja y cobra si sube; quien está vendido, al revés. Las posiciones combinadas de distinto vencimiento (spread) integran ambos márgenes pero reciben una bonificación por compensación de riesgos.","El principal riesgo de la cobertura es el riesgo de base: la diferencia entre el activo que se quiere cubrir y el activo subyacente del contrato (o entre spot y futuro al cierre). Un importador con un pago en dólares a 60 días que espera más devaluación de la que descuenta el mercado se cubre comprando futuro de dólar a 60 días."],"puntos":["Futuro: cobertura de precio, contrato estandarizado.","Cost of carry: F = S x (1 + r x t).","Margen inicial tanto para comprador como vendedor.","Diferencias diarias: el comprado paga si baja el precio.","Spread entre vencimientos: bonificación de márgenes.","Riesgo de base: activo cubierto distinto del subyacente.","Importador (deuda en USD): compra futuro. Exportador (cobro en USD): vende futuro."]},{"titulo":"9. Opciones: valor intrínseco, valor tiempo y volatilidad","parrafos":["La opción call da al comprador el derecho (no la obligación) de comprar el subyacente a un precio de ejercicio; la put da el derecho a vender. El comprador paga una prima; el lanzador (vendedor) la cobra y asume la obligación si el comprador ejerce.","La prima se compone de valor intrínseco y valor tiempo. Valor intrínseco de una call: máximo entre 0 y (S - K); de una put: máximo entre 0 y (K - S). El valor tiempo es la prima menos el valor intrínseco y se reduce a cero al vencimiento.","La volatilidad implícita es la expectativa del mercado sobre la variabilidad futura del precio, despejada a partir de las primas. A mayor volatilidad, mayor prima tanto de calls como de puts; si la volatilidad baja, ambas primas bajan. Black-Scholes valúa opciones europeas con cinco variables: precio del subyacente, precio de ejercicio, tiempo al vencimiento, tasa libre de riesgo y volatilidad.","La paridad put-call vincula call y put europeas del mismo strike y vencimiento: C + K/(1+r)^t = P + S. Estrategias típicas: put protectiva (acción + put comprada) limita la pérdida; bull spread con calls (compra call de strike bajo y vende call de strike alto) acota ganancia y pérdida."],"puntos":["Call = derecho a comprar. Put = derecho a vender.","Prima = valor intrínseco + valor tiempo.","Si al vencimiento S > K, la put no se ejerce (el lanzador gana la prima).","Volatilidad baja: bajan primas de call y de put.","Paridad put-call: C + VA(K) = P + S.","Black-Scholes: S, K, t, r y volatilidad."]},{"titulo":"10. NIIF: introducción, moneda y estados financieros","parrafos":["Las NIIF de Contabilidad son emitidas por el IASB y sus interpretaciones solo pueden emanar del IFRIC (Comité de Interpretaciones). Su objetivo es uniformar la presentación de estados financieros a nivel global, presentando información relevante y fiable. Decir que los estados están bajo NIIF implica que cumplen todas las NIIF vigentes, no solo algunas.","Las NIIF distinguen moneda funcional (la del entorno económico principal en que opera la entidad) y moneda de presentación. En Argentina, si la moneda funcional es distinta del peso, la moneda de presentación igual debe ser pesos (moneda de curso legal). Para NIIF tienen preeminencia los estados consolidados; según NIIF 10, la controlante debe presentar consolidados salvo excepciones (por ejemplo, entidades de inversión).","Los estados básicos son: estado de situación financiera, estado de resultados integrales, estado de cambios en el patrimonio y estado de flujos de efectivo. El estado de resultados integrales puede tener una segunda parte de Otros Resultados Integrales. El activo es el conjunto de bienes y derechos de la sociedad; la ecuación patrimonial es Activo - Pasivo = Patrimonio Neto.","Medición: el valor histórico usa el costo de adquisición; el valor corriente considera precios de mercado actuales. Para el ajuste por inflación (NIC 29 o RT 6) a efectos de exposición se presenta el ejercicio actual ajustado y el ejercicio anterior ajustado y reexpresado en moneda de cierre."],"puntos":["NIIF: emite el IASB; interpreta solo el IFRIC.","Bajo NIIF = todas las NIIF vigentes.","Moneda funcional: entorno económico principal.","Funcional distinta del peso: se presenta en pesos.","Preeminencia de los consolidados (NIIF 10).","4 estados básicos + Otros Resultados Integrales.","Valor corriente = precios de mercado actuales."]},{"titulo":"11. Régimen contable de emisoras en la CNV (Título IV Caps. I y III)","parrafos":["Las emisoras del régimen general presentan sus estados financieros bajo NIIF (RT 26 FACPCE). Las PyME CNV pueden usar Normas Contables Profesionales Argentinas (NCPA) y quedan excluidas de NIIF. Las entidades financieras pueden aplicar normas del BCRA, las aseguradoras normas y plazos de la SSN (compatibilización por RG 936/2022) y las mutuales y cooperativas, normas del INAES.","Plazos (Título IV Cap. I): estados anuales dentro de 70 días corridos del cierre y trimestrales dentro de 42 días corridos (o 2 días hábiles desde su aprobación, lo que ocurra primero). En un año calendario se publican cuatro estados contables (tres trimestrales y uno anual). Tanto en anuales como trimestrales es obligatorio el informe del auditor externo (auditoría en el anual, revisión en los intermedios) y la reseña informativa.","La CNV no admite aplicación anticipada de nuevas NIIF o NCPA por el principio de comparabilidad, salvo que al adoptarse la norma se admita expresamente. El art. 11 del Título IV Cap. III fija el orden de absorción de pérdidas acumuladas: primero ganancias reservadas (voluntarias, estatutarias, especiales y legal, en ese orden), luego contribuciones de capital, primas de emisión, otros instrumentos de patrimonio, ajuste de capital y por último capital social.","La reserva legal (art. 5 del mismo capítulo y art. 70 de la Ley 19.550) se forma con al menos el 5% de la ganancia hasta alcanzar el 20% del capital más su ajuste."],"puntos":["Régimen general: NIIF. PyME CNV: NCPA.","Bancos: BCRA. Seguros: SSN. Mutuales/cooperativas: INAES. RG 936/2022 compatibiliza plazos.","Anuales: 70 días corridos. Trimestrales: 42 días corridos.","Cuatro estados contables públicos por año.","Reseña informativa e informe del auditor: anuales y trimestrales.","Sin aplicación anticipada de NIIF, salvo admisión expresa.","Absorción de pérdidas: primero ganancias reservadas."]},{"titulo":"12. Control societario de la CNV","parrafos":["La CNV ejerce control societario (Ley 26.831 art. 19 inc. f y Ley 22.169) sobre personas jurídicas privadas que hacen oferta pública de sus valores negociables; quedan alcanzadas todas las entidades de la Ley 22.169, excluidas las PyME CNV Garantizadas. Estas sociedades deben solicitar la inscripción registral de sus actos: reformas de estatuto, aumentos de capital, miembros del directorio.","La reforma del estatuto (incluido el cambio de denominación) la aprueba la asamblea extraordinaria (Ley 19.550 art. 235), requiere conformidad de la CNV e inscripción en el Registro Público; la asamblea extraordinaria es el órgano cuyos actos requieren publicidad mediante inscripción. El objeto social debe ser preciso y determinado (Ley 19.550 art. 11), y para saber qué actividades puede desarrollar la emisora se revisa el estatuto; el capital social surge del estatuto y de los estados contables.","Un aumento de capital de una sociedad con oferta pública de acciones requiere autorización de oferta pública de la CNV e inscripción en el Registro Público (art. 188 de la Ley 19.550 regula el aumento hasta el quíntuplo). La designación o cesación de directores exige aviso en el Boletín Oficial e inicio de inscripción ante la CNV.","Para asistir a asambleas el accionista comunica su asistencia y deposita sus acciones (o constancia) ante la sociedad emisora, conforme art. 238 de la Ley 19.550. El registro de acciones lo lleva la propia emisora, un banco o Caja de Valores (art. 208 y 213 de la Ley 19.550). Las notificaciones válidas van a la sede social inscripta. Las asambleas a distancia requieren previsión estatutaria."],"puntos":["Control societario: sociedades con oferta pública (personas jurídicas privadas).","Ley 22.169, excluidas PyME CNV Garantizadas.","Reforma de estatuto: asamblea extraordinaria + conformidad CNV + Registro Público.","Objeto social preciso y determinado.","Directores: aviso en Boletín Oficial e inscripción en CNV.","Depósito de acciones para asamblea: ante la emisora (art. 238 LGS).","Asamblea a distancia: debe preverlo el estatuto."]},{"titulo":"13. Auditores externos: registro, independencia y calidad","parrafos":["La CNV tiene amplias facultades de supervisión sobre auditores externos (Ley 26.831 arts. 104 a 108, con la modificación de la Ley 27.440, de donde surge también su función de supervisión del control de calidad). La inscripción y control se regula en Normas CNV Título II Cap. III. Deben inscribirse en el Registro de Auditores Externos los contadores que certifiquen estados financieros de cualquier entidad bajo control de la CNV, y en el Registro de Asociaciones de Profesionales Auditores las asociaciones cuyos socios lo hagan. Ambos registros son públicos y se consultan en el sitio web de la CNV.","Requisitos de inscripción: matrícula con 5 años de antigüedad, 3 años de experiencia en auditoría, no estar inhabilitado y cumplir independencia; la solicitud se presenta dentro de los 10 días hábiles de la designación. Causal de exclusión del auditor: inhabilitación por la CNV según el art. 132 de la Ley 26.831 (o del Consejo Profesional). Causal de exclusión de la asociación: incumplimiento de las Normas CNV. Causal de cancelación: no haber sido designado auditor (titular o suplente) de una entidad controlada por la CNV en los últimos 3 años.","Solo pueden actuar como auditores externos los profesionales designados por la asamblea general de accionistas. La independencia exige una actitud mental independiente e independencia aparente, de modo que su opinión sea íntegra, veraz y objetiva; alcanza al auditor y a todo el equipo de trabajo. No es independiente quien sea propietario, director, gerente o administrador del ente auditado. Debe actuar siempre con principios de ética e independencia.","Las firmas que auditan emisoras con oferta pública que presentan bajo NIIF deben mantener un sistema de gestión de calidad que dé seguridad razonable de que cumplen normas profesionales y legales y que el informe es adecuado a las circunstancias. La documentación del trabajo registra procedimientos y juicios que fundamentan el informe y evidencia el cumplimiento normativo; el auditor puede aplicar procedimientos analíticos para obtener evidencia válida y suficiente."],"puntos":["Registro de auditores: Normas CNV Título II Cap. III; público en la web de la CNV.","Inscripción: auditores de cualquier ente bajo control de la CNV.","Exclusión: inhabilitación CNV (art. 132 Ley 26.831).","Cancelación: 3 años sin designación.","Designación: solo por asamblea de accionistas.","Independencia: mental y aparente; auditor y equipo.","Control de calidad: Ley 26.831 y Ley 27.440."]},{"titulo":"14. Informe de auditoría: opiniones, RT 37 y KAM","parrafos":["El auditor emite opinión sobre los estados financieros anuales; sobre los intermedios hace una revisión. Tipos de opinión: favorable o no modificada; con salvedades; adversa, cuando los estados no fueron preparados de acuerdo con las normas contables aplicables (desvíos generalizados); y abstención, cuando no puede obtener evidencia adecuada y suficiente para opinar.","La RT 37 de la FACPCE regula las normas de auditoría, revisión, otros encargos de aseguramiento, certificación y servicios relacionados; incorpora el nuevo informe extenso. Las Normas Internacionales de Auditoría son de aplicación obligatoria para estados financieros confeccionados bajo cualquier marco de información, según la guía conforme RT 37. Una certificación es un informe de constatación (no expresa opinión).","El informe largo con cuestiones clave de auditoría (KAM, NIA 701) busca mejorar la transparencia, dando a inversores y usuarios más información sobre riesgos, juicios significativos y cuestiones relevantes halladas en la auditoría. Es obligatorio para estados financieros de entidades listadas.","Si existe una incertidumbre material sobre empresa en funcionamiento (going concern), no se informa como KAM sino en una sección separada específica (Material Uncertainty Related to Going Concern)."],"puntos":["Adversa: estados no preparados según normas aplicables.","Abstención: no obtuvo evidencia suficiente.","Opinión: sobre estados anuales; trimestrales: revisión.","RT 37: informe extenso; certificación = informe de constatación.","KAM (NIA 701): obligatorio en entidades listadas.","Going concern: sección separada, no KAM."]}],"datos_duros":[{"concepto":"Norma de las obligaciones negociables","valor":"Ley 23.576 (art. 10: condiciones de emisión)","fuente":"Ley 23.576"},{"concepto":"Publicación del aviso de emisión de ON con oferta pública","valor":"Autopista de la Información Financiera (AIF)","fuente":"Normas CNV"},{"concepto":"Norma de la operatoria de derivados en mercados autorizados","valor":"Ley 26.831","fuente":"Ley de Mercado de Capitales"},{"concepto":"Régimen informativo contable periódico de emisoras","valor":"Normas CNV Título IV","fuente":"Normas CNV (N.T. 2013)"},{"concepto":"Plazo estados financieros anuales","valor":"70 días corridos desde el cierre (o 2 días hábiles desde aprobación)","fuente":"Normas CNV Título IV Cap. I"},{"concepto":"Plazo estados financieros trimestrales","valor":"42 días corridos desde el cierre del trimestre","fuente":"Normas CNV Título IV Cap. I"},{"concepto":"Plazo genérico que figura en la guía para información contable periódica","valor":"60 días corridos","fuente":"Guía de estudio CNV"},{"concepto":"Anuales a presentar antes de la asamblea","valor":"al menos 20 días corridos antes","fuente":"Normas CNV Título IV Cap. I"},{"concepto":"Estados contables públicos por año calendario","valor":"Cuatro (3 trimestrales + 1 anual)","fuente":"Normas CNV Título IV"},{"concepto":"PyME CNV: anuales y trimestrales","valor":"70 y 42 días corridos; pueden usar NCPA","fuente":"Normas CNV Título IV Cap. I art. 9"},{"concepto":"Marco contable régimen general","valor":"NIIF (RT 26 FACPCE)","fuente":"Normas CNV Título IV Cap. III art. 1"},{"concepto":"Marco contable PyME CNV","valor":"NCPA, excluidas de NIIF","fuente":"Normas CNV Título IV Cap. III art. 2"},{"concepto":"Entidades financieras emisoras","valor":"Normas del BCRA","fuente":"Normas CNV / RG 936/2022"},{"concepto":"Compañías de seguros emisoras","valor":"Normas y plazos de la SSN","fuente":"RG 936/2022"},{"concepto":"Asociaciones mutuales y cooperativas","valor":"Normas del INAES","fuente":"Normas CNV Título IV Cap. I art. 3"},{"concepto":"Aplicación anticipada de NIIF/NCPA","valor":"No admitida, salvo admisión expresa al adoptarse","fuente":"Normas CNV Título IV Cap. III"},{"concepto":"Moneda de presentación si la funcional no es el peso","valor":"Pesos (moneda de curso legal)","fuente":"Normas CNV Título IV Cap. III art. 3 inc. 12"},{"concepto":"Reseña informativa","valor":"Obligatoria en estados anuales y trimestrales","fuente":"Normas CNV Título IV Cap. III art. 4"},{"concepto":"Indicadores de la reseña","valor":"Liquidez, solvencia, inmovilización del capital y rentabilidad","fuente":"Normas CNV Título IV Cap. III art. 4"},{"concepto":"Orden de absorción de pérdidas (primer paso)","valor":"Ganancias reservadas: voluntarias, estatutarias, especiales y legal","fuente":"Normas CNV Título IV Cap. III art. 11"},{"concepto":"Reserva legal","valor":"5% de la ganancia hasta el 20% del capital + ajuste","fuente":"Ley 19.550 art. 70; Normas CNV Tít. IV Cap. III art. 5"},{"concepto":"Emisor de las NIIF","valor":"IASB","fuente":"IFRS Foundation"},{"concepto":"Emisor de interpretaciones NIIF","valor":"IFRIC","fuente":"IFRS Foundation"},{"concepto":"Consolidación","valor":"La controlante presenta consolidados salvo excepciones (entidades de inversión)","fuente":"NIIF 10"},{"concepto":"Ajuste por inflación","valor":"NIC 29 o RT 6; ejercicio anterior reexpresado y actual ajustado","fuente":"Normas CNV Título IV Cap. III art. 3"},{"concepto":"Control societario de la CNV","valor":"Personas jurídicas privadas con oferta pública (Ley 22.169), excluidas PyME CNV Garantizadas","fuente":"Ley 26.831 art. 19 inc. f; Ley 22.169"},{"concepto":"Reforma de estatuto","valor":"Asamblea extraordinaria + conformidad CNV + Registro Público","fuente":"Ley 19.550 art. 235; Normas CNV Título II Cap. IV"},{"concepto":"Objeto social","valor":"Preciso y determinado","fuente":"Ley 19.550 art. 11"},{"concepto":"Depósito de acciones para asistir a asambleas","valor":"Ante la sociedad emisora","fuente":"Ley 19.550 art. 238"},{"concepto":"Registro de acciones","valor":"La emisora, bancos o Caja de Valores","fuente":"Ley 19.550 arts. 208 y 213"},{"concepto":"Asamblea a distancia","valor":"Requiere previsión estatutaria","fuente":"Normas CNV Título II"},{"concepto":"Designación/cesación de directores","valor":"Aviso en Boletín Oficial e inscripción ante CNV","fuente":"Normas CNV Título II Cap. IV"},{"concepto":"Registro de Auditores Externos","valor":"Normas CNV Título II Cap. III; público en la web de la CNV","fuente":"Normas CNV"},{"concepto":"Facultades de la CNV sobre auditores externos","valor":"Amplias facultades de supervisión y control de calidad","fuente":"Ley 26.831 arts. 104-108, mod. Ley 27.440"},{"concepto":"Requisitos de inscripción del auditor","valor":"Matrícula 5 años, experiencia 3 años, presentación dentro de 10 días hábiles","fuente":"Normas CNV Título II Cap. III"},{"concepto":"Exclusión del Registro de Auditores","valor":"Inhabilitación por la CNV según régimen sancionatorio","fuente":"Ley 26.831 art. 132"},{"concepto":"Exclusión de asociaciones de auditores","valor":"Incumplimiento de las Normas CNV","fuente":"Normas CNV Título II Cap. III"},{"concepto":"Cancelación de inscripción del auditor","valor":"3 años sin ser designado titular o suplente","fuente":"Normas CNV Título II Cap. III"},{"concepto":"Designación del auditor externo","valor":"Asamblea general de accionistas","fuente":"Normas CNV Título II Cap. III; Ley 26.831"},{"concepto":"Nuevo informe extenso de auditoría","valor":"RT 37 FACPCE","fuente":"FACPCE"},{"concepto":"KAM obligatorio","valor":"Entidades listadas","fuente":"NIA 701 / RT 37"},{"concepto":"ON de bajo impacto","valor":"Autorización automática; tope 1 millón de UVA (mediano: 7 millones)","fuente":"RG CNV 1047/2025"},{"concepto":"Fideicomisos financieros","valor":"Oferta pública automática en supuestos definidos","fuente":"RG CNV 1051/2025"},{"concepto":"Contrato de futuro de dólar ROFEX/A3","valor":"1.000 dólares por contrato","fuente":"Manual MATBA-ROFEX"}],"trampas":["Plazos: la guía tiene una pregunta genérica cuya respuesta es 60 días corridos, pero cuando la pregunta distingue anuales y trimestrales la respuesta es 70 y 42 días corridos. Leé si pide un plazo único o diferenciado.","Interpretaciones NIIF: las emite el IFRIC, no el IASB (el IASB emite las normas).","Opinión adversa vs abstención: adversa es cuando los estados NO cumplen las normas contables; abstención es cuando el auditor NO obtuvo evidencia suficiente.","Going concern con incertidumbre material NO es una KAM: va en sección separada.","Solvencia es PN / pasivo; endeudamiento es pasivo / PN. No las inviertas. Liquidez es AC / PC (no activo total).","Inmovilización del capital es activo NO corriente sobre activo total, no sobre patrimonio.","La put lanzada: si al vencimiento el precio supera el strike, el tenedor NO ejerce y el lanzador se queda con la prima.","Cupón cero nunca cotiza sobre la par con tasas positivas, aunque bajen las tasas: es la afirmación falsa típica.","Split: afecta solo al índice ponderado por precio; la capitalización no cambia.","Volatilidad: si baja, bajan las primas de calls Y de puts (no se mueven en sentidos opuestos).","Duration modificada con convexidad: la guía obtiene -5,54% usando -DM x dy + C x dy^2 (sin el 1/2). Con el 1/2 daría -5,92%, que no es la opción correcta en el banco.","En futuros, tanto comprador como vendedor integran margen inicial. El vendido gana si el precio baja.","Aplicación anticipada de NIIF: la CNV no la admite aunque el IASB la permita, salvo admisión expresa.","Moneda funcional distinta del peso: igual se presenta en pesos en Argentina.","Exclusión del auditor por la CNV remite al art. 132 de la Ley 26.831; la cancelación es por 3 años sin designación (no confundir exclusión con cancelación)."],"formulas":[{"nombre":"Valor Actual Neto (VAN)","formula":"VAN = -I0 + Σ Ft/(1+i)^t","ejemplo":"I0 = 1.000; flujos de 500 en t=1,2,3; i = 10%. VA: 500/1,1 = 454,55; 500/1,1^2 = 413,22; 500/1,1^3 = 375,66. Suma = 1.243,43. VAN = 1.243,43 - 1.000 = 243,43 > 0, se acepta."},{"nombre":"Tasa Interna de Retorno (TIR)","formula":"0 = -I0 + Σ Ft/(1+TIR)^t","ejemplo":"I0 = 1.000; flujos de 600 en t=1 y t=2. Probando: TIR = 13,07%: 600/1,1307 + 600/1,1307^2 = 530,65 + 469,35 = 1.000. VAN = 0, entonces TIR = 13,07%."},{"nombre":"Precio de un bono","formula":"P = Σ C/(1+i)^t + VN/(1+i)^n","ejemplo":"VN 1.000, cupón 8% anual (80), 3 años, TIR 10%. 80/1,1 = 72,73; 80/1,1^2 = 66,12; 1.080/1,1^3 = 811,42. P = 950,26 (bajo la par porque cupón < TIR). Si TIR = 8%, P = 1.000 (a la par)."},{"nombre":"Bono cupón cero","formula":"P = VN/(1+i)^n","ejemplo":"VN 1.000, rendimiento 9,6%, 10 años: 1,096^10 = 2,5009; P = 1.000/2,5009 = 399,85."},{"nombre":"Current yield (rendimiento corriente)","formula":"CY = cupón anual / precio","ejemplo":"VN 1.000, cupón 100, 4 años, TIR 12%: P = 100/1,12 + 100/1,12^2 + 100/1,12^3 + 1.100/1,12^4 = 939,25. CY = 100/939,25 = 10,65%."},{"nombre":"Valor técnico y paridad","formula":"VT = valor residual + intereses corridos; Paridad = Precio/VT x 100","ejemplo":"Valor residual 100, cupón 10% anual, pasaron 3 meses desde el último pago: intereses corridos = 100 x 0,10 x 3/12 = 2,5. VT = 102,5. Precio 97: paridad = 97/102,5 = 94,63% (bajo la par)."},{"nombre":"Duration de Macaulay y modificada","formula":"D = Σ t x [Ft/(1+i)^t] / P; DM = D/(1+i); ΔP/P ≈ -DM x Δi","ejemplo":"Bono del ejemplo de precio (P = 950,26): D = (1x72,73 + 2x66,12 + 3x811,42)/950,26 = 2,777 años. DM = 2,777/1,1 = 2,525. Si la tasa sube 1%: ΔP/P ≈ -2,525%."},{"nombre":"Variación de precio con duration y convexidad (criterio de la guía)","formula":"ΔP/P ≈ -DM x Δi + C x (Δi)^2","ejemplo":"DM = 5,21; C = 52,1; Δi = +1,21% = 0,0121. -5,21 x 0,0121 = -0,06304; 52,1 x 0,0121^2 = 0,00763. Total = -0,05541 = -5,54%."},{"nombre":"Duration de una cartera","formula":"Dc = Σ (Pj/ΣP) x Dj","ejemplo":"Bonos de 1.050 (D=8), 1.000 (D=6) y 950 (D=4). Total 3.000. Dc = (1.050x8 + 1.000x6 + 950x4)/3.000 = 18.200/3.000 = 6,07."},{"nombre":"TNA a TEA y tasa equivalente","formula":"TEA = (1 + TNA/m)^m - 1; tasa equivalente de período = (1+TEA)^(1/m) - 1","ejemplo":"TNA 36% con capitalización mensual: TEA = (1 + 0,36/12)^12 - 1 = 1,03^12 - 1 = 42,58%. Inversa: (1,4258)^(1/12) - 1 = 3% mensual."},{"nombre":"Futuro por cost of carry","formula":"F = S x (1 + r x t); para monedas F = S x (1 + r_local x t)/(1 + r_ext x t)","ejemplo":"Spot 1.000, tasa 40% anual, 90 días: F = 1.000 x (1 + 0,40 x 90/365) = 1.098,63. Con tasa en dólares 5%: F = 1.000 x 1,0986/1,0123 = 1.085,25."},{"nombre":"Resultado de un futuro","formula":"Vendido: (F venta - F cierre) x tamaño x contratos; Comprado: (F cierre - F compra) x tamaño x contratos","ejemplo":"Vende 3 contratos de dólar (1.000 USD c/u) a 1.010 y cierra a 1.009,50: (1.010 - 1.009,50) x 1.000 x 3 = +1.500 de ganancia. Comprado de soja 30 t a 280: si baja a 270, pierde 10 x 30 = 300 USD por diferencias diarias."},{"nombre":"Valor intrínseco y valor tiempo de opciones","formula":"VI call = max(0; S-K); VI put = max(0; K-S); Valor tiempo = prima - VI","ejemplo":"Call K=40, S=48, prima 10: VI = 8; valor tiempo = 10 - 8 = 2. Put K=45, S=38: VI = 7. Protective put: compra acción a 40 + put K=45 a prima 4; al vencimiento S=38: acción -2, put +7, prima -4 = ganancia neta de 1."},{"nombre":"Bull spread con calls","formula":"Resultado = max(0;S-K1) - max(0;S-K2) - prima pagada + prima cobrada","ejemplo":"Compra call K=40 a 2 y vende call K=45 a 1; S=48: +8 - 3 - 2 + 1 = ganancia de 4 (máximo posible: 45-40-1 = 4)."},{"nombre":"Paridad put-call","formula":"C + K/(1+r)^t = P + S","ejemplo":"S=100, K=100, r=10% a un año, call=15: P = C + K/(1+r) - S = 15 + 90,91 - 100 = 5,91."},{"nombre":"PER y valor libro por acción","formula":"PER = Precio / (Resultado neto / acciones); VL = PN / acciones; P/VL = Precio/VL","ejemplo":"Resultado 3.435 millones, PN 17.610 millones, 984.380.978 acciones, precio 44,25. GPA = 3,49; PER = 44,25/3,49 = 12,68. VL = 17,89; P/VL = 2,47."},{"nombre":"ROE y ROA","formula":"ROE = Resultado neto / PN; ROA = Resultado neto / Activo total","ejemplo":"Resultado 3.435; PN 17.610; Activo 38.465: ROE = 19,51%; ROA = 8,93%. Si la ganancia cae 5% y el PN promedio cae 10%: nuevo ROE = ROE x 0,95/0,90 = ROE x 1,0556 (sube 5,56%)."},{"nombre":"Liquidez, endeudamiento, solvencia e inmovilización","formula":"Liquidez = AC/PC; Endeudamiento = Pasivo total/PN; Solvencia = PN/Pasivo total; Inmovilización = ANC/Activo total","ejemplo":"AC 11.492; ANC 26.973; PC 16.914; PNC 3.941; PN 17.610. Liquidez = 11.492/16.914 = 0,68 (68%). Endeudamiento = 20.855/17.610 = 1,18. Solvencia = 0,84. Inmovilización = 26.973/38.465 = 70,1%. Control: 38.465 - 20.855 = 17.610."}]},"5":{"modulo":5,"titulo":"Agentes, instrumentos, operaciones, liquidación y garantías","resumen":"El módulo recorre quién opera en el mercado de capitales argentino (mercados, cámaras y cada categoría de agente con lo que puede y no puede hacer), qué instrumentos se negocian (acciones, renta fija, ON, CPD, pagarés, FCE y derivados) y cómo se concertan, liquidan y garantizan las operaciones. El examen pregunta mucho sobre límites de cada agente, hacedor de mercado, caución vs pase, cálculos de caución, derechos de suscripción y opciones, y qué norma regula cada tema.","secciones":[{"titulo":"Marco normativo y rol de la CNV","parrafos":["La ley madre del mercado de capitales es la Ley 26.831 (Ley de Mercado de Capitales), reformada en 2018 por la Ley 27.440 de Financiamiento Productivo. La 26.831 es la que exige que todo agente esté autorizado e inscripto en la CNV para actuar, y también es la norma de referencia para la operatoria de derivados en mercados autorizados. Para el examen, ante la pregunta de qué ley regula el mercado, la inscripción de agentes o los derivados, la respuesta es la 26.831.","La Ley 27.440 incorporó, entre otras cosas, la Factura de Crédito Electrónica MiPyME (arts. 1 a 25), el régimen de derivados y pases ante concursos y quiebras, y retocó el régimen de pagarés (arts. 195 a 199, que sustituyen artículos de la Ley 27.264). Las Plataformas de Financiamiento Colectivo nacen de la Ley 27.349 de Apoyo al Capital Emprendedor, pero la guía oficial asocia su regulación a la Ley 27.440, que modificó ese régimen: en el examen marcá 27.440 cuando sea la opción ofrecida.","La CNV es la autoridad de aplicación: registra, supervisa, fiscaliza y sanciona a los agentes. La competencia disciplinaria (aplicar sanciones) es exclusiva de la CNV; en cambio, la supervisión, fiscalización y control de los agentes miembros no es exclusiva, porque los Mercados y Cámaras Compensadoras también controlan a sus agentes y deben denunciar a la CNV toda falta que detecten. La guía vincula el art. 2 de la Ley 26.831 con la función de la CNV (técnicamente el art. 2 tiene definiciones y las atribuciones están en el art. 19, pero para el examen respondé art. 2).","Las Normas CNV (N.T. 2013) ordenan la reglamentación por títulos: Título VI Mercados y Cámaras Compensadoras (incluye liquidación y compensación, colocación primaria y negociación secundaria), Título VII Agentes de negociación, ALyC, fondo de garantía para reclamos de clientes, AP, AAGI y corretaje, Título VIII ADC y ACRyP, Título IX Agentes de Calificación de Riesgo. La guía atribuye las operaciones garantizadas al Título XIV y los mecanismos de liquidación y compensación al Título VI."],"puntos":["Ley 26.831: mercado de capitales, inscripción de agentes, derivados, sanciones.","Ley 27.440: financiamiento productivo, FCE, PFC (según la guía), pagarés y derivados.","Ley 23.576: obligaciones negociables.","Sanciones a agentes: solo la CNV (exclusiva).","Supervisión y control: compartida con Mercados y Cámaras, que deben denunciar faltas.","Canal oficial para avisos y hechos relevantes: Autopista de la Información Financiera (AIF)."]},{"titulo":"Mercados, cámaras compensadoras y contraparte central","parrafos":["Los Mercados son sociedades anónimas autorizadas por la CNV que organizan la negociación de valores con oferta pública. Las Cámaras Compensadoras se encargan de la compensación y liquidación de las operaciones: calculan saldos netos, exigen márgenes, administran garantías y aseguran que cada parte reciba lo pactado. Un mercado puede cumplir también funciones de cámara.","Cuando el Mercado o la Cámara garantiza el cumplimiento de las operaciones, actúa como contraparte central (CCP): se interpone entre comprador y vendedor, convirtiéndose en comprador de todo vendedor y vendedor de todo comprador. Es decir, el rol de CCP existe justamente cuando garantizan; la afirmación contraria es falsa.","La regla general es que las operaciones con valores negociables se hagan en segmentos de concurrencia o interferencia de ofertas con prioridad precio-tiempo y con garantía del Mercado o Cámara. Los segmentos bilaterales son la excepción y quedan reservados a operaciones de agentes por cartera propia entre sí o entre agentes e inversores calificados."],"puntos":["Cámara compensadora: compensa, liquida y garantiza operaciones.","CCP = el Mercado/Cámara garantiza y se vuelve contraparte de ambas puntas.","Regla general: segmento con prioridad precio-tiempo y garantía.","Bilateral: cartera propia entre agentes o agentes con inversores calificados.","Mercados y Cámaras supervisan a sus miembros y denuncian faltas a la CNV."]},{"titulo":"Agentes de Negociación, ALyC y Hacedores de Mercado","parrafos":["El Agente de Negociación (AN) intermedia en la compra y venta de valores en mercados autorizados, por cuenta propia o de clientes. No puede custodiar valores ni fondos de clientes ni ser depositante en el Agente Depositario Central (Caja de Valores): para liquidar y custodiar necesita un convenio con un ALyC Integral. Tampoco puede asesorar sobre inversiones si no tiene el registro correspondiente en la CNV.","El Agente de Liquidación y Compensación (ALyC) además de negociar liquida y compensa operaciones, recibe y custodia fondos y valores. El ALyC Integral liquida lo propio, lo de sus clientes y también lo de los AN con los que tenga convenio, respondiendo ante el mercado por todos ellos. El ALyC Propio solo liquida lo propio y lo de sus clientes. Existe también el ALyC Agro, orientado a operaciones del sector agropecuario. El ALyC solo puede desarrollar actividades complementarias sujetas al control de la CNV; los bancos y entidades financieras de la Ley 21.526 están exceptuados de esa limitación.","Facultades a recordar del ALyC: puede ofrecer adelantos transitorios con fondos propios cuando hay descalces o demoras transitorias en la liquidación, y si el cliente le otorgó administración discrecional de cartera puede invertir los saldos en beneficio del cliente. Puede trasladar al cliente los costos de mantenimiento de cuenta derivados de su función de depositante en el ADCVN.","El Hacedor de Mercado (market maker) provee liquidez a especies determinadas para formar precios más eficientes y reducir volatilidad. Solo pueden serlo los ALyC Integrales, ALyC Propios, ALyC Agro y los AN con convenio vigente con un ALyC Integral. Actúa por cuenta propia (no exclusivamente por terceros), en el segmento de concurrencia de ofertas con prioridad precio-tiempo, manteniendo durante su período de presencia ofertas simultáneas de compra y venta con un mínimo diferencial (spread mínimo, en palabras de la guía) según las condiciones que fije el mercado, y solo en las especies para las que está habilitado. No puede delegar esa función en sus clientes."],"puntos":["AN: negocia; NO custodia ni es depositante en el ADCVN.","ALyC Integral: liquida propio, clientes y AN con convenio.","ALyC Propio: liquida solo propio y clientes.","ALyC: complementarias solo bajo control CNV (excepto bancos Ley 21.526).","ALyC: adelantos transitorios con fondos propios por descalces.","Hacedor de mercado: ALyC I, ALyC P, ALyC Agro o AN con convenio.","Hacedor: cartera propia, solo especies habilitadas, no delega en clientes.","Hacedor: ofertas simultáneas de compra y venta con diferencial mínimo."]},{"titulo":"Agentes Productores, AAGI, Corretaje y Calificación de Riesgo","parrafos":["El Agente Productor (AP) difunde, promociona y capta clientes para un agente registrado (AN, ALyC o AAGI), bajo la responsabilidad de ese agente. Tiene prohibido custodiar fondos o valores de clientes o en su nombre. Como norma de conducta debe brindar información adecuada en lenguaje apropiado para que el inversor conozca los riesgos que asume. Puede hacer difusión del mercado de capitales vinculado a un AAGI.","El Agente Asesor Global de Inversión (AAGI) brinda asesoramiento y puede administrar carteras, realizando operaciones por medio de intermediarios locales y del exterior. No puede ofrecer públicamente valores sin autorización de oferta pública en Argentina ni ser cliente del AN con el que celebró convenio.","El Agente de Corretaje de Valores Negociables (ACVN) pone en contacto a dos o más partes para concretar negocios con valores, sin estar ligado a ninguna por relaciones de colaboración, dependencia o representación.","Los Agentes de Calificación de Riesgo (ACR) califican valores negociables con oferta pública y también privada. Pueden hacer actividades afines solo con autorización previa de la CNV y no pueden prestar consultoría ni auditoría a quien califican. Sus informes no son publicidad ni recomendación de compra o venta."],"puntos":["AP: NO custodia fondos ni valores; actúa bajo responsabilidad de un agente.","AP: información adecuada y lenguaje apropiado sobre riesgos.","AAGI: opera vía intermediarios locales y del exterior.","AAGI: no ofrece valores sin oferta pública local; no es cliente de su AN.","ACVN: vincula partes sin dependencia con ninguna.","ACR: califica oferta pública y privada; afines con autorización CNV.","Calificación no es recomendación ni publicidad."]},{"titulo":"Custodia: ADC/ADCVN y ACRyP","parrafos":["El Agente de Depósito Colectivo (ADC), y en particular el Agente Depositario Central de Valores Negociables (ADCVN, en la práctica Caja de Valores), recibe en depósito colectivo los valores, lleva las cuentas comitentes a nombre de cada titular y custodia los instrumentos. Los agentes que liquidan son depositantes y abren subcuentas a nombre de sus clientes.","El Agente de Custodia, Registro y Pago (ACRyP) custodia, lleva registros y efectúa pagos sobre valores, por ejemplo servicios de renta y amortización o cuotas de pagarés. La responsabilidad clave del agente de custodia es administrar cuentas comitentes y custodiar valores.","Si el titular no está conforme con los saldos informados por el ADCVN, puede reclamar ante el propio ADCVN, ante su agente y ante la CNV."],"puntos":["Custodia: administra cuentas comitentes y custodia valores.","Reclamo por saldos: ADCVN, el agente y la CNV.","Costos de mantenimiento de cuenta en el ADCVN se pueden trasladar al cliente.","Regulación: Normas CNV Título VIII."]},{"titulo":"Normas de conducta en la relación con el cliente","parrafos":["Los agentes reciben órdenes por los medios de contacto pactados con cada cliente en el convenio de apertura de cuenta. Existe instrucción específica cuando por cada operación se indica al menos la especie o instrumento, la cantidad y el precio o rango de precio y/o tasa. Los fondos líquidos de un cliente que opera con instrucciones específicas se tratan según lo convenido
