ables, confeccionados bajo NIIF.","Certifican estados financieros de cualquier entidad, patrimonio o sujeto bajo control de la Comisión Nacional de Valores, cualquiera sea el marco contable aplicado.","Certifican estados financieros de entidades autorizadas para hacer oferta pública de sus valores negociables, confeccionados bajo normas del BCRA o de la SSN.","Certifican estados financieros de entidades del régimen PyME CNV, confeccionados bajo normas contables profesionales argentinas."],"src":"IV-56"},{"q":"La ecuación patrimonial básica está definida por la siguiente fórmula:","opts":["Activo - Pasivo = Patrimonio Neto.","Activo = Pasivo - Patrimonio Neto.","Pasivo - Activo = Patrimonio Neto.","Activo + Pasivo = Patrimonio Neto."],"src":"IV-57"},{"q":"La reseña informativa es obligatoria:","opts":["En Estados Contables anuales y trimestrales.","Para Estados Financieros anuales, en forma optativa para los trimestrales.","Solo para los Estados Financieros anuales.","Para Estados Financieros trimestrales, no así para los anuales."],"src":"IV-58"},{"q":"Las Normas Internacionales de Información Financiera (NIIF) de Contabilidad emanan:","opts":["Del IASB.","De la FACPCE.","De la Comisión Nacional de Valores.","Distinguen entre moneda funcional y moneda de presentación."],"src":"IV-59"},{"q":"Las entidades financieras emisoras de acciones y/u obligaciones negociables pueden presentar sus estados financieros conforme a:","opts":["Normas que dicta el BCRA.","Normas que dicta la IGJ.","Normas que dicta la SSN.","Normas que dicta la FACPCE."],"src":"IV-60"},{"q":"Las interpretaciones de las Normas Internacionales de Información Financiera (NIIF) de Contabilidad sólo pueden ser emanadas:","opts":["Del IFRIC.","FACPCE.","IASB.","Del Consejo Profesional de Ciencias Económicas."],"src":"IV-61"},{"q":"Las Normas Internacionales de Información Financiera (NIIF) de Contabilidad:","opts":["Distinguen entre moneda funcional y moneda de presentación.","De la FACPCE.","No distinguen entre moneda funcional y moneda de presentación.","Exigen que la moneda de presentación sea siempre el dólar."],"src":"IV-62"},{"q":"Los estados contables básicos son:","opts":["El estado de situación financiera, el estado de resultados integrales, el estado de cambios en el patrimonio y el estado de flujos de efectivo.","El estado de situación financiera y el estado de resultados.","La memoria, el estado de situación financiera, el estado de resultados y el estado de cambios en el patrimonio.","El estado de situación financiera, el estado de resultados, el estado de evolución del patrimonio y la memoria."],"src":"IV-63"},{"q":"Los plazos de presentación de los estados financieros para emisoras de acciones y/u obligaciones negociables son:","opts":["42 días corridos para trimestrales y 70 días corridos para anuales.","30 días corridos para trimestrales y 60 días corridos para anuales.","60 días corridos para trimestrales y 90 días corridos para anuales.","No existen plazos diferenciados entre trimestrales y anuales."],"src":"IV-64"},{"q":"Para las Normas Internacionales de Información Financiera (NIIF) de Contabilidad tiene preeminencia la información contenida en los estados financieros:","opts":["Consolidados.","Individuales de cada sociedad del grupo.","Individuales y consolidados de forma alternativa.","Solo los de la controlante sin consolidar."],"src":"IV-65"},{"q":"Que los estados financieros estén confeccionados de acuerdo con las Normas Internacionales de Información Financiera (NIIF) de Contabilidad implica:","opts":["Que están confeccionados de acuerdo con todas las NIIF vigentes.","Que están confeccionados con las NIIF elegidas a criterio del órgano de administración.","Que están confeccionados siguiendo las NIIF que son de aplicación en ese país.","Que están confeccionados de acuerdo con las NIIF vigentes a la fecha de cierre del ejercicio anterior."],"src":"IV-66"},{"q":"Se considera que el auditor externo cumple con el requisito de independencia cuando:","opts":["Su desempeño y conducta profesional le permiten emitir una opinión íntegra, veraz y objetiva con relación a las evidencias examinadas.","Su desempeño y conducta profesional solo ocasionalmente le permiten emitir una opinión, íntegra, veraz y objetiva con relación a las evidencias examinadas.","Su desempeño y conducta profesional con frecuencia le impiden emitir una opinión, íntegra, veraz y objetiva con relación a las evidencias examinadas.","Su remuneración es fijada por el Consejo Profesional y no por el ente auditado."],"src":"IV-67"},{"q":"Según el Régimen Informativo Periódico, los estados financieros se pueden confeccionar en base a Normas Contables Profesionales Argentina (NCPA) si:","opts":["Pertenecen a emisoras de acciones y/u obligaciones negociables que califican como PyME CNV.","Son emisoras que cotizan en mercados internacionales.","Son emisoras del régimen general con más de 5 años de antigüedad.","Son emisoras que emiten exclusivamente obligaciones negociables."],"src":"IV-68"},{"q":"Según las Normas Internacionales de Información Financiera (NIIF) de Contabilidad, el Estado de Resultados Integrales puede tener una segunda parte denominada:","opts":["Otros Resultados Integrales.","Resultados antes de Amortizaciones, Depreciaciones, Intereses e Impuestos.","Resultados Extraordinarios.","Resultados por Tenencia."],"src":"IV-69"},{"q":"Si los estados financieros están confeccionados con moneda funcional distinta al peso, en Argentina:","opts":["La moneda de presentación será pesos.","La moneda de presentación será distinta al peso.","Deberá cambiarse la moneda funcional.","La moneda de presentación será la moneda funcional."],"src":"IV-70"},{"q":"Solo pueden desempeñarse como auditores externos, los profesionales designados por:","opts":["La Asamblea General de Accionistas del emisor de los estados financieros.","El Directorio de la sociedad emisora, con la conformidad del Comité de Auditoría.","La Comisión Nacional de Valores, a propuesta de la sociedad emisora.","El Comité de Auditoría de la emisora, con la conformidad del órgano de fiscalización."],"src":"IV-71"},{"q":"Tanto en el régimen informativo anual como trimestral:","opts":["Es obligatoria la presentación del Informe del Auditor Externo.","Es obligatoria sólo para los estados financieros anuales.","Es optativa para emisoras del régimen PyME CNV.","Es obligatoria cuando los estados presentan salvedades."],"src":"IV-72"},{"q":"Una emisora que se encuentra en el régimen general de oferta pública presenta sus estados financieros a la Comisión Nacional de Valores, confeccionados conforme a:","opts":["Normas Internacionales de Información Financiera (NIIF) de Contabilidad.","US GAAP.","Normas Contables Profesionales Argentina (NCPA).","Todas son correctas."],"src":"IV-73"},{"q":"Es causal de cancelación de la inscripción de un auditor externo en el Registro de Auditores Externos:","opts":["Que el auditor no haya sido designado para desempeñarse como auditor externo, ya sea en carácter de titular o suplente, de los estados financieros de una emisora, patrimonio, sujeto o entidad que está sujeta al control de la Comisión Nacional de Valores, durante los últimos TRES (3) años.","Que el auditor haya sido designado como suplente, y no como titular, de los estados financieros de una emisora bajo control de la Comisión Nacional de Valores durante los últimos TRES (3) años, sin haber emitido informe alguno en ese período.","Que el auditor no haya sido designado para desempeñarse como auditor externo, ya sea en carácter de titular o suplente, de los estados financieros de una emisora, patrimonio, sujeto o entidad bajo control de la Comisión Nacional de Valores, durante el último ejercicio anual.","Que el auditor no haya informado la actualización de sus datos registrales dentro de los TREINTA (30) días de producida la novedad, en cuyo caso la cancelación opera de pleno derecho sin intimación previa."],"src":"IV-74"},{"q":"La función de supervisión del control de calidad de las auditorías externas que ejerce la Comisión Nacional de Valores resulta:","opts":["De la Ley 26.831 (y su modificatoria Ley 27.440).","De la Ley 25.246 de prevención de lavado de activos.","De la Resolución UIF 78/2023.","Del Código Civil y Comercial de la Nación."],"src":"IV-75"},{"q":"Las Normas Internacionales de Auditoría (NIA) son de:","opts":["Aplicación obligatoria para estados financieros confeccionados bajo cualquier marco de información, conforme RT 37.","Aplicación obligatoria únicamente para estados financieros confeccionados bajo NIIF, conforme RT 37.","Aplicación optativa para estados financieros de emisoras del régimen PyME CNV, conforme RT 37.","Aplicación obligatoria para estados financieros anuales, quedando los intermedios sujetos a la RT 7."],"src":"IV-76"},{"q":"Los requisitos de independencia son aplicables:","opts":["Tanto al auditor externo como a los integrantes del equipo de trabajo que interviene en las tareas de auditoría.","Solo al auditor externo que emite su informe.","Sólo al auditor externo cuando audite estados financieros de grupo o componentes.","Sólo a los integrantes del equipo de trabajo, no al auditor que firma."],"src":"IV-77"},{"q":"Se considera que el auditor externo no cumple con el requisito de independencia:","opts":["Si es propietario, director, gerente o administrador del ente cuyos estados financieros certifica.","Si su remuneración no depende del resultado del periodo a que se refieren los estados financieros que certifica.","Si se encuentra matriculado simultáneamente en más de un consejo profesional de ciencias económicas.","Si audita a más de una emisora bajo control de la Comisión Nacional de Valores."],"src":"IV-78"},{"q":"La documentación del trabajo del auditor externo tiene por finalidad:","opts":["Registrar los procedimientos y juicios que fundamentan su informe y evidenciar el cumplimiento de las normas y los requerimientos legales y reglamentarios aplicables.","Registrar la calificación técnica e idoneidad del auditor y de su equipo de trabajo y evidenciar el cumplimiento de los requisitos de independencia aplicables.","Registrar los procedimientos aplicados y los hallazgos comunicados al ente auditado, a fin de que éste corrija las deficiencias antes de la emisión del informe.","Registrar los procedimientos y juicios que fundamentan su informe, quedando el cumplimiento de las normas a cargo del sistema de gestión de calidad de la firma."],"src":"IV-79"},{"q":"El auditor externo debe mantener permanentemente una actitud y conducta profesional acorde con:","opts":["Principios de ética e independencia.","Usos y costumbres que rigen la práctica contable.","Prácticas y reglas impuestas por el emisor de los estados financieros que certifica.","Instrucciones del órgano de administración del ente auditado."],"src":"IV-80"},{"q":"Para realizar una tarea de auditoría sin prejuicios, libre de conflicto de intereses o de influencia indebida de terceros, el auditor debe:","opts":["Mantener una actitud mental independiente e independencia aparente.","Tener a su cargo el registro de documentación contable y la preparación de los estados financieros a certificar.","Determinar su remuneración sobre la base del resultado del período a que se refieren los estados financieros.","Contar con la conformidad previa del Comité de Auditoría del ente."],"src":"IV-81"},{"q":"En el curso de una auditoría, el profesional puede:","opts":["Aplicar procedimientos analíticos para obtener evidencias válidas y suficientes.","No aplicar procedimiento por no resultar escéptico respecto de la integridad de la información preparada por los responsables de la misma.","Apoyarse en el trabajo de la auditoría interna del ente soslayando la obtención de un conocimiento apropiado de la estructura del ente, sus operaciones, sistemas y normas legales y reglamentarias que son aplicables.","Omitir la revisión del control interno cuando el ente cuente con auditoría interna."],"src":"IV-82"},{"q":"Una certificación emitida por un profesional contable es:","opts":["Un informe de constatación.","Un informe de auditoría con opinión favorable.","Un dictamen con opinión adversa.","Un informe de revisión limitada."],"src":"IV-83"},{"q":"Si en una nueva NIIF o modificación de una ya existente, el IASB permite la aplicación anticipada de la norma:","opts":["No puede aplicarse en forma anticipada en el mercado de capitales, según las Normas CNV.","Puede aplicarse en forma anticipada en el mercado de capitales, según las Normas CNV.","Sólo puede aplicarse en forma anticipada si la FACPCE lo permite.","Puede aplicarse en forma anticipada con autorización previa de la Comisión Nacional de Valores."],"src":"IV-84"},{"q":"Si una compañía de seguros es autorizada a efectuar oferta pública de sus valores negociables:","opts":["Puede aplicar las normas y los plazos de presentación de información contable de la Superintendencia de Seguros de la Nación (SSN).","Debe dejar de aplicar las normas de la Superintendencia de Seguros de la Nación (SSN).","No puede aplicar ni las normas ni los plazos de presentación de información contable de la Superintendencia de Seguros de la Nación (SSN).","Debe aplicar las normas de la SSN y los plazos de la Comisión Nacional de Valores."],"src":"IV-85"},{"q":"Según el orden de absorción de pérdidas del Art. 11 del Capítulo III del Título IV de las Normas (N.T. 2013 y mod.):","opts":["Se utilizan primero las Ganancias Reservadas (voluntarias, estatutarias, especiales y legal, en ese orden).","Se utilizan primero las Ganancias Reservadas (legal, especiales, estatutarias y voluntarias, en ese orden).","Se utiliza primero el Ajuste del Capital y luego las Ganancias Reservadas, cualquiera sea su tipo.","Se utilizan primero los Resultados No Asignados, luego el Capital Social y por último las Ganancias Reservadas."],"src":"IV-86"},{"q":"Pueden las asociaciones mutuales presentar ante la Comisión Nacional de Valores sus estados contables:","opts":["De acuerdo con las normas del INAES.","Solamente con las normas de la SSN.","De acuerdo con las normas del INAES, previa conformidad de la SSN.","De acuerdo con las normas de la IGJ."],"src":"IV-87"},{"q":"La Comisión Nacional de Valores, bajo la órbita de su competencia, ejerce el control societario respecto de:","opts":["Personas jurídicas privadas;","Personas jurídicas públicas y privadas sin distinción.","Las personas jurídicas privadas con capital superior a 100.000 UVAs.","Las personas jurídicas privadas autorizadas a hacer oferta pública de acciones, no así las de obligaciones negociables."],"src":"IV-88"},{"q":"Las siguientes personas jurídicas se encuentran bajo control societario de la Comisión Nacional de Valores:","opts":["Todas las entidades encuadradas en la Ley Nº 22.169, excluidas las PyME CNV Garantizadas.","Las mencionadas en la ley 22.169, incluidas las encuadradas en el régimen PyME CNV garantizadas.","Las emisiones de acciones con o sin autorización de oferta pública.","Todas las entidades encuadradas en la Ley Nº 22.169, incluidas las sociedades admitidas al régimen de oferta privada."],"src":"IV-89"},{"q":"Cuando una sociedad realiza una emisión de obligaciones negociables con oferta pública, debe:","opts":["Publicar el aviso de emisión en la Autopista de la Información Financiera.","Publicar el aviso de emisión en el Boletín Oficial e iniciar el trámite de inscripción del mismo.","Publicar el aviso de emisión en el Boletín oficial.","Publicar el aviso de emisión en la Autopista de la Información Financiera y en el Boletín Oficial, dentro de los diez días de la colocación."],"src":"IV-90"},{"q":"Las personas jurídicas sujetas a control societario de la Comisión Nacional de Valores deben solicitar la inscripción registral de:","opts":["Los miembros del Directorio;","Los miembros del Directorio, de la Comisión Fiscalizadora y del Comité de Auditoría.","Los miembros del Comité de Auditoría.","Los miembros de la Comisión Fiscalizadora."],"src":"IV-91"},{"q":"Si una persona jurídica sujeta a control societario de la Comisión Nacional de Valores quiere cambiar su denominación social, deberá:","opts":["Reformar su estatuto, con conformidad de la Comisión Nacional de Valores e inscripción en el Registro Público;","Reformar su estatuto, y obtener la conformidad de la CNV e inscripción en el Registro Público y la transferencia de oferta pública correspondiente.","Reformar su estatuto y solicitar la inscripción directamente ante el Registro Público y registrar el cambio de denominación en la CNV.","Reformar su estatuto, obtener la conformidad de la Inspección General de Justicia e inscripción en el Registro Público."],"src":"IV-92"},{"q":"Para saber qué actividades tiene permitido desarrollar una sociedad emisora, debo revisar:","opts":["El estatuto social.","Los estados contables del último ejercicio.","El informe de la calificadora de riesgo.","El acta de la última asamblea de accionistas."],"src":"IV-93"},{"q":"El registro de acciones de una sociedad emisora está a cargo de:","opts":["La propia emisora, bancos o Caja de Valores;","La propia emisora, la Comisión Nacional de Valores o el mercado donde liste;","Bancos o Caja de Valores, no pudiendo llevarlo la propia emisora;","El agente de custodia, registro y pago designado por la Comisión Nacional de Valores;"],"src":"IV-94"},{"q":"Para saber cuál es el capital social de una sociedad emisora, debo revisar:","opts":["El estatuto social y los estados contables.","El acta de directorio y los libros contables.","El registro de accionistas y la memoria anual.","El prospecto de emisión y el acta de asamblea."],"src":"IV-95"},{"q":"Si necesito cursar una notificación a la sociedad emisora, para que la misma sea válida y vinculante, debo hacerlo a:","opts":["La sede social inscripta.","El domicilio fiscal registrado ante la AFIP.","El domicilio del representante legal.","Cualquier domicilio constituido ante la CNV."],"src":"IV-96"},{"q":"Si un accionista desea participar en una asamblea, debe comunicar su intención de asistir y depositar sus acciones ante:","opts":["La sociedad emisora.","Al mercado donde cotizan las acciones.","A la Comisión Nacional de Valores.","Al Agente de Custodia, Registro y Pago."],"src":"IV-97"},{"q":"Si el directorio de una sociedad anónima admitida al régimen de oferta pública decide convocar a una asamblea de accionistas a celebrarse a distancia, deberá:","opts":["Tenerlo previsto en el estatuto social.","Autorización previa de la CNV.","Aprobación de la asamblea ordinaria de accionistas.","Dictamen favorable del auditor externo."],"src":"IV-98"},{"q":"Cuando se produce la designación o cesación de directores en una persona jurídica bajo control societario de la Comisión Nacional de Valores, se debe:","opts":["Publicar un aviso en el Boletín oficial, e iniciar el trámite de inscripción en la Comisión Nacional de Valores.","Publicar un aviso en la AUTOPISTA DE LA INFORMACIÓN FINANCIERA (AIF).","Publicar un aviso en el Boletín oficial e iniciar el trámite de inscripción en la INSPECCIÓN GENERAL DE JUSTICIA (IGJ).","Publicar un aviso en la AIF e iniciar el trámite de inscripción en el Registro Público, sin intervención de la Comisión Nacional de Valores."],"src":"IV-99"},{"q":"Las reformas de estatutos sociales de sociedades anónimas bajo control societario de la Comisión Nacional de Valores deben ser aprobadas por:","opts":["Asamblea Extraordinaria.","Asamblea Ordinaria.","Reunión de Directorio.","Comisión Fiscalizadora."],"src":"IV-100"},{"q":"En una sociedad anónima bajo control societario de la Comisión Nacional de Valores, el objeto social debe ser:","opts":["Preciso y determinado.","Amplio y genérico.","Determinado por la CNV según el rubro de la sociedad.","Definido libremente por el directorio sin restricciones."],"src":"IV-101"},{"q":"Las sociedades que se encuentran en el régimen de oferta pública de acciones, en caso de aumento de su capital social, deben:","opts":["Obtener autorización de oferta pública de acciones de la Comisión Nacional de Valores y la inscripción del aumento de capital en el Registro Público.","Obtener la inscripción del aumento de capital en el Registro Público e informarlo a la Comisión Nacional de Valores como hecho relevante, sin nueva autorización de oferta pública.","Obtener autorización de oferta pública de acciones de la Comisión Nacional de Valores, que sustituye la inscripción del aumento de capital en el Registro Público.","Obtener la conformidad del mercado en el que listen las acciones y la inscripción del aumento de capital en la Comisión Nacional de Valores."],"src":"IV-102"},{"q":"¿Cuál de las siguientes características no es propia de un bono cupón cero?","opts":["Un bono cupón cero puede negociarse sobre la par cuando bajan las tasas de interés.","A menor precio, mayor tasa de rendimiento.","Amortiza todo el capital al vencimiento.","Se negocia a descuento respecto de su valor nominal."],"src":"IV-103"},{"q":"Suponga que existen 2 bonos A y B. Uno hace pagos de amortización e interés semestralmente (bono A), el otro paga interés semestralmente pero es bullet (bono B). Ambos tienen el mismo cupón semestral con el mismo calendario de pagos y vencimiento en un año. Si ambos son descontados a una misma tasa, responda:","opts":["El valor actual de los flujos de A es mayor al de B.","El valor actual de los flujos de B es mayor al de A.","Los valores actuales son iguales porque tienen el mismo vencimiento.","No se puede comparar sin conocer la calificación de riesgo."],"src":"IV-104"},{"q":"¿Cuál de las siguientes situaciones puede provocar un incremento del ROE de una Sociedad?","opts":["Que la Ganancia neta disminuya 5% y el promedio del valor libro de las acciones disminuya 10%.","Que la Ganancia neta aumente 5% y el promedio del valor libro de las acciones se incremente 10%.","Que la Ganancia neta aumente 5% y el promedio del valor libro de las acciones aumente 5%.","Que la Ganancia neta disminuya 10% y el promedio del valor libro de las acciones disminuya 5%."],"src":"IV-105"},{"q":"Al 31/12/2024 los Estados Financieros de EMISORA S.A. muestran la siguiente información (en millones de $): Activo Corriente: 11.492; Activo No Corriente: 26.973; Pasivo Corriente: 16.914; Pasivo No Corriente: 3.941; Patrimonio Neto: 17.610. Estado de Resultados al 31/12/2024: Resultado Neto: 3.435. Cantidad de acciones: 984.380.978. Cotización al 31/12/2024: $44,25. El ratio de liquidez de la empresa y el de endeudamiento son, respectivamente:","opts":["Liquidez: 68% y endeudamiento: 1,18.","Liquidez: 1,18 y endeudamiento: 68%.","Liquidez: 147% y endeudamiento: 0,96.","Liquidez: 68% y endeudamiento: 0,22."],"src":"IV-106"},{"q":"El 1° de octubre de 2024 Juan vendió 3 contratos en ROFEX de Futuro dólar a diciembre de 2024 a $1010. El 1 de Noviembre del 2024 este contrato de futuro de dólar se ubica en $1009,50. ¿Cuál sería en este caso la ganancia o pérdida si cierra su posición? (Sin considerar los costos de transacción)","opts":["Una ganancia de $1.500.","Una pérdida de $1.500.","Una ganancia de $4.500.","No hay resultado porque la operación se liquida al vencimiento."],"src":"IV-107"},{"q":"Suponga que tiene una posición comprada de un contrato de Futuro de Soja por 30 toneladas. Inicialmente el precio del contrato de Futuros comprado fue a 280 dólares la tonelada.","opts":["Si el precio baja 10 dólares Ud. tiene diferencias en contra, debe pagar diferencias diarias.","Si el precio baja 10 dólares Ud. tiene diferencias a favor y cobra la diferencia.","Si el precio sube 10 dólares Ud. debe pagar diferencias diarias.","No hay diferencias diarias en contratos de futuros; se liquida sólo al vencimiento."],"src":"IV-108"},{"q":"Si la volatilidad de una acción baja, lo más probable que ocurra es:","opts":["El precio tanto de una opción call como put disminuirá.","Baja el precio del call y sube la del put.","Sube el precio del put y baja la del call.","El precio de la prima no se modifica."],"src":"IV-109"},{"q":"¿Un split de acciones tiene efectos en el cálculo del índice ponderado por precio y del índice ponderado por capitalización bursátil?","opts":["Sólo afecta al índice ponderado por precio.","Afecta a todos los tipos de índices por igual.","No afecta a ningún índice bursátil.","Solo afecta al índice ponderado por capitalización."],"src":"IV-110"},{"q":"Si un inversionista lanza una opción de venta sobre una acción. ¿Qué pasará si el precio de mercado en la fecha de vencimiento de la opción excede el precio de ejercicio?","opts":["El tenedor no ejercerá su opción.","Se deberá entregar el subyacente.","Se deberá comprar el subyacente.","El tenedor ejercerá su opción y el lanzador deberá comprar el subyacente al precio de ejercicio."],"src":"IV-111"},{"q":"Si usted es un inversor y decide comprar un futuro de dólar, usted debe:","opts":["Poner una garantía inicial cuando compra el futuro.","Pagar una prima por la compra de ese futuro.","No pagar nada y esperar que caduque el futuro para ver si tiene que pagar o cobrar la diferencia entre el precio pactado en el futuro y la cotización en el mercado spot.","Pagar el precio pactado al momento de concertar el futuro."],"src":"IV-112"},{"q":"Si usted compra un futuro de dólar con vencimiento dentro de un mes y vende un futuro de dólar con vencimiento en 3 meses. ¿Cómo supone que será el margen a integrar por las posiciones?","opts":["Se integrarán ambos márgenes, pero recibirá una bonificación por compensación de riesgos.","Solo se integra el margen de la posición más grande.","Se suman ambos márgenes sin bonificación alguna.","No se requiere integrar márgenes para operaciones de spread."],"src":"IV-113"},{"q":"Suponga que usted es Gerente de Finanzas de una compañía manufacturera importadora de electrodomésticos. En el día de la fecha usted acuerda la compra de insumos por un monto a pagar de u$s 1.000.000, que serán abonados el día que reciba los productos, es decir dentro de 60 días. De acuerdo al reporte de su equipo de research que considera que las expectativas devaluatorias son mayores que lo estimado por el mercado. Usted ante este escenario debería:","opts":["Comprar futuro de dólar a 60 días.","Vender futuro de dólar a 60 días.","Comprar opciones de venta sobre el dólar a 90 días.","No realizar cobertura y asumir el riesgo cambiario."],"src":"IV-114"},{"q":"Supongamos que un inversor compra una acción a $40 y también adquiere una opción de venta (put) sobre esa acción pagando una prima de $4, con un precio de ejercicio de $45. Al vencimiento, el precio de mercado de la acción es de $38. Considerando el costo de adquisición de la acción y de la opción, ¿cuál es el resultado económico neto de la estrategia al vencimiento? (Ignorar costos de transacción).","opts":["Ganancia de $1.","Pérdida de $4.","Pérdida de $2.","Ganancia de $5."],"src":"IV-115"},{"q":"Un bono de cupón cero cotiza con un rendimiento del 9,6% y un valor nominal de $ 1.000. Si el bono vence en 10 años, cuál sería el precio actual del bono (utilice dos decimales):","opts":["399,85.","391.","422.","413,25."],"src":"IV-116"},{"q":"Una orden de divulgación parcial o ICEBERG es una orden parcialmente oculta porque:","opts":["Se muestra su precio y parcialmente su cantidad.","Se muestra su cantidad y parcialmente su precio.","Se ocultan tanto el precio como la cantidad.","Se muestra completamente pero con un retardo temporal."],"src":"IV-117"},{"q":"Un bono que paga cupones anuales, tiene un valor nominal de $ 1.000, vence en 4 años, paga un cupón de $ 100 y tiene una TIR del 12 %. El rendimiento actual o Current Yield de este bono es:","opts":["10,65%.","12,00%.","10,00%.","10,71%."],"src":"IV-118"},{"q":"Un bono sobre la par es negociado cuando:","opts":["El precio es mayor que su valor nominal.","El precio es menor que su valor nominal.","El precio es igual a su valor nominal.","El precio es igual a su valor técnico."],"src":"IV-119"},{"q":"Una cartera de bonos que tiene un bono X, un bono Y y un bono Z. Los precios de los bonos son $1,050, $1,000 y $950 respectivamente y la duration de los mismos son 8, 6 y 4 respectivamente. ¿Cuál es duration total de la cartera?","opts":["6,07.","5,50.","7,25.","4,85."],"src":"IV-120"},{"q":"Un inversor compra por 2 pesos una opción de compra de EMISORA S.A. con un precio de ejercicio de $40 y a su vez vende por un 1 peso una opción de compra con un precio de ejercicio de $45. Si cuando vencen las opciones el precio de mercado de la acción de EMISORA S.A. es de $48, el inversionista tuvo como resultado:","opts":["Una ganancia de $ 4.","Una ganancia de $5.","Una pérdida de $5.","Una pérdida de $4."],"src":"IV-121"},{"q":"Si el beta de una acción aumenta, es probable que su volatilidad:","opts":["Haya incrementado respecto a la del Mercado.","Haya disminuido respecto a la del Mercado.","Se mantenga igual respecto a la del Mercado.","No existe relación entre beta y volatilidad."],"src":"IV-122"},{"q":"La definición de Venta en corto se corresponde con la siguiente afirmación:","opts":["Son aquellas operaciones de venta concertadas en el plazo de contado normal y cuya liquidación es realizada con valores negociables obtenidos en préstamo en la misma sesión de negociación.","Son aquellas operaciones de venta concertadas a plazo firme y cuya liquidación es realizada con valores negociables adquiridos en el mercado de contado en la fecha de vencimiento.","Son aquellas operaciones de venta concertadas en el plazo de contado inmediato y cuya liquidación es realizada con valores negociables de titularidad del vendedor depositados en garantía.","Son aquellas operaciones de venta concertadas en el plazo de contado normal y cuya liquidación es realizada con valores negociables obtenidos mediante una caución tomadora en la misma sesión."],"src":"IV-123"},{"q":"Respecto a las siguientes afirmaciones señale cual es verdadera:","opts":["En una “posición larga” las potenciales ganancias son ilimitadas mientras que las potenciales pérdidas pueden alcanzar el 100%. Por otro lado, en el caso de tener una posición corta, las potenciales ganancias están limitadas al 100%, mientras que las pérdidas son ilimitadas.","En una “posición larga” las potenciales ganancias están limitadas al 100% mientras que las potenciales pérdidas son ilimitadas. Por otro lado, en el caso de tener una posición corta, las potenciales ganancias son ilimitadas, mientras que las pérdidas pueden alcanzar el 100%.","En una “posición larga” las potenciales ganancias son ilimitadas mientras que las potenciales pérdidas pueden alcanzar el 100%. Por otro lado, en el caso de tener una posición corta, las potenciales ganancias son también ilimitadas, mientras que las pérdidas están limitadas al 100%.","Tanto en una “posición larga” como en una posición corta las potenciales ganancias y pérdidas están limitadas al 100% del capital invertido, dado que ambas se liquidan al precio de mercado del vencimiento."],"src":"IV-124"},{"q":"Dada una duración modificada de 5,21 y su convexidad de 52,1. ¿Cuál de las siguientes variaciones de precios de un bono es la correcta ante un incremento de la tasa de interés del 1,21%?","opts":["-5,54 %.","-6,30 %.","-4,95 %.","+0,76 %."],"src":"IV-125"},{"q":"La Comisión Nacional de Valores restringe la aplicación anticipada de NIIF y NCPA por el principio de comparabilidad. Esta regla:","opts":["Rige salvo que, al adoptarse la norma, se admita expresamente la aplicación anticipada.","No existe restricción para normas emitidas por el IASB.","La restricción aplica sólo a emisoras PyME CNV.","Se restringe sólo para normas que afecten el patrimonio neto."],"src":"IV-126"},{"q":"Una emisora PyME CNV puede presentar estados bajo:","opts":["NCPA, quedando excluida de la obligación de NIIF.","NIIF completas, igual que el régimen general.","US GAAP adaptadas al mercado argentino.","Solo normas del BCRA."],"src":"IV-127"},{"q":"Las entidades financieras registradas como emisoras ante Comisión Nacional de Valores pueden compatibili stración y fiscalización, síndicos, gerentes y apoderados del Agente, con exclusión de los empleados, socios y accionistas sin funciones ejecutivas.","Los miembros del órgano de administración y los apoderados del Agente, siempre que las operaciones se realicen en la subcuenta de cartera propia registrada ante el Mercado."],"src":"V-34"},{"q":"En los segmentos para la negociación bilateral, la misma se lleva a cabo:","opts":["Entre Agentes de su cartera propia y/o entre Agentes e inversores/clientes calificados.","Entre Agentes de su cartera propia y/o entre Agentes y clientes/inversores no calificados.","Sólo entre Agentes cartera propia.","Entre Agentes y clientes no calificados, con garantía del Mercado."],"src":"V-35"},{"q":"El fondo de garantía obligatorio, dispuesto en la Ley de Mercado de Capitales para los Mercados/Cámaras Compensadoras, cubre los compromisos:","opts":["No cumplidos entre Agentes, originados en operaciones con garantía de liquidación del Mercado/CC.","No cumplidos por los Agentes con sus clientes, originados en operaciones con garantía de liquidación del Mercado/CC.","No cumplidos entre Agentes, originados en operaciones concertadas en segmentos de negociación bilateral sin garantía.","No cumplidos por el Mercado/Cámara Compensadora frente a los Agentes, originados en operaciones garantizadas."],"src":"V-36"},{"q":"Los fondos líquidos pertenecientes a un cliente que opera mediante instrucciones específicas a su Agente, deben:","opts":["Ser tratados conforme lo convenido expresamente con el cliente.","Mantenerse depositados en el agente.","Ser transferidos hacia otras cuentas, a criterio del Agente.","Ser invertidos por el Agente en fondos comunes de dinero."],"src":"V-37"},{"q":"Se entiende que existe una \"instrucción específica\" para una operación cuando:","opts":["Por cada operación se indiquen al menos la especie/instrumento que se quiere operar, cantidad, precio o rango de precio y/o tasa de rendimiento.","Por cada operación se indique  el tomador entrega valores en garantía."],"src":"V-45"},{"q":"Los vendedores de Call están obligados a vender el activo subyacente si el comprador ejerce la opción.","opts":["Verdadero.","Falso."],"src":"V-46"},{"q":"Los contratos de futuros agrícolas son:","opts":["Contratos estandarizados para recibir la entrega de una mercaderia en un lugar y fecha específicos.","Contratos no estandarizados para recibir la entrega de una mercadería en un lugar y fecha convenidos bilateralmente entre las partes.","Contratos estandarizados que otorgan el derecho, pero no la obligación, de recibir la entrega de una mercadería en una fecha específica.","Contratos estandarizados en cantidad y calidad de la mercadería, con fecha y lugar de entrega a convenir entre las partes al vencimiento."],"src":"V-47"},{"q":"Los márgenes de garantía en la negociación de futuros:","opts":["Sirven como garantía de cumplimiento.","Se utilizan para pagar comisiones al agente.","Son opcionales para operaciones de bajo monto.","Se devuelven íntegramente al cierre de la operación."],"src":"V-48"},{"q":"Los Agentes, en la documentación de respaldo que extiendan a sus clientes por las operaciones realizadas (boletos), deben:","opts":["Explicitar las comisiones y todo otro costo de intermediación.","No discriminar costos de intermediación.","Hacer referencia a lo informado en el convenio de apertura de cuenta cliente oportunamente firmado.","Informar únicamente la comisión del Agente, sin los derechos de Mercado."],"src":"V-49"},{"q":"Según la Ley de Mercado de Capitales N° 26.831, la aplicación de sanciones a los Agentes le corresponde a:","opts":["La Comisión Nacional de Valores.","El Banco Central de la República Argentina.","El Ministerio de Economía.","El Poder Judicial de la Nación."],"src":"V-50"},{"q":"Requisito previo a la negociación de un Cheque de Pago Diferido:","opts":["Endoso con especificación de que el CPD será negociado en Mercados regulados por Comisión Nacional de Valores.","Endoso en blanco a favor del Agente, sin especificación del destino del CPD, acompañado de la instrucción escrita del cliente.","Endoso con especificación de la entidad de custodia responsable del pago y de la fecha de vencimiento del CPD.","Endoso con especificación de que el CPD será negociado en el Mercado, previa certificación de fondos por parte del banco girado."],"src":"V-51"},{"q":"La negociación de Cheques de Pago Diferido en el segmento directo:","opts":["Solamente pueden negociarse instrumentos cuyo vencimiento se produzca a partir de los 20 días corridos desde la fecha de la decisión de descontarlo/negociarlo en el mercado de capitales.","Solamente pueden negociarse instrumentos cuyo vencimiento se produzca a partir de los 30 días corridos desde la fecha de la decisión de descontarlo/negociarlo en el mercado de capitales.","Solamente pueden negociarse instrumentos cuyo vencimiento se produzca dentro de los 20 días corridos desde la fecha de la decisión de descontarlo/negociarlo en el mercado de capitales.","Solamente pueden negociarse instrumentos cuyo vencimiento se produzca a partir de los 20 días hábiles desde la fecha de libramiento del cheque, cualquiera sea la fecha de la decisión de negociarlo."],"src":"V-52"},{"q":"Si una PyME decide negociar una Factura de Crédito Electrónica (FCE) en Mercados regulados por Comisión Nacional de Valores, deberá:","opts":["Abrir cuenta apta para la negociación del instrumento y solicitar la acreditación del instrumento en la misma.","Abrir cuenta apta para la negociación del instrumento y obtener el aval de una SGR o entidad de garantía previo a la acreditación del instrumento.","Solicitar la acreditación del instrumento en la cuenta comitente de la gran empresa deudora, que lo transfiere al Agente de la PyME.","Abrir cuenta apta para la negociación del instrumento y registrar la FCE ante el Agente Depositario Central de Valores Negociables, sin intervención del Agente de Registro y Pago."],"src":"V-53"},{"q":"La negociación del instrumento pagaré requiere:","opts":["El cumplimiento de los montos y plazos mínimos que fija Comisión Nacional de Valores.","Acreditación del aval para la negociación en todos los segmentos habilitados por el Mercado y reglamentados por circular.","Que el instrumento sea emitido en moneda nacional, dado que no se permite la negociación de este tipo de valores en moneda extranjera.","Que el instrumento cuente con calificación de riesgo emitida por un agente registrado."],"src":"V-54"},{"q":"Negociación de Factura de Crédito Electrónica en moneda extranjera:","opts":["La gran empresa deberá cancelar la deuda en pesos, conforme el reglamento del Agente de Registro y Pago de FCE.","La gran empresa paga en moneda extranjera, conforme el reglamento del Agente de Registro de FCE.","La gran empresa deberá emitir un cheque a la PyME y ésta deberá cancelar la deuda con el tenedor de la FCE negociada.","La gran empresa deberá cancelar la deuda en moneda extranjera, conforme el reglamento del Mercado."],"src":"V-55"},{"q":"Cuando una PyME decide descontar una Factura de Crédito Electrónica en Mercados regulados por Comisión Nacional de Valores:","opts":["Debe ser cancelada conforme surja del reglamento del Agente de Registro y Pago o entidad que cumpla el rol de clearing.","Debe ser cancelada en la fecha de vencimiento declarada en el título, mediante transferencia directa de la gran empresa a la PyME.","Debe ser cancelada conforme surja del reglamento del Mercado en el que se negoció, con intervención del Agente Depositario Central de Valores Negociables.","Puede ser cancelada mediante la entrega de cheques de pago diferido, conforme lo convenido entre la gran empresa y el tenedor de la FCE."],"src":"V-56"},{"q":"En la negociación de Cheques de Pago Diferido, los Agentes deberán:","opts":["Notificar fehacientemente y bajo su responsabilidad a los clientes que intervengan en las distintas modalidades disponibles de negociación de cheques de pago diferido, sus características distintivas y los esquemas de garantías de cada una de ellas; notificar fehacientemente y bajo su responsabilidad a los clientes, de los eventuales riesgos de distintas modalidades ante el no pago del cheque por defectos formales o falta de fondos del librador y el procedimiento posterior aplicable en cada caso.","Informar a los clientes las modalidades de negociación disponibles, indicando riesgos y responsabilidades según el segmento, sin asumir garantía de pago; notificar fehacientemente al Mercado los eventuales riesgos de cada modalidad ante el no pago del cheque por defectos formales o falta de fondos del librador, siendo el Mercado el responsable de notificar a los clientes el procedimiento posterior aplicable en cada caso.","Verificar, previo a la negociación, los requisitos formales del cheque y la existencia de fondos del librador ante el banco girado; notificar fehacientemente y bajo su responsabilidad a los clientes las características distintivas de cada modalidad de negociación, quedando los esquemas de garantías y los riesgos ante el no pago a cargo de la Cámara Compensadora, que los informa directamente a los clientes.","Notificar fehacientemente y bajo su responsabilidad a los clientes que intervengan en la modalidad avalada las características distintivas y los esquemas de garantías de la misma, quedando las modalidades directa y patrocinada exentas de notificación por no contar con garantía; informar a la Comisión Nacional de Valores los eventuales riesgos de cada modalidad ante el no pago del cheque y el procedimiento posterior aplicable."],"src":"V-57"},{"q":"Para los clientes de los Agentes que estén autorizados a operar ADM (Acceso Directo al Mercado):","opts":["La redistribución de la información de Mercado (Market Data) en tiempo real, por parte de los Agentes a dichos clientes, está sujeta a los aranceles fijados por el Mercado en cuestión.","La redistribución de la información del Mercado (Market Data) en tiempo real, por parte de los Agentes a dichos clientes, no está sujeta a aranceles.","La información de Mercado no se encuentra disponible en tiempo real.","La redistribución de la información del Mercado está sujeta a la autorización previa de la Comisión Nacional de Valores."],"src":"V-58"},{"q":"Respecto del o los saldos de valores negociables, instrumentos o fondos en custodia en el Agente Depositario Central de Valores Negociables (ADCVN), ante la disconformidad del tenedor titular:","opts":["Dicho titular podrá realizar el reclamo ante el ADCVN, su Agente y la Comisión Nacional de Valores.","Dicho titular podrá realizar el recamo sólo ante la ADCVN.","Dicho titular podrá realizar el reclamo ante el Mercado donde su Agente tenga membresía.","Dicho titular podrá realizar el reclamo ante el Banco Central de la República Argentina."],"src":"V-59"},{"q":"Los Agentes pueden trasladar a sus clientes:","opts":["Los costos del mantenimiento de cuenta/s derivados de los servicios que prestan como despositantes en el Agente Depositario Central de Valores Negociables (ADCVN).","Los costos del mantenimiento de cuenta/s de titularidad del Agente como comitente en el Agente Depositario Central de Valores Negociables (ADCVN).","Todos los costos que el ADCVN cobre al Agente por la totalidad de los servicios prestados.","Los costos de la membresía del Agente en el Mercado."],"src":"V-60"},{"q":"La regulación de C.N.V. respecto de las Plataformas de Financiamiento Colectivo incluye:","opts":["Plataformas orientadas a financiación bajo el esquema de equity.","a. Plataformas orientadas a financiación bajo el esquema de lending.","c. Plataformas orientadas a financiación bajo el esquema de equity o lending.","Plataformas orientadas a financiación bajo el esquema de donaciones."],"src":"V-61"},{"q":"Respecto de los proyectos ofrecidos a través de las Plataformas de Financiamiento Colectivo (PFC):","opts":["Deben revestir la calidad de Emprendimiento Argentino conforme la reglamentación del Ministerio de Economía.","Deben revestir la calidad de Emprendimiento Argentino conforme la reglamentación de la Comisión Nacional de Valores, con calificación de riesgo vigente.","Deben ser ofrecidos por sociedades anónimas con al menos dos ejercicios cerrados, conforme la reglamentación del Ministerio de Economía.","Deben revestir la calidad de PyME CNV y contar con autorización de oferta pública otorgada por la Comisión Nacional de Valores."],"src":"V-62"},{"q":"Los Agentes de Negociación no pueden:","opts":["Efectuar custodia de valores negociables, fondos y ser depositantes en el Agente Depositario Central de Valores Negociables.","Prestar servicios de asesoramiento y realizar la custodia de fondos y valores negociables.","Actuar en la colocación primaria y realizar la custodia de fondos y valores negociables.","Recibir órdenes de clientes y ejecutarlas en los Mercados."],"src":"V-63"},{"q":"Los Agentes Asesores Globales de Inversión pueden:","opts":["Realizar operaciones por medio de intermediarios locales y del exterior.","Recibir cobros y pagos de clientes en relación con el servicio de administración de cartera que realizan.","Ser cliente/comitente del ALYC con el cual firmaron convenio.","Custodiar los valores negociables de sus clientes."],"src":"V-64"},{"q":"Los Agentes de Calificación de Riesgo pueden:","opts":["Realizar actividades afines, si realizan el trámite de autorización previa ante C.N.V.","Prestar servicios de auditoría, consultoría y asesoramiento.","Tercerizar funciones operativas relativas a la calificación de riesgos, previa autorización a la CNV.","Emitir valores negociables con oferta pública."],"src":"V-65"},{"q":"Los Agentes de calificación de Riesgo:","opts":["Pueden calificar valores negociables con oferta pública y privada.","Solamente pueden calificar valores negociables sujetos al régimen de oferta pública.","Solamente podrían calificar valores negociables sujetos al régimen de oferta privada.","Calificar únicamente emisoras, no valores negociables."],"src":"V-66"},{"q":"Los Agentes Productores pueden:","opts":["Realizar actividades de difusión del Mercado de Capitales vinculados a un Agente Asesor Global de Inversión (AAGI).","Administrar cartera y brindar asesoramiento vinculados a un ALyC.","Actuar como Agentes de Colocación y Distribución de FCI como parte de las funciones de asesoramiento.","Custodiar fondos de clientes en nombre del ALyC."],"src":"V-67"},{"q":"Normas de conducta que debe cumplir un Agente Productor (AP):","opts":["Brindar información adecuada en lenguaje apropiado, que le permita al inversor conocer los riesgos que asume en la o las inversiones.","Debe actuar considerando el mejor interés del cliente y del ALYC ofreciendo los productos que le permitan mayor rentabilidad.","Debe actuar considerando el mejor interés del ALYC con quien suscribió convenio.","Debe garantizar al inversor la rentabilidad de los productos ofrecidos."],"src":"V-68"},{"q":"Un Agente ALyC que posee la autorización del comitente para cumplir con la función de administración discrecional de cartera:","opts":["Puede invertir los saldos en beneficio del cliente.","Puede utilizar los saldos líquidos de manera discrecional, siempre que se encuentren disponibles en cuenta bancaria abierta para fines operativos.","Puede conceder financiamiento a sus clientes.","Puede utilizar los saldos para operaciones de cartera propia."],"src":"V-69"},{"q":"El ALYC tiene facultades para:","opts":["Ofrecer adelantos transitorios, con fondos propios por eventos que generen descalce o demoras transitorias.","Ofrecer financiamiento y otorgar préstamos de mediano plazo solo a sus clientes.","Ofrecer adelantos y préstamos, con saldos líquidos acreditados.","Ofrecer préstamos a terceros no clientes con fondos de clientes."],"src":"V-70"},{"q":"El cheque de pago diferido goza de oferta pública en los términos de la Ley de Mercado de Capitales Nº 26.831 y podrá ser negociado en Mercados bajo competencia de esta Comisión:","opts":["Verdadero.","Falso."],"src":"V-71"},{"q":"La colocación primaria de valores negociables podrá efectuarse por los mecanismos de:","opts":["Formación de libro o subasta o licitación pública.","Formación de libro o licitación pública, quedando excluida la subasta, reservada a la negociación secundaria.","Subasta o licitación pública, quedando excluida la formación de libro, reservada a las colocaciones del exterior.","Formación de libro o colocación directa por el emisor entre inversores calificados, sin intervención de agentes."],"src":"V-72"},{"q":"Se considera rotación excesiva de cartera a aquella actividad realizada:","opts":["Aquella que no responde a la recepción de órdenes impartidas por el cliente y excede lo habitual.","Por el agente que responde exclusivamente a su propio interés comercial.","Por la CNV que ordena la rotación de cartera.","Por el mercado que impone las operaciones obligatorias."],"src":"V-73"},{"q":"Para recibir órdenes e instrucciones de clientes, los Agentes pueden:","opts":["Utilizar los medios o modalidades de contacto convenidos con cada cliente en el Convenio de Apertura de Cuenta.","Utilizar únicamente medios escritos o electrónicos que dejen constancia fehaciente, con exclusión de los telefónicos, aun cuando estén convenidos con el cliente.","Utilizar los medios o modalidades de contacto habilitados por el Mercado en el que operen, con independencia de lo convenido con cada cliente.","Utilizar los medios o modalidades de contacto convenidos con cada cliente, siempre que cuenten con la aprobación previa de la Comisión Nacional de Valores."],"src":"V-74"},{"q":"El Agente Asesor Global de Inversión NO puede:","opts":["Ofrecer públicamente valores negociables que no cuenten con autorización de oferta pública en la República Argentina; ser cliente del AN con quien celebre convenio.","Administrar carteras de inversión a nombre y en interés de sus clientes; ofrecer públicamente valores negociables con autorización de oferta pública en la República Argentina.","Asesorar sobre valores negociables del exterior; realizar operaciones por medio de intermediarios locales y del exterior por cuenta de sus clientes.","Ser cliente del AN con quien celebre convenio; recibir cobros y pagos de clientes en relación con el servicio de administración de cartera."],"src":"V-75"},{"q":"La competencia disciplinaria, a la cual quedan sometidos los Agentes registrados y con matrícula Comisión Nacional de Valores, no es exclusiva de esta última.","opts":["Falso.","Verdadero."],"src":"V-76"},{"q":"Las actividades de supervisión, fiscalización y control, sobre los Agentes registrados en Comisión Nacional de Valores y con membresía en Mercados, no resultan competencia exclusiva de la Comisión Nacional de Valores.","opts":["Verdadero.","Falso."],"src":"V-77"},{"q":"Los Mercados y las Cámaras Compensadoras deben denunciar toda falta en que incurrieren sus Agentes miembros, que resulten de las auditorías y controles de supervisión, fiscalización y control practicados por dichos Mercados/Cámaras Compensadoras sobre ellos.","opts":["Verdadero.","Falso."],"src":"V-78"},{"q":"Las operaciones a plazo firme pueden ser realizadas:","opts":["Únicamente sobre valores negociables de renta fija y variable, excluidos cheques de pago diferido, letras de cambio, pagarés, certificados de depósito, warrants y certificados de depósito a plazo fijo.","Únicamente sobre valores negociables de renta fija y variable, incluidos cheques de pago diferido, letras de cambio y pagarés, excluidos los certificados de depósito, warrants y certificados de depósito a plazo fijo.","Únicamente sobre valores negociables de renta variable, excluidos los de renta fija, cheques de pago diferido, letras de cambio, pagarés, certificados de depósito y warrants.","Sobre cualquier valor negociable con oferta pública, incluidos cheques de pago diferido, letras de cambio, pagarés, certificados de depósito, warrants y certificados de depósito a plazo fijo, siempre que cuente con garantía del Mercado."],"src":"V-79"},{"q":"Las operaciones de pase pueden ser realizadas:","opts":["Únicamente sobre valores negociables de renta fija y variable, excluidos cheques de pago diferido, letras de cambio, pagarés, certificados de depósito, warrants y certificados de depósito a plazo fijo.","Únicamente sobre valores negociables de renta fija y variable, incluidos cheques de pago diferido, letras de cambio y pagarés, excluidos los certificados de depósito, warrants y certificados de depósito a plazo fijo.","Únicamente sobre valores negociables de renta fija, excluidos los de renta variable, cheques de pago diferido, letras de cambio, pagarés, certificados de depósito y warrants.","Sobre cualquier valor negociable con oferta pública, incluidos cheques de pago diferido, letras de cambio, pagarés, certificados de depósito, warrants y certificados de depósito a plazo fijo, siempre que cuente con garantía del Mercado."],"src":"V-80"},{"q":"En las operaciones de pase, el comprador a plazo firme:","opts":["Puede cancelar anticipadamente tal compra abonando el mismo importe que correspondería pagar en la fecha del vencimiento pactado.","Puede cancelar anticipadamente tal compra abonando el importe pactado menos los intereses correspondientes al plazo no transcurrido.","No puede cancelar anticipadamente tal compra, salvo conformidad expresa del vendedor a plazo firme y del Mercado en el que se registró la operación.","Puede cancelar anticipadamente tal compra abonando el importe de contado de los valores negociables a la fecha de la cancelación."],"src":"V-81"},{"q":"Las acreencias devengadas durante la vigencia de una operación:","opts":["De caución corresponden al tomador de fondos, de pase corresponden al colocador.","De caución corresponden al colocador de fondos, de pase corresponden al tomador.","De caución y de pase corresponden al tomador de fondos, por conservar la propiedad de los valores.","De caución corresponden al tomador de fondos, de pase corresponden al Mercado hasta el vencimiento."],"src":"V-82"},{"q":"En las operaciones de caución, el tomador de fondos:","opts":["Puede cancelar anticipadamente la operación abonando el mismo importe que correspondería pagar en la fecha del vencimiento pactado.","Puede cancelar anticipadamente la operación abonando el importe pactado menos los intereses correspondientes al plazo no transcurrido.","No puede cancelar anticipadamente la operación, salvo conformidad expresa del colocador de fondos y de la Cámara Compensadora.","Puede cancelar anticipadamente la operación abonando el valor aforado de la garantía sin intereses."],"src":"V-83"},{"q":"En la fecha de concertación de una operación de caución la especie entregada en garantía se valoriza considerando:","opts":["El último precio de cierre de la especie para liquidar en contado normal.","El valor nominal de las acciones.","El valor de mercado al momento de la concertación.","El precio de emisión original de las acciones."],"src":"V-84"},{"q":"En la fecha de concertación de una operación de caución el colocador entrega:","opts":["El valor aforado de la garantía menos los intereses.","El valor de mercado de la garantía más los intereses.","El valor nominal de la garantía.","El valor aforado de la garantía más los intereses."],"src":"V-85"},{"q":"En la fecha de vencimiento de una operación de caución el tomador devuelve:","opts":["El valor aforado de la garantía más los intereses y gastos.","El valor aforado de la garantía.","El valor aforado de la garantía más los gastos.","El valor de mercado de la garantía más los intereses."],"src":"V-86"},{"q":"El ALYC sólo puede realizar como actividades complementarias aquellas sujetas al control de la Comisión Nacional de Valores y quedan exceptuados de dicha limitación los Bancos y Entidades Financieras autorizadas a funcionar en los términos de la Ley Nº 21.526.","opts":["Verdadero.","Falso."],"src":"V-87"},{"q":"Los Mercados y las Cámaras Compensadoras, desempeñarán el rol y funciones de contraparte central (CCP en inglés), cuando no garanticen el cumplimiento de las operaciones autorizadas por la Comisión Nacional de Valores.","opts":["Falso.","Verdadero."],"src":"V-88"},{"q":"Los ALYCs Integrales, los ALYCs Propios, los ALYCs Agro y los ANs (con convenio vigente con el respectivo ALYC Integral), son las únicas subcategorías y categoría de Agentes autorizados y registrados por la Comisión Nacional de Valores que pueden revestir la calidad de Hacedores de Mercado.","opts":["Verdadero.","Falso."],"src":"V-89"},{"q":"La función del Hacedor de Mercado es la de proveer liquidez a las especies y/o instrumentos sobre los que opere en orden a la formación más eficiente del precio y a la consiguiente reducción de su volatilidad.","opts":["Verdadero.","Falso."],"src":"V-90"},{"q":"El Hacedor de Mercado, para cumplir su función, debe formular ofertas de compra y de venta con un mínimo diferencial entre sus respectivos precios, según el instrumento o la especie y bajo las condiciones que el Mercado establezca.","opts":["Verdadero.","Falso."],"src":"V-91"},{"q":"El Hacedor de Mercado actúa exclusivamente por cuenta de terceros.","opts":["Falso.","Verdadero."],"src":"V-92"},{"q":"Durante el período de presencia en la sesión de negociación, el Hacedor de Mercado no sólo podrá actuar en tal carácter con las especies y/o instrumentos para los que se encuentre habilitado por el respectivo Mercado.","opts":["Falso.","Verdadero."],"src":"V-93"},{"q":"El Hacedor de Mercado, bajo su entera responsabilidad e independientemente que se encuentre habilitado o no por el correspondiente Mercado para ejercer sus funciones como tal, podrá acordar y habilitar que uno o más de sus clientes realice operaciones tendientes a proveer liquidez a determinadas especies y/o instrumentos.","opts":["Falso.","Verdadero."],"src":"V-94"},{"q":"Los informes de calificación, emitidos por los Agentes de Calificación de Riesgos, no deben ser considerados una publicidad, propaganda, difusión o recomendación para adquirir, vender o negociar valores negociables o del instrumento objeto de calificación.","opts":["Verdadero.","Falso."],"src":"V-95"},{"q":"¿Quiénes están legalmente obligados a inscribirse en el Registro de Proveedores de Servicios de Activos Virtuales (PSAV)?","opts":["Todas las personas humanas residentes y jurídicas constituidas en el país (o extranjeras) que realicen una o más actividades definidas como PSAV en el art. 4° bis de la Ley 25.246.","Las personas humanas o jurídicas que, de manera habitual, presten servicios comprendidos como PSAV y operen en el país, conforme la ley y normativa reglamentaria.","Solo los exchanges que realicen intermediación y custodia para terceros, quedando excluidos quienes solo provean software sin intervenir en operaciones.","Las entidades financieras autorizadas por el BCRA cuando ofrezcan servicios vinculados a activos virtuales."],"src":"V-96"},{"q":"¿El tipo societario por sí mismo impide la inscripción como Proveedor de Servicios de Activos Virtuales?","opts":["No; lo determinante son los requisitos normativos, no el tipo societario.","Sí; sólo las sociedades anónimas y las sucursales de sociedades extranjeras pueden inscribirse.","Sí; las sociedades de responsabilidad limitada no pueden inscribirse por carecer de capital mínimo.","No; lo determinante es la nacionalidad de los socios, no el tipo societario."],"src":"V-97"},{"q":"¿Cuál es el monto del patrimonio neto mínimo exigido a las personas jurídicas que soliciten inscripción como Proveedores de Servicios de Activos Virtuales?","opts":["Depende de la categoría en la que solicite su inscripción.","Es el mismo para todas las categorías sin distinción.","No se exige patrimonio neto mínimo.","Solo se exige a personas humanas."],"src":"V-98"},{"q":"¿Qué actividad puede realizar una persona humana para inscribirse como Proveedores de Servicios de Activos Virtuales, según las Normas CNV?","opts":["Actividades de intercambio entre activos virtuales y moneda de ,"Falso."],"src":"V-128"}],"6":[{"q":"¿Qué es un Fondo Común de Inversión (FCI)?","opts":["Un patrimonio separado administrado por una sociedad gerente.","Es un instrumento de inversión colectiva formado por aportes de un grupo de inversores con los mismos objetivos de inversión.","Es un título de deuda privada que incorpora un derecho de crédito que posee su titular respecto de la empresa emisora.","Es un vehículo de inversión colectiva que puede emitir valores representativos de deuda y certificados de participación."],"src":"VI-1"},{"q":"¿Cuál es una característica esencial de los FCI?","opts":["Permiten diversificación de inversiones.","Permiten al inversor elegir individualmente qué activos comprar.","Tienen baja liquidez.","Garantizan un rendimiento mínimo al inversor."],"src":"VI-2"},{"q":"¿Qué ventaja ofrecen los FCI al inversor minorista?","opts":["Acceso a carteras diversificadas con bajo monto mínimo.","Solo pueden invertir en bonos del Estado.","Requieren un monto mínimo de inversión elevado.","No permiten rescates parciales."],"src":"VI-3"},{"q":"¿Cuál es una desventaja de los FCI?","opts":["Costos de administración.","Falta de liquidez total.","Imposibilidad de diversificar la cartera.","Ausencia de regulación estatal."],"src":"VI-4"},{"q":"¿Qué documento describe las características del FCI?","opts":["Reglamento de gestión.","Prospecto de emisión.","Estatuto social de la sociedad gerente.","Informe de auditoría externa."],"src":"VI-5"},{"q":"¿Qué norma regula los FCI en Argentina?","opts":["Ley 24.083.","Ley 26.831.","Ley 25.246.","Ley 23.576."],"src":"VI-6"},{"q":"¿Cuál es una categoría típica de FCI?","opts":["Fondos de renta fija.","Fondos de derivados exclusivamente.","Fondos de inversión inmobiliaria directa.","Fondos de préstamos personales."],"src":"VI-7"},{"q":"¿Qué significa la suscripción en un FCI?","opts":["Compra de cuotapartes por el inversor.","Venta de cuotapartes por el inversor.","Pago de dividendos al cuotapartista.","Emisión de nuevas cuotapartes por la sociedad gerente."],"src":"VI-8"},{"q":"¿Qué implica el rescate en un FCI?","opts":["Venta de cuotapartes por el inversor.","Compra de cuotapartes adicionales.","Reinversión automática de dividendos.","Transferencia de cuotapartes a un tercero."],"src":"VI-9"},{"q":"¿Qué documento debe contener la política de inversión del FCI?","opts":["Reglamento de gestión.","Estatuto social de la sociedad gerente.","Prospecto de obligaciones negociables.","Informe trimestral de la CNV."],"src":"VI-10"},{"q":"¿Qué organismo fiscaliza los FCI?","opts":["Comisión Nacional de Valores.","Banco Central de la República Argentina.","Superintendencia de Seguros de la Nación.","Inspección General de Justicia."],"src":"VI-11"},{"q":"¿Qué norma regula la publicidad y prospectos de FCI?","opts":["Normas CNV Título V.","Normas CNV Título XII.","Ley 25.246.","Resolución UIF 78/2023."],"src":"VI-12"},{"q":"¿Qué establece la Ley 24.083 sobre el patrimonio del FCI?","opts":["Es un patrimonio separado del de la sociedad gerente.","Forma parte del patrimonio de la sociedad gerente.","Es un patrimonio compartido con la sociedad depositaria.","Se confunde con el patrimonio del custodio."],"src":"VI-13"},{"q":"¿Qué norma regula la custodia de activos del FCI?","opts":["Normas CNV Título V.","Normas CNV Título XII.","Ley 26.831 exclusivamente.","Resolución del BCRA."],"src":"VI-14"},{"q":"¿Qué documento debe aprobar la Comisión Nacional de Valores para autorizar un FCI?","opts":["Reglamento de gestión.","Prospecto de emisión de la sociedad gerente.","Estatuto social de la sociedad depositaria.","Informe de calificación de riesgo."],"src":"VI-15"},{"q":"¿Qué obligación tienen los FCI respecto a la información periódica?","opts":["Publicar balances trimestrales.","Publicar balances anuales únicamente.","Publicar balances semestrales.","Publicar balances mensuales."],"src":"VI-16"},{"q":"¿Qué norma regula las comisiones de administración de FCI?","opts":["Normas CNV Título V.","Normas CNV Título XII.","Ley 26.831.","Resolución del BCRA."],"src":"VI-17"},{"q":"¿Qué ley regula la responsabilidad de la sociedad gerente?","opts":["Ley 24.083.","Ley 26.831.","Código Civil y Comercial exclusivamente.","Ley 25.246."],"src":"VI-18"},{"q":"¿Qué es un fideicomiso financiero?","opts":["Un contrato por el cual se transmiten bienes a un fiduciario para un fin determinado.","Un contrato por el cual un fiduciario administra bienes propios en beneficio de un tercero determinado.","Una sociedad constituida por el fiduciante para emitir valores de deuda con garantía de sus activos.","Un patrimonio común administrado por una sociedad gerente y custodiado por una sociedad depositaria."],"src":"VI-19"},{"q":"¿Qué norma regula los fideicomisos financieros en Argentina?","opts":["Ley 24.441.","Ley 26.831.","Normas CNV Título XII.","Ley 25.246."],"src":"VI-20"},{"q":"¿Cuál es una característica del fideicomiso financiero?","opts":["Tiene patrimonio separado del fiduciario.","Su patrimonio se confunde con el del fiduciario.","No requiere inscripción ante la CNV.","No puede emitir valores fiduciarios."],"src":"VI-21"},{"q":"¿Qué documento regula el funcionamiento del fideicomiso?","opts":["Contrato de fideicomiso.","Reglamento de gestión.","Prospecto de FCI.","Estatuto de la sociedad fiduciaria."],"src":"VI-22"},{"q":"¿Qué organismo fiscaliza los fideicomisos financieros?","opts":["Comisión Nacional de Valores.","Banco Central de la República Argentina.","Superintendencia de Seguros de la Nación.","Inspección General de Justicia."],"src":"VI-23"},{"q":"¿Qué norma establece la obligación de inscripción de fideicomisos financieros?","opts":["Normas CNV Título V.","Normas CNV Título XII.","Ley 25.246.","Resolución del BCRA."],"src":"VI-24"},{"q":"¿Cuál es una diferencia clave entre FCI y fideicomisos financieros?","opts":["El FCI no tiene fiduciario, el fideicomiso sí.","Ambos tienen fiduciario.","Ambos emiten cuotapartes.","No existe diferencia sustancial entre ambos."],"src":"VI-25"},{"q":"¿Qué instrumento suele utilizarse para titulización de activos?","opts":["Fideicomiso financiero.","Fondo común de inversión abierto.","Obligación negociable convertible.","Cheque de pago diferido."],"src":"VI-26"},{"q":"¿Qué riesgo comparten FCI y fideicomisos?","opts":["Riesgo de mercado.","Riesgo de contraparte central.","Riesgo de rescate anticipado.","Riesgo cambiario, por operar en moneda extranjera."],"src":"VI-27"},{"q":"¿Qué ventaja tienen los FCI frente a fideicomisos?","opts":["Mayor transparencia normativa.","Mayor rentabilidad garantizada.","Menor costo de estructuración.","Mayor flexibilidad en la política de inversión."],"src":"VI-28"},{"q":"¿Qué documento es obligatorio tanto en un FCI como en un Fideicomiso?","opts":["Prospecto.","Solo el FCI requiere prospecto.","Solo el fideicomiso requiere prospecto.","Reglamento de Gestión."],"src":"VI-29"},{"q":"¿Qué ley regula aspectos del fideicomiso en el Código Civil y Comercial?","opts":["Ley 26.994.","Ley 26.831.","Ley 24.083.","Ley 25.246."],"src":"VI-30"},{"q":"Es correcto que:","opts":["Los Fondos Comunes de Inversión tienen permitido efectuar operaciones con instrumentos financieros derivados con fines de cobertura o como inversión para administrar más eficazmente la cartera mientras la exposición total a riesgo de mercado no supere el patrimonio neto del fondo.","Los Fondos Comunes de Inversión tienen permitido efectuar operaciones con instrumentos financieros derivados únicamente con fines de cobertura, no como inversión, mientras la exposición total a riesgo de mercado no supere el patrimonio neto del fondo.","Los Fondos Comunes de Inversión tienen permitido efectuar operaciones con instrumentos financieros derivados con fines de cobertura o como inversión, sin límite de exposición, siempre que cuenten con autorización previa de la Comisión Nacional de Valores.","Los Fondos Comunes de Inversión Cerrados tienen permitido efectuar operaciones con instrumentos financieros derivados con fines de cobertura o como inversión; los Fondos Abiertos sólo pueden hacerlo mientras la exposición no supere el 20% del patrimonio neto."],"src":"VI-31"},{"q":"Respecto de los Fondos Comunes de Inversión Abiertos ¿Cuál de las siguientes afirmaciones es correcta?","opts":["Pueden abonar los rescates con valores de cartera en casos excepcionales con previa autorización de la Comisión Nacional de Valores.","No tienen permitido abonar los rescates con valores que integren la cartera de inversiones.","Pueden abonar los rescates con valores en cartera sin tener que informarlo a la CNV.","Pueden abonar los rescates con valores en cartera siempre que el cuotapartista lo solicite expresamente."],"src":"VI-32"},{"q":"¿Cuál de las siguientes afirmaciones respecto de la cartera de un Fondo Común Abierto de Renta Variable destinado al público en general es correcta?","opts":["Puede invertir hasta 100% del patrimonio neto administrado en CEDEAR cuyo activo subyacente este constituido por acciones de compañías chilenas.","Puede invertir hasta 75% del patrimonio neto administrado en CEDEAR cuyo activo subyacente está constituido por acciones de compañías mexicanas.","Puede invertir hasta 100% del patrimonio neto administrado en ADR cuyo activo subyacente está constituido por acciones de compañías argentinas.","Puede invertir hasta 50% del patrimonio neto administrado en CEDEAR cuyo activo subyacente esté constituido por acciones de compañías brasileñas."],"src":"VI-33"},{"q":"¿Cuál de las siguientes afirmaciones respecto de los Fondos Comunes Cerrados es correcta?","opts":["Se pueden adquirir cuotapartes en la colocación primaria y/o en la negociación secundaria.","Solo pueden adquirirse cuotapartes en la suscripción primaria.","Deben contar con una calificación de riesgo.","Las cuotapartes son rescatables en cualquier momento a valor de cuotaparte."],"src":"VI-34"},{"q":"¿Cuál de las siguientes afirmaciones respecto del régimen informativo de los Fondos Comunes de Inversión Abiertos es correcta?","opts":["Deben informar la cantidad de cuotapartes, el valor de cuotaparte y patrimonio neto con periodicidad diaria.","Deben presentar sus Estados Contables con periodicidad trimestral.","Deben informar la nómina de cuotapartistas dentro de los tres días hábiles de finalizado cada mes calendario.","Deben informar la composición de la cartera con periodicidad semestral."],"src":"VI-35"},{"q":"¿En cuál de las siguientes categorías debe estar inscripta una sociedad para intervenir en la colocación de un Fondo Común de Inversión Cerrado?","opts":["Agente de Liquidación y Compensación o Agente de Negociación.","Agente de Colocación y Distribución Integral de FCI.","Agente de Colocación y Distribución Simple de FCI.","Sociedad Depositaria del Fondo."],"src":"VI-36"},{"q":"¿Cuál de estas premisas es correcta respecto de la conformación de la cartera de un Fondo Común de Inversión Abierto destinado al público en general?","opts":["Como máximo puede invertir hasta 20% en Obligaciones Negociables emitidas por la misma emisora.","Como máximo, puede invertir hasta 30% en Títulos Públicos.","Como máximo, puede invertir hasta 10% en Plazos Fijos Precancelables.","Como máximo, puede invertir hasta 5% en Cuotapartes de Fondos Comunes de Dinero."],"src":"VI-37"},{"q":"En un Fondo Común de Inversión Abierto ¿Cuál es el porcentaje máximo de disponibilidades permitido?","opts":["No existe un porcentaje máximo.","Existe un límite establecido en la normativa del 20%.","Existe un límite en la normativa del 50%.","Existe un límite en la normativa del 10%."],"src":"VI-38"},{"q":"De acuerdo con la normativa, ninguna estas carteras cumple con las limitaciones estipuladas para un Fondo Común de Inversión Abierto especializado en Renta Fija:","opts":["40% Obligaciones Negociables, 30% Títulos Públicos, 25% Acciones y 5% Cuotapartes de Fondos Comunes de Inversión; 25% Letras del Tesoro, 20% Cauciones, 20% Certificados de Participación de Fideicomisos Financieros, 15% Acciones, 10% Bonos Corporativos y 10% Disponibilidades.","40% Obligaciones Negociables, 30% Títulos Públicos, 20% Plazos Fijos Precancelables y 10% Disponibilidades; 35% Títulos Públicos, 25% Obligaciones Negociables, 20% Cauciones, 10% Bonos Corporativos y 10% Cuotapartes de Fondos Comunes de Dinero.","50% Títulos Públicos Nacionales, 40% Obligaciones Negociables, 5% Cauciones y 5% Disponibilidades; 45% Letras del Tesoro, 35% Bonos Corporativos, 10% Certificados de Participación de Fideicomisos Financieros y 10% Cauciones.","30% Obligaciones Negociables, 30% Títulos Públicos, 25% Letras del Tesoro, 10% Cauciones y 5% Disponibilidades; 40% Títulos Públicos, 30% Bonos Corporativos, 20% Plazos Fijos Precancelables y 10% Cuotapartes de Fondos Comunes de Dinero."],"src":"VI-39"},{"q":"La Sociedad Gerente NO tiene por obligación informar a la Comisión Nacional de Valores la siguiente información respecto de un Fondo Común de Inversión Abierto:","opts":["Tasa de rendimiento esperada.","Las variaciones diarias del valor de la cuotaparte.","La composición de la cartera del fondo.","Los estados contables del fondo."],"src":"VI-40"},{"q":"En el caso de un Fondo Común de Inversión de Mercado de Dinero, el Margen de Liquidez debe constituirse sobre la porción de activos:","opts":["Que valúen a Devengamiento.","De Renta Variable.","De Renta Fija.","Que valúen a precio de mercado."],"src":"VI-41"},{"q":"Un Fondo Común de Inversión de Mercado de Dinero mantiene en cartera las siguientes inversiones ¿Por cuál de ellas se encuentra excedido?","opts":["25 % en Acciones Emitidas en el país.","10% en Plazos Fijos no precancelables.","10% en Plazos Fijos precancelables.","15% en Cauciones."],"src":"VI-42"},{"q":"En los Fondos Comunes de Inversión Abiertos ASG el plazo mínimo de conformación de la cartera es de:","opts":["180 días corridos.","240 días de corridos.","360 días de corridos.","90 días corridos."],"src":"VI-43"},{"q":"Con qué periodicidad se tienen que presentar ante la Comisión Nacional de Valores los estados contables por los fondos comunes de inversión abiertos:","opts":["Anualmente.","Trimestralmente.","Semestralmente.","Mensualmente."],"src":"VI-44"},{"q":"¿Cuál es el patrimonio neto mínimo para constituir una sociedad gerente con dos fondos comunes de inversión según Normas CNV?","opts":["170.000 UVA.","150.000 UVA.","150.000 dólares.","170.000 dólares."],"src":"VI-45"},{"q":"En un Fondo Común de Inversión PyME hay exigencias mínimas de inversión...","opts":["Sí, como mínimo, 75% del haber del fondo deberá invertirse en valores negociables emitidos por PyMEs y/o valores negociables emitidos por otras entidades cuya emisión tenga como objetivo o finalidad el financiamiento de PyMEs.","El 100% como minimo, del haber del fondo debera invertirse en valores negociables emitidos por entidades cuya emision tenga como objetivo o finalidad el financiamiento por PYMEs y/o valores negociables emitidos por otras.","El 90%, como minimo, del haber del fondo debera invertirse en valores negociables emitidas por objetivo o finalidad el financiamiento de PYMEs.","Sí, como mínimo, 50% del haber del fondo deberá invertirse en valores negociables emitidos por PyMEs, pudiendo el resto invertirse en títulos públicos."],"src":"VI-46"},{"q":"¿Cuál de estas funciones NO se encuentra a cargo de la Sociedad Depositaria de Fondos Comunes de Inversión?","opts":["Confeccionar la contabilidad del Fondo.","Llevar el registro de las cuotapartes y expedir las constancias que soliciten los cuotapartistas.","Desempeñar la guarda y la custodia de valores y demás instrumentos.","Percibir el importe de las suscripciones y pagar los rescates."],"src":"VI-47"},{"q":"¿Cuál de estas funciones NO se encuentra a cargo de la Sociedad Gerente de Fondos Comunes de Inversión?","opts":["Desempeñar la guarda y la custodia de valores y demás instrumentos.","Gestionar el patrimonio del FCI.","La representación colectiva de los Cuotapartistas en sus intereses y respecto de terceros.","Dirigir y administrar el Fondo conforme el Reglamento de Gestión."],"src":"VI-48"},{"q":"¿Cuál de estos cargos no son imputados al resultado del Fondo Común de Inversión?","opts":["Comisión de Suscripción.","Comisión de administración.","Honorarios del auditor externo.","Gastos de custodia de valores."],"src":"VI-49"},{"q":"¿Quiénes gozan del derecho a la distribución de utilidades devengadas del Fondo Común de Inversión?","opts":["Los cuotapartistas.","La Sociedad Gerente.","La Sociedad Depositaria.","Los agentes colocadores."],"src":"VI-50"},{"q":"En un Fondo Común de Inversión Abierto es posible solicitar rescates:","opts":["Totales o parciales.","Una vez al dia.","Sin limite.","Únicamente totales."],"src":"VI-51"},{"q":"En un Fondo Común de Inversión Abierto es posible solicitar un rescate:","opts":["Sin límite.","Hasta el 50% de las cuotapartes que posea.","Solo una vez por trimestre.","Con un máximo de 10.000 cuotapartes por operación."],"src":"VI-52"},{"q":"Indicar el monto de dinero que se obtiene de la operación de rescate de un Fondo Común de Inversión si se rescatan 8.512 cuotapartes el 6 de enero. DATOS: Comisión de rescate: 2,9%. VP 6/1: 10,643. Cantidad CP 6/1: 3.472.614. PN 6/1: $36.959.031:","opts":["$87.966 (aprox.).","$90.590 (aprox.).","$85.429 (aprox.).","$88.012 (aprox.)."],"src":"VI-53"},{"q":"Las operaciones de rescate de Fondos Comunes de Inversión Abiertos no podrán abonarse en ningún caso con valores integrantes de la cartera:","opts":["Falso.","Verdadero."],"src":"VI-54"},{"q":"Un Fondo Común de Inversión es considerado:","opts":["Un patrimonio indiviso.","Una persona jurídica con personalidad propia.","Una sociedad anónima regulada por la Ley 19.550.","Un patrimonio divisible entre la gerente y la depositaria."],"src":"VI-55"},{"q":"Un Fondo Común de Inversión:","opts":["Es un instrumento de inversión colectiva formado por aportes de un grupo de inversores con los mismos objetivos de inversión.","Es una sociedad anónima cuyo capital se divide en cuotapartes suscriptas por inversores con los mismos objetivos de inversión.","Es un contrato de fideicomiso por el cual una sociedad gerente administra los aportes de un grupo de inversores.","Es un patrimonio de titularidad de la sociedad depositaria, formado por aportes de inversores que delegan su administración."],"src":"VI-56"},{"q":"Para la contabilización de las operaciones efectuadas por los Fondos Comunes de Inversión Abiertos será obligatorio el uso del Plan y el Manual de Cuentas de Fondos Comunes de Inversión dispuesto por Normas CNV.","opts":["Verdadero.","Falso."],"src":"VI-57"},{"q":"Para la valuación del Patrimonio Neto de un Fondo Común de Inversión Abierto deberán utilizarse los criterios de valuación previstos en las Normas CNV.","opts":["Verdadero.","Falso."],"src":"VI-58"},{"q":"El valor de la cuotaparte deberá estar expresado con al menos….","opts":["Tres decimales.","Dos decimales.","Cuatro decimales.","Sin decimales."],"src":"VI-59"},{"q":"¿Cuál de las siguientes afirmaciones es correcta para un Fondo Común de Inversión Cerrado?","opts":["Deberá contar con Reglamento de Gestión y Prospecto de Emisión.","Una cámara compensadora opera como contraparte central.","Se negocian en un mercado secundario activo.","Las cuotapartes son rescatables a solicitud del cuotapartista."],"src":"VI-60"},{"q":"Es correcto que:","opts":["A partir de los 13 años, las personas menores de edad, pueden cursar órdenes para suscribir Fondos Comunes de Inversión Abiertos de “Mercado de Dinero.","A partir de los 16 años, las personas menores de edad, pueden cursar órdenes para suscribir Fondos Comunes de Inversión Abiertos de cualquier tipo.","A partir de los 13 años, las personas menores de edad, pueden cursar órdenes para suscribir Fondos Comunes de Inversión Abiertos de Renta Variable.","Las personas menores de edad no pueden cursar órdenes para suscribir Fondos Comunes de Inversión hasta cumplir los 18 años, cualquiera sea el tipo de fondo."],"src":"VI-61"},
