iones frecuentes","valor":"7 fideicomisos emitidos en total, 3 en los últimos 12 meses; mismo programa, fiduciario, fiduciante y similar activo subyacente","fuente":"RG CNV 1063/2025 y 1074/2025"},{"concepto":"Umbral de inversor calificado persona humana","valor":"Inversiones superiores a 350.000 UVA, o idóneo inscripto en CNV, o no residente","fuente":"Normas CNV Tít. II Cap. VI Secc. I art. 12"}],"trampas":["Gerente vs depositaria: la gerente administra, decide inversiones, lleva la contabilidad y calcula el valor de cuotaparte; la depositaria custodia, cobra suscripciones, paga rescates y lleva el registro. Las preguntas vienen en negativo (cuál función NO corresponde): confeccionar la contabilidad NO es de la depositaria; custodiar NO es de la gerente.","Ley 24.083 vs Normas CNV Título V: la figura básica, el patrimonio separado y la responsabilidad de la gerente van por la ley; publicidad, prospectos, custodia, comisiones e inscripción van por las Normas CNV. Si la opción dice Ley 26.831 o BCRA para FCI, descartala.","Ley 24.441 vs Ley 26.994: ante la pregunta qué norma regula los fideicomisos financieros, la guía responde Ley 24.441; ante qué ley regula el fideicomiso en el Código Civil y Comercial, responde Ley 26.994. No mezclar: 24.083 es FCI, 24.441 es fideicomiso.","FCI vs fideicomiso financiero: la diferencia clave es que el FCI no tiene fiduciario. Comparten riesgo de mercado y prospecto obligatorio; el FCI tiene mayor transparencia normativa; el fideicomiso es el vehículo típico de titulización.","Abierto vs cerrado: en el abierto se rescata contra el fondo en cualquier momento, sin límite y total o parcialmente; en el cerrado se compra en colocación primaria o en el secundario y se sale vendiendo en el mercado. El cerrado exige reglamento más prospecto y lo colocan ALyC o AN.","Pago en especie: es FALSO que los rescates nunca puedan pagarse con valores de cartera; se admite en casos excepcionales con autorización previa de la CNV.","Comisión de suscripción vs honorarios: la comisión de suscripción la paga el inversor y no se imputa al resultado del fondo; honorarios de gerente y depositaria y gastos ordinarios sí se imputan.","Trimestral vs anual en FCI: balances trimestrales se publican como información periódica; los estados contables se presentan ante la CNV anualmente. Y la información de cuotapartes, valor y patrimonio es diaria.","Porcentajes de fondos abiertos: 20% por emisora, 30% por especie de título público, 2% en controlante de gerente o depositaria, 75% mínimo local, 5% en fondos de dinero de otra gerente. Disponibilidades: sin tope. Un CEDEAR de acción chilena es activo local: puede ser hasta el 100%.","Fondos cerrados dentro de la cartera de un abierto: 10% regla general (ASG, infraestructura), 5% PyME, 25% inversores calificados, 0% si el cerrado es de la propia gerente. El examen pregunta cada caso por separado.","Clásico vs dinámico en fondos de dinero: el clásico tiene tope de 20% en títulos de deuda a un año y el dinámico 100%; por eso el clásico es MENOS volátil. La afirmación de que el clásico es más volátil es falsa.","Margen de liquidez y pruebas de resistencia: ambos son propios de los fondos de mercado de dinero; el margen se constituye sobre los activos valuados a devengamiento, no sobre toda la cartera.","Fiduciante, beneficiario y fideicomisario: el fideicomisario recibe lo que queda al final y puede ser el fiduciante, el beneficiario o un tercero. En fideicomisos con activos líquidos (fondos de inversión directa) el inversor es fiduciante-beneficiario, no beneficiario-fideicomisario.","VDF vs CP: los valores de deuda fiduciaria los pueden emitir fiduciario, fiduciante o un tercero y cobran primero (el senior es la opción para el averso al riesgo); los certificados de participación solo los emite el fiduciario y cobran último.","Delegación en el fideicomiso: administración y cobranza pueden delegarse (depósito en 3 días hábiles), pero el reclamo por incumplimiento se hace ante el fiduciario, que sigue siendo responsable. La custodia de documentos solo se delega en el fiduciante si es entidad financiera: una empresa comercial no puede ser agente de custodia.","Unanimidad vs tres cuartos: modificar una condición esencial de la emisión requiere unanimidad; decidir ante insuficiencia del patrimonio requiere 3/4 de los valores en circulación. No confundir con la mayoría absoluta de las asambleas ordinarias.","Plazos del fideicomiso: 42 días corridos (EECC trimestrales del fiduciario), 20 días hábiles (informe mensual de control y revisión), 5 años (matrícula del contador y reapertura de colocación inmobiliaria), 3 ejercicios (descripción del fiduciante), 3 días hábiles (depósito de cobranzas). Prestá atención a si dice corridos o hábiles.","Fondos de inversión directa: los EECC trimestrales son obligatorios (es incorrecto decir que son opcionales) y el PIPE se actualiza anualmente; los fiduciantes de un programa global exclusivo de FID pueden no estar identificados si el objeto está delimitado.","Autorización automática: 1.000.000 UVA es bajo impacto (por fiduciante en 12 meses), 7.000.000 UVA es mediano impacto, y 7 fideicomisos en total con 3 en los últimos 12 meses es emisiones frecuentes. Las características idénticas son programa, fiduciario, fiduciante y activo subyacente similar, no el monto ni el plazo."],"formulas":[{"nombre":"Valor de cuotaparte","formula":"VCP = Patrimonio neto del fondo / Cantidad de cuotapartes en circulación (expresado con al menos tres decimales)","ejemplo":"PN $36.959.031 y 3.472.614 cuotapartes: VCP = 36.959.031 / 3.472.614 = 10,643."},{"nombre":"Importe de un rescate con comisión","formula":"Rescate neto = Cantidad de cuotapartes rescatadas x VCP del día x (1 - comisión de rescate)","ejemplo":"8.512 cuotapartes x 10,643 = $90.593,22 bruto; comisión 2,9% = $2.627,20; neto = 90.593,22 x 0,971 = $87.966 aproximadamente."},{"nombre":"Cuotapartes obtenidas en una suscripción","formula":"Cuotapartes = Monto suscripto x (1 - comisión de suscripción) / VCP del día","ejemplo":"Suscripción de $100.000 sin comisión con VCP 10,643: 100.000 / 10,643 = 9.395,847 cuotapartes."},{"nombre":"Rendimiento del fondo entre dos fechas","formula":"Rendimiento = (VCP final / VCP inicial) - 1","ejemplo":"VCP pasa de 10,000 a 10,643: rendimiento = 10,643 / 10,000 - 1 = 6,43%."}]}};

const KEY = "idoneo-cnv-v1";
let S = {stats:{}, errors:[], sims:[]};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
function record(id, ok){
  const s = S.stats[id] || (S.stats[id] = {ok:0,bad:0,last:null});
  ok ? s.ok++ : s.bad++; s.last = ok;
  const i = S.errors.indexOf(id);
  if (!ok && i < 0) S.errors.push(id);
  if (ok && i >= 0) S.errors.splice(i,1);
}
function modStats(n){
  const qs = BANK[n]; let known=0, wrong=0;
  for (const q of qs){ const s=S.stats[q.src]; if (!s) continue; if (s.last) known++; else wrong++; }
  return {total:qs.length, known, wrong, seen:known+wrong};
}

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = (arr,n) => shuffle(arr).slice(0,n);
const pct = (a,b) => b ? Math.round(a*100/b) : 0;
const LET = "ABCDE";
const fmtT = s => { s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };
const modName = n => MODS[n-1];

/* ---------- router ---------- */
let view = "home", studyMod = 1, timerId = null, Q = null;
function go(v, opts){
  if (Q && Q.mode==="sim" && !Q.done && v!=="sim-run" && view==="sim-run"){
    if (!Q.leaveOk){ Q.leaveOk = true; flash("Hay un simulacro en curso. Tocá de nuevo para salir (se pierde)."); return; }
    stopTimer(); Q = null;
  }
  view = v; Object.assign(window, {_opts:opts||{}});
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-current", String(b.dataset.v===v.split("-")[0])));
  render(); window.scrollTo(0,0);
}
document.getElementById("tabs").addEventListener("click", e => { const b=e.target.closest("button"); if(b) go(b.dataset.v); });
function flash(msg){
  let el = document.getElementById("flash");
  if (!el){ el=document.createElement("div"); el.id="flash"; el.setAttribute("role","status");
    el.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)"; document.body.appendChild(el); }
  el.textContent=msg; el.hidden=false; clearTimeout(el._t); el._t=setTimeout(()=>el.hidden=true,3200);
}
function render(){
  const app = $("#app");
  const V = {home, study, cards, practice, sim, errors, exam, "sim-run":quizView, "practice-run":quizView, "errors-run":quizView, result};
  app.innerHTML = (V[view]||home)() + footer();
  after[view] && after[view]();
}
const after = {};
function footer(){ return `<footer>Herramienta de estudio independiente: no es material oficial ni está avalada por la CNV. Banco de ${ALL.length} preguntas con enunciados y respuestas de la Guía de Estudio oficial (v5) de la CNV; opciones incorrectas tomadas del proyecto abierto “simulador-idoneidad-cnv” (licencia MIT). Tu progreso se guarda solo en este navegador.</footer>`; }

/* ---------- FLASHCARDS + buscador ---------- */
let cardMod = 1, cardDeck = null, cardIdx = 0, cardShow = false, cardOnlyNew = false, searchQ = "";
function setCardMod(n){ cardMod=n; cardDeck=null; render(); }
function buildDeck(){
  let qs = BANK[cardMod];
  if (cardOnlyNew) qs = qs.filter(q=>!(S.stats[q.src]&&S.stats[q.src].last));
  cardDeck = shuffle(qs).map(q=>q.src); cardIdx=0; cardShow=false;
}
function cards(){
  if (!cardDeck) buildDeck();
  const q = BYID[cardDeck[cardIdx]];
  return `<div class="stack" style="gap:20px">
   <div class="stack" style="gap:10px">${modPicker(cardMod,"setCardMod")}
    <h1>Fichas · Módulo ${modName(cardMod).r}</h1>
    <p class="muted" style="margin:0">Leé la pregunta, respondé mentalmente y tocá la ficha para ver la respuesta de la guía oficial.</p>
    <label class="check"><input type="checkbox" id="onlynew" ${cardOnlyNew?"checked":""} onchange="cardOnlyNew=this.checked;cardDeck=null;render()"> Solo las que todavía no domino</label>
   </div>
   ${q? `<div class="card" id="fcard" tabindex="0" role="button" aria-label="Mostrar respuesta" onclick="cardShow=true;render()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();cardShow=true;render()}">
     <div class="row" style="justify-content:space-between"><span class="chip">${esc(q.src)}</span><span class="muted num" style="font-size:12px">${cardIdx+1} / ${cardDeck.length}</span></div>
     <p class="question">${esc(q.q)}</p>
     ${cardShow?`<div class="ans">${esc(q.opts[0])}</div>`:`<span class="muted" style="font-size:13px">Tocá para ver la respuesta</span>`}
   </div>
   <div class="row">${cardShow?`<button class="btn" onclick="cardMark(false)">No la sabía</button><button class="btn primary" onclick="cardMark(true)">La sabía</button>`:`<button class="btn primary" onclick="cardShow=true;render()">Ver respuesta</button>`}<button class="btn ghost" onclick="cardNext()">Saltar</button></div>`
   : `<div class="panel"><p style="margin:0">¡No quedan fichas pendientes en este módulo! Desmarcá el filtro para repasar todas.</p></div>`}
   <div class="panel stack" style="gap:10px">
    <h3>Buscar en el banco de preguntas</h3>
    <input type="search" id="bsearch" placeholder="Ej.: OPA, ROS, caución, cuotaparte, 10 días hábiles" value="${esc(searchQ)}">
    <div class="hits" id="hits"></div>
   </div></div>`;
}
after.cards = () => { const i=$("#bsearch"); i.addEventListener("input",()=>{searchQ=i.value;doSearch();}); doSearch(); };
function norm(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase(); }
function doSearch(){
  const box=$("#hits"); const t=norm(searchQ.trim());
  if (t.length<3){ box.innerHTML=`<span class="muted" style="font-size:13px">Escribí al menos 3 letras para buscar en las ${ALL.length} preguntas y respuestas.</span>`; return; }
  const res = ALL.filter(q=>norm(q.q+" "+q.opts[0]).includes(t)).slice(0,40);
  const hl = s => { const e=esc(s); const n=norm(e); const i=n.indexOf(t); return i<0?e:e.slice(0,i)+"<mark>"+e.slice(i,i+t.length)+"</mark>"+e.slice(i+t.length); };
  box.innerHTML = res.length? res.map(q=>`<div class="hit"><span class="muted num" style="font-size:12px">${q.src}</span><span>${hl(q.q)}</span><b>${hl(q.opts[0])}</b></div>`).join("") : `<span class="muted">Sin resultados.</span>`;
}
function cardMark(ok){ record(cardDeck[cardIdx], ok); save(); cardNext(); }
function cardNext(){ cardIdx++; cardShow=false; if (cardIdx>=cardDeck.length) buildDeck(); render(); }

/* ---------- PRACTICE ---------- */
function practice(){
  return `<div class="stack" style="gap:20px">
   <h1>Práctica por módulo</h1>
   <p class="muted" style="margin:0;max-width:64ch">Respondés y ves al instante si acertaste y cuál es la respuesta correcta. Las que errás pasan a “Mis errores”.</p>
   <div class="mods">${MODS.map(m=>{const s=modStats(m.n);return `<div class="mod"><div class="head"><span class="chip">M${m.n}</span><h3>${esc(m.t)}</h3></div>
    <div class="bar"><i class="k" style="width:${pct(s.known,s.total)}%"></i><i class="w" style="width:${pct(s.wrong,s.total)}%"></i></div>
    <div class="row" style="gap:6px;margin-top:auto"><button class="btn" onclick="startPractice(${m.n},10)">10</button><button class="btn" onclick="startPractice(${m.n},25)">25</button><button class="btn" onclick="startPractice(${m.n},'new')">No vistas</button><button class="btn" onclick="startPractice(${m.n},'all')">Todas (${s.total})</button></div></div>`}).join("")}</div>
   <div class="panel row" style="justify-content:space-between"><div><h3>Mezcla de todos los módulos</h3><span class="muted" style="font-size:13px">20 preguntas al azar del banco completo</span></div><button class="btn primary" onclick="startPractice(0,20)">Practicar 20</button></div>
  </div>`;
}
function mkItems(qs){ return qs.map(q=>({id:q.src, order:shuffle(q.opts.map((_,i)=>i)), sel:null, flag:false})); }
function startPractice(mod, n){
  let pool = mod ? BANK[mod] : ALL;
  if (n==="new"){ pool = pool.filter(q=>!S.stats[q.src]); n = pool.length; if(!n){ flash("Ya viste todas las preguntas de este módulo."); return; } }
  if (n==="all") n = pool.length;
  Q = {mode:"practice", title: mod?`Práctica · Módulo ${modName(mod).r}`:"Práctica · todos los módulos", items:mkItems(pick(pool,n)), i:0, immediate:true};
  go("practice-run");
}

/* ---------- ERRORS ---------- */

  return `<div class="stack" style="gap:20px"><h1>Mis errores</h1>
   <p class="muted" style="margin:0;max-width:64ch">Cada pregunta que respondés mal queda acá hasta que la aciertes. Es la forma más rápida de subir el puntaje.</p>
   ${ids.length? `<div class="panel stack" style="gap:12px"><div class="score"><span class="big num">${ids.length}</span><span class="muted">preguntas pendientes de corregir</span></div>
     <div class="modbars">${by.map(x=>`<div class="modbar"><span class="chip">M${x.m.n}</span><div class="bar"><i class="w" style="width:${pct(x.c,Math.max(...by.map(y=>y.c)))}%"></i></div><span class="num">${x.c}</span></div>`).join("")}</div>
     <div class="row"><button class="btn primary" onclick="startErrors(0)">Repasar todos (${Math.min(ids.length,30)})</button>${by.filter(x=>x.c).map(x=>`<button class="btn" onclick="startErrors(${x.m.n})">M${x.m.n}</button>`).join("")}</div></div>
     <div class="review">${ids.slice(0,60).map(id=>{const q=BYID[id];return `<div class="rev"><span class="muted num" style="font-size:12px">${id}</span><span>${esc(q.q)}</span><span class="corr">${esc(q.opts[0])}</span></div>`}).join("")}</div>`
   : `<div class="panel"><p style="margin:0">No tenés errores pendientes. Practicá un módulo o rendí un simulacro y los que falles van a aparecer acá.</p></div>`}

}
function startErrors(mod){
  let ids = S.errors.filter(id=>BYID[id] && (!mod || BYID[id].mod===mod));
  Q = {mode:"errors", title:"Repaso de errores", items:mkItems(pick(ids.map(id=>BYID[id]),30)), i:0, immediate:true};
  go("errors-run");
}

/* ---------- SIM ---------- */
let partialMods = [1,2,3];
function sim(){
  return `<div class="stack" style="gap:20px"><h1>Simulacro</h1>
   <p class="muted" style="margin:0;max-width:64ch">Mismo formato que el examen de la CNV: preguntas al azar, reloj corriendo y corrección al final. Podés moverte entre preguntas y marcarlas para revisar.</p>
   <div class="facts">
    <div class="panel stack" style="gap:12px"><h3>Examen total</h3><dl><dt>Preguntas</dt><dd class="num">60 (10 por módulo)</dd><dt>Tiempo</dt><dd class="num">45 minutos</dd><dt>Aprobación</dt><dd class="num">42 correctas (70%)</dd></dl><button class="btn primary" onclick="startSim('total')">Empezar simulacro total</button></div>
    <div class="panel stack" style="gap:12px"><h3>Examen parcial</h3><dl><dt>Preguntas</dt><dd class="num">30</dd><dt>Tiempo</dt><dd class="num">23 minutos</dd><dt>Aprobación</dt><dd class="num">21 correctas (70%)</dd></dl>
     <div class="row" style="gap:12px">${MODS.map(m=>`<label class="check"><input type="checkbox" id="pm${m.n}" ${partialMods.includes(m.n)?"checked":""} onchange="togglePM(${m.n},this.checked)"> M${m.n}</label>`).join("")}</div>
     <button class="btn" onclick="startSim('parcial')">Empezar simulacro parcial</button></div>
   </div>
   <div class="panel"><label class="check"><input type="checkbox" id="practicemode" onchange="simImmediate=this.checked" ${simImmediate?"checked":""}> Mostrar la respuesta correcta después de cada pregunta (modo entrenamiento, no cuenta como examen real)</label></div>
  </div>`;
}
let simImmediate = false;
function togglePM(n,on){ partialMods = on? [...new Set([...partialMods,n])].sort() : partialMods.filter(x=>x!==n); }
function startSim(type){
  let qs = [];
  if (type==="total") for (const m of MODS) qs.push(...pick(BANK[m.n],10));
  else {
    if (!partialMods.length){ flash("Elegí al menos un módulo para el parcial."); return; }
    const per = Math.floor(30/partialMods.length); let rest = 30 - per*partialMods.length;
    for (const n of partialMods){ qs.push(...pick(BANK[n], per + (rest-- > 0 ? 1 : 0))); }
  }
  const mins = type==="total"?45:23;
  Q = {mode:"sim", type, title: type==="total"?"Simulacro total":"Simulacro parcial (M"+partialMods.join(", M")+")", items:mkItems(qs), i:0, immediate:simImmediate, start:Date.now(), deadline:Date.now()+mins*60000, mins};
  go("sim-run");
  startTimer();
}
function startTimer(){ stopTimer(); timerId = setInterval(()=>{ const el=$("#timer"); if(!Q||Q.done){stopTimer();return;} const left=(Q.deadline-Date.now())/1000; if(el){el.textContent=fmtT(left); el.classList.toggle("low", left<300);} if(left<=0){ stopTimer(); flash("Se terminó el tiempo."); finish(); } },500); }
function stopTimer(){ if (timerId) clearInterval(timerId); timerId=null; }

/* ---------- QUIZ VIEW ---------- */
function quizView(){
  if (!Q) return home();
  const it = Q.items[Q.i]; const q = BYID[it.id]; const n = Q.items.length;
  const answered = it.sel!==null; const reveal = Q.immediate && answered;
  const isSim = Q.mode==="sim";
  const opts = it.order.map((oi,k)=>{
    let cls="opt";
    if (reveal){ if (oi===0) cls+=" right"; else if (oi===it.sel) cls+=" wrong"; }
    else if (it.sel===oi) cls+=" sel";
    return `<button class="${cls}" ${reveal?"disabled":""} onclick="answer(${oi})"><span class="l">${LET[k]}</span><span>${esc(q.opts[oi])}</span></button>`;
  }).join("");
  const nAns = Q.items.filter(x=>x.sel!==null).length;
  return `<div class="stack" style="gap:18px">
   <div class="qhead"><div><div class="eyebrow">${esc(Q.title)}</div><div class="num" style="font-size:14px">Pregunta ${Q.i+1} de ${n} · <span class="chip">M${q.mod}</span></div></div>
    ${isSim?`<div class="row"><span class="timer" id="timer">${fmtT((Q.deadline-Date.now())/1000)}</span></div>`:`<span class="muted num" style="font-size:13px">${Q.items.filter(x=>x.sel===0).length} bien · ${Q.items.filter(x=>x.sel!==null&&x.sel!==0).length} mal</span>`}</div>
   <div class="progress"><i style="width:${pct(isSim?nAns:Q.i+(answered?1:0),n)}%"></i></div>
   <p class="question">${esc(q.q)}</p>
   <div class="opts">${opts}</div>
   ${reveal? (it.sel===0?`<div class="feedback ok">Correcto.</div>`:`<div class="feedback bad">Incorrecto. La respuesta de la guía es: ${esc(q.opts[0])}</div>`):""}
   <div class="row" style="justify-content:space-between">
    <div class="row">${Q.i>0?`<button class="btn" onclick="move(-1)">← Anterior</button>`:""}${isSim?`<button class="btn ghost" onclick="toggleFlag()">${it.flag?"Quitar marca":"Marcar para revisar"}</button>`:""}</div>
    <div class="row">${Q.i<n-1?`<button class="btn ${answered?"primary":""}" onclick="move(1)">Siguiente →</button>`:""}${(Q.i===n-1||isSim)?`<button class="btn ${Q.i===n-1?"primary":""}" onclick="confirmFinish()">${isSim?"Entregar examen":"Ver resultado"}</button>`:""}</div>
   </div>
   ${isSim?`<div class="panel stack" style="gap:8px"><div class="row" style="justify-content:space-between"><span class="eyebrow">Navegación</span><span class="muted num" style="font-size:12px">${nAns}/${n} respondidas</span></div><div class="grid-nav">${Q.items.map((x,k)=>`<button class="${x.sel!==null?"ans":""} ${x.flag?"flag":""} ${k===Q.i?"cur":""}" onclick="jump(${k})" aria-label="Pregunta ${k+1}">${k+1}</button>`).join("")}</div></div>`:""}
   <div id="confirmbox"></div>
  </div>`;
}
function answer(oi){
  const it = Q.items[Q.i]; if (Q.immediate && it.sel!==null) return;
  it.sel = oi;
  if (Q.immediate){ record(it.id, oi===0); save(); }
  render();
  if (!Q.immediate && Q.mode==="sim" && Q.i<Q.items.length-1) setTimeout(()=>{ if(Q && Q.items[Q.i]===it){ Q.i++; render(); } }, 220);
}
function move(d){ Q.i=Math.min(Q.items.length-1,Math.max(0,Q.i+d)); render(); }
function jump(k){ Q.i=k; render(); }
function toggleFlag(){ Q.items[Q.i].flag=!Q.items[Q.i].flag; render(); }
function confirmFinish(){
  const blank = Q.items.filter(x=>x.sel===null).length;
  if (Q.mode==="sim" && blank){
    $("#confirmbox").innerHTML = `<div class="panel stack" style="gap:10px;border-color:var(--warn)"><b>Te quedan ${blank} preguntas sin responder.</b><span class="muted">Las preguntas en blanco cuentan como incorrectas.</span><div class="row"><button class="btn primary" onclick="finish()">Entregar igual</button><button class="btn" onclick="$('#confirmbox').innerHTML=''">Seguir respondiendo</button></div></div>`;
    $("#confirmbox").scrollIntoView({behavior:"smooth"}); return;
  }
  finish();
}
function finish(){
  stopTimer(); Q.done = true;
  if (!Q.immediate) for (const it of Q.items) record(it.id, it.sel===0);
  const score = Q.items.filter(x=>x.sel===0).length;
  Q.score = score; Q.secs = Q.start? (Date.now()-Q.start)/1000 : 0;
  if (Q.mode==="sim" && !Q.immediate) S.sims.push({date:Date.now(), type:Q.type, score, total:Q.items.length, secs:Math.min(Q.secs,Q.mins*60)});
  save(); view="result"; render(); window.scrollTo(0,0);
}

/* ---------- RESULT ---------- */
function result(){
  if (!Q) return home();
  const n=Q.items.length, sc=Q.score, ok = sc/n>=.7, need=Math.ceil(n*.7);
  const by = MODS.map(m=>{const its=Q.items.filter(x=>BYID[x.id].mod===m.n);return {m,t:its.length,k:its.filter(x=>x.sel===0).length};}).filter(x=>x.t);
  const wrong = Q.items.filter(x=>x.sel!==0);
  const again = Q.mode==="sim"?`startSim('${Q.type}')`:Q.mode==="errors"?"startErrors(0)":"go('practice')";
  return `<div class="stack" style="gap:22px">
   <div class="eyebrow">${esc(Q.title)} · resultado</div>
   <div class="panel score"><span class="big">${sc}/${n}</span><div class="stack" style="gap:6px"><span class="pill ${ok?'ok':'bad'}">${ok?'Aprobado':'No aprobado'} · ${pct(sc,n)}%</span><span class="muted" style="font-size:13px">Se necesitan ${need} correctas.${Q.mode==="sim"?` Tiempo usado: ${fmtT(Math.min(Q.secs,Q.mins*60))} de ${Q.mins}:00.`:""}${Q.mode==="sim"&&Q.immediate?" Modo entrenamiento: no se guarda en el historial.":""}</span></div></div>
   <div class="panel stack" style="gap:10px"><h3>Por módulo</h3><div class="modbars">${by.map(x=>`<div class="modbar"><span class="chip">M${x.m.n}</span><div class="bar"><i class="k" style="width:${pct(x.k,x.t)}%"></i><i class="w" style="width:${pct(x.t-x.k,x.t)}%"></i></div><span class="num">${x.k}/${x.t}</span></div>`).join("")}</div>
    ${by.filter(x=>x.k/x.t<.7).length?`<p class="muted" style="margin:0;font-size:13px">Reforzá: ${by.filter(x=>x.k/x.t<.7).map(x=>`<a href="#" onclick="event.preventDefault();studyMod=${x.m.n};go('study')">apunte del M${x.m.n}</a>`).join(", ")}.</p>`:""}</div>
   <div class="row"><button class="btn primary" onclick="${again}">Hacer otro</button><button class="btn" onclick="go('errors')">Ir a mis errores</button><button class="btn ghost" onclick="go('home')">Volver al inicio</button></div>
   ${wrong.length?`<div class="stack" style="gap:10px"><h2>Revisión de las ${wrong.length} que fallaste</h2><div class="review">${wrong.map(it=>{const q=BYID[it.id];return `<div class="rev"><span class="muted num" style="font-size:12px">${it.id} · M${q.mod}</span><span>${esc(q.q)}</span>${it.sel===null?`<span class="yours">Sin responder</span>`:`<span class="yours">Tu respuesta: ${esc(q.opts[it.sel])}</span>`}<span class="corr">Correcta: ${esc(q.opts[0])}</span></div>`}).join("")}</div></div>`:`<div class="panel"><p style="margin:0">Sin errores. Excelente.</p></div>`}
  </div>`;
}

    <tr><td><span class="chip">M6</span></td><td>Productos de inversión colectiva. Fondos comunes de inversión. Fideicomisos financieros.</td><td class="num">${BANK[6].length}</td></tr>

  </div>`;
}
function resetAll(){ S={stats:{},errors:[],sims:[]}; save(); flash("Progreso borrado."); go("home"); }

document.addEventListener("keydown", e => {
  if (!Q || !view.endsWith("-run") || e.target.matches("input,textarea")) return;
  const k = e.key.toUpperCase(); const idx = "ABCD1234".indexOf(k);
  if (idx>=0){ const it=Q.items[Q.i]; const j=idx%4; if (j<it.order.length) answer(it.order[j]); }
  else if (e.key==="ArrowRight") move(1); else if (e.key==="ArrowLeft") move(-1);
});
go("home");
</script>
