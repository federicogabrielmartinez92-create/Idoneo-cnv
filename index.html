"opts":["10 días hábiles.","5 días hábiles.","30 días corridos.","20 días hábiles."],"src":"III-19"},{"q":"¿Qué norma establece la obligación de designar un Responsable de Relaciones con el Público Inversor?","opts":["Normas CNV Título XII.","Ley 26.831 de Mercado de Capitales.","Resolución UIF 78/2023.","Ley 19.550 de Sociedades Comerciales."],"src":"III-20"},{"q":"¿Qué oficina atiende consultas y reclamos de inversores?","opts":["Oficina de Atención al Inversor.","Tribunal Arbitral.","Defensoría del Pueblo.","Ministerio de Economía."],"src":"III-21"},{"q":"¿Qué norma regula la obligación de publicar hechos relevantes?","opts":["Normas CNV Título IV.","Normas CNV Título XII.","Normas CNV Título XVI.","Ley 19.550."],"src":"III-22"},{"q":"¿Qué plazo tiene la emisora para informar un hecho relevante?","opts":["24 horas.","48 horas.","10 días hábiles.","5 días hábiles."],"src":"III-23"},{"q":"¿Qué norma establece el deber de informar conflictos de interés?","opts":["Ley General de Sociedades, art. 272.","Ley 26.831, art. 72.","Normas CNV, Título XII, art. 1.","Ley 19.550, art. 59."],"src":"III-24"},{"q":"¿Qué norma regula las conductas contrarias a la transparencia?","opts":["Normas CNV Título XII.","Normas CNV Título IV.","Normas CNV Título XVI.","Ley 25.246."],"src":"III-25"},{"q":"¿Qué norma establece el procedimiento aplicable ante incumplimiento?","opts":["Normas CNV Título XVI.","Normas CNV Título XII.","Normas CNV Título IV.","Ley 19.550."],"src":"III-26"},{"q":"¿Qué obligación tienen los emisores respecto a inversores institucionales?","opts":["Proporcionar información completa y veraz.","Garantizar un retorno mínimo sobre sus inversiones.","Otorgarles prioridad en la suscripción de nuevas emisiones.","Informarles exclusivamente mediante comunicación privada."],"src":"III-27"},{"q":"¿Qué norma regula la recepción y tratamiento de denuncias?","opts":["Normas CNV Título XIII.","Normas CNV Título XII.","Normas CNV Título IV.","Ley 26.831 exclusivamente."],"src":"III-28"},{"q":"¿Qué norma establece obligaciones con los clientes y empleadores?","opts":["Normas CNV Título XII.","Normas CNV Título XVI.","Normas CNV Título IV.","Ley 25.246."],"src":"III-29"},{"q":"¿Qué norma regula la Oficina de Atención al Inversor?","opts":["Normas CNV Título XIII.","Normas CNV Título XII.","Normas CNV Título XVI.","Ley 26.831 exclusivamente."],"src":"III-30"},{"q":"¿Qué “conductas son contrarias a la transparencia”?","opts":["El abuso de información privilegiada, manipulación y engaño en el mercado.","Incumplir el deber de informar hechos relevantes.","La publicidad engañosa, el incumplimiento del deber de reserva y la falta de registro ante la Comisión Nacional de Valores.","La manipulación de precios, el asesoramiento sin registro y la omisión de actualizar el perfil de riesgo del cliente."],"src":"III-31"},{"q":"A los efectos de la determinación de la sanción de aquellas conductas encuadradas como “abuso de información privilegiada” o “manipulación o engaño”, la Comisión Nacional de Valores considerará como agravante si la conducta irregular fue realizada, entre otros, por:","opts":["El accionista de Control.","El directorio de la emisora.","El auditor externo independiente.","La CNV como autoridad de aplicación."],"src":"III-32"},{"q":"A los efectos de la determinación de la sanción referida al abuso de información privilegiada y manipulación y engaño, la Comisión Nacional de Valores considerará como agravante si la conducta sancionada fuere realizada por:","opts":["Administradores, gerentes, síndicos de las personas sujetas a fiscalización de la Comisión Nacional de Valores.","Inversores calificados y accionistas minoritarios que hubieran actuado por cuenta de terceros.","Agentes registrados ante la Comisión Nacional de Valores en cualquiera de sus categorías, con exclusión de los administradores de las emisoras.","Funcionarios públicos y empleados de los organismos de control, siempre que hubieran obtenido un beneficio económico directo."],"src":"III-33"},{"q":"Ante el requerimiento de comparecencia de un investigado (no abogado) por ante la Comisión Nacional de Valores:","opts":["Podrá decidir concurrir con o sin asistencia letrada.","Deberá concurrir siempre con la presencia de un letrado patrocinante.","Deberá concurrir sin asistencia de un abogado.","Podrá designar un apoderado para que comparezca en su lugar."],"src":"III-34"},{"q":"Deber de colaboración de personas sujetas a una investigación:","opts":["Toda persona sujeta a un procedimiento de investigación debe proveer a la Comisión Nacional de Valores la información que ésta le requiera, de manera fehaciente, siendo la conducta renuente y reiterada en contrario un elemento más de convicción en contra para decidir la apertura de un sumario y su posterior resolución final.","Toda persona sujeta a un procedimiento de investigación puede proveer a la Comisión Nacional de Valores la información que ésta le requiera, sin que su negativa pueda ser considerada como elemento de convicción en su contra, en resguardo del derecho a no autoincriminarse y del debido proceso.","Toda persona sujeta a un procedimiento de investigación debe proveer a la Comisión Nacional de Valores la información que ésta le requiera dentro de los diez días hábiles, pudiendo invocar el secreto comercial o bursátil para diferir la entrega hasta la formulación de cargos en el sumario.","Toda persona sujeta a un procedimiento de investigación debe proveer la información que le requiera el mercado en el que opere, quien la remitirá a la Comisión Nacional de Valores; la conducta renuente sólo podrá ser valorada una vez abierto el sumario y notificada la propuesta de cargos."],"src":"III-35"},{"q":"El plexo normativo referido a la Transparencia en el ámbito de la Oferta Pública resulta oponible:","opts":["A cualquier persona física o jurídica que intervenga en el mercado de capitales, incluidos los inversores.","A las emisoras, los agentes registrados y los mercados, quedando los inversores alcanzados sólo por las normas de protección al inversor.","A cualquier persona física o jurídica registrada ante la Comisión Nacional de Valores, con exclusión de los inversores minoristas.","A quienes intervengan en ofertas iniciales, no en los mercados secundarios."],"src":"III-36"},{"q":"En cumplimiento del deber de lealtad y diligencia, los directores de las sociedades emisoras deberán:","opts":["Hacer prevalecer, sin excepción, el interés social de la emisora en que ejercen su función y el interés común de todos sus socios.","Hacer prevalecer el interés social de la emisora, salvo cuando éste resulte contrario al interés del accionista controlante que los designó.","Hacer prevalecer el interés común de los accionistas mayoritarios, en tanto representan la voluntad social expresada en la asamblea.","Hacer prevalecer, con las excepciones que fije el estatuto, el interés de los socios que los hubieran propuesto para el cargo."],"src":"III-37"},{"q":"En oportunidad de determinarse la realización de una verificación sobre un sujeto administrado por la COMISION NACIONAL DE VALORES, la persona bajo dicho procedimiento de investigación:","opts":["Deberá colaborar con el Organismo, sin excepciones.","Podrá requerir la postergación del procedimiento mediante solicitud fundada.","Deberá contar con asesoramiento jurídico durante todo el proceso.","Podrá negarse invocando el secreto comercial."],"src":"III-38"},{"q":"La oferta pública de valores negociables será irregular cuando:","opts":["Cuando sea efectuada por sujetos no autorizados para ello por parte de la Comisión Nacional de Valores o, cuando bajo el ropaje de una oferta privada, se utilicen medios de comunicación masivos para su difusión.","Cuando sea efectuada por sujetos autorizados por la Comisión Nacional de Valores respecto de valores negociables que no cuenten con autorización de oferta pública, o cuando una oferta privada supere el monto fijado por las Normas.","Cuando sea efectuada por sujetos no autorizados para ello por parte de la Comisión Nacional de Valores, siempre que se dirija a inversores no calificados y se utilicen medios de comunicación masivos para su difusión.","Cuando sea efectuada por sujetos no autorizados por el mercado en el que se negocien los valores negociables o, bajo el ropaje de una oferta pública, se dirija a un número de destinatarios inferior al mínimo fijado por las Normas."],"src":"III-39"},{"q":"La siguiente conducta es contraria a la Transparencia en el ámbito de la Oferta Pública:","opts":["Engaño y manipulación de mercado.","La reserva de información efectuada por cualquier persona que, en razón de su cargo o actividad, tenga información acerca de un hecho aún no divulgado públicamente y que por su importancia sea apto para afectar la colocación o el curso de la negociación que se realice con valores negociables con oferta pública autorizada.","La publicación de información contable con las salvedades del auditor externo.","La difusión del prospecto de emisión por medios masivos de comunicación."],"src":"III-40"},{"q":"Las denuncias por ante la Comisión Nacional de Valores:","opts":["Pueden formularse de manera anónima y/o con individualización de quien denuncia.","Deben formularse con identificación completa del denunciante.","Requieren patrocinio letrado.","Deben presentarse por medio electrónico."],"src":"III-41"},{"q":"Las emisoras, los agentes de negociación, los inversores y/o cualquier otro interviniente en los mercados, por sí o por interpósita persona, en ofertas iniciales o mercados secundarios, deberán:","opts":["Abstenerse de realizar prácticas o conductas que pretendan o permitan la manipulación de precios o volumen de los valores negociables listados en Mercados.","Informar a la Comisión Nacional de Valores, en forma previa a su ejecución, las operaciones que puedan afectar el precio o el volumen de los valores negociables listados en Mercados.","Abstenerse de operar por cuenta propia mientras tengan órdenes pendientes de clientes sobre los mismos valores.","Abstenerse de realizar prácticas o conductas que pretendan o permitan la manipulación de precios o volumen, salvo que se trate de operaciones de un Hacedor de Mercado habilitado."],"src":"III-42"},{"q":"Las investigaciones llevadas a cabo en el ámbito de la Comisión Nacional de Valores:","opts":["Pueden iniciarse a petición de un particular o de oficio por parte del Organismo.","Deben iniciarse siempre a propósito de una denuncia.","Sólo pueden comenzar a instancias de un requerimiento de un sector específico de la CNV.","Deben iniciarse a requerimiento del mercado en el que opere el investigado."],"src":"III-43"},{"q":"Los domicilios especiales constituidos por ante la Comisión Nacional de Valores por parte de los directores de las sociedades que se encuentran dentro del régimen de la oferta pública para recibir notificaciones tienen validez:","opts":["Hasta DOS (2) años después que dichos directores cesan en sus cargos.","Hasta que dichos directores cesan en sus funciones.","Hasta 1 año después de que dichos directores cesan en sus cargos.","Hasta TRES (3) años después que dichos directores cesan en sus cargos."],"src":"III-44"},{"q":"Los mercados, respecto de los agentes que operen bajo su órbita:","opts":["Deben efectuar amplias tareas de inspección y control.","Deben informar irregularidades cuando lo solicite la CNV.","No tienen obligación de supervisar a los agentes bajo su órbita.","Deben intervenir ante denuncia formal de un inversor."],"src":"III-45"},{"q":"Los sujetos que ofrezcan, compren, vendan o realicen cualquier tipo de operación sobre valores negociables por cuenta y orden de terceros:","opts":["Deben estar registrados ante el Organismo.","Deben iniciar el trámite de registro ante la CNV.","Deben inscribirse ante un mercado.","Deben contar con la autorización del Banco Central de la República Argentina."],"src":"III-46"},{"q":"Resultan susceptibles de calificarse como supuestos de engaños al mercado:","opts":["Ambas respuestas son correctas.","Transacciones en las que no se produzca, más allá de su apariencia, la transferencia de los valores negociables.","Transacciones efectuadas con el propósito de crear la apariencia falsa de existencia de oferta y demanda o de un mercado activo, aun cuando se produzca efectivamente la transferencia de los valores negociables.","Transacciones efectuadas entre partes relacionadas al precio de cierre del día anterior."],"src":"III-47"},{"q":"No se considera abuso de información privilegiada por parte del director de una sociedad emisora:","opts":["La comunicación de dicha información a terceros, en el ejercicio normal de su cargo.","La recomendación efectuada a un tercero para que adquiera o ceda valores negociables, basándose en dicha información.","La realización d cualquier tipo de operación en el mercado sobre los valores negociables a los que la información se refiera.","La utilización de dicha información para comprar por cuenta de un familiar."],"src":"III-48"},{"q":"Puede efectuar una invitación al público en general para comprar y vender valores negociables:","opts":["Sólo aquellas personas físicas o jurídicas que previamente hayan obtenido autorización para hacerlo por parte de la Comisión Nacional de Valores.","Cualquier persona humana o jurídica.","Las personas humanas o jurídicas que se encuentren en proceso de registro y autorización por ante la CNV.","Todas son correctas."],"src":"III-49"},{"q":"Quien/es formula/n una denuncia por ante la Comisión Nacional de Valores y las personas físicas y/o jurídicas denunciadas e investigadas:","opts":["Quien formula una denuncia ante la CNV no es parte del proceso sancionador y no puede tomar vista del expediente, ya que la denuncia es un hecho externo al procedimiento; la persona física o jurídica denunciada no es parte del procedimiento hasta la formulación de cargos, sólo a partir de ese momento adquiere el derecho a tomar vista del expediente y ejercer su defensa.","Quien formula una denuncia ante la CNV es parte del proceso sancionador desde su presentación y puede tomar vista del expediente; la persona denunciada sólo adquiere el derecho a tomar vista y ejercer su defensa a partir de la formulación de cargos.","Quien formula una denuncia ante la CNV no es parte del proceso sancionador, pero puede tomar vista del expediente una vez abierto el sumario; la persona denunciada es parte del procedimiento desde la presentación de la denuncia y puede ejercer su defensa desde ese momento.","Ni el denunciante ni la persona denunciada son parte del proceso sancionador, que se sustancia de oficio; ambos pueden tomar vista del expediente únicamente una vez dictada la resolución final de la Comisión Nacional de Valores."],"src":"III-50"},{"q":"Quienes en razón de su cargo o actividad tengan información acerca de un hecho no divulgado públicamente y que por su importancia sea apto para afectar la colocación de valores negociables, o el curso de su negociación en los mercados, deberá guardar estricta reserva:","opts":["Hasta que dicha información tenga carácter público.","Por tiempo ilimitado.","Por el término definido en la norma.","Hasta la aprobación de los estados contables del ejercicio en que se produjo el hecho."],"src":"III-51"},{"q":"Se considera oferta pública irregular:","opts":["Cualquier tipo de actuación relacionada con valores negociables efectuada por personas humanas / jurídicas sin autorización ante la Comisión Nacional de Valores.","Todo asesoramiento relacionado con la intermediación de valores negociables efectuado por agentes registrados ante la CNV, cuando supera un monto determinado.","Todo ofrecimiento vinculado con la negociación de cuotapartes del FCI efectuado por un agente de administración de productos de inversión colectiva.","Toda actuación relacionada con valores negociables efectuada por agentes registrados fuera del horario de rueda."],"src":"III-52"},{"q":"Toda persona sujeta a un procedimiento de investigación y/o inspección:","opts":["Deberá proveer a la Comisión Nacional de Valores toda la información y documentación que ésta le requiera.","Deberá facilitar toda aquella información y documentación que no implique levantar un secreto bursátil.","Podrá unilateralmente diferir la entrega y/o exhibición de la información y documentación requerida para una fecha posterior.","Deberá proveer únicamente la información que la Comisión Nacional de Valores le requiera por orden judicial."],"src":"III-53"},{"q":"Las Cámaras Compensadoras y los mercados deben denunciar ante la Comisión Nacional de Valores toda falta en que incurrieren sus agentes miembros:","opts":["Siempre.","Cuando la CNV lo solicite expresamente.","En casos de fraude comprobado.","Cuando el monto involucrado supere determinado umbral."],"src":"III-54"},{"q":"Los administradores de entidades emisoras que realicen oferta pública de valores negociables y los integrantes del órgano de fiscalización, éstos últimos en materia de su competencia y los administradores de mercados, cámaras compensadoras y demás agentes registrados ante la Comisión en todas sus categorías y en su caso, los integrantes de sus órganos de fiscalización, estos últimos en materia de su competencia, deberán informar a la Comisión en forma inmediata:","opts":["Despidos de trabajadores, con causa o sin ella, que representen un DIEZ POR CIENTO (10%) del número total que prestan servicios en la entidad; hechos de cualquier naturaleza y acontecimientos fortuitos que obstaculicen o puedan obstaculizar seriamente el desenvolvimiento de sus actividades, incluyendo hechos que generen o puedan generar afectaciones de importancia al ambiente, especificándose sus consecuencias.","Despidos de trabajadores, con causa o sin ella, que representen un VEINTE POR CIENTO (20%) del número total que prestan servicios en la entidad; hechos de cualquier naturaleza que obstaculicen seriamente el desenvolvimiento de sus actividades, con exclusión de los acontecimientos fortuitos y de los hechos que generen afectaciones al ambiente, que se informan con los estados financieros.","Despidos de trabajadores sin causa que representen un DIEZ POR CIENTO (10%) del número total que prestan servicios en la entidad; hechos de cualquier naturaleza y acontecimientos fortuitos que obstaculicen seriamente el desenvolvimiento de sus actividades, dentro de los diez días hábiles de ocurridos y previa aprobación del órgano de fiscalización.","Despidos de trabajadores, con causa o sin ella, cualquiera sea su número; hechos de cualquier naturaleza que afecten el precio de cotización de sus valores negociables en más de un DIEZ POR CIENTO (10%) en una rueda, incluyendo hechos que generen afectaciones de importancia al ambiente, los que se informarán al mercado y no a la Comisión."],"src":"III-55"},{"q":"En cuanto tiempo debe informar un sujeto regulado por la Comisión Nacional de Valores un hecho relevante:","opts":["Inmediatamente.","Dentro de los 5 días hábiles.","Dentro de los 10 días hábiles.","Dentro de los 30 días corridos."],"src":"III-56"},{"q":"Las emisoras, las cámaras compensadoras, los agentes de negociación y todo otra persona humana o jurídica que intervenga, se ofrezca u ofrezca servicios en la oferta pública de valores negociables deberán especialmente abstenerse de:","opts":["Ofrecer servicios de asesoramiento de valores negociables sin contar con el registro en cualquiera de las categorías de Agentes autorizados por la Comisión Nacional de Valores a tales efectos.","Ofrecer servicios de asesoramiento de valores negociables sin contar con la autorización previa del mercado en el que se negocien, aun cuando se encuentren registrados ante la Comisión Nacional de Valores en alguna categoría de Agente.","Abstenerse de efectuar transacciones con el propósito de crear la apariencia falsa de oferta y demanda, salvo que se produzca efectivamente la transferencia de los valores negociables.","Ofrecer servicios de custodia de valores negociables sin contar con el registro como Agente de Depósito Colectivo, aun cuando se encuentren registrados en otra categoría de Agente ante la Comisión Nacional de Valores."],"src":"III-57"},{"q":"Los inversores y/o cualquier otro interviniente en los Mercados, en ofertas iniciales o mercados secundarios, deberán:","opts":["Abstenerse de efectuar transacciones en las que se produzca efectivamente la transferencia de los valores negociables con el propósito de crear la apariencia falsa de existencia de oferta y demanda o de un mercado activo; abstenerse de efectuar transacciones en las que no se produzca, más allá de su apariencia, la transferencia de los valores negociables.","Abstenerse de efectuar transacciones en las que se produzca efectivamente la transferencia de los valores negociables cuando el precio se aparte del último cierre en más del porcentaje fijado por el Mercado; abstenerse de efectuar transacciones por cuenta propia mientras tengan órdenes pendientes de clientes sobre los mismos valores.","Abstenerse de efectuar transacciones con el propósito de crear la apariencia falsa de existencia de oferta y demanda, salvo que se produzca efectivamente la transferencia de los valores negociables; abstenerse de efectuar transacciones en las que no se produzca la transferencia de los valores negociables, salvo que se trate de operaciones entre partes relacionadas.","Informar a la Comisión Nacional de Valores, en forma previa, las transacciones en las que no se produzca la transferencia de los valores negociables; abstenerse de efectuar transacciones con el propósito de crear la apariencia falsa de un mercado activo, únicamente en las ofertas iniciales y no en los mercados secundarios."],"src":"III-58"},{"q":"La Oficina de Atención al Inversor (OAI) de la Comisión Nacional de Valores:","opts":["Todas son correctas.","Promueve la educación sobre el Mercado de Capitales.","Atiende consultas de inversores y público en general.","Pone a disposición las recomendaciones y advertencias generadas por la CNV y otros organismos reguladores, como OICV-IOSCO y ESMA."],"src":"III-59"},{"q":"La idoneidad que acredita el examen de Comisión Nacional de Valores es parte de los requisitos para:","opts":["Desempeñarse como idóneo en los Agentes y Fondos Comunes de Inversión.","Desempeñarse como director o síndico de una emisora.","Desempeñarse como Oficial de Cumplimiento en un Sujeto Obligado del mercado de capitales.","Desempeñarse como auditor externo de los Agentes registrados ante la Comisión Nacional de Valores."],"src":"III-60"},{"q":"En el marco de la normativa vigente aplicable a la actividad del idóneo del mercado de capitales, ¿cuál de las siguientes afirmaciones describe de manera correcta la atribución de responsabilidad en caso de incumplimientos normativos detectados durante su desempeño?","opts":["La Comisión Nacional de Valores podrá imponer sanciones al idóneo por incumplimientos normativos y esta responsabilidad podrá extenderse también al Agente y sus integrantes, según los procedimientos establecidos.","La responsabilidad recae exclusivamente sobre el idóneo, quien será sancionado conforme al artículo 132 de la Ley N° 26.831, sin que el Agente registrado al cual pertenece tenga responsabilidad alguna.","La responsabilidad por incumplimientos normativos corresponde al Mercado donde opera el Agente, quien debe garantizar el cumplimiento de la normativa por parte de sus miembros y del idóneo registrado.","La responsabilidad recae sobre el Agente y sus integrantes, quienes responden por los actos del idóneo; la Comisión Nacional de Valores no puede sancionar directamente al idóneo."],"src":"III-61"},{"q":"Deberán inscribirse en el Registro de Idóneos llevado por la Comisión Nacional de Valores:","opts":["Aquellas personas que desarrollen la actividad de venta, promoción o prestación de cualquier tipo de asesoramiento en el contacto con el público inversor.","Aquellas personas que desarrollen tareas administrativas o de liquidación en los Agentes registrados, aun cuando no tengan contacto con el público inversor.","Aquellas personas que integren el órgano de administración de los Agentes registrados y de las sociedades gerentes de Fondos Comunes de Inversión.","Aquellas personas que presten asesoramiento al público inversor por cuenta de entidades financieras, quedando excluido el personal de los Agentes registrados ante la Comisión."],"src":"III-62"},{"q":"¿Dónde puede un inversor verificar si el Agente con el que planea invertir está autorizado por la Comisión Nacional de Valores?","opts":["Consultando el Registro Público de Agentes autorizados y registrados ante Comisión Nacional de Valores, en el sitio web de la Comisión Nacional de Valores.","Consultando el registro de agentes que lleva el mercado en el que opera el Agente, en el sitio web de dicho mercado, dado que la Comisión Nacional de Valores no publica los registros.","Consultando el Registro Público de Comercio de la jurisdicción del Agente, donde se inscribe la autorización otorgada por la Comisión Nacional de Valores.","Consultando el Registro de Idóneos de la Comisión Nacional de Valores, en el sitio web de la Comisión, donde figuran los Agentes autorizados junto con su personal."],"src":"III-63"},{"q":"Se presenta un cliente que posee Acciones de una emisora autorizada, quien quiere consultar los prospectos de emisión. ¿Dónde puede encontrar dicha información pública el inversor?","opts":["En la Autopista de la Información Financiera, en el link de la emisora correspondiente.","En la página web del mercado en el que listen las acciones, en el link de la emisora correspondiente, dado que la Autopista de la Información Financiera es de acceso exclusivo para la Comisión y los agentes.","En Caja de Valores S.A., por los medios que ésta habilite, debiendo el Agente informar al comitente de los mismos; los prospectos no se publican en la Autopista de la Información Financiera.","En la Autopista de la Información Financiera, previa registración y acreditación de su condición de accionista."],"src":"III-64"},{"q":"Según la normativa, ¿con qué frecuencia debe actualizarse el perfil de riesgo del cliente?","opts":["El perfil de riesgo debe actualizarse al menos una vez al año, o en la primera oportunidad que el cliente pretenda operar después de dicho plazo.","El perfil de riesgo debe actualizarse cuando el cliente desea realizar una nueva inversión.","El perfil de riesgo debe actualizarse en el momento de la primera inversión del cliente.","El perfil de riesgo debe actualizarse cada tres años, sin importar las circunstancias."],"src":"III-65"},{"q":"Según la normativa vigente, ¿qué debe ocurrir para que un idóneo inactivo sea dado de baja definitiva del Registro de Idóneos y deba cumplir nuevamente con los requisitos para obtener la idoneidad?","opts":["Permanecer inactivo por dos años o no cumplir con los cursos de actualización requeridos.","Permanecer inactivo por un período de tres años o no realizar los cursos de actualizaciones en tiempo y forma.","No ser contratado por un Agente registrado luego de 6 meses de aprobado el examen.","No cumplir con los requisitos establecidos para ser idóneo en un período de cinco años."],"src":"III-66"},{"q":"Idoneidad en el Mercado de Capitales:","opts":["Para ser idóneo en el mercado de capitales, es necesario ser dado de alta en el Registro Público de Idóneos de Comisión Nacional de Valores por un Agente Matriculado; el idóneo deberá actuar con honestidad, imparcialidad, profesionalidad, diligencia y lealtad con los inversores con quienes tenga contacto, velando por la gestión sana y prudente en el ejercicio de su actividad; ante el incumplimiento de la normativa vigente aplicable a su actividad, el idóneo será pasible de la eventual aplicación de las sanciones previstas en el artículo 132 de la Ley Nº 26.831 de acuerdo a los procedimientos establecidos por la Comisión, sin perjuicio de la responsabilidad que también le pueda corresponder al Agente y a sus integrantes.","Para ser idóneo en el mercado de capitales, basta con aprobar el examen de idoneidad de la Comisión Nacional de Valores, sin necesidad de alta en el Registro Público de Idóneos; el idóneo deberá actuar con honestidad, imparcialidad, profesionalidad, diligencia y lealtad con los inversores; ante el incumplimiento de la normativa, el idóneo será pasible de las sanciones previstas en el artículo 132 de la Ley Nº 26.831, con exclusión de toda responsabilidad del Agente y de sus integrantes.","Para ser idóneo en el mercado de capitales, es necesario ser dado de alta en el Registro Público de Idóneos de la Comisión Nacional de Valores por el mercado en el que opere el Agente; el idóneo deberá actuar con honestidad, imparcialidad, profesionalidad, diligencia y lealtad con los inversores; ante el incumplimiento de la normativa, la responsabilidad recae exclusivamente en el Agente y sus integrantes, que responden por los actos del idóneo conforme el artículo 132 de la Ley Nº 26.831.","Para ser idóneo en el mercado de capitales, es necesario ser dado de alta en el Registro Público de Idóneos de la Comisión Nacional de Valores por un Agente Matriculado; el idóneo deberá actuar con honestidad, imparcialidad, profesionalidad, diligencia y lealtad con los inversores; ante el incumplimiento de la normativa, el idóneo será sancionado por el mercado en el que opere el Agente, conforme su reglamento interno, sin intervención de la Comisión Nacional de Valores."],"src":"III-67"},{"q":"¿A dónde puede recurrir un inversor para consultar su tenencia de valores negociables?","opts":["Al Agente de Depósito Colectivo, por los medios que éste habilite, debiendo el Agente informar al comitente de los mismos.","Al Mercado en el que se concertaron las operaciones, por los medios que éste habilite, debiendo el Agente informar al comitente de los mismos.","A la Comisión Nacional de Valores, a través de la Autopista de la Información Financiera (AIF), previa registración del inversor como usuario.","Al Agente de Depósito Colectivo, únicamente a través del Agente con el que opera."],"src":"III-68"},{"q":"El Responsable de Relaciones con el Público (RRP) del Agente deberá:","opts":["Atender los reclamos y denuncias de los clientes, informarlos al órgano de administración y remitir un informe dentro de los 5 días hábiles de recibido cada reclamo/denuncia, un detalle con el estado y acciones adoptadas.","Atender los reclamos y denuncias de los clientes, informarlos al mercado en el que opera el Agente y remitir un informe dentro de los 10 días hábiles de recibido cada reclamo/denuncia, con el detalle del estado y las acciones adoptadas.","Atender los reclamos y denuncias de los clientes e informarlos al órgano de administración en forma trimestral, mediante un informe consolidado con el estado y las acciones adoptadas respecto de cada reclamo/denuncia.","Atender los reclamos y denuncias de los clientes, resolverlos en forma directa dentro de los 5 días hábiles de recibidos y remitir a la Comisión Nacional de Valores un informe mensual con el detalle de los reclamos resueltos."],"src":"III-69"},{"q":"Es condición suficiente para ejercer como idóneo.","opts":["Estar inscripto en el registro público de idóneos de la Comisión Nacional de Valores.","Haber aprobado el examen de idoneidad de la CNV.","Tener título universitario en ciencias económicas.","Contar con 5 años de experiencia en el mercado de capitales."],"src":"III-70"},{"q":"De acuerdo a lo establecido en el Título de Transparencia en el Ámbito de la Oferta Pública de las Normas CNV, sobre publicidad y propaganda:","opts":["La publicidad no debe inducir a error, equívocos o confusión respecto a la naturaleza, precios, rentabilidad o garantías de los valores negociables; en caso de violación, la Comisión Nacional de Valores puede ordenar la modificación o suspensión de la publicidad, además de aplicar otras sanciones.","La publicidad debe incluir la calificación de riesgo y la advertencia sobre la volatilidad de los valores negociables; en caso de violación, el mercado en el que listen los valores puede ordenar la suspensión de la publicidad, sin perjuicio de las sanciones que aplique la Comisión Nacional de Valores.","La publicidad no debe inducir a error respecto a la naturaleza y precios de los valores negociables, pudiendo referirse a la rentabilidad esperada y a las garantías; en caso de violación, la Comisión Nacional de Valores sólo puede aplicar las sanciones previstas en la Ley, no así ordenar la modificación de la publicidad.","La publicidad debe ser aprobada previamente por la Comisión Nacional de Valores cuando se refiera a la rentabilidad o a las garantías de los valores negociables; en caso de difusión sin aprobación, la Comisión puede ordenar la suspensión de la publicidad y aplicar las sanciones correspondientes."],"src":"III-71"},{"q":"¿Cuáles son los aspectos mínimos que un agente debe considerar al conocer el perfil de riesgo de sus clientes y qué excepciones establece la normativa para la aplicación de este requisito?","opts":["El agente debe considerar la experiencia del cliente en inversiones, el grado de conocimiento sobre instrumentos, el objetivo de inversión, la situación financiera, el horizonte de inversión, el porcentaje de ahorros destinados a la inversión, el nivel de ahorro que el cliente está dispuesto a arriesgar y otras circunstancias relevantes. No aplica a inversores institucionales.","El agente debe considerar la experiencia del cliente en inversiones, el grado de conocimiento sobre instrumentos, el objetivo de inversión, la situación financiera, el horizonte de inversión, el porcentaje de ahorros destinados a la inversión, el nivel de ahorro que el cliente está dispuesto a arriesgar y otras circunstancias relevantes. No aplica a personas jurídicas ni a inversores calificados.","El agente debe considerar el objetivo de inversión, la situación financiera, el horizonte de inversión, el porcentaje de ahorros destinados a la inversión y el nivel de ahorro que el cliente está dispuesto a arriesgar; la experiencia y el grado de conocimiento se presumen cuando el cliente opera por instrucciones específicas. No aplica a inversores institucionales ni a clientes con cuenta comitente con más de cinco años de antigüedad.","El agente debe considerar la experiencia del cliente en inversiones, el grado de conocimiento sobre instrumentos, el objetivo de inversión, la situación financiera, el horizonte de inversión, el porcentaje de ahorros destinados a la inversión y el nivel de ahorro que el cliente está dispuesto a arriesgar. Aplica a todos los clientes, incluidos los inversores institucionales, sin excepción."],"src":"III-72"},{"q":"¿Quiénes no pueden ser inscriptos como idóneos de los Agentes registrados en la Comisión?","opts":["Las personas que no puedan ejercer el comercio, los fallidos, los concursados y las personas inhabilitadas por el Banco Central de la República Argentina, hasta cinco años después de su rehabilitación.","Las personas que hayan sido condenadas por delitos contra la fe pública, los fallidos y los condenados en los últimos dos años.","Las personas inhabilitadas por el Banco Central de la República Argentina, los fallidos y los condenados por delitos de corrupción, hasta cuatro años después de su condena.","Las personas inhabilitadas por la Comisión Nacional de Valores y los fallidos, hasta dos años después de su rehabilitación, y los condenados por delitos contra la propiedad."],"src":"III-73"},{"q":"¿Qué obligación tienen los mercados, cámaras compensadoras y demás agentes registrados en la Comisión respecto a la publicación de los derechos, aranceles y comisiones que perciben?","opts":["Publicar y mantener actualizado el detalle de derechos, aranceles y comisiones en la Autopista de la Información Financiera y de forma idéntica en su página institucional, en un lugar destacado.","Actualizar el detalle de derechos, aranceles y comisiones anualmente y publicarlo en su página institucional.","Conservar un registro interno de los derechos, aranceles y comisiones percibidos, teniéndolo a disposición cuando lo soliciten los inversores o la Comisión.","Publicar el detalle de derechos, aranceles y comisiones en el Boletín Oficial y comunicarlo a la Comisión con cada modificación."],"src":"III-74"},{"q":"Las personas físicas y/o jurídicas registradas en la Comisión deberán contar con un Código de Protección al Inversor o Código de Conducta. ¿Cuáles son los aspectos mínimos que dicho Código debe abarcar?","opts":["Normativa aplicable relacionada con la Transparencia en el Ámbito de la Oferta Pública, las conductas contrarias a la transparencia y los procedimientos tendientes a prevenir dichas conductas; normas de protección al inversor vigentes, incluyendo los derechos de los pequeños inversores minoristas y los procedimientos aplicables para el ejercicio de tales derechos; disposiciones que regulan el comportamiento del personal alcanzado, garantizando la seguridad y eficiencia en los servicios, el respeto al deber de confidencialidad y la prevención de conflictos de interés.","Normativa aplicable relacionada con la Transparencia en el Ámbito de la Oferta Pública, las conductas contrarias a la transparencia y los procedimientos tendientes a prevenir dichas conductas; normas de prevención de lavado de activos y financiación del terrorismo, incluyendo el régimen de reporte de operaciones sospechosas; disposiciones que regulan el comportamiento del personal alcanzado, con exclusión de las relativas a conflictos de interés, que se rigen por el manual de prevención.","Normativa aplicable relacionada con la Transparencia en el Ámbito de la Oferta Pública y las conductas contrarias a la transparencia; normas de protección al inversor vigentes, incluyendo los derechos de los inversores calificados y los procedimientos aplicables para el ejercicio de tales derechos; disposiciones que regulan la política de comisiones y aranceles del Agente, garantizando la seguridad y eficiencia en los servicios y la prevención de conflictos de interés.","Normas de protección al inversor vigentes, incluyendo los derechos de los pequeños inversores minoristas y los procedimientos aplicables para el ejercicio de tales derechos; disposiciones que regulan el comportamiento del personal alcanzado, garantizando la seguridad y eficiencia en los servicios, el respeto al deber de confidencialidad y la prevención de conflictos de interés; régimen disciplinario aplicable al personal, aprobado por el mercado en el que opere el Agente, con exclusión de la normativa sobre Transparencia, que se rige por el reglamento del mercado."],"src":"III-75"},{"q":"En el marco de las obligaciones de los participantes en el ámbito de la oferta pública, ¿quiénes están comprendidos en el deber de guardar estricta reserva sobre información no divulgada públicamente que pueda afectar la colocación de valores negociables o su negociación en los mercados?","opts":["Los directores, administradores, gerentes, síndicos, miembros del consejo de vigilancia, accionistas controlantes y profesionales intervinientes de cualquier entidad autorizada a la oferta pública de valores negociables, incluidos los Mercados; cualquier persona que haga una oferta pública de adquisición o canje de valores respecto de una entidad autorizada a la oferta pública; directivos, funcionarios y empleados de los agentes de calificación de riesgos; funcionarios públicos y directivos, funcionarios y empleados de los organismos de control públicos o privados, incluida la Comisión.","Los directores, administradores, gerentes, síndicos, miembros del consejo de vigilancia y accionistas controlantes de cualquier entidad autorizada a la oferta pública de valores negociables, con exclusión de los profesionales intervinientes y de los Mercados; cualquier persona que haga una oferta pública de adquisición o canje de valores respecto de una entidad autorizada a la oferta pública; directivos, funcionarios y empleados de los agentes de calificación de riesgos; funcionarios públicos de los organismos de control, con exclusión de los directivos y empleados de la Comisión, que se rigen por el régimen de secreto de la Ley 26.831.","Los directores, administradores, gerentes, síndicos, miembros del consejo de vigilancia, accionistas controlantes y profesionales intervinientes de cualquier entidad autorizada a la oferta pública de valores negociables, incluidos los Mercados; cualquier persona que haga una oferta pública de adquisición o canje de valores respecto de una entidad autorizada a la oferta pública; directivos, funcionarios y empleados de los Agentes de Negociación y de Liquidación y Compensación, con exclusión de los agentes de calificación de riesgos; directivos, funcionarios y empleados de los organismos de control privados, no así los funcionarios públicos, que se rigen por la Ley de Ética Pública.","Los directores, administradores, gerentes y síndicos de cualquier entidad autorizada a la oferta pública de valores negociables, con exclusión de los accionistas controlantes, de los profesionales intervinientes y de los Mercados; cualquier persona que haga una oferta pública de adquisición o canje de valores respecto de una entidad autorizada a la oferta pública, hasta la publicación del anuncio de la oferta; directivos, funcionarios y empleados de los agentes de calificación de riesgos y de los organismos de control públicos o privados, incluida la Comisión, con exclusión de los funcionarios públicos ajenos a dichos organismos."],"src":"III-76"},{"q":"En caso de que un accionista desee participar en una asamblea, debe informar su intención de asistir y depositar sus acciones ante:","opts":["La sociedad emisora.","Al mercado donde cotizan las acciones.","A la Comisión Nacional de Valores.","Al Agente de Custodia, Registro y Pago."],"src":"III-77"},{"q":"¿Deben cumplir con algún procedimiento específico las sociedades que hagan oferta pública de sus acciones sobre los actos o contratos que celebren con una parte relacionada?","opts":["Sí, siempre que se trate de un monto relevante estipulado en la Ley de Mercado de Capitales.","Sí, siempre que se trate de un monto relevante estipulado en el reglamento del Mercado.","Sí, cualquiera sea el monto del acto o contrato, debiendo contar con la aprobación previa de la asamblea de accionistas.","No, salvo que la parte relacionada sea el accionista controlante, en cuyo caso se requiere la conformidad previa de la Comisión Nacional de Valores."],"src":"III-78"},{"q":"La normativa ejemplifica también como “hechos relevantes” enmarcados en el deber de informar a:","opts":["Los cambios en el objeto social, alteraciones de importancia en sus actividades o iniciación de otras nuevas; las pérdidas superiores al 15% del patrimonio neto.","Los cambios en el objeto social, alteraciones de importancia en sus actividades o iniciación de otras nuevas; las pérdidas superiores al 5% del patrimonio neto.","Los cambios en el objeto social y las alteraciones de importancia en sus actividades, no así la iniciación de otras nuevas; las pérdidas superiores al 15% del activo total.","Las alteraciones de importancia en sus actividades o iniciación de otras nuevas, con exclusión de los cambios en el objeto social, que se informan con los estados financieros anuales; las pérdidas superiores al 25% del patrimonio neto."],"src":"III-79"},{"q":"En el régimen general de la oferta pública, una sociedad emisora no puede prescindir de publicar a través de la Autopista de la Información Financiera:","opts":["Las actas de las asambleas anuales de la entidad; los estados contables trimestrales de la sociedad.","Las actas de las asambleas anuales de la entidad; los estados contables anuales de la sociedad, quedando los trimestrales a disposición de los accionistas en la sede social.","Los estados contables trimestrales de la sociedad; las actas de directorio, quedando las actas de las asambleas anuales a disposición de los accionistas en la sede social.","Las actas de las asambleas anuales de la entidad y los estados contables trimestrales, salvo que la emisora los publique en su página institucional y en el mercado en el que liste."],"src":"III-80"},{"q":"Qué tipo de emisoras están obligadas a presentar un Código de Gobierno Societario:","opts":["Las emisoras que se encuentran comprendidas en el régimen general de oferta pública por acciones u obligaciones negociables.","Todas las emisoras.","Las emisoras que se encuentran admitidas en el régimen general de oferta pública de acciones.","Las emisoras comprendidas en el régimen PyME CNV y las sociedades gerentes de Fondos Comunes de Inversión."],"src":"III-81"},{"q":"¿Qué se considera un hecho relevante?","opts":["Todo hecho o situación que, por su importancia, sea apto para afectar en forma sustancial la colocación de los valores negociables, el curso de su negociación, o el desenvolvimiento de la actividad propia de cada sujeto alcanzado.","Todo hecho o situación que, por su importancia, sea apto para afectar en forma sustancial la colocación de los valores negociables o el curso de su negociación, con exclusión de los que afecten el desenvolvimiento de la actividad propia de cada sujeto alcanzado, que se informan con los estados financieros.","Todo hecho o situación que afecte la cotización en más de un DIEZ POR CIENTO (10%) en una rueda, conforme la calificación que efectúe el Mercado.","Todo hecho o situación que, por su importancia, sea apto para afectar en forma sustancial la colocación de los valores negociables, el curso de su negociación o el desenvolvimiento de la actividad propia de cada sujeto alcanzado, siempre que haya sido calificado como tal por el órgano de administración y aprobado por el órgano de fiscalización."],"src":"III-82"},{"q":"¿En qué oportunidad debe ser comunicado un hecho relevante?","opts":["En forma inmediata de ocurrido.","En forma trimestral.","Con los estados contables anuales.","Dentro de los diez días hábiles de ocurrido."],"src":"III-83"},{"q":"¿Qué emisoras están obligadas a contar con un Comité de Auditoría?","opts":["Las emisoras que hacen oferta pública de acciones.","Todas las emisoras.","Las emisoras que hacen oferta pública de obligaciones negociables.","Las emisoras del régimen PyME CNV Garantizada."],"src":"III-84"},{"q":"El Comité de Auditoría debe estar conformado por:","opts":["Directores.","Auditores.","Síndicos.","Accionistas."],"src":"III-85"},{"q":"La mayoría de los miembros del Comité de Auditoría deben reunir el carácter de:","opts":["Directores Independientes.","Directores ejecutivos.","Síndicos titulares.","Representantes de los accionistas minoritarios."],"src":"III-86"},{"q":"¿Qué es el gobierno societario?","opts":["Es el conjunto de prácticas, procesos y estructuras por el cual se dirigen y controlan las compañías.","Conjunto de principios que regulan la integración y funcionamiento de la sociedad, sus accionistas y órganos sociales.","Una encuesta que debe ser presentada ante CNV.","Es el conjunto de normas de la Ley 19.550 que regulan la responsabilidad de los directores."],"src":"III-87"},{"q":"¿Qué es un código de gobierno societario?","opts":["Una herramienta de reporte de buenas prácticas corporativas que deben presentar las emisoras del régimen general .","Una herramienta de reporte de buenas prácticas corporativas que deben presentar los intermediarios.","Una herramienta de reporte de buenas prácticas que deben presentar las sociedades gerentes de FCI.","Una herramienta de reporte de buenas prácticas corporativas que deben presentar los mercados y cámaras compensadoras."],"src":"III-88"},{"q":"¿Con qué periodicidad debe presentarse el reporte al código de gobierno societario?","opts":["Anualmente, como anexo en la Memoria Anual.","Trimestralmente, con la presentación de cada uno de los EEFF.","A solicitud expresa de la CNV.","Semestralmente, junto con los EEFF intermedios."],"src":"III-89"},{"q":"¿Las prácticas dispuestas en el Código de Gobierno Societario de la Comisión Nacional de Valores son obligatorias para las emisoras alcanzadas?","opts":["No, no son obligatorias pero la emisora deberá brindar explicaciones sobre cómo cumple con los principios de gobierno corporativo que subyacen a la práctica.","Sí, son obligatorias para las emisoras comprendidas en el régimen general de oferta pública, que deberán acreditar su cumplimiento en la Memoria Anual.","No, no son obligatorias; la emisora puede omitir toda referencia a ellas cuando no las adopte, sin necesidad de brindar explicaciones.","Sí, son obligatorias, pero la emisora puede solicitar a la Comisión Nacional de Valores la dispensa de aquellas prácticas que no resulten aplicables a su actividad."],"src":"III-90"},{"q":"La afirmación: \"La publicidad realizada para la promoción y comercialización del Fondo, con independencia del medio empleado, no podrá en ningún caso ser dirigida de forma específica y/o exclusiva a los menores de edad, debiendo garantizar la difusión de idéntico contenido e información a todo el público inversor\", es:","opts":["Verdadera.","Falsa.","Depende del tipo de fondo.","Solo aplica a fondos cerrados."],"src":"III-91"},{"q":"¿A partir de qué edad un Agente de Liquidación y Compensación (ALyC) puede abrir subcuentas comitentes a nombre de una persona menor de edad, según lo dispuesto por la normativa vigente?","opts":["A partir de los 13 años.","A partir de los 18 años.","A partir de los 16 años.","No existe edad mínima establecida."],"src":"III-92"},{"q":"Según la normativa vigente, ¿qué tipo de operaciones pueden realizar los menores de edad adolescentes titulares de subcuentas comitentes?","opts":["Únicamente operaciones de contado y caución colocadora.","Todo tipo de operaciones, incluidas las de derivados.","Solo operaciones con obligaciones negociables.","Operaciones de contado, caución y futuros."],"src":"III-93"},{"q":"¿Con qué periodicidad debe remitir el RRP a la Comisión Nacional de Valores por Autopista de la Información Financiera el detalle de reclamos/denuncias?","opts":["Dentro de los 5 días hábiles de recibidos y actualizaciones semanales hasta su cierre.","Dentro de los 10 días hábiles y sin actualizaciones posteriores.","Dentro de los 30 días corridos con un informe final.","Una vez al mes con un resumen consolidado."],"src":"III-94"},{"q":"En las sociedades comprendidas en el régimen de oferta pública por acciones o valores negociables de deuda:","opts":["La totalidad de los miembros de la Comisión Fiscalizadora debe revestir la calidad de independiente.","La mayoría de los miembros de la Comisión Fiscalizadora debe revestir la calidad de independiente.","Solo los directores titulares deben revestir la calidad de independientes.","No existe requisito de independencia para la Comisión Fiscalizadora."],"src":"III-95"},{"q":"Según el artículo 73 de la de Ley de Mercado de Capitales N° 26.831, los contratos con partes relacionadas, siempre que las condiciones previstas hayan sido calificadas como razonablemente adecuadas por los órganos competentes, requieren obligatoriamente de:","opts":["La aprobación del Directorio con indicación de la existencia de los pronunciamientos del comité de auditoría o, en su caso, de las firmas evaluadoras independientes.","La aprobación de la asamblea de accionistas con indicación de la existencia de los pronunciamientos del comité de auditoría o, en su caso, de las firmas evaluadoras independientes.","La aprobación del Directorio y la conformidad previa de la Comisión Nacional de Valores, con indicación de los pronunciamientos del comité de auditoría o de las firmas evaluadoras independientes.","La aprobación del Directorio, sin necesidad de pronunciamiento del comité de auditoría ni de firmas evaluadoras independientes, siempre que el contrato sea informado como hecho relevante."],"src":"III-96"},{"q":"Los administradores y los representantes de la sociedad deben obrar con lealtad y con la diligencia de un buen hombre de negocios. Según el Art. 59 Ley 19.550: ¿Qué tipo de responsabilidad les cabe, por los daños y perjuicios causados, a aquellos que faltaren a sus obligaciones?","opts":["Ilimitada y solidaria por acción u omisión.","Limitada al monto de su participación accionaria.","Limitada al capital aportado por cada administrador.","Subsidiaria, respondiendo solo si la sociedad no puede hacerlo."],"src":"III-97"},{"q":"Según el Art. 272 de la Ley 19.550, si un director tuviese un interés contrario al de la sociedad:","opts":["Deberá hacerlo saber al directorio; deberá hacerlo saber a los síndicos; deberá abstenerse de intervenir en la deliberación.","Deberá hacerlo saber al directorio y a los síndicos; podrá intervenir en la deliberación pero deberá abstenerse de votar.","Deberá hacerlo saber a la asamblea de accionistas; deberá abstenerse de intervenir en la deliberación y en la votación.","Deberá hacerlo saber al directorio; podrá intervenir en la deliberación y votar, dejando constancia de su interés en el acta."],"src":"III-98"},{"q":"RG 1002/2024. ¿Cuál de las siguientes sí es una conducta contraria a la transparencia?","opts":["Ofrecer servicios de asesoramiento en valores sin la categoría de Agente habilitada por Comisión Nacional de Valores.","Realizar operaciones de compraventa de valores negociables sin cuenta comitente.","Presentar estados contables con información desactualizada.","No cumplir con el régimen informativo periódico."],"src":"III-99"},{"q":"RG 1002/2024. Además del asesoramiento no autorizado, ¿qué otra conducta debe abstenerse de realizar una persona no registrada?","opts":["Realizar actividades de difusión y/o captación de clientes para Agentes registrados sin autorización.","Realizar actividades de difusión y/o captación de clientes para emisoras, aun cuando cuente con mandato expreso de éstas.","Operar valores negociables por cuenta propia a través de un Agente registrado sin informar su condición de persona no registrada.","Realizar difusión y/o captación de clientes para Agentes registrados, en tanto no perciba comisiones."],"src":"III-100"},{"q":"Los hechos relevantes deben informarse:","opts":["En forma inmediata, por Autopista de la Información Financiera.","Dentro de los 5 días hábiles, por nota dirigida a la CNV.","En el próximo informe trimestral del agente.","Dentro de los 30 días corridos por carta documento."],"src":"III-101"},{"q":"El RRP debe enviar a Comisión Nacional de Valores por Autopista de la Información Financiera el detalle de cada reclamo/denuncia:","opts":["Dentro de los 5 días hábiles de recibido, con actualizaciones semanales hasta el cierre.","Dentro de los 10 días hábiles sin actualizaciones posteriores.","Dentro de los 30 días corridos con un único informe.","En forma mensual con un resumen consolidado."],"src":"III-102"},{"q":"RG 1023/2024: los menores de entre 13 y 17 años con subcuenta comitente pueden:","opts":["Operar de contado (renta fija/variable) y caución colocadora.","Operar todo tipo de instrumentos incluyendo derivados y futuros.","Pueden tener la cuenta pero no operar hasta cumplir 18 años.","Operar con fondos comunes de inversión abiertos, sin operaciones de contado."],"src":"III-103"},{"q":"En sociedades con OP de acciones, el Comité de Auditoría:","opts":["Debe estar integrado por Directores, con mayoría de Independientes.","Puede estar integrado por síndicos y auditores externos.","No tiene requisito de independencia de sus miembros.","Debe estar integrado exclusivamente por accionistas minoritarios."],"src":"III-104"},{"q":"El Código de Gobierno Societario (CGS) se presenta:","opts":["Anualmente, como anexo de la Memoria.","Trimestralmente, junto con los estados contables intermedios.","Solo al momento de la constitución de la sociedad.","Cada vez que se produzca un cambio en el directorio."],"src":"III-105"},{"q":"¿Cuál de las siguientes constituye oferta irregular?","opts":["Ofrecer públicamente servicios o VN sin la autorización de Comisión Nacional de Valores.","Ofrecer públicamente servicios o VN con autorización de la Comisión Nacional de Valores, pero fuera de los mercados autorizados.","Asesorar a inversores calificados sin inscripción en el Registro de Idóneos.","Ofrecer públicamente VN con autorización de oferta pública sin haber publicado el prospecto en la Autopista de la Información Financiera."],"src":"III-106"}],"4":[{"q":"¿Qué representa el Valor Actual Neto (VAN) en el análisis de inversiones?","opts":["La diferencia entre el valor presente de los flujos y la inversión inicial.","La tasa de retorno mínima aceptable para un proyecto.","El flujo de caja acumulado sin descontar.","El monto total de la inversión inicial ajustado por inflación."],"src":"IV-1"},{"q":"¿Qué indica la Tasa Interna de Retorno (TIR)?","opts":["La tasa que iguala el VAN a cero.","La tasa mínima exigida por los inversores.","La tasa de interés del mercado al momento de la evaluación.","La rentabilidad promedio del mercado de capitales."],"src":"IV-2"},{"q":"¿Cuál es una característica principal de los instrumentos de renta fija?","opts":["Pago de intereses preestablecidos y vencimiento definido.","Rentabilidad variable sujeta a resultados de la emisora.","Participación en las ganancias y pérdidas de la empresa.","Derecho a voto en las asambleas de accionistas."],"src":"IV-3"},{"q":"¿Cuál de los siguientes es un riesgo asociado a la renta fija?","opts":["Riesgo de reinversión.","Riesgo regulatorio.","Riesgo operativo del emisor.","Riesgo de inflación exclusivamente."],"src":"IV-4"},{"q":"¿Qué norma establece las condiciones de emisión de obligaciones negociables?","opts":["Ley 23.576.","Ley 26.831.","Normas CNV Título IV.","Ley 19.550."],"src":"IV-5"},{"q":"¿Cuál de los siguientes factores afecta directamente el cálculo del VAN?","opts":["La tasa de descuento aplicada a los flujos futuros.","El valor nominal del instrumento.","El plazo de vencimiento del bono.","La calificación crediticia del emisor."],"src":"IV-6"},{"q":"¿Qué representa el análisis fundamental en renta variable?","opts":["Evaluación de estados financieros y factores económicos.","Predicción de precios mediante gráficos e indicadores técnicos.","Análisis del volumen de operaciones y del precio.","Estudio de la psicología del inversor y del mercado."],"src":"IV-7"},{"q":"¿Cuál es el objetivo del análisis técnico?","opts":["Predecir movimientos futuros del precio mediante patrones históricos.","Evaluar la solidez financiera de la empresa emisora.","Determinar el valor intrínseco de los activos de una empresa.","Analizar las políticas de gobierno corporativo de la emisora."],"src":"IV-8"},{"q":"¿Qué mide el ratio PER (Price Earnings Ratio)?","opts":["Relación entre precio de la acción y ganancia por acción.","La relación entre deuda y patrimonio neto.","La relación entre activos corrientes y pasivos corrientes.","La relación entre dividendos pagados y precio de la acción."],"src":"IV-9"},{"q":"¿Cuál es un componente clave en la formación del precio de las acciones?","opts":["Interacción entre oferta y demanda en el mercado.","La calificación de riesgo asignada por una agencia.","El valor nominal de las acciones.","Las decisiones del directorio exclusivamente."],"src":"IV-10"},{"q":"¿Qué norma establece la obligación de presentar información contable periódica para emisoras de acciones?","opts":["Normas CNV Título IV.","Normas CNV Título XII.","Ley 25.246.","Resolución UIF 78/2023."],"src":"IV-11"},{"q":"¿Qué indica un PER elevado en una acción?","opts":["Que el mercado espera alto crecimiento de beneficios.","Que la empresa tiene alta deuda respecto a su patrimonio.","Que la acción está subvaluada respecto a sus pares.","Que la empresa distribuye altos dividendos."],"src":"IV-12"},{"q":"¿Qué representa el modelo “cost of carry” en la valuación de futuros?","opts":["La relación entre el precio spot y el precio futuro considerando costos de financiación.","La diferencia entre el precio de compra y venta de un futuro.","El margen de garantía exigido por la cámara compensadora.","La volatilidad histórica del activo subyacente."],"src":"IV-13"},{"q":"¿Cuál es el principal objetivo de un contrato de futuros?","opts":["Cobertura contra variaciones de precios.","Existencia de una contraparte central.","Tienen baja liquidez.","Fijar el precio de contado del activo subyacente."],"src":"IV-14"},{"q":"¿Qué mide la volatilidad implícita en opciones?","opts":["La expectativa del mercado sobre la variabilidad futura del precio.","La variación histórica del precio de la acción.","El volumen de operaciones del activo subyacente.","La tasa de interés libre de riesgo vigente."],"src":"IV-15"},{"q":"¿Cuál es la diferencia entre una opción call y una opción put?","opts":["La call otorga derecho a comprar y la put a vender.","La europea se ejerce al vencimiento y la americana en cualquier momento.","La europea puede ejercerse en cualquier momento y la americana el vencimiento.","La call se ejerce al vencimiento y la put en cualquier momento."],"src":"IV-16"},{"q":"¿Qué norma regula la operatoria de derivados en mercados autorizados por Comisión Nacional de Valores?","opts":["Ley 26.831.","Ley 25.246.","Ley 23.576.","Resolución UIF 78/2023."],"src":"IV-17"},{"q":"¿Cuál es el principal riesgo al utilizar derivados para cobertura?","opts":["Riesgo de base (diferencia entre activo cubierto y activo del contrato).","Riesgo de contraparte (incumplimiento de la cámara compensadora del mercado).","Riesgo de tipo de cambio (diferencia entre la moneda del contrato y la del activo).","Riesgo de liquidez (imposibilidad de cerrar la posición antes del vencimiento)."],"src":"IV-18"},{"q":"¿Cuál es el objetivo principal de las Normas Internacionales de Información Financiera (NIIF)?","opts":["Uniformar la presentación de estados financieros a nivel global.","Establecer las tasas de interés de referencia para cada país.","Regular las comisiones que cobran los agentes de mercado.","Definir los requisitos de capital
