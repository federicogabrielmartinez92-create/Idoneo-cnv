<title>Idóneo CNV · Estudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Spectral:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: una columna de 920px con barra de secciones fija arriba; tablero → apunte → práctica → simulacro */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --ink:#13202E; --muted:#5A6A7B; --line:#D8DFE6;
  --accent:#1C5A8A; --accent-soft:#E2ECF5; --on-accent:#FFFFFF;
  --ok:#1D7A4D; --ok-soft:#E0F1E8; --bad:#AE3737; --bad-soft:#F7E3E1; --warn:#9A6200; --warn-soft:#F8EDD7;
  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E161F; --surface:#15202B; --ink:#E5ECF2; --muted:#93A3B4; --line:#263441;
  --accent:#72AADA; --accent-soft:#1A2F44; --on-accent:#0E161F;
  --ok:#5DC191; --ok-soft:#14321F; --bad:#E77C74; --bad-soft:#3A1D1C; --warn:#E2AA4C; --warn-soft:#352812; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161F; --surface:#15202B; --ink:#E5ECF2; --muted:#93A3B4; --line:#263441;
  --accent:#72AADA; --accent-soft:#1A2F44; --on-accent:#0E161F;
  --ok:#5DC191; --ok-soft:#14321F; --bad:#E77C74; --bad-soft:#3A1D1C; --warn:#E2AA4C; --warn-soft:#352812; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:920px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:16px;min-height:54px}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;white-space:nowrap}
.brand small{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400;margin-left:6px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-current="true"]{color:var(--ink);background:var(--accent-soft)}
nav.tabs button:hover{color:var(--ink)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:30px}h2{font-size:23px}h3{font-size:18px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:7px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
/* hero */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:stretch}
.hero .lead{display:flex;flex-direction:column;gap:12px;justify-content:center}
.hero p{margin:0;max-width:56ch}
.ticket{border:1px dashed var(--line);border-radius:10px;padding:16px;background:var(--surface);display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.ticket div b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.ticket div span{font-size:12px;color:var(--muted)}
.readiness{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.gauge{flex:1;min-width:200px;height:10px;border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.gauge i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.gauge .mark{position:absolute;top:-3px;bottom:-3px;left:70%;width:2px;background:var(--ink)}
/* module grid */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mod .head{display:flex;gap:10px;align-items:flex-start}
.chip{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.mod h3{font-size:16px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .k{background:var(--ok)}.bar .w{background:var(--bad)}
.legend{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
/* notes */
.modpick{display:flex;gap:6px;flex-wrap:wrap}
.modpick button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;cursor:pointer;font-family:var(--f-mono);font-size:13px}
.modpick button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.notes{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:2px;font-size:13px;max-height:calc(100vh - 100px);overflow:auto}
.toc a{color:var(--muted);text-decoration:none;padding:4px 8px;border-left:2px solid var(--line)}
.toc a:hover{color:var(--ink);border-left-color:var(--accent)}
.article{min-width:0;display:flex;flex-direction:column;gap:28px}
.article section{display:flex;flex-direction:column;gap:10px;scroll-margin-top:80px}
.article p{margin:0;max-width:68ch}
.article ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.keypts{background:var(--accent-soft);border-radius:8px;padding:12px 14px}
.keypts .eyebrow{color:var(--accent);margin-bottom:6px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--bg)}
tr:last-child td{border-bottom:0}
td.v{font-weight:600;font-variant-numeric:tabular-nums}
td.s{color:var(--muted);font-size:12.5px}
.trap{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:0 6px 6px 0}
.formula{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.formula code{font-family:var(--f-mono);font-size:13.5px;background:var(--bg);padding:6px 8px;border-radius:5px;overflow-x:auto;white-space:pre-wrap}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.timer{font-family:var(--f-mono);font-size:20px;font-weight:600;padding:4px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad);border-color:var(--bad)}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.question{font-size:18px;font-weight:600;line-height:1.45;margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);padding:12px 14px;border-radius:8px;cursor:pointer;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .l{font-family:var(--f-mono);font-weight:600;font-size:13px;width:22px;height:22px;flex:none;display:grid;place-items:center;border-radius:5px;background:var(--bg)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:var(--on-accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .l{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.feedback{padding:10px 12px;border-radius:8px;font-weight:600}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.grid-nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px}
.grid-nav button{height:32px;border:1px solid var(--line);background:var(--surface);border-radius:5px;cursor:pointer;font-family:var(--f-mono);font-size:12px}
.grid-nav button.ans{background:var(--accent-soft);border-color:var(--accent)}
.grid-nav button.cur{outline:2px solid var(--ink)}
.grid-nav button.flag{border-color:var(--warn);box-shadow:inset 0 -3px 0 var(--warn)}
.score{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.score .big{font-family:var(--f-mono);font-size:44px;font-weight:600;line-height:1}
.pill{display:inline-block;align-self:flex-start;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.modbars{display:flex;flex-direction:column;gap:8px}
.modbar{display:grid;grid-template-columns:44px 1fr 56px;gap:10px;align-items:center;font-size:13px}
.review{display:flex;flex-direction:column;gap:10px}
.rev{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.rev .yours{color:var(--bad)}.rev .corr{color:var(--ok);font-weight:600}
/* flashcards */
.card{min-height:220px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:22px;display:flex;flex-direction:column;gap:14px;justify-content:center;cursor:pointer}
.card .ans{border-top:1px dashed var(--line);padding-top:14px;font-weight:600;color:var(--ok);font-size:17px}
input[type=search],select{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.hits{display:flex;flex-direction:column;gap:6px}
.hit{border-bottom:1px solid var(--line);padding:8px 0;display:flex;flex-direction:column;gap:2px}
.hit b{color:var(--ok);font-weight:600}
mark{background:var(--warn-soft);color:inherit;padding:0 2px;border-radius:2px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.facts dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.facts dt{color:var(--muted)}.facts dd{margin:0;font-weight:600}
.sims td,.sims th{font-size:13px}
footer{font-size:12px;color:var(--muted);margin-top:40px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:720px){
  .hero{grid-template-columns:1fr}
  .notes{grid-template-columns:1fr}
  .toc{position:static;max-height:none;flex-direction:row;flex-wrap:wrap;gap:4px}
  .toc a{border:1px solid var(--line);border-radius:5px;font-size:12px}
  .brand small{display:none}
  h1{font-size:25px}
  .question{font-size:16.5px}
}
@media (prefers-reduced-motion:no-preference){.gauge i,.bar i,.progress i{transition:width .3s ease}}
</style>

<header class="top"><div class="top-in">
  <div class="brand">Idóneo CNV<small>Mercado de Capitales</small></div>
  <nav class="tabs" id="tabs" aria-label="Secciones">
    <button data-v="home">Inicio</button>
    <button data-v="study">Apuntes</button>
    <button data-v="cards">Fichas</button>
    <button data-v="practice">Práctica</button>
    <button data-v="sim">Simulacro</button>
    <button data-v="errors">Mis errores</button>
    <button data-v="exam">El examen</button>
  </nav>
</div></header>
<main class="wrap" id="app"></main>

<script>
const BANK = {"1":[{"q":"¿Cuál es el objetivo principal de la Ley 26.831?","opts":["Regular, supervisar y fiscalizar el mercado de capitales.","Promover la inversión extranjera directa en el país.","Garantizar la rentabilidad de las inversiones en el mercado.","Establecer las tasas de interés de referencia del sistema financiero."],"src":"I-1"},{"q":"¿Qué organismo es la autoridad de aplicación de la Ley 26.831?","opts":["Comisión Nacional de Valores.","Banco Central de la República Argentina.","Superintendencia de Entidades Financieras y Cambiarias.","Ministerio de Economía de la Nación."],"src":"I-2"},{"q":"¿Cuál de las siguientes NO es una facultad de la Comisión Nacional de Valores?","opts":["Garantizar la rentabilidad de los inversores.","Regular y supervisar el mercado de capitales.","Llevar el registro de agentes y personas idóneas.","Fiscalizar el cumplimiento de la normativa por parte de las emisoras."],"src":"I-3"},{"q":"¿Qué principio rige la adquisición de acciones propias por parte de una emisora?","opts":["Trato igualitario entre todos los accionistas.","Maximización de la rentabilidad para los accionistas mayoritarios.","Prioridad de los accionistas fundadores sobre los minoritarios.","Autorización previa del Banco Central para cada operación."],"src":"I-4"},{"q":"¿Qué documento debe presentar una emisora para solicitar la autorización de oferta pública?","opts":["Prospecto.","Certificado de aptitud emitido por el BCRA.","Dictamen de calificadora de riesgo.","Informe de auditoría externa aprobado por la IGJ."],"src":"I-5"},{"q":"¿Cuál es el plazo mínimo para aceptar una OPA una vez publicada?","opts":["10 días hábiles.","5 días hábiles.","20 días hábiles.","30 días corridos."],"src":"I-6"},{"q":"¿Qué sucede si una oferta pública se realiza sin autorización de la Comisión Nacional de Valores?","opts":["Se considera oferta irregular.","Se convalida automáticamente si no hay objeciones dentro de los 30 días.","La CNV puede regularizarla a pedido del emisor.","Se considera válida si los inversores no presentan reclamos."],"src":"I-7"},{"q":"¿Qué es la DUVA según la Ley 26.831?","opts":["Declaración Unilateral de Adquisición.","Documento Único de Valuación de Activos.","Disposición Unilateral de Venta de Acciones.","Declaración Universal de Valores Admitidos."],"src":"I-8"},{"q":"¿Cuál es la sanción máxima prevista por la Ley 26.831 para incumplimientos graves?","opts":["Multa hasta el quíntuplo del beneficio obtenido.","Inhabilitación permanente del infractor.","Multa hasta el triple del beneficio obtenido.","Prisión de hasta 6 años según la gravedad del hecho."],"src":"I-9"},{"q":"¿Qué condición debe cumplir una PyME para ingresar al régimen PyME CNV?","opts":["Cumplir con los parámetros establecidos por la SEPyME.","Tener cotización en al menos un mercado autorizado por la CNV.","Ser sociedad anónima con un capital mínimo de 50 millones de pesos.","Contar con calificación de riesgo otorgada por entidad registrada."],"src":"I-10"},{"q":"¿Qué significa “oferta pública” según la Ley 26.831?","opts":["Una oferta dirigida al público en general o a sectores indeterminados.","Una oferta exclusivamente dirigida a inversores institucionales registrados.","Una oferta restringida a un máximo de 50 inversores calificados.","Una oferta que requiere un monto mínimo de inversión de 500.000 UVAs por suscriptor."],"src":"I-11"},{"q":"¿Qué norma regula el secreto profesional en el mercado de capitales?","opts":["Ley 26.831, art. 24.","Ley 25.246, art. 21.","Ley 24.083, art. 15.","Ley 19.550, art. 55."],"src":"I-12"},{"q":"¿Cuál es la función del Tribunal Arbitral según la Ley 26.831?","opts":["Resolver controversias entre participantes del mercado.","Sancionar a los agentes que incumplan las normas del mercado.","Aprobar los prospectos de emisión de valores negociables.","Regular las tasas de comisiones que cobran los agentes."],"src":"I-13"},{"q":"¿Qué debe incluir el prospecto de emisión?","opts":["Información financiera, riesgos, características de los valores y datos del emisor.","Información contable auditada, datos del emisor y calificación de riesgo.","Riesgos, características de los valores y opinión del auditor externo.","Datos del emisor, características de los valores y dictamen de la calificadora."],"src":"I-14"},{"q":"¿Qué plazo tiene la emisora para informar la designación de autoridades a la Comisión Nacional de Valores?","opts":["10 días hábiles.","5 días hábiles.","20 días hábiles.","30 días corridos."],"src":"I-15"},{"q":"¿Qué sucede si una emisora no coloca los valores autorizados en el plazo previsto?","opts":["La Comisión Nacional de Valores cancela la autorización de oferta pública.","La CNV puede extender el plazo a pedido fundamentado del emisor.","Se aplica una multa pero la autorización se mantiene vigente.","Se suspende temporalmente la cotización pero no se cancela la autorización."],"src":"I-16"},{"q":"¿Qué principio debe respetarse en toda OPA?","opts":["Igualdad de trato y transparencia.","Máxima rentabilidad para el oferente.","Confidencialidad de las condiciones hasta el cierre.","Preferencia para los accionistas mayoritarios."],"src":"I-17"},{"q":"¿Qué plazo tiene la Comisión Nacional de Valores para resolver la solicitud de autorización de una OPA?","opts":["20 días hábiles.","10 días hábiles.","30 días hábiles.","45 días corridos."],"src":"I-18"},{"q":"¿Qué sucede si el oferente incumple la obligación de formular una OPA?","opts":["La Comisión Nacional de Valores dispone la subasta de las participaciones adquiridas.","El oferente pierde su registro como agente por un año.","La CNV puede extender el plazo para cumplir con la obligación.","No hay consecuencias si el incumplimiento es subsanado dentro de los 30 días hábiles de intimada la sociedad por la Comisión Nacional de Valores."],"src":"I-19"},{"q":"¿Qué es una oferta pública irregular?","opts":["Una oferta sin autorización de la Comisión Nacional de Valores.","Una oferta efectuada fuera de los mercados autorizados.","Una oferta autorizada por un mercado pero no publicada en la Autopista de la Información Financiera.","Una oferta cuyo prospecto no fue actualizado con los estados financieros del último ejercicio."],"src":"I-20"},{"q":"¿Qué condición deben cumplir los aportes irrevocables a cuenta de futuras emisiones?","opts":["Tener contrapartida en un rubro de alta liquidez.","Estar respaldados exclusivamente por garantías reales.","Estar aprobados por unanimidad de la asamblea de accionistas.","Haber sido registrados ante la Inspección General de Justicia."],"src":"I-21"},{"q":"¿Qué plazo tiene la emisora para tratar en asamblea la capitalización de aportes irrevocables?","opts":["6 meses.","12 meses.","3 meses.","18 meses."],"src":"I-22"},{"q":"¿Qué norma establece la responsabilidad de los administradores hacia la Sociedad por daños causados?","opts":["Ley General de Sociedades, art. 274.","Ley 26.831 de Mercado de Capitales, art. 119.","Código Civil y Comercial, art. 146.","Ley 23.576 de Obligaciones Negociables, art. 35."],"src":"I-23"},{"q":"¿Qué artículo del Código Civil y Comercial define la personalidad jurídica?","opts":["Art. 146.","Art. 33.","Art. 299.","Art. 1."],"src":"I-24"},{"q":"¿Qué plazo tiene el oferente para publicar el prospecto de una OPA luego de su aprobación?","opts":["5 días hábiles.","10 días hábiles.","20 días hábiles.","3 días hábiles."],"src":"I-25"},{"q":"¿Qué plazo mínimo debe durar la aceptación de una OPA?","opts":["10 días hábiles.","5 días hábiles.","20 días hábiles.","30 días corridos."],"src":"I-26"},{"q":"¿Qué norma regula las Obligaciones Negociables en Argentina?","opts":["Ley 23.576.","Ley 26.831.","Ley 17.811.","Ley 24.083."],"src":"I-27"},{"q":"¿Qué debe contener el anuncio de una OPA?","opts":["Identificación del oferente, tipo de oferta, condiciones esenciales.","Identificación del oferente, calificación de riesgo del oferente y estados contables del último ejercicio.","Tipo de oferta, dictamen de la calificadora y conformidad previa de la Comisión Nacional de Valores.","Garantía constituida y plazo de liquidación."],"src":"I-28"},{"q":"¿Qué plazo tiene la Comisión Nacional de Valores para objetar el precio equitativo en una OPA?","opts":["20 días hábiles.","10 días hábiles.","30 días hábiles.","5 días hábiles."],"src":"I-29"},{"q":"¿Qué sucede si una emisora decide retirarse del régimen de oferta pública?","opts":["Debe formular una OPA por el total de acciones.","La CNV autoriza el retiro sin condiciones.","Queda deslistada del mercado una vez aprobado el retiro por la asamblea.","Debe notificar a la CNV con 30 días de anticipación y publicar el aviso en la AIF."],"src":"I-30"},{"q":"Emisor Frecuente: ¿cuándo debe informar la intención de efectuar una nueva emisión de valores negociables, considerando que ya cuenta con Registro de Emisor vigente y Prospecto/Suplemento actualizado en la Autopista de la Información Financiera?","opts":["No tiene que informarlo previamente a la Comisión Nacional de Valores, siempre que mantenga su condición y documentación actualizada.","Debe informarlo a la Comisión Nacional de Valores con diez días hábiles de anticipación, acompañando el Suplemento de Prospecto para su revisión previa.","Debe informarlo a la Comisión Nacional de Valores el mismo día de la emisión, sin que ello suspenda la colocación de los valores negociables.","Debe informarlo al mercado en el que liste, que a su vez lo eleva a la Comisión Nacional de Valores para su autorización previa."],"src":"I-31"},{"q":"¿Qué se entiende por Pequeñas y Medianas Empresas Comisión Nacional de Valores (PyME CNV) al sólo efecto del acceso al mercado de capitales, de acuerdo a las Normas (N.T. 2013)?","opts":["Se entiende por PYMES Comisión Nacional de Valores a aquellas que cuentan con “Certificado MiPyME” y se encuentran, por ende, inscriptas en el Registro de Empresas MiPyME a cargo de la autoridad de aplicación instituida por la Ley Nº 24.467.","Se entiende por PYMES CNV al sólo efecto del acceso al mercado de capitales, a las empresas constituidas en el país cuyos ingresos totales anuales expresados en pesos no superen los valores establecidos para cada sector.","Se entiende por PYMES CNV al sólo efecto del acceso al mercado de capitales, a las empresas que desarrollen actividades productivas en el país cuyos ingresos totales anuales expresados en pesos no superen los valores establecidos para cada sector.","Se entiende por PYMES CNV a aquellas que acrediten ante la Comisión Nacional de Valores la condición de pequeña o mediana empresa mediante declaración jurada, sin necesidad de inscripción en el Registro de Empresas MiPyME."],"src":"I-32"},{"q":"“Reales S.A.” es una sociedad que quiere ingresar al régimen de oferta pública para la emisión de obligaciones negociables. Lo consultan a Ud. para saber si en la presentación inicial bajo el régimen general, ante la Comisión Nacional de Valores, el Prospecto debe ser acompañado en dicha presentación. Su respuesta es:","opts":["Sí, porque es un documento básico que se debe acompañar al solicitar el ingreso a la oferta pública.","No, porque es un documento que puede presentarse posteriormente y así ganar tiempo para que revisen la documentación.","Sí, porque es información que hace a la oferta pública de obligaciones negociables.","No, porque el Prospecto se presenta ante el mercado en el que se listen las obligaciones negociables, no ante la Comisión Nacional de Valores."],"src":"I-33"},{"q":"“Reales S.A.” es una sociedad que se encuentra en el régimen de oferta pública y pretende emitir obligaciones negociables cuyos fondos se destinarán a un proyecto de Bonos Verdes, ¿la emisión cumple con los requisitos previstos por Comisión Nacional de Valores?","opts":["Sí, si cumple con los “Lineamientos para la Emisión de Valores Negociables Sociales, Verdes y Sustentables en Argentina” y está admitido por un mercado.","No, porque no se cumple con los destinos admitidos por la Ley de Obligaciones Negociables.","Si, si cumple con los \"Lineamientos para la Emisión de Valores Negociables Temáticos en Argentina\" aunque no cuente con listado en un mercado.","Sí, siempre que la emisión cuente con una calificación de riesgo específica otorgada por un agente registrado, sin necesidad de lineamientos adicionales."],"src":"I-34"},{"q":"“Reales S.A.”, es una sociedad que se encuentra en el régimen de oferta pública para la emisión de obligaciones negociables y se propone refinanciar sus deudas mediante la integración de obligaciones negociables sin oferta pública y/o créditos preexistentes contra ella. En este caso se considera cumplido el requisito de colocación por oferta pública si:","opts":["La nueva emisión resulta suscripta bajo esta forma por acreedores de la sociedad cuyas obligaciones negociables sin oferta pública y/o créditos preexistentes representen un porcentaje que no exceda el 30% del monto total efectivamente colocado, y el porcentaje restante sea suscripto e integrado en efectivo o en especie mediante la entrega de obligaciones negociables originalmente colocadas por oferta pública, u otros valores negociables con oferta pública y listado y/o negociación en mercados autorizados por la Comisión Nacional de Valores.","La nueva emisión resulta suscripta, por acreedores de la sociedad cuyas obligaciones negociables sin oferta pública y/o créditos preexistentes representan un porcentaje que no exceda el 30% del monto total efectivamente colocado, y que el porcentaje restante sea suscripto e integrado en especie entregado obligaciones negociables u originalmente colocadas por oferta pública, u otros valores negociables con oferta pública y listado y/o negociación en mercados autorizados por la CNV.","La nueva emisión resulta suscripta bajo esta forma por acreedores de la sociedad cuyas obligaciones negociables sin oferta pública y/o créditos preexistentes representen un porcentaje que no exceda el 50% del monto total efectivamente colocado, y el porcentaje restante sea suscripto e integrado en efectivo, no admitiéndose la integración en especie.","La nueva emisión resulta suscripta íntegramente por acreedores de la sociedad cuyos créditos preexistentes se capitalicen, siempre que la emisora cuente con la conformidad previa de la Comisión Nacional de Valores y los créditos estén reconocidos en los estados contables."],"src":"I-35"},{"q":"Constituye oferta pública:","opts":["La invitación que se hace a personas en general o a grupos o sectores determinados para la suscripción de valores negociables efectuada por el propio emisor por medio de publicaciones periodísticas, comunicaciones electrónicas, volantes entregados en la vía pública, transmisiones telefónicas, de televisión, proyecciones cinematográficas y colocación de afiches.","La invitación que se hace a personas, en general para la suscripción de acciones efectuada por el propio emisor por medio de publicaciones periódicas, comunicaciones electrónicas y volantes entregados en la vía pública.","La invitación que se hace a personas en general para la suscripción de valores negociables, efectuada por intermediarios registrados, mediante publicaciones periodísticas, comunicaciones electrónicas y afiches, con exclusión de las efectuadas por el propio emisor, aun cuando dichos intermediarios actúen por cuenta y orden del emisor y utilicen transmisiones telefónicas, de televisión o proyecciones cinematográficas.","La invitación que se hace a un grupo determinado de personas vinculadas al emisor para la suscripción de valores negociables, efectuada mediante comunicaciones individuales y confidenciales, por el propio emisor o por intermediarios, sin que resulte relevante el medio utilizado para efectuar la comunicación."],"src":"I-36"},{"q":"Constituye, entre otros, valor negociable:","opts":["Las letras de cambio y Obligaciones Negociables.","Las cartas de crédito y las garantías bancarias.","Los traveler checks y los contratos de mutuo.","Los certificados de plazo fijo y los seguros de caución."],"src":"I-37"},{"q":"Cuando una sociedad realiza una emisión de obligaciones negociables con oferta pública, debe:","opts":["Publicar el aviso de emisión en la Autopista de la Información Financiera;","Publicar el aviso de emisión en el Boletín Oficial e iniciar el trámite de inscripción del mismo.","Publicar el aviso de emisión en el Boletín oficial.","Publicar el aviso de emisión en la Autopista de la Información Financiera y en el Boletín Oficial, dentro de los diez días de la colocación."],"src":"I-38"},{"q":"Dados S.A. es el accionista controlante de Tableros S.A. Dados S.A. se dedica a la construcción, particularmente relacionada con autopistas y obras de envergadura licitadas por el Gobierno Nacional y se encuentra atravesando por un proceso de expansión económica con la necesidad de incorporar nuevos activos fijos que sustenten la misma. Por tal motivo, decide fusionarse por absorción con Tableros S.A. La incorporación del patrimonio de Tableros S.A. sin la necesidad de erogar dinero como forma de pago, sino mediante la emisión de nuevas acciones por incremento de su capital, permitirá a Dados S.A. optimizar sus flujos financieros. En la confección del Prospecto, deciden omitir la inclusión de factores de riesgo relativos a su situación de apalancamiento y liquidez y los efectos de ésta en la fusión. Ud. opina:","opts":["Resulta fundamental incluir a los riesgos respecto a su situación de apalancamiento y liquidez y sus efectos en el Prospecto de fusión.","No es necesario incluir riesgos adicionales si Dados S.A. ya tiene prospecto aprobado.","Solo se deben incluir los riesgos propios de Tableros S.A., sin considerar la situación de apalancamiento y liquidez del grupo controlante, por tratarse de sociedades distintas.","La relación de control no tiene impacto en los riesgos a revelar en el Prospecto."],"src":"I-39"},{"q":"De acuerdo a la Ley de Mercado de Capitales, para que exista “actuación concertada” debe existir:","opts":["Actuación coordinada de dos (2) o más personas, según un acuerdo o entendimiento formal o informal, para cooperar activamente en la adquisición, tenencia o disposición de acciones u otros valores o derechos convertibles en acciones de una entidad cuyos valores negociables están admitidos a la oferta pública.","Actuación coordinada de una persona humana, para cooperar activamente en la adquisición, tenencia o disposición de acciones u otros valores o derechos convertibles en acciones de una entidad cuyos valores negociables están admitidos a la oferta pública.","Actuación coordinada de 2 o más personas, sea actuando por intermedio de cualquiera de dichas personas a través de cualquier sociedad u otra forma asociativa en general, o por intermedio de otras personas, a través de cualquier sociedad u otra forma asociativa en general o por intermedio de otras personas a través de cualquier persona, vinculada a esta/s persona/s, para cooperar activamente en la adquisición de acciones u otros valores o derechos convertibles en acciones de una entidad cuyos valores negociables no están admitidos a la oferta pública.","Actuación coordinada de dos (2) o más personas vinculadas por una relación de control, según un acuerdo formal, para cooperar en la adquisición de acciones de una entidad cuyos valores negociables están admitidos a la oferta pública, quedando excluidos los entendimientos informales."],"src":"I-40"},{"q":"El registro de accionistas de una sociedad emisora está a cargo de:","opts":["La propia emisora, bancos o Caja de Valores;","La propia emisora, la Comisión Nacional de Valores o el mercado donde liste;","La Caja de Valores o el Registro Público;","El agente de custodia, registro y pago designado por la Comisión Nacional de Valores;"],"src":"I-41"},{"q":"Las acciones preferidas con preferencia patrimonial:","opts":["Tendrán derecho de voto si se encuentra en mora en recibir los beneficios que constituyen su preferencia.","No tendrán derecho de voto aunque la sociedad esté en mora en el pago de los beneficios que constituyen su preferencia.","Tendrán derecho de voto en todos los casos, en igualdad de condiciones con las acciones ordinarias.","Tendrán derecho de voto mientras la sociedad no se encuentre en mora en el pago de los beneficios que constituyen su preferencia."],"src":"I-42"},{"q":"Una vez en el régimen de Oferta Pública por acciones:","opts":["No pueden emitirse acciones ordinarias con voto privilegiado, salvo en casos de ajuste de capital.","pueden emitirse acciones ordinarias con voto privilegiado.","pueden emitirse acciones ordinarias y preferidas ambas con voto privilegiado.","No pueden emitirse acciones ordinarias con voto privilegiado, salvo que la emisión cuente con la conformidad previa de la Comisión Nacional de Valores."],"src":"I-43"},{"q":"La colocación primaria de valores negociables deberá efectuarse mediante:","opts":["Formación de libro o subasta o licitación pública.","Subasta o licitación pública abierta.","Book Building.","Colocación directa por el emisor, sin intervención de agentes."],"src":"I-44"},{"q":"En una oferta pública de adquisición de acciones (OPA) el oferente debe contar con una garantía emitida por:","opts":["Entidades financieras locales o extranjeras (estas últimas con sucursal o representación permanente en la República Argentina) o compañías de seguros del país fiscalizadas por la SSN, previa autorización de la Comisión Nacional de Valores.","Entidades financieras locales o compañías de seguros del país fiscalizadas por la SSN, quedando excluidas las entidades financieras extranjeras aun cuando tengan sucursal o representación permanente en la República Argentina.","Entidades financieras locales o extranjeras con sucursal en el país, o el mercado en el que listen las acciones objeto de la oferta, sin necesidad de autorización previa de la Comisión Nacional de Valores.","Compañías de seguros del país o del exterior fiscalizadas por la SSN, o sociedades de garantía recíproca autorizadas, previa autorización de la Comisión Nacional de Valores."],"src":"I-45"},{"q":"La negociación de Cheques de Pago Diferido avalados emitidos por una PyME requiere:","opts":["El aval de una SGR para su negociación en el mercado.","Solamente pueden negociarse instrumentos cuyo vencimiento se produzca a partir de los 20 días corridos desde la fecha de la decisión de descontarlo/negociarlo en el mercado de capitales.","El plazo y monto mínimo son definidos por los Mercados.","El aval de una entidad financiera, sin posibilidad de aval de una SGR."],"src":"I-46"},{"q":"La sociedad AGRICOLA FEDERAL S.A. necesita u$s100.000.000 para financiar un proyecto de inversión. Para ello le consulta a su asesor qué tipo de instrumentos puede emitir. ¿En cuál de estos instrumentos debe requerirse la previa autorización de oferta pública ante la Comisión Nacional de Valores?","opts":["Emisión primaria de acciones a ser ofrecidas y colocadas en el país y en el exterior.","Venta del 3% del paquete accionario del grupo de control para ser negociado en el país y en el exterior.","Cheques de pago diferido y/o pagarés para ser negociados en el mercado.","Emisión de obligaciones negociables bajo el Régimen de Oferta Privada para ser colocadas entre inversores calificados del exterior."],"src":"I-47"},{"q":"La sociedad LA VIÑA S.A. solicita el ingreso a la oferta pública para financiar un proyecto de inversión mediante la emisión de acciones y sus estados contables tienen un patrimonio neto negativo pero el ratio del EBITDA indica lo contrario. Lo consultan a Ud. para saber si la Comisión Nacional de Valores otorgará autorización para el ingreso al régimen de oferta pública para emisión de acciones. ¿Cuál será su respuesta?","opts":["La Comisión Nacional de Valores autoriza el ingreso a la oferta pública de sociedades con patrimonio neto negativo en la medida que estén explicados en el prospecto los riesgos de la emisora.","La Comisión Nacional de Valores no autoriza el ingreso a la oferta pública de sociedades con patrimonio neto negativo, salvo que el EBITDA positivo se haya mantenido durante los tres últimos ejercicios.","La Comisión Nacional de Valores autoriza el ingreso a la oferta pública de sociedades con patrimonio neto negativo en la medida que la emisión se destine íntegramente a recomponer el patrimonio.","La Comisión Nacional de Valores autoriza el ingreso a la oferta pública de sociedades con patrimonio neto negativo en la medida que un mercado autorizado haya admitido previamente el listado de las acciones."],"src":"I-48"},{"q":"La sociedad Lost Cities Inc. es una sociedad holding de capital extranjero y tiene listadas sus acciones en el TSX Ventures Exchange de Toronto, Canadá. Esta sociedad no tiene activos fijos en dicho país y tiene concesiones para la exploración y explotación de gas y petróleo en las provincias de Salta y Río Negro mediante su participación en Lost Cities S.R.L. En Argentina, la sociedad holding constituyó una sucursal según el art. 118 LGS. La sociedad holding solicita el ingreso a la oferta pública. Lo consultan sobre los factores de riesgo principales y Ud. opina que éstos:","opts":["Son que la sociedad holding depende de los resultados de sus subsidiarias para cumplir con sus obligaciones contractuales y pagar dividendos a sus accionistas.","Son la falta de activos fijos de la sociedad holding en el lugar de constitución, lo que impide acreditar el patrimonio mínimo exigido para el ingreso a la oferta pública.","Son que la sucursal constituida según el art. 118 LGS no puede ser titular de las concesiones de exploración y explotación otorgadas por las provincias.","Son que las acciones listadas en el TSX Ventures Exchange no pueden ser objeto de oferta pública en la Argentina sin un programa de CEDEARs previamente autorizado."],"src":"I-49"},{"q":"Las personas jurídicas sujetas a control societario de la Comisión Nacional de Valores deben solicitar la inscripción registral de:","opts":["Los miembros del Directorio;","Los miembros del Directorio, de la Comisión Fiscalizadora y del Comité de Auditoría.","Los miembros del Comité de Auditoría.","Los miembros de la Comisión Fiscalizadora."],"src":"I-50"},{"q":"Las siguientes personas jurídicas se encuentran bajo control societario de la Comisión Nacional de Valores:","opts":["Todas las entidades encuadradas en la Ley Nº 22.169, excluidas las PyME CNV Garantizadas.","Las mencionadas en la ley 22.169, incluidas las encuadradas en el régimen PyME CNV garantizadas.","Las emisiones de acciones con o sin autorización de oferta pública.","Todas las entidades encuadradas en la Ley Nº 22.169, incluidas las sociedades admitidas al régimen de oferta privada."],"src":"I-51"},{"q":"Las Sociedades de Garantía Recíproca tienen por objeto principal….","opts":["Otorgar garantías a sus socios partícipes mediante la celebración de contratos.","Brindar créditos a las PyME.","Otorgar avales a las PyME, que son socios protectores.","Administrar fondos de riesgo por cuenta de sus socios protectores."],"src":"I-52"},{"q":"Las Sociedades de Responsabilidad Limitada que califican como PYMEs Comisión Nacional de Valores tienen un tope máximo de emisión:","opts":["Estipulado por parámetros de Comisión Nacional de Valores y resolución de su Reunión de Socios.","Pueden emitir obligaciones negociables bajo el régimen general sin restricciones.","Deben inscribirse previamente como Sociedad Anónima para acceder al mercado de capitales.","No pueden acceder al mercado de capitales por su tipo societario."],"src":"I-53"},{"q":"Lo consultan a Ud. si en el Prospecto de una emisión de acciones de una Sociedad debe incluirse como factor de riesgo unos contratos de Préstamos de Capital de Trabajo que están próximos a vencer y se encuentran garantizados con las participaciones de la Sociedad a través de una sociedad subsidiaria. ¿Cuál es su respuesta?","opts":["Hay que incluirlos porque son factores de riesgo a pesar de que estén próximos a vencer.","No es necesario incluirlo como factor de riesgo si los préstamos están al día.","Solo debe incluirse si el monto del préstamo supera el 50% del patrimonio neto.","Debe informarse en nota a los estados contables, sin que corresponda su inclusión en el Prospecto."],"src":"I-54"},{"q":"Los responsables por la información contenida en el Prospecto son:","opts":["Los emisores de valores negociables, oferentes de valores negociables, las personas que lo firmen y los expertos o terceros que opinen sobre ciertas partes del Prospecto;","Los emisores de valores negociables, el mercado en el que listen y los agentes colocadores, con exclusión de los expertos o terceros que opinen sobre ciertas partes del Prospecto;","Los directores de la emisora y los accionistas controlantes, en forma solidaria, con exclusión de las personas que firmen el Prospecto en representación de la sociedad;","Los emisores de valores negociables y la Comisión Nacional de Valores, en virtud de la autorización de oferta pública otorgada sobre el documento;"],"src":"I-55"},{"q":"Los valores negociables comprendidos en el régimen PyME CNV:","opts":["Sólo podrán ser adquiridos por los inversores calificados que se encuentren dentro de las categorías establecidas en las Normas de la Comisión Nacional de Valores.","Podrán ser adquiridos por cualquier inversor, siempre que el agente acredite el perfil de riesgo del cliente conforme las Normas de la Comisión Nacional de Valores.","Sólo podrán ser adquiridos por inversores calificados y deberán contar como mínimo con una calificación de riesgo emitida por un agente registrado ante la Comisión Nacional de Valores.","Podrán ser adquiridos por inversores no calificados hasta un monto máximo por persona fijado por las Normas de la Comisión Nacional de Valores."],"src":"I-56"},{"q":"Para la emisión de obligaciones negociables del régimen general, el Suplemento de Prospecto de una serie se publica en la Autopista de la Información Financiera:","opts":["Cuando el programa está vigente/actualizado y el Suplemento incorpore la información actualizada del Prospecto del programa global.","Cuando el programa está vigente y la Comisión Nacional de Valores haya otorgado la autorización previa específica para la publicación del Suplemento de Prospecto de la serie.","Cuando la serie haya sido colocada y el Suplemento refleje el resultado de la colocación y la tasa de corte efectivamente obtenida.","Cuando el mercado en el que se listarán las obligaciones negociables haya aprobado el Suplemento y el Prospecto del programa global."],"src":"I-57"},{"q":"Para saber cuál es el capital social de una sociedad emisora, puedo consultar:","opts":["El estatuto social y los estados contables.","El acta de directorio y los libros contables.","El registro de accionistas y la memoria anual.","El prospecto de emisión y el acta de asamblea."],"src":"I-58"},{"q":"Para saber qué actividades tiene permitido desarrollar una sociedad emisora, debo revisar:","opts":["El estatuto social.","Los estados contables del último ejercicio.","El informe de la calificadora de riesgo.","El acta de la última asamblea de accionistas."],"src":"I-59"},{"q":"Se requiere la presentación de una adenda al Prospecto para los siguientes casos:","opts":["Modificación de términos y condiciones, prórroga de vigencia del Programa y/o aumento del monto de Programa.","Modificación de términos y condiciones y/o prórroga de vigencia del Programa.","Modificación de términos y condiciones, aumento del monto de Programa y/o prórroga de vigencia del Programa, sólo cuando no es necesario actualizar el prospecto ni modificar otra información.","Modificación de términos y condiciones, prórroga de vigencia del Programa y/o cambio de la sociedad depositaria del Programa."],"src":"I-60"},{"q":"Según la definición de PyME CNV de las Normas CNV (T.O. 2013) las mismas deben:","opts":["Cumplir con los requisitos de SEPYME.","Cumplir con los requisitos de Secretaría de la Pequeña y Mediana Empresa y los Emprendedores y Normas de CNV.","Estar constituidas y desarrollar actividades productivas en el país.","Cumplir con los requisitos de la Comisión Nacional de Valores, sin necesidad de encuadrar en los parámetros de SEPYME."],"src":"I-61"},{"q":"El régimen informativo de las Pymes Garantizadas:","opts":["Es menor al de las Pymes Comisión Nacional de Valores.","Es idéntico al del régimen general de oferta pública.","Es mayor al de las Pymes CNV por requerimientos de las SGR.","No existe régimen informativo específico para Pymes Garantizadas."],"src":"I-62"},{"q":"Si necesito cursar una notificación a la sociedad emisora, en un trámite de autorización de oferta pública, para que la misma sea válida y vinculante, debo hacerlo a:","opts":["La sede social inscripta.","El domicilio fiscal registrado ante la AFIP.","El domicilio del representante legal del emisor.","Cualquier domicilio que la emisora haya constituido ante la CNV."],"src":"I-63"},{"q":"Si una persona jurídica con domicilio en la Provincia de Santa Fe, bajo el régimen general de oferta pública quiere cambiar su denominación social, deberá:","opts":["Reformar su estatuto y obtener la conformidad de la Comisión Nacional de Valores e inscripción en el Registro Público;","Reformar su estatuto, y obtener la conformidad de la CNV e inscripción en el Registro Público y la transferencia de oferta pública correspondiente.","Reformar su estatuto y solicitar la inscripción directamente ante el Registro Público y registrar el cambio de denominación en la CNV.","Reformar su estatuto, obtener la conformidad de la Inspección General de Justicia e inscripción en el Registro Público de la Provincia de Santa Fe."],"src":"I-64"},{"q":"Al alcanzar el 95% de las acciones de una sociedad admitida al régimen de oferta pública, ante intimación del minoritario, corresponde:","opts":["Que la sociedad controlante lance una Declaración Unilateral de Voluntad de Adquisición (DUVA).","Que la sociedad controlante solicite la suspensión de la cotización.","Que la CNV convoque a asamblea para decidir el futuro de la sociedad.","Que los accionistas minoritarios puedan solicitar la intervención judicial para forzar la venta de sus tenencias a precio equitativo."],"src":"I-65"},{"q":"Una sociedad admitida al régimen de la oferta pública para emisión de acciones quiere ingresar al régimen de emisor frecuente de obligaciones negociables. Ud. Opina:","opts":["Es posible, pero se deberá ingresar como emisor de obligaciones negociables y cumplir con los requisitos previstos por Comisión Nacional de Valores.","No es posible porque la sociedad está admitida como emisor de acciones.","Es posible porque es un emisor de acciones siempre que cumpla los requisitos de frecuencia previstos por CNV.","Es posible sin trámite adicional, dado que la admisión al régimen de oferta pública por acciones comprende la condición de emisor frecuente de obligaciones negociables."],"src":"I-66"},{"q":"Una sociedad emisora de acciones constituida en el extranjero, cuyas acciones listan en el mercado español y argentino, decide retirarse del régimen de la oferta pública argentino. Para ello, le consultan a Ud. si se debe realizar una oferta pública de adquisición. ¿Cuál es su respuesta?","opts":["No es obligatorio si las acciones listan en otro mercado, tienen liquidez igual o superior al mercado local y se garantiza mantener las tenencias y/o proceder a la venta en los mercados en donde continúen listando.","Es obligatorio formular una oferta pública de adquisición por el total de las acciones en el mercado argentino, aun cuando las acciones continúen listando en el mercado español con liquidez igual o superior.","No es obligatorio siempre que la emisora obtenga la conformidad previa del regulador español y de la Comisión Nacional de Valores, y mantenga el listado en ambos mercados durante un año.","No es obligatorio si la emisora ofrece a los accionistas locales la conversión de sus tenencias en CEDEARs listados en el mercado argentino, con garantía de un agente de custodia."],"src":"I-67"},{"q":"Una sociedad extranjera solicita el ingreso a la oferta pública sin venta de acciones nuevas. Este caso se trata de:","opts":["Oferta pública secundaria.","Oferta pública primaria.","Oferta pública inicial (IPO).","Oferta pública de canje."],"src":"I-68"},{"q":"Qué es un CEDEAR.","opts":["Un CERTIFICADO DE DEPÓSITO DE VALORES EXTRANJEROS que se negocia en el país.","Un valor negociable que cotiza en USA.","Un certificado que se negocia localmente y representa activos listados para cotizar en el exterior.","Un certificado de depósito de valores argentinos que se negocia en el exterior."],"src":"I-69"},{"q":"Una sociedad extranjera que se dedica a la explotación minera posee una mina de yacimientos de oro en San Juan a través de una concesión de propiedad de una de sus subsidiarias. La sociedad minera extranjera cotiza en la Bolsa de Toronto (Canadá), pero también quiere ingresar al régimen de oferta pública por acciones en Argentina, con los menores costos y cumplimiento de requisitos. Ud. qué le aconsejaría:","opts":["Que solicite el ingreso al Régimen de Doble Listado.","Que constituya una subsidiaria local como sociedad anónima argentina.","Que emita CEDEARs exclusivamente para el mercado argentino.","Que transfiera la propiedad de la mina a una sociedad local."],"src":"I-70"},{"q":"Ud. está asesorando a una PYME que quiere emitir obligaciones negociables y le debe explicar qué diferencias hay entre emitir como una PyME CNV o una PyME CNV Garantizada:","opts":["Bajo el Régimen PyME CNV Garantizada no debe presentar estados contables una vez admitida a la oferta pública. Asimismo, bajo el Régimen PyME CNV Garantizada el control societario continúa siendo el Registro Público de su jurisdicción.","Bajo el Régimen PyME CNV Garantizada la emisora debe presentar estados contables trimestrales una vez admitida a la oferta pública, y el control societario pasa a estar a cargo de la Comisión Nacional de Valores.","Bajo el Régimen PyME CNV el control societario continúa siendo el Registro Público de su jurisdicción, mientras que bajo el Régimen PyME CNV Garantizada el control societario pasa a la Comisión Nacional de Valores.","Bajo ambos regímenes la emisora queda bajo control societario de la Comisión Nacional de Valores, pero sólo bajo el Régimen PyME CNV Garantizada queda eximida de presentar estados contables."],"src":"I-71"},{"q":"La reventa de los valores negociables en una Oferta Privada podrá efectuarse de la siguiente manera:","opts":["Sin limitación cuando la transferencia sea efectuada fuera de la República Argentina.","Sin limitación cuando la transferencia sea efectuada dentro de la República Argentina entre inversores calificados.","Dentro de los mercados autorizados por la CNV, a partir del sexto mes.","Mediante oferta pública con autorización previa de la CNV, cualquiera sea el lugar de la transferencia."],"src":"I-72"},{"q":"Una oferta de valores negociables será considerada una Oferta Extraterritorial, cuando reúna, entre otras, las siguientes condiciones:","opts":["No hay limitación en la cantidad de potenciales inversores ni al precio ni en el monto de los valores negociables adquiridos por los inversores bajo esta oferta, sin necesidad de cumplimiento de requisito alguno.","No hay limitación en la cantidad de potenciales inversores, pero el monto colocado no podrá superar el equivalente a 7.000.000 de UVAs por emisión, sin necesidad de otro requisito ni de intervención de un agente registrado.","Se limita a cincuenta (50) potenciales inversores calificados y la reventa en el país queda sujeta a la autorización previa de la Comisión Nacional de Valores.","No hay limitación en el monto ni en el precio, pero los valores negociables deberán estar listados en un mercado del exterior reconocido por la Comisión Nacional de Valores."],"src":"I-73"},{"q":"A raíz de las modificaciones de la R.G. 1088/2025, las invitaciones a realizar operaciones con valores negociables en una Oferta Privada, por emisión, podrán ser efectuadas a un número máximo de potenciales inversores, según el siguiente detalle:","opts":["Treinta (30) potenciales Inversores no Calificados y cincuenta (50) potenciales Inversores Calificados.","Quince (15) potenciales Inversores no Calificados y treinta (30) potenciales Inversores Calificados.","Cincuenta (50) potenciales Inversores no Calificados y treinta (30) potenciales Inversores Calificados.","Treinta (30) potenciales Inversores en total, sin distinción entre Calificados y no Calificados."],"src":"I-74"},{"q":"Las operaciones con valores negociables en una Oferta Privada podrán ser celebradas según el siguiente detalle:","opts":["Por un máximo de treinta y cinco (35) adquirentes.","Por un máximo de cincuenta (50) adquirentes.","Sin límite de adquirentes si son todos Inversores Calificados.","Por un máximo de quince (15) adquirentes no calificados."],"src":"I-75"},{"q":"Respecto de la obligación de confidencialidad en una Oferta Privada:","opts":["Podrá ser renunciada de manera expresa por los inversores y por los demás intervinientes en la oferta respectiva a favor de los inversores.","Podrá ser renunciada de manera expresa por el emisor y por los demás intervinientes en la oferta respectiva a favor del emisor.","Podrá ser renunciada de manera tácita por los inversores mediante la reventa de los valores negociables dentro de la República Argentina.","Podrá ser renunciada mediante comunicación previa a la Comisión Nacional de Valores por parte del emisor y de los inversores."],"src":"I-76"},{"q":"Las Ofertas Públicas con Autorización Automática por su Bajo Impacto de Obligaciones Negociables:","opts":["Serán consideradas Ofertas Públicas autorizadas y regulares, quedando exentas de sanciones disciplinarias relacionadas con la Oferta Pública irregular de valores negociables.","Serán consideradas Ofertas Privadas con dispensa, quedando sujetas a las limitaciones de reventa y de número de destinatarios previstas para ese régimen.","Serán consideradas Ofertas Públicas en trámite, quedando sujetas a la autorización posterior de la Comisión Nacional de Valores dentro de los plazos previstos por las Normas.","Serán consideradas Ofertas Públicas autorizadas, pero quedarán sujetas a sanciones disciplinarias si el monto emitido supera el límite previsto para el régimen."],"src":"I-77"},{"q":"Respecto de la negociación secundaria de las obligaciones negociables emitidas bajo el Régimen de Autorización Automática por su Bajo Impacto, se establece lo siguiente:","opts":["Los mercados deberán adecuar el ingreso a sus plataformas digitales de manera de no desvirtuar la simplicidad de emisión prevista por este Régimen.","Los mercados deberán someter cada solicitud de listado a la aprobación previa de la Comisión Nacional de Valores, a fin de verificar el cumplimiento de los requisitos del Régimen.","Los mercados deberán habilitar la negociación en un segmento diferenciado reservado a inversores calificados.","Los mercados podrán negarse a listar estas obligaciones negociables, en cuyo caso la negociación secundaria deberá efectuarse fuera de los mercados autorizados."],"src":"I-78"},{"q":"Con relación al Régimen de Autorización Automática de Acciones por su Mediano Impacto, se estipula que:","opts":["No podrán acogerse emisores sujetos a privatización, con participación estatal/FGS, entidades financieras o bancarias; tampoco mercados autorizados por Comisión Nacional de Valores ni emisores de servicios públicos.","Podrán acogerse emisores sujetos a privatización y entidades financieras, pero no los mercados autorizados por la Comisión Nacional de Valores ni los emisores de servicios públicos.","No podrán acogerse emisores con participación estatal o del FGS, pero sí las entidades financieras y bancarias, siempre que cuenten con autorización previa del BCRA.","No podrán acogerse emisores de servicios públicos ni mercados autorizados por la Comisión Nacional de Valores; las entidades financieras podrán hacerlo con conformidad previa del BCRA y presentación de sus estados contables auditados del último ejercicio."],"src":"I-79"},{"q":"Los remates de valores negociables, judiciales o extrajudiciales, que provengan de la ejecución de garantías reales o fideicomisos de garantía, tendrán Autorización Automática para Oferta Pública siempre que:","opts":["Se cumplan las normas previstas por el mercado en donde se lleve a cabo el proceso de subasta.","Se obtenga la conformidad previa de la CNV respecto del precio base de la subasta.","Los valores negociables subastados cuenten con calificación de riesgo vigente emitida por un agente registrado.","El juez o el fiduciario de garantía notifique a la Comisión Nacional de Valores con diez días hábiles de anticipación."],"src":"I-80"},{"q":"En las Ofertas Públicas con Autorización Automática por su Bajo Impacto, el valor nominal de las acciones a emitir en concepto de suscripción inicial:","opts":["Si la integración es en moneda extranjera, se calcula con Tipo de Cambio de Referencia (Com. “A” 3500 BCRA; o tipo vendedor BNA si no es USD).","Si la integración es en moneda extranjera, se calcula con el tipo de cambio comprador del Banco de la Nación Argentina del día hábil anterior a la integración.","Si la integración es en moneda extranjera, se calcula con el Tipo de Cambio de Referencia (Com. “A” 3500 BCRA), no admitiéndose otra moneda que el dólar estadounidense.","Si la integración es en moneda extranjera, se calcula con el tipo de cambio fijado por el mercado en el que listen las acciones al cierre del período de suscripción."],"src":"I-81"},{"q":"Las emisoras que se encuentren comprendidas en el Régimen de Oferta Pública Automática de Acciones por su Bajo Impacto podrán:","opts":["Solicitar el cambio a dicho Régimen General por acciones, sin que ello implique el retiro del Régimen de Oferta Pública o la obligación de efectuar una Oferta Pública de Adquisición por Retiro.","Solicitar el cambio a dicho Régimen General por acciones, debiendo previamente retirarse del Régimen de Oferta Pública y efectuar una Oferta Pública de Adquisición por Retiro.","Solicitar el cambio a dicho Régimen General por acciones mediante una nueva emisión de acciones por suscripción sometida a la autorización previa de la Comisión Nacional de Valores.","Permanecer en el Régimen Automático sin posibilidad de cambio, hasta tanto transcurran doce meses desde la última emisión efectuada bajo ese Régimen."],"src":"I-82"},{"q":"Para calcular el límite máximo de 7.000.000 de UVAs previsto para el Régimen de Oferta Pública Automática de Acciones por su Mediano Impacto:","opts":["Se considerarán como parte de una misma oferta a todas las emisiones de acciones por suscripción que realice el Emisor bajo el presente régimen durante los 12 meses anteriores contados desde la última fecha de emisión de acciones bajo este Régimen.","Se considerarán como parte de una misma oferta a todas las emisiones de acciones por suscripción que realice el Emisor bajo el presente régimen durante los 24 meses anteriores contados desde la última fecha de emisión.","Se considerarán como parte de una misma oferta a todas las emisiones de acciones, incluidas las realizadas bajo el Régimen General, durante el ejercicio económico en curso del Emisor.","Se considerará cada emisión de acciones por suscripción en forma independiente, computándose el límite sobre el valor de mercado de las acciones a la fecha de cada emisión."],"src":"I-83"},{"q":"El Emisor Frecuente mantendrá vigente su condición bajo las siguientes condiciones:","opts":["No tendrá necesidad de ratificación periódica de su condición.","Deberá ratificar su condición anualmente ante la CNV.","Perderá su condición si no emite al menos una vez cada seis meses.","Deberá obtener una nueva calificación de riesgo cada dos años."],"src":"I-84"},{"q":"En lo atinente al plazo de difusión para la colocación primaria de los valores negociables, el mismo:","opts":["Deberá ser suficiente para garantizar el adecuado conocimiento por parte del público inversor.","Es fijo en 5 días hábiles para todos los valores negociables, contados desde la publicación del aviso de suscripción en la Autopista de la Información Financiera.","No existe plazo mínimo de difusión para emisores frecuentes.","Es de 48 horas corridas desde la publicación en el boletín oficial."],"src":"I-85"},{"q":"La actualización del Prospecto con consecuencia de la aprobación de Estados Financieros correspondientes a un nuevo ejercicio anual, será:","opts":["Optativa, acompañando un informe de contador público independiente que emita opinión sobre la información contenida en dicho documento.","Obligatoria, acompañando un informe de contador público independiente que emita opinión sobre la información contenida en dicho documento.","Optativa, debiendo en caso de efectuarse obtener la autorización previa de la Comisión Nacional de Valores antes de su publicación.","Optativa, sin necesidad de informe de contador público, siempre que los estados financieros hayan sido aprobados sin salvedades por la asamblea."],"src":"I-86"},{"q":"A fin de apelar una sanción aplicada por la Comisión Nacional de Valores, el recurso directo se interpone y se funda:","opts":["Ante la Comisión Nacional de Valores.","Ante el órgano jurisdiccional correspondiente.","Ante la Comisión Nacional de Valores o el órgano jurisdiccional correspondiente, en forma indistinta.","Ante el Tribunal Arbitral del mercado donde se originó la infracción."],"src":"I-87"},{"q":"A efectos de apelar una sanción impuesta por la Comisión Nacional de Valores, el recurso directo debe interponerse y fundarse:","opts":["Dentro de los 10 días hábiles de la notificación del acto recurrido.","Dentro de los quince (15) días hábiles de la notificación del acto recurrido.","Dentro de los cinco (5) días hábiles de la notificación del acto recurrido.","Dentro de los treinta (30) días hábiles de la notificación del acto recurrido."],"src":"I-88"},{"q":"El recurso directo interpuesto contra una sanción impuesta por la Comisión Nacional de Valores, se concederá:","opts":["Con efecto devolutivo, con excepción del recurso contra la imposición de multa que será con efecto suspensivo.","Con efecto suspensivo, con excepción del recurso contra la imposición de multa que será con efecto devolutivo.","Con efecto devolutivo en todos los casos, incluido el recurso contra la imposición de multa.","Con efecto suspensivo, con excepción del recurso contra la inhabilitación que será con efecto devolutivo."],"src":"I-89"},{"q":"A los fines de la fijación de sanciones por parte de la Comisión Nacional de Valores, ésta, entre otras pautas de graduación, deberá tener especialmente en cuenta:","opts":["La actuación individual de los miembros de los órganos de administración y fiscalización y su vinculación con el grupo de control, en particular, el carácter de miembro independiente o externo de dichos órganos, y la magnitud de la infracción.","La actuación colectiva de los órganos de administración y fiscalización, sin distinguir entre sus miembros, y el perjuicio económico efectivamente causado a los inversores, con independencia del carácter de miembro independiente o externo de los integrantes de dichos órganos.","La actuación individual de los miembros de los órganos de administración, con exclusión de los miembros independientes o externos, y la reincidencia del infractor.","La vinculación del infractor con el grupo de control y la evolución de la cotización de los valores negociables de la emisora en los seis meses posteriores a la infracción."],"src":"I-90"},{"q":"Las multas que como sanción imponga la Comisión Nacional de Valores devengarán intereses, los que no podrán exceder:","opts":["En una vez y media el interés que aplica el Banco de la Nación Argentina en sus operaciones de descuento para documentos comerciales.","En dos veces el interés que aplica el Banco de la Nación Argentina en sus operaciones de descuento para documentos comerciales.","En una vez y media la tasa que aplica el Banco Central de la República Argentina en sus operaciones de pases pasivos.","En una vez y media el interés que aplica el Banco de la Nación Argentina en sus operaciones de depósito a plazo fijo a treinta días."],"src":"I-91"},{"q":"La prescripción de las acciones que nacieran de las infracciones al régimen de la Ley de Mercado de Capitales N° 26.831 y de la Ley de Fondos Comunes de Inversión N° 24.083 operará:","opts":["A los seis (6) años de la comisión del hecho que la configure.","A los cuatro (4) años de la comisión del hecho que la configure.","A los diez (10) años de la comisión del hecho que la configure.","A los dos (2) años de la comisión del hecho que la configure."],"src":"I-92"},{"q":"El plazo de la prescripción de las acciones que nacieran de las infracciones al régimen de la Ley de Mercado de Capitales N° 26.831 y de la Ley de Fondos Comunes de Inversión N° 24.083 se interrumpirá:","opts":["Por la resolución del Directorio de la Comisión Nacional de Valores que ordene la apertura del sumario administrativo y por los actos y diligencias de procedimiento inherentes a la sustanciación del sumario teniendo “como tales la apertura a prueba, el cierre del período probatorio y la convocatoria para alegar, con sus respectivas notificaciones.","Por la presentación de la denuncia ante la Comisión Nacional de Valores y por la notificación al sumariado de la propuesta de cargos, no así por los actos posteriores de sustanciación del sumario, cualquiera sea su naturaleza.","Por la resolución del Directorio de la Comisión Nacional de Valores que ordene la apertura del sumario administrativo, no así por los actos y diligencias posteriores inherentes a su sustanciación, como la apertura a prueba, el cierre del período probatorio o la convocatoria para alegar, los que deberán ser notificados al sumariado pero no producen efecto interruptivo alguno sobre el plazo de prescripción.","Por la resolución del Directorio de la Comisión Nacional de Valores que ordene la apertura del sumario y por la interposición de causas ante la justicia con competencia en lo criminal sobre los mismos hechos, con sus respectivas notificaciones."],"src":"I-93"},{"q":"Las sanciones que puede disponer la Comisión Nacional de Valores por infracciones al régimen de la Ley de Mercado de Capitales N° 26.831 y de la Ley de Fondos Comunes de Inversión N° 24.083:","opts":["Deben ser aplicadas, mediante resolución fundada, previo sumario.","Pueden ser aplicadas sin sumario previo.","Deben ser aplicadas, mediante resolución fundada, previo sumario, salvo la sanción de apercibimiento.","Deben ser aplicadas, mediante resolución fundada, previo sumario, con la conformidad del Ministerio de Economía."],"src":"I-94"},{"q":"La existencia de causas ante la justicia con competencia en lo criminal con respecto a conductas descriptas en la Ley de Mercado de Capitales N° 26.831 y que pudieren también dar lugar a condenas en esa sede:","opts":["No obstará a la prosecución y conclusión del trámite de los sumarios respectivos en la Comisión Nacional de Valores.","Obstará a la prosecución y conclusión del trámite de los sumarios respectivos en la Comisión Nacional de Valores.","Obstará a la prosecución y conclusión del trámite de los sumarios respectivos en las Comisión Nacional de Valores, salvo que mediante resolución fundada de dicho organismo se resolviere lo contrario.","Suspenderá el trámite de los sumarios respectivos en la Comisión Nacional de Valores hasta el dictado de sentencia firme en sede penal."],"src":"I-95"},{"q":"Los sumarios que inicie la Comisión Nacional de Valores:","opts":["Se sustanciarán en una dependencia de dicho Organismo separada e independiente de la que formule la propuesta de cargos.","Se sustanciarán en la misma dependencia de dicho Organismo que formule la propuesta de cargos.","Se sustanciarán en una dependencia de dicho Organismo designada por el Directorio en cada caso, que podrá ser la misma que formuló la propuesta de cargos.","Se sustanciarán ante el Tribunal Arbitral del mercado en el que se encuentre registrado el sumariado, con intervención de dicho Organismo como parte."],"src":"I-96"},{"q":"En forma previa a la apertura a prueba del procedimiento sumarial que inicie la Comisión Nacional de Valores:","opts":["Deberá convocarse una audiencia preliminar donde además de requerirse explicaciones se procure reducir las discrepancias sobre cuestiones de hecho, concentrando distintos pasos del procedimiento para dar virtualidad a los principios de concentración, economía procesal e inmediación.","Podrá celebrarse una audiencia preliminar donde además de requerirse explicaciones se procure reducir las discrepancias sobre cuestiones de hecho, concentrando distintos pasos del procedimiento para dar virtualidad a los principios de concentración, economía procesal e inmediación.","No se requiere la celebración de una audiencia preliminar.","Deberá convocarse una audiencia preliminar ante el Directorio de la Comisión Nacional de Valores con el único objeto de requerir explicaciones al sumariado."],"src":"I-97"},{"q":"La Comisión Nacional de Valores podrá sustanciar un sumario administrativo a emisoras, cámaras compensadoras, agentes de negociación y a toda otra persona humana o jurídica que:","opts":["Ofrezca comprar, vender o realizar cualquier tipo de operación sobre valores negociables que por sus características debieran contar con autorización de oferta pública y no la hubieran obtenido al momento de la operación.","Realice operaciones sobre valores negociables con autorización de oferta pública fuera de los mercados autorizados por la Comisión Nacional de Valores, aun cuando cuente con registro de agente.","Ofrezca comprar, vender o realizar cualquier tipo de operación sobre valores negociables con oferta pública sin estar inscripta como agente en el registro de la Comisión Nacional de Valores.","Difunda información sobre valores negociables con autorización de oferta pública sin haber actualizado el prospecto correspondiente ante la Comisión Nacional de Valores."],"src":"I-98"},{"q":"Cuando de la investigación previa surja la posible comisión de las infracciones contempladas en la “Grilla de Conductas Infractoras pasibles de Procedimiento Sumarial Abreviado”, el Directorio de la Comisión Nacional de Valores podrá disponer, en la resolución que ordene la instrucción sumarial, la aplicación del procedimiento sumarial abreviado establecido en el artículo 140 de la Ley N° 26.831. Sin embargo, en ningún caso resultará de aplicación el procedimiento abreviado cuando se den, entre otras opciones, las siguientes situaciones:","opts":["Todas son correctas.","El infractor hubiera obtenido presuntamente algún beneficio económico en base a la conducta irregular.","Existan elementos que indiquen que se habría causado perjuicio económico a los inversores o al mercado.","Existan antecedentes sancionatorios firmes contra el presunto infractor en los últimos cinco años."],"src":"I-99"},{"q":"Para que pueda proceder el procedimiento de sumario abreviado, todos los sumariados deberán:","opts":["Deberán admitir los hechos y reconocer expresamente las conductas infractoras y su responsabilidad.","Deberán rechazar los hechos imputados para poder acceder al procedimiento.","Podrán admitir parcialmente los hechos, negando la conducta infractora.","No se requiere ninguna declaración sobre los hechos para acceder al procedimiento, bastando la conformidad del Directorio de la Comisión Nacional de Valores."],"src":"I-100"},{"q":"Las sanciones que se pueden imponer en el marco del procedimiento abreviado únicamente podrán consistir:","opts":["Multa y/o Apercibimiento.","Multa, Inhabilitación y/o Suspensión.","Inhabilitación definitiva y/o clausura.","Cualquiera de las previstas en el artículo 132 de la Ley 26.831."],"src":"I-101"},{"q":"En los sumarios abreviados, en los casos donde resulta procedente, la aplicación de Multa, la misma no podrá superar el monto de:","opts":["Pesos diez millones ($ 10.000.000).","Pesos un millón ($ 1.000.000).","Pesos cincuenta millones ($ 50.000.000).","No existe monto máximo para multas en sumarios abreviados."],"src":"I-102"},{"q":"Si se produjeran nuevos cargos durante la actividad sumarial, se podrá:","opts":["Se podrán incluir como nuevos cargos, mediante resolución del Directorio, cuando se trate de incumplimientos en la presentación de documentación o información que motivó la promoción del sumario y que debe ser remitida periódicamente a la Comisión Nación de Valores.","Se podrán incluir como nuevos cargos, mediante resolución de la dependencia instructora, cualquiera sea la naturaleza de la infracción, sin necesidad de nueva intervención del Directorio de la Comisión Nacional de Valores, debiendo notificarse al sumariado en forma conjunta con la propuesta de cargos original.","Se podrán incluir como nuevos cargos, mediante resolución del Directorio, cuando el sumariado preste conformidad expresa a su incorporación en el mismo expediente, cualquiera sea la naturaleza de la infracción.","Se deberá iniciar un nuevo expediente sumarial independiente, salvo que se trate de incumplimientos en la presentación de documentación periódica, en cuyo caso los nuevos cargos se archivan sin más trámite."],"src":"I-103"},{"q":"Los sumariados durante la tramitación del sumario, gozarán, entre otros, de los siguientes derechos:","opts":["Recusar al conductor del sumario. Recusar a los integrantes del Directorio de la Comisión Nacional de Valores.","Designar un defensor oficial provisto por la CNV.","Solicitar la suspensión del sumario hasta obtener sentencia judicial favorable en la causa penal que tramite por los mismos hechos.","Presentar un recurso de amparo ante la justicia federal."],"src":"I-104"},{"q":"Ante una investigación originada por una denuncia, frente al desistimiento manifestado por el denunciante de la misma, la Comisión Nacional de Valores:","opts":["Continuará actuando de oficio hasta finalizar la investigación.","Se archivará inmediatamente la investigación.","Se notificará al denunciado y se cerrará el expediente, salvo que el denunciante ratifique la denuncia dentro de los diez días hábiles.","Se derivará a la justicia penal para su continuación."],"src":"I-105"},{"q":"Una vez recibida la denuncia y efectuada la investigación de la misma, esta podrá culminar con:","opts":["La desestimación de la misma cuando no se hubieran comprobado la existencia de las irregularidades administrativas denunciadas. La instrucción de un sumario administrativo. La formulación de reporte de operación sospechosa.","La desestimación de la misma cuando el denunciante no la ratifique dentro del plazo previsto. La instrucción de un sumario administrativo. La remisión de las actuaciones a la justicia con competencia en lo criminal.","La desestimación de la misma cuando no se hubieran comprobado las irregularidades administrativas denunciadas. La aplicación directa de una sanción de apercibimiento. La formulación de reporte de operación sospechosa.","La instrucción de un sumario administrativo. La suspensión preventiva de la negociación de los valores negociables involucrados. La notificación al mercado en el que opere el denunciado."],"src":"I-106"},{"q":"El denunciante será notificado del estado de su denuncia:","opts":["Se le notificará la decisión final.","En cada etapa procesal del sumario.","Se le notificará la apertura del sumario y la decisión final.","Se le notificará la propuesta de cargos formulada al denunciado."],"src":"I-107"},{"q":"La Comisión Nacional de Valores podrá iniciar investigaciones que se originen:","opts":["Por denuncias recibidas. De oficio cuando advierta en el ejercicio de sus funciones la existencia de presuntas irregularidades administrativas. A partir de informaciones periodísticas de las que surjan presuntas irregularidades administrativas.","Por denuncias recibidas. De oficio cuando advierta en el ejercicio de sus funciones la existencia de presuntas irregularidades administrativas. A requerimiento de la justicia con competencia en lo criminal, no así a partir de informaciones periodísticas.","Por denuncias recibidas de inversores o accionistas de la emisora. Por requerimiento de los mercados o cámaras compensadoras. A partir de informaciones periodísticas, previa ratificación por parte del medio que las publicó.","Por denuncias recibidas, siempre que el denunciante acredite interés legítimo. De oficio cuando lo disponga el Directorio por resolución fundada. A partir de informaciones periodísticas de las que surjan presuntas irregularidades administrativas."],"src":"I-108"},{"q":"Dentro de los objetivos establecidos por la Ley 26.831 se incluyen:","opts":["Todas son correctas.","Fortalecer los mecanismos de protección y prevención de abusos contra los inversores, en el marco de la función tuitiva del derecho del consumidor.","Propender a la inclusión financiera.","Propender a la integridad y transparencia de los mercados de capitales."],"src":"I-109"},{"q":"¿Qué tipo de emisoras pueden adquirir sus propias acciones?","opts":["Las sociedades anónimas que hacen oferta pública de acciones.","Todas las personas jurídicas registradas ante la CNV.","Solo las Sociedades de Responsabilidad Limitada del régimen PyME.","Cualquier sociedad comercial, sin necesidad de contar con autorización de oferta pública de sus acciones."],"src":"I-110"},{"q":"¿Cuál de los siguientes sujetos se considera un inversor calificado según la normativa vigente?","opts":["El Estado Nacional, las Provincias y Municipalidades, Entidades Autárquicas, Sociedades del Estado y Empresas del Estado. Cajas Previsionales. Compañías de Seguros, de Reaseguros y Aseguradoras de Riesgos de Trabajo.","El Estado Nacional, las Provincias y Municipalidades, Entidades Autárquicas, Sociedades del Estado y Empresas del Estado. Las personas humanas con cuenta comitente abierta en un agente registrado. Las asociaciones
