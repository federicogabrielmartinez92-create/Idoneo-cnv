{"q":"Las pruebas de resistencia de mercado, ¿para qué tipos de Fondos Comunes de Inversión son obligatorias?","opts":["Para los Fondos Comunes de Inversión Abiertos de Dinero (Money Market Funds).","Para los Fondos Comunes de Inversión Abiertos de Renta Fija y de Renta Variable.","Para los Fondos Comunes de Inversión Cerrados con oferta pública.","Para los Fondos Comunes de Inversión Abiertos destinados a Inversores Calificados."],"src":"VI-62"},{"q":"¿Cuál es el tope de inversión de un Fondo Común de Inversión en inversiones en controlantes del Administrador o controlantes o controladas del Custodio?","opts":["Las inversiones en valores negociables emitidos por la controlante del Administrador, o la controlante o controladas del Custodio, no podrán exceder el DOS POR CIENTO (2%) del capital o pasivo obligacionario de la controlante o controlada de que se trate, conforme al último balance anual o subperiódico conocido.","Las inversiones en valores negociables emitidos por la controlante del Administrador, o la controlante o controladas del Custodio, no podrán exceder el DIEZ POR CIENTO (10%) del patrimonio neto del Fondo, conforme al último valor de cuotaparte conocido.","Las inversiones en valores negociables emitidos por la controlante del Administrador no podrán exceder el DOS POR CIENTO (2%) del capital de la controlante; no existe tope para las controladas del Custodio.","Las inversiones en valores negociables emitidos por la controlante del Administrador, o la controlante o controladas del Custodio, se encuentran prohibidas, salvo autorización previa de la Comisión Nacional de Valores."],"src":"VI-63"},{"q":"Para un Fondo Común de Inversión Abierto de renta fija, ¿cuál es el tope de inversión en una MISMA ESPECIE para títulos públicos?","opts":["Las inversiones en una misma especie de títulos de deuda pública emitidos con iguales condiciones de emisión por el Estado Nacional, Provincial o Municipal no podrán superar el TREINTA POR CIENTO (30%) del patrimonio del FONDO.","Las inversiones en una misma especie de títulos de deuda pública emitidos con iguales condiciones de emisión por el Estado Nacional, Provincial o Municipal no podrán superar el VEINTE POR CIENTO (20%) del patrimonio del FONDO.","Las inversiones en una misma especie de títulos de deuda pública emitidos por el Estado Nacional no tienen tope; las emitidas por Estados Provinciales o Municipales no podrán superar el TREINTA POR CIENTO (30%) del patrimonio del FONDO.","Las inversiones en una misma especie de títulos de deuda pública emitidos con iguales condiciones de emisión por el Estado Nacional, Provincial o Municipal no podrán superar el CINCUENTA POR CIENTO (50%) del patrimonio del FONDO."],"src":"VI-64"},{"q":"Para un Fondo Común de Inversión Abierto de renta variable, ¿cuál es el tope de inversión en Fondos Comunes de Inversión Cerrados administrados por la misma Sociedad Gerente?","opts":["Por ser el Fondo Común de Inversión Cerrado administrado por la propia Sociedad Gerente no podrá invertir en el mismo.","Podrá invertir en cuotapartes de Fondos Comunes de Inversión Cerrados administrados por la propia Sociedad Gerente hasta el DIEZ POR CIENTO (10%) del haber del Fondo.","Podrá invertir en cuotapartes de Fondos Comunes de Inversión Cerrados administrados por la propia Sociedad Gerente hasta el VEINTICINCO POR CIENTO (25%) del haber del Fondo, previa autorización de la Comisión Nacional de Valores.","Podrá invertir sin tope en cuotapartes de Fondos Comunes de Inversión Cerrados administrados por la propia Sociedad Gerente, siempre que su objeto de inversión sea compatible."],"src":"VI-65"},{"q":"Para un Fondo Común de Inversión Abierto ASG, ¿cuál es el tope de inversión en Fondos Comunes de Inversión Cerrados administrado por otra Sociedad Gerente?","opts":["Podrá invertirse en cuotapartes de Fondos Comunes de Inversión Cerrados administrados por otra Sociedad Gerente y cuyo objeto de inversión sea compatible hasta el DIEZ POR CIENTO (10%) del haber del Fondo.","Podrá invertirse en cuotapartes de Fondos Comunes de Inversión Cerrados administrados por otra Sociedad Gerente y cuyo objeto de inversión sea compatible hasta el VEINTICINCO POR CIENTO (25%) del haber del Fondo.","Podrá invertirse en cuotapartes de Fondos Comunes de Inversión Cerrados administrados por otra Sociedad Gerente, cualquiera sea su objeto de inversión, hasta el CINCO POR CIENTO (5%) del haber del Fondo.","No podrá invertirse en cuotapartes de Fondos Comunes de Inversión Cerrados administrados por otra Sociedad Gerente, salvo que ésta se encuentre vinculada por relación de control."],"src":"VI-66"},{"q":"Para un Fondo Común de Inversión Abierto PYMES, ¿cuál es el tope de inversión en Fondos Comunes de Inversión Cerrados administrado por otra Sociedad Gerente?","opts":["Podrá invertirse en cuotapartes de Fondos Comunes de Inversión Cerrados administrados por otra Sociedad Gerente y cuyo objeto de inversión sea compatible hasta el CINCO POR CIENTO (5%) del haber del Fondo.","Podrá invertirse en cuotapartes de Fondos Comunes de Inversión Cerrados administrados por otra Sociedad Gerente y cuyo objeto de inversión sea compatible hasta el DIEZ POR CIENTO (10%) del haber del Fondo.","Podrá invertirse en cuotapartes de Fondos Comunes de Inversión Cerrados administrados por otra Sociedad Gerente, cualquiera sea su objeto de inversión, hasta el VEINTICINCO POR CIENTO (25%) del haber del Fondo.","No podrá invertirse en cuotapartes de Fondos Comunes de Inversión Cerrados administrados por otra Sociedad Gerente, por tratarse de un Fondo con exigencia mínima de inversión en PYMES."],"src":"VI-67"},{"q":"Para un Fondo Común de Inversión Abierto para el Financiamiento de la Infraestructura y la Economía Real, ¿cuál es el tope de inversión en Fondos Comunes de Inversión Cerrados administrado por otra Sociedad Gerente?","opts":["Podrá invertirse en cuotapartes de Fondos Comunes de Inversión Cerrados administrados por otra Sociedad Gerente y cuyo objeto de inversión sea compatible hasta el DIEZ POR CIENTO (10%) del haber del Fondo.","Podrá invertirse en cuotapartes de Fondos Comunes de Inversión Cerrados administrados por otra Sociedad Gerente y cuyo objeto de inversión sea compatible hasta el VEINTICINCO POR CIENTO (25%) del haber del Fondo.","Podrá invertirse en cuotapartes de Fondos Comunes de Inversión Cerrados administrados por otra Sociedad Gerente, cualquiera sea su objeto de inversión, hasta el CINCO POR CIENTO (5%) del haber del Fondo.","Podrá invertirse sin tope en cuotapartes de Fondos Comunes de Inversión Cerrados administrados por otra Sociedad Gerente cuyo objeto sea el financiamiento de la infraestructura."],"src":"VI-68"},{"q":"Para un Fondo Común de Inversión Abierto destinado exclusivamente a Inversores Calificados, ¿cuál es el tope de inversión en Fondos Comunes de Inversión Cerrados?","opts":["Podrá invertirse en cuotapartes de Fondos Comunes de Inversión Cerrados administrados por otra Sociedad Gerente por hasta el VEINTICINCO POR CIENTO (25%) del haber del Fondo.","Podrá invertirse en cuotapartes de Fondos Comunes de Inversión Cerrados administrados por otra Sociedad Gerente por hasta el DIEZ POR CIENTO (10%) del haber del Fondo.","Podrá invertirse en cuotapartes de Fondos Comunes de Inversión Cerrados administrados por la propia Sociedad Gerente por hasta el VEINTICINCO POR CIENTO (25%) del haber del Fondo.","Podrá invertirse sin tope en cuotapartes de Fondos Comunes de Inversión Cerrados administrados por otra Sociedad Gerente, por tratarse de un Fondo destinado a Inversores Calificados."],"src":"VI-69"},{"q":"¿Cuál de las siguientes afirmaciones es correcta para un Fondo Común de Inversión Abierto de Renta Variable?","opts":["Podrá invertir en cuotapartes de Fondos Comunes de Inversión Abiertos, exclusivamente en Fondos Comunes de Dinero administrados por otra Sociedad Gerente, por hasta el CINCO POR CIENTO (5%) del haber del Fondo.","Podrá invertir en cuotapartes de Fondos Comunes de Inversión Abiertos de cualquier tipo administrados por otra Sociedad Gerente, por hasta el VEINTE POR CIENTO (20%) del haber del Fondo.","Podrá invertir en cuotapartes de Fondos Comunes de Dinero administrados por la propia Sociedad Gerente, por hasta el CINCO POR CIENTO (5%) del haber del Fondo.","No podrá invertir en cuotapartes de otros Fondos Comunes de Inversión Abiertos, por tratarse de un Fondo especializado en Renta Variable."],"src":"VI-70"},{"q":"En un Fondo Común de Dinero Clásico se encuentra admitida la adquisición de títulos representativos de deuda, cuyo vencimiento final no exceda UN (1) año a partir de la fecha de adquisición:","opts":["Por hasta el VEINTE POR CIENTO (20%) del Patrimonio Neto del Fondo.","Por hasta el CIEN POR CIENTO (100%) del Patrimonio Neto del Fondo.","Por hasta el CINCUENTA POR CIENTO (50%) del Patrimonio Neto del Fondo.","No se encuentra admitida en ningún porcentaje."],"src":"VI-71"},{"q":"En un Fondo Común de Dinero Dinámico se encuentra admitida la adquisición de títulos representativos de deuda, cuyo vencimiento final no exceda UN (1) año a partir de la fecha de adquisición:","opts":["Por hasta el CIEN POR CIENTO (100%) del Patrimonio Neto del Fondo.","Por hasta el VEINTE POR CIENTO (20%) del Patrimonio Neto del Fondo.","Por hasta el CINCUENTA POR CIENTO (50%) del Patrimonio Neto del Fondo.","No se encuentra admitida en ningún porcentaje."],"src":"VI-72"},{"q":"La siguiente afirmación: “Los Fondos Comunes de Dinero Clásicos presentan mayor volatilidad y sensibilidad al cambio de tasas de interés y exposición al riesgo que los Fondos Comunes de Dinero Dinámicos”, es:","opts":["Falsa.","Verdadera.","Depende del tipo de fondo.","Solo aplica a fondos cerrados."],"src":"VI-73"},{"q":"La siguiente afirmación: “Los Fondos Comunes de Dinero Clásicos presentan menor volatilidad y sensibilidad al cambio de tasas de interés y exposición al riesgo que los Fondos Comunes de Dinero Dinámicos”, es:","opts":["Verdadera.","Falsa.","Depende del patrimonio del fondo.","Solo es verdadera para fondos en moneda extranjera."],"src":"VI-74"},{"q":"Es posible la fusión de dos Fondos Comunes de Inversión Abiertos administrados por distintas Sociedades Gerentes.","opts":["Falso.","Verdadero."],"src":"VI-75"},{"q":"A los efectos de la constitución de un Fideicomiso Financiero, las Normas CNV admiten:","opts":["La constitución de fideicomisos por acto unilateral, entendiéndose por tal la declaración de voluntad del fiduciante.","Únicamente la constitución de fideicomisos por contrato bilateral entre fiduciante y fiduciario, con la conformidad del beneficiario.","La constitución de fideicomisos por acto unilateral, entendiéndose por tal la declaración de voluntad del fiduciario con la conformidad de la Comisión.","La constitución de fideicomisos por acto unilateral únicamente cuando el fiduciante sea una entidad financiera autorizada por el BCRA."],"src":"VI-76"},{"q":"Cuando el o los Fiduciarios deleguen la ejecución de las funciones de administración, el agente de cobro deberá depositar en una cuenta del fideicomiso- operada exclusivamente por el o los Fiduciarios- los fondos provenientes de las cobranzas:","opts":["En un plazo determinado de 3 días hábiles.","Sin determinación de plazo.","El plazo que se fije contractualmente.","En un plazo determinado de 10 días hábiles."],"src":"VI-77"},{"q":"El documento básico a través del cual se realiza la oferta pública de valores fiduciarios es:","opts":["El Prospecto/Suplemento de Prospecto.","El contrato de fideicomiso.","Los certificados globales.","El Reglamento de Gestión."],"src":"VI-78"},{"q":"El Fideicomisario es la persona a quien se le transmite la propiedad fiduciaria al concluir el Fideicomiso. Por lo que podrá ser:","opts":["El Fiduciante; el Beneficiario y/o un tercero.","El Fiduciante o un tercero, no pudiendo serlo el Beneficiario.","El Beneficiario o un tercero, no pudiendo serlo el Fiduciante.","El Fiduciario, el Fiduciante o el Beneficiario."],"src":"VI-79"},{"q":"El proceso de colocación primaria de valores fiduciarios deberá ser llevado a cabo:","opts":["A través de sistemas informáticos presentados por los Mercados autorizados por la Comisión;","A través de cualquier sistema informático propio de un agente colocador.","A través de la presentación de ofertas en las oficinas de los agentes colocadores.","A través de la Autopista de la Información Financiera de la Comisión."],"src":"VI-80"},{"q":"En el caso de Fideicomisos cuyo activo fideicomitido esté constituido total o parcialmente por dinero u otros activos líquidos coincidirán las figuras de:","opts":["Fiduciante – Beneficiario.","Fiduciario - Beneficiario.","Fiduciante - Fiduciante.","Fiduciario - Fideicomisario."],"src":"VI-81"},{"q":"En el marco de un Fideicomiso Financiero con Oferta Pública se emiten valores fiduciarios, los cuales podrán ser representados de acuerdo a los derechos que otorguen como:","opts":["Valores de deuda fiduciaria y/o certificados de participación y/o valores fiduciarios atípicos en los términos del artículo 1820 del CCyCN.","Valores de deuda fiduciaria y/o certificados de participación, no admitiéndose valores fiduciarios atípicos bajo el régimen de oferta pública.","Valores de deuda fiduciaria y/o obligaciones negociables del fiduciario y/o certificados de participación en los términos del artículo 1820 del CCyCN.","Certificados de participación y/o valores fiduciarios atípicos en los términos del artículo 1820 del CCyCN, no admitiéndose valores de deuda fiduciaria."],"src":"VI-82"},{"q":"La administración de un Fideicomiso Financiero, ha sido delegada en el Fiduciante, quien se encuentra incumpliendo con el depósito de las cobranzas en el tiempo y la forma requerida por la normativa vigente, lo cual impacta negativamente sobre el pago de servicios de los valores fiduciarios. Ud. inicia el reclamo correspondiente ante:","opts":["El fiduciario.","El Fiduciante.","El fiduciario y el Fiduciante.","El Agente de Depósito Colectivo."],"src":"VI-83"},{"q":"La custodia de los bienes fideicomitidos corresponde al Fiduciario, sin embargo, éste podrá delegar la ejecución de tales funciones en:","opts":["El Fiduciante - en caso de que se trate de entidad financiera.","El administrador -sin importar el carácter que revista- o un tercero.","No puede delegarla.","La Comisión Nacional de Valores."],"src":"VI-84"},{"q":"La Serie XV de un FF contiene en la portada la siguiente información: VDF A 500 millones; VDF B 300 millones; CP 100 millones; Inversores calificados: SI; Fideicomiso Financiero destinado al financiamiento Pyme: SI. Teniendo en consideración los datos expuestos en la portada, Ud. podría ofrecerle el producto a:","opts":["A los tres: un Municipio del interior de la Pcia. de Buenos Aires, Juan X (persona humana inscripta en el Registro de Idóneos de CNV) y John Y (domiciliado en los Estados Unidos de América).","Únicamente al Municipio del interior de la Pcia. de Buenos Aires y a Juan X, por ser John Y residente en el exterior.","Únicamente a Juan X y a John Y, por no poder los Municipios invertir en fideicomisos destinados al financiamiento Pyme.","A ninguno de ellos, porque los fideicomisos destinados al financiamiento Pyme sólo pueden ser suscriptos por PYMES Comisión Nacional de Valores."],"src":"VI-85"},{"q":"La subasta o licitación pública de valores fiduciarios no deberá ser:","opts":["Ciega o cerrada para Tramo Competitivo; abierta para Tramo No Competitivo.","Abierta para Tramo Competitivo; ciega o cerrada para Tramo No Competitivo.","Ciega o cerrada para ambos tramos, Competitivo y No Competitivo.","Abierta para ambos tramos, Competitivo y No Competitivo."],"src":"VI-86"},{"q":"Le consultan sobre la viabilidad de que el Fiduciante, una empresa dedicada exclusivamente a la comercialización de electrodomésticos sea el Agente de Custodia de los documentos que respaldan los Bienes Fideicomitidos. Usted contesta:","opts":["El Fiduciante en cuestión no puede ser designado como agente de custodia.","Sólo si la sociedad se encuentra inscripta en algún registro de la CNV sin importar su tipo social.","Si el fiduciante es Administrador, puede ostentar la custodia de los documentos.","A y B son correctas."],"src":"VI-87"},{"q":"Los valores representativos de deuda podrán ser emitidos por:","opts":["El Fiduciario, el Fiduciante o un tercero.","El Fiduciario o un tercero, no pudiendo serlo el Fiduciante.","El Fiduciante o un tercero, no pudiendo serlo el Fiduciario.","Únicamente el Fiduciario, en su carácter de titular del patrimonio fideicomitido."],"src":"VI-88"},{"q":"Se presenta un potencial inversor, quien se describe a sí mismo como averso al riesgo, con la intención de adquirir valores fiduciarios. Usted le recomendaría que invierta su dinero en:","opts":["Un Fideicomiso Financiero serie 132 autorizado por la Comisión Nacional de Valores y cuyo activo subyacente esté constituido por créditos de consumo ya originados.","Un FF autorizado por la CNV cuyo activo subyacente este constituido por créditos de obligación futura.","Cualquier FF autorizado por por la CNV siempre que cuente con nota de claificacion de riesgo inferior a grado de inversión (Investment grade).","Un FF autorizado por la CNV cuyos certificados de participación se encuentren subordinados a los valores de deuda."],"src":"VI-89"},{"q":"Se presenta un potencial inversor, quien se describe a sí mismo como averso al riesgo, con la intención de adquirir valores fiduciarios. Usted le recomendaría que invierta su dinero en:","opts":["Valores de deuda fiduciaria senior, con bajo riesgo pero menor rentabilidad;","Valores de deuda fiduciaria senior, con bajo riesgo y alta rentabilidad.","Certificados de participación con alto riesgo y alta rentabilidad.","Valores fiduciarios atípicos, con riesgo medio y rentabilidad variable."],"src":"VI-90"},{"q":"Un Fideicomiso Financiero con Oferta Pública es aquel en el cual:","opts":["El Fiduciario es una entidad inscripta en el registro de Fiduciarios Financieros de la Comisión y los Beneficiarios son los titulares de los valores fiduciarios;","El Fiduciario es una entidad inscripta en el registro de fiduciarios financieros de la CNV.","El fiduciante está inscripto en el registro público que lleva CNV y los beneficiarios son inversores del mercado de capitales.","El Fiduciario es una entidad financiera autorizada por el BCRA y los Beneficiarios son los fiduciantes."],"src":"VI-91"},{"q":"Un inversor adquirió valores representativos de deuda de un Fideicomiso Financiero y recurre a Ud. a fin de que le brinde información del devenir del mismo al último cierre de estado contable del Fideicomiso. Ud. le recomienda:","opts":["Consultar el sitio web de la Comisión Nacional de Valores y analizar la información mensual contenida en el informe de control y revisión.","Recurrir al sitio web del Fiduciante y administrador a fin de consultar el estado contable del mismo al cierre de dicho ejercicio.","Comunicarse telefónicamente con el auditor del Fideicomiso y requerirle dicha información.","Consultar el sitio web del Mercado en el que se negocien los valores y analizar el último precio de cierre."],"src":"VI-92"},{"q":"Un cliente que no posee Certificado MIPyME vigente, emitido por la autoridad competente, pero que es titular de una cartera de cheques de pago diferidos que financian Pymes, pretende constituir -como Fiduciante- un Fideicomiso Financiero que se encuentre destinado al financiamiento de PyME, ¿cuál de las siguientes estructuras Fiduciarias le propone?","opts":["Un Fideicomiso Financiero que constituya con al menos el SETENTA POR CIENTO (70%) del monto del activo fideicomitido, (valor nominal), de CPD provenientes de operaciones celebradas con PYMES Comisión Nacional de Valores y el 30% restantes CPD de otros deudores.","Un Fideicomiso Financiero que constituya con al menos el CINCUENTA POR CIENTO (50%) del monto del activo fideicomitido, (valor nominal), de CPD provenientes de operaciones celebradas con PYMES Comisión Nacional de Valores y el 50% restante CPD de otros deudores.","Un Fideicomiso Financiero que constituya con el CIEN POR CIENTO (100%) del monto del activo fideicomitido, (valor nominal), de CPD provenientes de operaciones celebradas con PYMES Comisión Nacional de Valores, no admitiéndose CPD de otros deudores.","Le informa que sólo puede constituirse un Fideicomiso Financiero destinado al financiamiento Pyme cuando el fiduciante cuenta con Certificado MiPyME vigente, cualquiera sea la composición del activo fideicomitido."],"src":"VI-93"},{"q":"Un potencial inversor recurre a Ud. con la intención de invertir en un Fideicomiso cuyo activo fideicomitido esté constituido total o parcialmente por dinero u otros activos líquidos. Ud. le aclara que pasará a participar del Fideicomiso en carácter de:","opts":["Fiduciante – Beneficiario.","Fiduciario - Fiduciante.","Fiduciario - Beneficiario.","Fiduciario - Fideicomisario."],"src":"VI-94"},{"q":"Un potencial inversor se acerca a Ud. a fin de solicitarle en detalle los términos y condiciones de la emisión de un fideicomiso financiero recientemente publicado en el boletín del mercado. Usted pone a disposición del inversor:","opts":["El Prospecto/Suplemento de Prospecto/Contrato de Fideicomiso.","Los estados contables del fiduciario.","El informe del auditor externo exclusivamente.","La calificación de riesgo del fideicomiso."],"src":"VI-95"},{"q":"Una persona llega a su oficina con la intención de participar de la oferta pública primaria de un fideicomiso financiero inmobiliario autorizado hace 3 años, pero en cuyos términos se encuentra prevista la reapertura del período de colocación. Ud. le manifiesta que:","opts":["Aguarde a la reapertura del período de colocación dispuesto en el suplemento y allí presente su oferta.","Rechazar al inversor por no haberse presentado a tiempo.","Ofrecerle participar en otro fideicomiso similar.","Indicarle que puede comprar los valores en el mercado secundario una vez listados."],"src":"VI-96"},{"q":"Los valores negociables que se emitan en el marco de los Productos de Inversión Colectiva para el Desarrollo de Infraestructura:","opts":["Solo podrán ser adquiridos por los inversores calificados definidos en la Sección I del Capítulo VI del Título II de Las Normas.","Podrán ser adquiridos por cualquier inversor, siempre que el agente acredite el perfil de riesgo del cliente conforme las Normas.","Sólo podrán ser adquiridos por entidades financieras autorizadas por el BCRA y por inversores institucionales.","Sólo podrán ser adquiridos por los inversores calificados definidos en las Normas y por personas humanas con patrimonio superior a 100.000 UVAs."],"src":"VI-97"},{"q":"¿Cuándo serán considerados fideicomisos financieros destinados al financiamiento de PYMES?","opts":["Cuando i) el/los fiduciante/s califiquen como PYMES Comisión Nacional de Valores en los términos definidos por estas Normas. En el caso de Fideicomisos Financieros para el Fomento del Desarrollo Productivo y de las Economías Regionales que se constituyan en los términos del Capítulo VIII del presente Título se admitirá que el/los fiduciantes sean personas humanas que cuenten con “Certificado MiPyME” en los términos dispuestos en el artículo 2° de la Sección I del Capítulo VI del Título II de estas Normas. ii) en el caso de fiduciantes que no reúnan la condición de PYMES Comisión Nacional de Valores, al menos el SETENTA POR CIENTO (70%) del monto del activo fideicomitido, considerando su valor nominal, se encuentre conformado por derechos o créditos provenientes de operaciones celebradas con sujetos que califiquen como PYMES Comisión Nacional de Valores. iii) en las emisiones con pluralidad de fiduciantes, al menos el SETENTA POR CIENTO (70%) del monto del activo fideicomitido, considerando su valor nominal, se encuentre conformado por derechos o créditos transferidos por fiduciantes que califiquen como PYMES Comisión Nacional de Valores. iv) en caso de constituirse como un fondo de inversión directa, al menos el SETENTA POR CIENTO (70%) del monto del activo fideicomitido se aplique a operaciones celebradas con sujetos que califiquen como PYMES Comisión Nacional de Valores. Se cumpla al menos uno de los ítems i, ii, iii o iv.","Cuando i) el/los fiduciante/s califiquen como PYMES Comisión Nacional de Valores en los términos definidos por estas Normas; ii) en el caso de fiduciantes que no reúnan la condición de PYMES Comisión Nacional de Valores, al menos el CINCUENTA POR CIENTO (50%) del monto del activo fideicomitido, considerando su valor nominal, se encuentre conformado por derechos o créditos provenientes de operaciones celebradas con sujetos que califiquen como PYMES Comisión Nacional de Valores; iii) en las emisiones con pluralidad de fiduciantes, la totalidad de ellos califiquen como PYMES Comisión Nacional de Valores; iv) en caso de constituirse como un fondo de inversión directa, al menos el CINCUENTA POR CIENTO (50%) del monto del activo fideicomitido se aplique a operaciones celebradas con PYMES Comisión Nacional de Valores. Se cumplan en forma conjunta los ítems i a iv.","Cuando i) el fiduciario califique como PYME Comisión Nacional de Valores o cuente con Certificado MiPyME; ii) en el caso de fiduciantes que no reúnan la condición de PYMES Comisión Nacional de Valores, al menos el SETENTA POR CIENTO (70%) de los valores fiduciarios sea suscripto por inversores que califiquen como PYMES Comisión Nacional de Valores; iii) en las emisiones con pluralidad de fiduciantes, al menos el SETENTA POR CIENTO (70%) de ellos califiquen como PYMES Comisión Nacional de Valores; iv) en caso de constituirse como un fondo de inversión directa, el SETENTA POR CIENTO (70%) del producido de la colocación se aplique a operaciones con PYMES. Se cumpla al menos uno de los ítems i, ii, iii o iv, con conformidad previa de la Comisión.","Cuando i) el/los fiduciante/s califiquen como PYMES Comisión Nacional de Valores en los términos definidos por estas Normas, no admitiéndose en ningún caso fiduciantes personas humanas; ii) en el caso de fiduciantes que no reúnan la condición de PYMES Comisión Nacional de Valores, al menos el SETENTA POR CIENTO (70%) del monto del activo fideicomitido, considerando su valor de mercado, se encuentre conformado por derechos o créditos provenientes de operaciones celebradas con sujetos que califiquen como PYMES; iii) en las emisiones con pluralidad de fiduciantes, al menos el NOVENTA POR CIENTO (90%) del monto del activo fideicomitido se encuentre conformado por derechos transferidos por fiduciantes PYMES; iv) en caso de constituirse como un fondo de inversión directa, la totalidad del activo se aplique a operaciones con PYMES. Se cumpla al menos uno de los ítems i, ii, iii o iv."],"src":"VI-98"},{"q":"Se considerarán Productos de Inversión Colectiva para el desarrollo de Infraestructura a:","opts":["Los Fideicomisos Financieros con autorización de oferta pública de sus valores fiduciarios por la Comisión Nacional de Valores, cuyo objeto se encuentre destinado a Directa o indirectamente al desarrollo, inversión, financiamiento de una Infraestructura Pública o de Infraestructura Privada.","Los Fideicomisos Financieros y los Fondos Comunes de Inversión Abiertos con autorización de oferta pública de la Comisión Nacional de Valores, cuyo objeto se encuentre destinado directamente al desarrollo o financiamiento de una Infraestructura Pública, con exclusión de la Infraestructura Privada.","Los Fideicomisos Financieros con o sin autorización de oferta pública de sus valores fiduciarios, cuyo objeto se encuentre destinado directa o indirectamente al desarrollo, inversión o financiamiento de una Infraestructura Pública o Privada, previa inscripción ante el Ministerio de Economía.","Los Fideicomisos Financieros con autorización de oferta pública de sus valores fiduciarios por la Comisión Nacional de Valores, cuyo objeto se encuentre destinado al financiamiento de obras públicas licitadas por el Estado Nacional, con exclusión de las provinciales, municipales y privadas."],"src":"VI-99"},{"q":"En los Fideicomisos Financieros destinados al Desarrollo Inmobiliario, ¿podrá preverse la reapertura del Período de Colocación de los Valores Fiduciarios ya autorizados?","opts":["Sí, mientras se encuentre previsto en el Prospecto y en el Contrato; no se exceda de los CINCO (5) años desde iniciado el Período de Colocación original o hasta alcanzar el monto autorizado.","Sí, mientras se encuentre previsto en el Prospecto y en el Contrato, sin limitación de plazo o de fecha de inicio o de cierre de tal hasta alcanzar el monto autorizado.","Sí, mientras se encuentre previsto en el Prospecto y en el Contrato, sin provisión temporal pero hasta alcanzar el monto autorizado y sin necesidad de requerir la previa autorización de la CNV.","Sí, mientras se encuentre previsto en el Prospecto y en el Contrato; no se exceda de los DOS (2) años desde iniciado el Período de Colocación original o hasta alcanzar el monto autorizado."],"src":"VI-100"},{"q":"Indique cuál de las siguientes opciones resulta un objeto válido para la constitución de un Fideicomiso Financiero que pueda considerarse para el fomento del Desarrollo Productivo y de las Economías Regionales:","opts":["Explotación de un negocio de producción agropecuario en el litoral llevado a cabo por una empresa con presencia multinacional.","Explotación de un negocio de comercialización de bienes importados en el área metropolitana, llevado a cabo por una empresa con presencia multinacional.","Inversión en valores negociables de emisoras extranjeras con actividad agropecuaria en el litoral, a través de CEDEARs.","Financiamiento de operaciones de caución y pases de una PyME agropecuaria del litoral, con garantía de su cartera de cheques."],"src":"VI-101"},{"q":"Durante la estructuración de un fideicomiso de capital emprendedor a ser presentado a Comisión Nacional de Valores para su posterior autorización, donde el vehículo de inversión tiene tinte tecnológico, (y ya se ha decidido que el Fiduciario no tiene el expertice necesario para ejercer dicha función), por lo que surgen diferentes opciones para seleccionar al “Gestor Profesional” que formará parte del Prospecto. Lo correcto para integrar el Prospecto de acuerdo a la normativa es:","opts":["Tecno Road S.A., inscripta en la Inspección General de Justicia el 01-01-2015, dedicada a brindar y gestionar soluciones tecnológicas para empresas nacionales.","Tecno Soluciones S.R.L., constituida hace cuatro meses, dedicada a brindar soluciones tecnológicas para empresas nacionales y del exterior.","Capital Tech S.A., inscripta en la Inspección General de Justicia el 01-01-2015, dedicada a la administración de carteras de inversión de terceros.","Tech Global Inc., sociedad constituida en el exterior sin inscripción en la República Argentina, dedicada a brindar soluciones tecnológicas."],"src":"VI-102"},{"q":"En caso de que se desee modificar una condición esencial de la emisión establecida en el contrato de fideicomiso financiero ¿Con cuál de estos requisitos debe cumplir para que esa modificación sea válida?","opts":["Obtener el consentimiento unánime de los tenedores de valores fiduciarios emitidos y en circulación.","Obtener el consentimiento de la mayoría absoluta de los tenedores de valores fiduciarios emitidos y en circulación, reunidos en asamblea.","Obtener la conformidad previa de la Comisión Nacional de Valores y publicar la modificación en la Autopista de la Información Financiera.","Obtener el consentimiento unánime de los tenedores de certificados de participación, sin necesidad de consultar a los tenedores de valores de deuda."],"src":"VI-103"},{"q":"Si se optase por llevar a cabo una asamblea con modalidad a distancia ¿Cuál requisito es obligatorio para garantizar la validez de estas reuniones?","opts":["Que la reunión se grabe en soporte digital y se garantice que todos los participantes puedan identificarse correctamente.","Que la reunión se celebre con la presencia física del fiduciario y de un escribano público que certifique la identidad de los participantes.","Que la reunión se grabe en soporte digital y asistan tenedores que representen al menos el 50% de los valores fiduciarios en circulación.","Que se publique un aviso en la Autopista de la Información Financiera con 10 días de anticipación y la reunión se transmita en forma pública."],"src":"VI-104"},{"q":"Ante una situación en la que el patrimonio del fideicomiso resulta insuficiente para cumplir sus obligaciones, ¿Qué mayoría es necesaria para tomar decisiones válidas?","opts":["Al menos tres cuartas partes de los valores fiduciarios emitidos y en circulación.","La mitad de los valores fiduciarios emitidos y en circulación.","Dos tercios de los valores fiduciarios emitidos y en circulación.","Los tenedores de valores de deuda fiduciaria, con exclusión de los de certificados de participación."],"src":"VI-105"},{"q":"Indique cuáles de estas condiciones se deben cumplir para que una serie pueda acceder al régimen de Fideicomisos Financieros con Autorización Automática de Emisiones Frecuentes:","opts":["Tiene que haber emitido al menos 7 fideicomisos financieros en total y de ellos, 3 en los últimos 12 meses.","Tiene que haber emitido al menos 3 fideicomisos financieros en total y de ellos, 1 en los últimos 12 meses.","Tiene que haber emitido al menos 7 fideicomisos financieros en total y de ellos, 5 en los últimos 12 meses.","Tiene que haber emitido al menos 10 fideicomisos financieros en total, cualquiera sea su antigüedad."],"src":"VI-106"},{"q":"En el caso de Fideicomisos Financieros con Autorización Automática de Emisiones Frecuentes indicar cuáles son las idénticas características que tienen que presentar en lo sustancial:","opts":["Programa, Fiduciario, Fiduciante y similar composición del Activo subyacente.","Programa, Fiduciario y Fiduciante, admitiéndose cualquier composición del Activo subyacente.","Fiduciario, Fiduciante y monto de emisión, admitiéndose distinto Programa.","Programa y Fiduciario, admitiéndose distinto Fiduciante y Activo subyacente."],"src":"VI-107"},{"q":"¿Cuál de las siguientes enunciaciones relativas a las Ofertas Públicas con Autorización Automática por su Mediano Impacto es correcta:","opts":["Los valores fiduciarios serán considerados colocados por oferta pública, siempre que los mismos sean efectivamente colocados mediante esfuerzos acreditables por cualquiera de los medios previstos en el artículo 2° de la Ley N° 26.831.","Los valores fiduciarios serán considerados colocados por oferta pública únicamente cuando sean colocados a través de un mercado autorizado por la Comisión Nacional de Valores, mediante subasta o licitación pública.","Los valores fiduciarios serán considerados colocados por oferta pública siempre que sean suscriptos íntegramente por inversores calificados, sin necesidad de acreditar esfuerzos de colocación.","Los valores fiduciarios serán considerados colocados por oferta pública siempre que el monto de la emisión supere 1.000.000 de UVA y se acrediten esfuerzos de colocación por los medios previstos en el artículo 2° de la Ley N° 26.831."],"src":"VI-108"},{"q":"Conforme lo dispuesto las Normas (N.T.2013 y mod.) el Prospecto de emisión de un fideicomiso financiero con autorización automática por su mediano Impacto:","opts":["Deberá ser publicado al inicio del periodo del plazo de difusión a través de la Autopista de la Información Financiera y en los sistemas de información de los mercados autorizados donde se listen y negocien los valores fiduciarios.","Deberá ser publicado al cierre del período de difusión a través de la Autopista de la Información Financiera, no siendo necesaria su publicación en los sistemas de información de los mercados autorizados.","Deberá ser publicado al inicio del período de colocación en los sistemas de información de los mercados autorizados donde se listen los valores fiduciarios, no siendo necesaria su publicación en la Autopista de la Información Financiera.","Podrá ser publicado en cualquier momento del período de colocación a través de la Autopista de la Información Financiera, previa conformidad de la Comisión Nacional de Valores."],"src":"VI-109"},{"q":"“La presentación de EE.CC. trimestrales es opcional en aquellos fideicomisos financieros que se constituyan como fondos de inversión directa” resulta:","opts":["Incorrecta.","Correcta, la presentación trimestral es optativa.","Depende del monto de la emisión.","Solo es correcta para fideicomisos PyME."],"src":"VI-110"},{"q":"En los Prospectos de los Programas Globales de fideicomisos financieros que prevean exclusivamente la constitución de fideicomisos financieros como fondos de inversión directa los fiduciantes:","opts":["Pueden no estar identificados si se encuentra expresamente delimitado el objeto de inversión de los fideicomisos a constituirse bajo el Programa.","Deben estar identificados obligatoriamente, aun cuando se encuentre expresamente delimitado el objeto de inversión de los fideicomisos a constituirse bajo el Programa.","Pueden no estar identificados únicamente cuando revistan la calidad de inversores calificados y el objeto de inversión sea compatible con el Programa.","Pueden no estar identificados siempre que el Fiduciario asuma la responsabilidad por la selección de los activos, sin necesidad de delimitar el objeto de inversión."],"src":"VI-111"},{"q":"Con qué periodicidad debe ser actualizado el PIPE (Plan de Inversión, Producción y Estratégico) en los fideicomisos financieros constituidos como fondos de inversión directa:","opts":["Anualmente, con la presentación de los EE.CC. anuales del fideicomiso financiero.","Semestralmente, con la presentación de los EE.CC. trimestrales del fideicomiso financiero.","Anualmente, dentro de los 30 días de iniciado cada ejercicio, con independencia de los EE.CC.","Cada tres años, coincidiendo con la renovación del Programa Global."],"src":"VI-112"},{"q":"A fin de acreditar el cumplimiento del requisito patrimonial requerido a los Fiduciarios Financieros ¿Cuál es el plazo de presentación de los estados contables trimestrales?","opts":["Dentro de los cuarenta y dos (42) días corridos de cerrado cada trimestre.","Dentro de los setenta (70) días corridos de cerrado cada trimestre.","Dentro de los treinta (30) días hábiles de cerrado cada trimestre.","Dentro de los sesenta (60) días corridos de cerrado cada trimestre."],"src":"VI-113"},{"q":"¿Cuál es antigüedad requerida para que la información contable contenida en el Suplemento de Prospecto en la Sección “Descripción del Fiduciante” se encuentre debidamente actualizada para la autorización de la solicitud de autorización de oferta pública?","opts":["Tres (3) últimos ejercicios anuales o desde su constitución, si su antigüedad fuere menor.","Último ejercicio anual, acompañado de estados contables trimestrales actualizados.","Cinco (5) últimos ejercicios anuales o desde su constitución, si su antigüedad fuere menor.","Dos (2) últimos ejercicios anuales, no admitiéndose fiduciantes con antigüedad menor."],"src":"VI-114"},{"q":"¿Cuál es la periodicidad exigida para la presentación de estados contables de Fideicomisos Financieros, excepto para aquellos Fideicomisos Financieros que se constituyan como “Fondos de Inversión Directa”?","opts":["Por períodos anuales y, opcionalmente, por subperíodos trimestrales.","Por períodos anuales, sin opción trimestral.","Por períodos trimestrales obligatoriamente.","Por períodos mensuales obligatoriamente."],"src":"VI-115"},{"q":"En caso de que la función de control y revisión de los activos subyacentes de los fideicomisos y el flujo de fondos que generan sea ejercida por un Contador Público Independiente matriculado ¿cuál es la antigüedad en la matricula requerida?","opts":["No inferior a cinco (5) años.","No inferior a tres (3) años.","No inferior a diez (10) años.","No existe plazo mínimo."],"src":"VI-116"},{"q":"¿Cuál es el plazo presentación en el Sitio Web de la Comisión de los informes mensuales de control y revisión elaborados durante la vigencia del fideicomiso?","opts":["Dentro de los veinte (20) días hábiles.","Dentro de los diez (10) días hábiles.","Dentro de los cuarenta y dos (42) días corridos.","No existe plazo específico."],"src":"VI-117"},{"q":"A los fines de considerar una Oferta Pública con Autorización Automática por su Bajo Impacto, el monto nominal total de los valores fiduciarios emitidos no deberá:","opts":["Superar un millón (1.000.000) de UVA's o su equivalente en pesos o moneda extranjera, emitidos durante 12 meses anteriores por el mismo fiduciante sin distinción respecto del activo subyacente.","Superar quinientos mil (500.000) UVA's o su equivalente en pesos o moneda extranjera, emitidos durante los 12 meses anteriores por el mismo fiduciario.","Superar cinco millones (5.000.000) de UVA's o su equivalente en pesos, emitidos durante los 24 meses anteriores por el mismo fiduciante.","Superar un millón (1.000.000) de UVA's por serie, sin acumulación de las emisiones anteriores del mismo fiduciante."],"src":"VI-118"},{"q":"El fiduciario que emita bajo el régimen de Oferta Pública con Autorización Automática por su Bajo Impacto, estará obligado a:","opts":["Proceder a la carga de los datos estructurados de Fideicomisos Financieros y, para los fideicomisos financieros bajo los “Lineamientos para la emisión de Valores Negociables Temáticos en Argentina”, presentar informe de revisión externa que acredite la etiqueta temática del valor negociable.","Obtener autorización previa de la Comisión Nacional de Valores para cada emisión y presentar un nuevo prospecto por cada serie, sin necesidad de cargar datos estructurados.","Proceder a la carga de los datos estructurados de Fideicomisos Financieros y presentar, para todas las emisiones, un informe de revisión externa sobre la composición del activo subyacente.","Informar a la Comisión Nacional de Valores dentro de los 30 días de la emisión y presentar, para los fideicomisos bajo los Lineamientos de Valores Negociables Temáticos, la calificación de riesgo correspondiente."],"src":"VI-119"},{"q":"Para las emisiones de Oferta Pública con Autorización Automática por su Bajo Impacto, el Contrato del Fideicomiso Financiero:","opts":["Deberá publicarse en Autopista de la Información Financiera y contener una leyenda especial referida a la emisión del vehículo en el marco del mencionado régimen.","Deberá publicarse en el sitio web del fiduciario y en el Boletín Oficial, sin necesidad de leyenda especial.","Deberá publicarse en Autopista de la Información Financiera, previa aprobación de la Comisión Nacional de Valores, sin leyenda especial.","No requiere publicación previa, bastando su presentación ante la Comisión Nacional de Valores junto con los datos estructurados."],"src":"VI-120"},{"q":"RG 1030/2024. ¿Cuál de los siguientes FCI requiere suscripción exclusivamente por Inversores Calificados?","opts":["Fondo Abierto de Renta Variable en dólares bajo régimen especial.","Fondo Abierto de Renta Fija en pesos bajo régimen especial.","Fondo Abierto de Dinero Clásico en dólares.","Fondo Cerrado de Renta Variable en dólares."],"src":"VI-121"},{"q":"¿Qué nuevo instrumento incorporó Comisión Nacional de Valores a partir de 2024 para oferta pública en Argentina?","opts":["CEDEARs de ETFs de gestión pasiva.","Bonos vinculados a la sostenibilidad (sustainability-linked).","Futuros de índice bursátil.","Opciones sobre ETFs internacionales."],"src":"VI-122"},{"q":"FF con autorización automática de bajo impacto: el monto máximo emitido por fiduciante en los últimos 12 meses para acceder al régimen es:","opts":["1.000.000 UVA.","500.000 UVA.","5.000.000 UVA.","No existe monto máximo."],"src":"VI-123"},{"q":"FF con emisiones frecuentes (RG 1074/2025). ¿Cuántos fideicomisos debe haber emitido el fiduciario en total?","opts":["7.","3.","10.","5."],"src":"VI-124"},{"q":"RG 1030/2024. Los FCI abiertos para Inversores Calificados en moneda extranjera deben:","opts":["Ser suscriptos con fondos depositados en el exterior.","Ser suscriptos con fondos depositados en el país.","Ser suscriptos en pesos y liquidados en moneda extranjera.","Ser suscriptos por inversores calificados residentes en el país."],"src":"VI-125"}]};
const NOTES = {"1":{"modulo":1,"titulo":"Marco normativo, emisoras, régimen sancionatorio, OPA y oferta pública","resumen":"El módulo cubre la arquitectura legal del mercado de capitales argentino: la Ley 26.831 (reformada por la Ley 27.440), las Normas CNV (N.T. 2013) y sus reformas 2025, el rol y las facultades de la CNV, qué es oferta pública y cuándo es irregular, cómo ingresan y qué deben cumplir las emisoras, el régimen de OPA, DUVA y retiro, y el procedimiento sancionatorio. El examen pregunta sobre todo plazos (10, 20, 5 días hábiles; 6 meses; 6 años), porcentajes (95%, 30%, 10%), límites numéricos de la oferta privada y los regímenes de autorización automática, artículos puntuales (146 CCyC, 274 LGS) y definiciones (oferta pública, valores negociables, actuación concertada, inversor calificado, PyME CNV).","secciones":[{"titulo":"1. La Ley 26.831: objetivos, definiciones y marco internacional","parrafos":["La Ley 26.831 de Mercado de Capitales (LMC) es la norma central del régimen. Reemplazó a la vieja Ley 17.811, eliminó la autorregulación de las bolsas y concentró en la Comisión Nacional de Valores (CNV) el poder de regular, supervisar y fiscalizar todo lo que ocurre alrededor de la oferta pública de valores negociables. En 2018 la Ley 27.440 de Financiamiento Productivo la reformó en profundidad: rediseñó la OPA obligatoria, incorporó el sumario abreviado, el recurso directo contra sanciones y nuevas facultades regulatorias para la CNV.","El artículo 1 fija los objetivos del régimen y el examen suele tomarlos en bloque: promover la participación de pequeños inversores, asociaciones sindicales, cámaras empresariales, organizaciones profesionales e instituciones de ahorro público; fortalecer la protección y la prevención de abusos contra los pequeños inversores; promover el acceso de las PyMEs al mercado de capitales; propender a un mercado federalmente integrado; fomentar la simplificación de la negociación; reducir el riesgo sistémico; fomentar la coordinación con otros reguladores y la competencia entre mercados. Cuando una pregunta lista varios de estos objetivos y ofrece la opción de que todas son correctas, esa es la respuesta.","El artículo 2 contiene las definiciones transversales: oferta pública, valores negociables, actuación concertada, controlante y grupo de control, información reservada o privilegiada, mercados, cámaras compensadoras, cada categoría de agente, PyMEs, productos de inversión colectiva. Muchas preguntas del módulo son puramente definicionales, así que conviene aprender los elementos de cada concepto y no solo su nombre.","El marco local se apoya en los objetivos de IOSCO, la organización internacional de reguladores de valores de la que la CNV es miembro: proteger a los inversores, garantizar mercados justos, eficientes y transparentes, y reducir el riesgo sistémico. Esos tres objetivos reaparecen en el artículo 1 de la LMC. La reglamentación concreta está en las Normas CNV, cuyo texto ordenado 2013 (N.T. 2013) se organiza por Títulos: emisoras, OPA, régimen informativo, productos de inversión colectiva, oferta pública primaria, entre otros, y fue actualizado en 2025 por varias resoluciones generales (1054, 1084, 1088, 1097)."],"puntos":["Objeto de la LMC: regular, supervisar y fiscalizar el mercado de capitales (art. 1).","Autoridad de aplicación: la Comisión Nacional de Valores.","Ley 27.440 (2018) reformó la LMC: OPA obligatoria a posteriori, sumario abreviado, recurso directo.","Art. 1 = objetivos; art. 2 = definiciones.","IOSCO: tres objetivos (protección del inversor, mercados justos/eficientes/transparentes, reducción del riesgo sistémico).","Normas CNV N.T. 2013 = reglamentación por Títulos; RG 1097/2025 unificó definiciones en el nuevo Título I.","Ley 22.169: delega en la CNV el control societario de las emisoras con oferta pública."]},{"titulo":"2. La CNV: naturaleza, competencias, facultades, secreto y tribunal arbitral","parrafos":["La CNV es un organismo autárquico del Estado nacional que actúa en el ámbito del Ministerio de Economía. Está dirigida por un Directorio de cinco vocales designados por el Poder Ejecutivo con mandato de cinco años. Tiene sede en la Ciudad de Buenos Aires y puede abrir delegaciones regionales permanentes o móviles. Es la autoridad de aplicación y de autorización de la oferta pública en todo el territorio nacional (art. 80).","El artículo 19 enumera sus atribuciones: supervisar, regular, inspeccionar, fiscalizar y sancionar a todas las personas humanas o jurídicas que desarrollen actividades relacionadas con la oferta pública; llevar el registro y otorgar, suspender o revocar la autorización de oferta pública; registrar y autorizar mercados, cámaras compensadoras y agentes; aprobar estatutos y reglamentos de los mercados; ejercer el control societario delegado por la Ley 22.169; dictar reglamentaciones; declarar irregulares e ineficaces a efectos administrativos los actos sometidos a su fiscalización; promover la defensa de los pequeños inversores; fijar normas mínimas de capacitación, acreditación y registro para quienes asesoran al público inversor (base legal del examen de idoneidad); fijar requisitos a los auditores externos; establecer aranceles y celebrar convenios de cooperación. El artículo 20 agrega las facultades correlativas: requerir informes y documentos, realizar inspecciones e investigaciones, pedir auxilio de la fuerza pública, iniciar acciones judiciales, denunciar delitos y solicitar allanamientos.","Lo que la CNV no hace es tan examinable como lo que hace: no garantiza la rentabilidad de los inversores, no asegura resultados ni fija precios de los valores. Supervisa y controla; el riesgo de la inversión lo asume el inversor. En materia de control societario (Ley 22.169), la CNV reemplaza al Registro Público en las sociedades por acciones con oferta pública: otorga la conformidad administrativa a las reformas de estatuto, inscribe registralmente a los miembros del Directorio y fiscaliza las asambleas. Quedan fuera de ese control las PyME CNV Garantizadas, que siguen bajo el Registro Público de su jurisdicción. Para que una notificación a una emisora en trámite sea válida y vinculante debe cursarse a la sede social inscripta.","La LMC protege la confidencialidad en dos niveles. Los artículos 25 a 27 establecen el secreto sobre la información que la CNV obtiene en inspecciones e investigaciones (sus funcionarios deben guardarlo y los jueces deben rechazar pedidos de informes salvo excepciones), permiten compartirla con reguladores extranjeros bajo convenios de reciprocidad y habilitan el levantamiento recíproco del secreto entre CNV, BCRA y Superintendencia de Seguros, y a pedido de la UIF. El artículo 53 impone a los agentes registrados el secreto sobre las operaciones y los nombres de sus clientes. La guía oficial ubica el secreto profesional en la Ley 26.831, art. 24: lo que hay que recordar es que la norma que lo regula es la Ley de Mercado de Capitales, no la Ley de Entidades Financieras ni la LGS. Por último, el artículo 46 obliga a cada mercado a constituir un tribunal arbitral permanente que resuelve controversias entre participantes del mercado: las emisoras listadas quedan sometidas obligatoriamente en sus relaciones con accionistas e inversores, mientras que accionistas e inversores pueden optar por acudir a la justicia ordinaria."],"puntos":["CNV: organismo autárquico; Directorio de 5 vocales por 5 años.","Art. 19 = atribuciones; art. 20 = facultades correlativas (informes, inspecciones, acciones judiciales).","Facultad expresa del art. 19: normas mínimas de capacitación, acreditación y registro para quienes asesoran al público inversor.","NO es facultad: garantizar la rentabilidad de los inversores.","Control societario (Ley 22.169): CNV reemplaza al Registro Público; inscribe a los miembros del Directorio; excluye a las PyME CNV Garantizadas.","Cambio de denominación social: reforma de estatuto + conformidad de la CNV + inscripción en el Registro Público.","Notificación válida a una emisora: sede social inscripta.","Secreto: arts. 25-27 (CNV) y 53 (agentes); la guía lo cita como Ley 26.831, art. 24. Tribunal arbitral: art. 46."]},{"titulo":"3. Oferta pública: concepto, valores negociables, autorización y oferta irregular","parrafos":["Según el artículo 2 de la LMC, hay oferta pública cuando existe una invitación hecha a personas en general o a sectores o grupos determinados para realizar cualquier acto jurídico con valores negociables, efectuada por el emisor o por organizaciones dedicadas total o parcialmente al comercio de valores, a través de ofrecimientos personales, publicaciones periodísticas, radio, televisión, cine, afiches, letreros, volantes, llamados telefónicos, medios electrónicos, correo electrónico, redes sociales o cualquier otro procedimiento de difusión. Los elementos son cuatro: invitación, destinatarios indeterminados o sectores determinados, valores negociables y un medio de difusión. No hace falta que se dirija a todo el público: una campaña a un grupo determinado también es oferta pública.","Los valores negociables también se definen en el artículo 2: son los títulos valores cartulares y todos los valores incorporados a un registro de anotaciones en cuenta, incluyendo acciones, obligaciones negociables, cuotapartes de fondos comunes de inversión, títulos de deuda y certificados de participación de fideicomisos financieros, cheques de pago diferido, pagarés, letras de cambio, letras hipotecarias, facturas de crédito, certificados de depósito y warrants, contratos de futuros y opciones y, en general, todo valor o contrato homogéneo y fungible negociable. Cuando el examen pide un ejemplo, las letras de cambio y las obligaciones negociables son valores negociables.","La autorización de oferta pública la otorga la CNV en todo el país (art. 80). El artículo 84 le da 30 días hábiles para resolver desde que la documentación está completa; si vence ese plazo el interesado puede pedir pronto despacho y, pasados 15 días hábiles más sin respuesta, la autorización se considera concedida, salvo prórroga fundada de hasta 15 días hábiles. El artículo 81 permite crear regímenes diferenciados según el emisor, los destinatarios y los montos (PyME, emisor frecuente, autorización automática). El artículo 83 excluye de la ley a los valores emitidos por la Nación, las provincias, la Ciudad de Buenos Aires, los municipios y los organismos multilaterales de crédito; los Estados extranjeros necesitan autorización del Poder Ejecutivo, salvo los del Mercosur. Ejemplo típico: una emisión primaria de acciones para colocarse en el país y en el exterior requiere autorización previa de oferta pública; un préstamo bancario, un pagaré entregado a un acreedor o una colocación privada no.","Toda oferta pública realizada sin autorización de la CNV es una oferta irregular. Las consecuencias son administrativas (la CNV puede declarar irregulares e ineficaces los actos, abrir sumario y aplicar las sanciones del art. 132 a cualquier persona humana o jurídica que ofrezca comprar, vender u operar valores que debieran contar con autorización y no la tienen) y además penales, porque el Código Penal castiga la intermediación financiera y la oferta pública no autorizadas. El Decreto 1087/1993 introdujo la figura del inversor institucional (compañías de seguros, fondos comunes de inversión, entidades financieras, cajas y fondos previsionales) y dejó en claro que una colocación dirigida a este tipo de inversores también es oferta pública sujeta a la ley, lo que habilita los beneficios impositivos de las obligaciones negociables."],"puntos":["Oferta pública (art. 2): invitación a personas en general o a sectores/grupos determinados, con valores negociables, por cualquier medio de difusión.","Oferta pública secundaria: ingreso al régimen sin emitir ni vender acciones nuevas.","Valores negociables (art. 2): acciones, ON, cuotapartes de FCI, títulos de fideicomisos, CPD, pagarés, letras de cambio, futuros y opciones, entre otros.","Autorización: CNV, 30 días hábiles; pronto despacho + 15 días hábiles = silencio positivo (art. 84).","Art. 83: valores de Nación, provincias, CABA, municipios y organismos multilaterales están fuera de la ley.","Oferta irregular = oferta pública sin autorización de la CNV; habilita sumario, sanciones y acción penal.","La CNV puede sumariar a cualquier persona que opere valores que debían tener autorización de oferta pública y no la tenían.","Decreto 1087/1993: inversores institucionales; colocar entre ellos también es oferta pública."]},{"titulo":"4. Oferta privada, oferta extraterritorial y regímenes de autorización automática (reformas 2025)","parrafos":["La RG 1088/2025 reglamentó la oferta privada, que es la vía para colocar valores sin pedir autorización de oferta pública. El criterio clave para saber a quién se puede invitar es la categoría del destinatario: inversor calificado o no calificado. Las invitaciones por emisión pueden dirigirse a un máximo de 30 potenciales inversores no calificados y 50 potenciales inversores calificados. Las operaciones efectivamente celebradas no pueden superar los 35 adquirentes, y dentro de ese total los no calificados no pueden exceder de 15. Ejemplo: colocar a 28 adquirentes (20 calificados y 8 no calificados) cumple el límite.","Dos reglas más de la oferta privada aparecen en el examen. La obligación de confidencialidad puede ser renunciada de manera expresa por los inversores y por los demás intervinientes, siempre a favor de los inversores. La reventa de los valores colocados privadamente puede hacerse sin limitación cuando la transferencia se efectúa fuera de la República Argentina; dentro del país rigen restricciones de destinatario y plazo. Distinta es la oferta extraterritorial: una oferta hecha hacia el exterior que no constituye oferta pública en Argentina y, por eso, no tiene limitación en la cantidad de potenciales inversores, ni en el precio, ni en el monto adquirido, y no exige cumplir requisito alguno ante la CNV.","Las Ofertas Públicas con Autorización Automática son regímenes donde la autorización opera sin trámite previo de aprobación individual. Para obligaciones negociables de Bajo Impacto, la oferta se considera pública, autorizada y regular, de modo que el emisor queda exento de sanciones por oferta pública irregular; los mercados deben adecuar el ingreso a sus plataformas digitales sin desvirtuar la simplicidad del régimen. Para acciones, hay Bajo y Mediano Impacto: el emisor debe estar admitido al Régimen General y cumplir las condiciones específicas de impacto. El Mediano Impacto tiene un tope de 7.000.000 de UVAs, y para calcularlo se consideran parte de una misma oferta todas las emisiones de acciones por suscripción del emisor bajo el régimen en los 12 meses anteriores a la última emisión (tres emisiones de 2,2, 2,4 y 2,6 millones ya suman 7,2 millones, así que una nueva de 0,5 millones no califica). No pueden acogerse al Mediano Impacto los emisores sujetos a privatización, con participación estatal o del FGS, las entidades financieras, los mercados autorizados por la CNV ni los emisores de servicios públicos. Si la integración es en moneda extranjera, el valor nominal se calcula con el Tipo de Cambio de Referencia de la Comunicación A 3500 del BCRA (o tipo vendedor del Banco Nación si la moneda no es dólar). Una emisora en Bajo Impacto puede pasar al Régimen General sin que ello implique retiro de la oferta pública ni OPA por retiro. También tienen autorización automática los remates judiciales o extrajudiciales de valores por ejecución de garantías reales o fideicomisos de garantía, si cumplen las normas del mercado donde se subastan, y los fondos comunes de inversión sustancialmente equivalentes a otro ya aprobado por la misma sociedad gerente sin cambios en objetivo ni política de inversión.","Otras reformas de 2025 que el examen menciona: la RG 1097/2025 reescribió el Título I de las Normas unificando y actualizando definiciones transversales (Inversor Calificado, DUVA, PyME CNV, Ratio CEDEAR, Precio Equitativo), de modo que cada concepto se define una sola vez para todo el texto. La RG 1084/2025 simplificó y agilizó la autorización e inscripción de fideicomisos financieros reduciendo requisitos. La RG 1054/2025 obliga a los Agentes de Custodia, Registro y Pago a publicar la información de pagos de instrumentos PyME en plataformas de acceso libre y gratuito, para reducir asimetrías informativas; una plataforma solo para usuarios registrados no cumple. Los mercados deben implementar un mecanismo gratuito y permanente de difusión de los valores negociables en circulación (datos identificatorios, fechas, montos y emisores). La representación digital y la tokenización incorporan mecanismos basados en tecnología digital dentro del marco del valor negociable, sin alterar los requisitos legales de la oferta pública, con el objetivo de modernizar la operatoria mediante instrumentos digitales regulados."],"puntos":["Oferta privada (RG 1088/2025): invitaciones hasta 30 no calificados y 50 calificados; operaciones con máximo 35 adquirentes, de los cuales hasta 15 no calificados.","Elemento clave de la oferta privada: la categoría del destinatario (calificado / no calificado).","Confidencialidad: renunciable expresamente por inversores e intervinientes, a favor de los inversores.","Reventa en oferta privada: sin limitación si la transferencia es fuera de Argentina.","Oferta extraterritorial: sin límite de cantidad de inversores, precio ni monto; sin requisitos.","ON Bajo Impacto: oferta pública autorizada y regular, exenta de sanción por oferta irregular.","Acciones Mediano Impacto: tope 7.000.000 UVAs sumando emisiones por suscripción de los últimos 12 meses; excluidos privatizables, con participación estatal/FGS, entidades financieras, mercados y servicios públicos.","RG 1097/2025 = definiciones unificadas (Título I); RG 1084/2025 = fideicomisos simplificados; RG 1054/2025 = plataformas de acceso libre de los ACRyP."]},{"titulo":"5. Emisoras: ingreso al régimen, obligaciones y reglas societarias","parrafos":["Una sociedad ingresa al régimen de oferta pública presentando ante la CNV la solicitud con el Prospecto como documento básico, junto con el estatuto, los estados contables, la nómina de directores y síndicos y la documentación del Título II de las Normas. La CNV puede autorizar incluso a una sociedad con patrimonio neto negativo, siempre que el prospecto explique claramente los riesgos de la emisora: el régimen se basa en información completa, no en juzgar la calidad del negocio. Si la emisora no coloca los valores autorizados dentro del plazo previsto, la CNV cancela la autorización de oferta pública. Una vez admitida, la emisora debe informar la designación de sus autoridades a la CNV dentro de los 10 días hábiles y publicar sus avisos, hechos relevantes y estados financieros en la Autopista de la Información Financiera (AIF).","La vida societaria de una emisora combina la LGS con la LMC. La asamblea ordinaria que trata los estados contables y la designación de directores (art. 234 incs. 1 y 2 LGS y art. 71 LMC) debe celebrarse dentro de los cuatro meses del cierre del ejercicio. La convocatoria se publica entre 20 y 45 días corridos antes de la asamblea, la información debe estar disponible 20 días corridos antes y los accionistas con al menos el 2% del capital pueden presentar comentarios hasta 5 días corridos antes (art. 70). Las asambleas a distancia están permitidas si el estatuto prevé esa posibilidad y la emisora presentó ante la CNV el instructivo de asamblea a distancia. Para conocer el capital social se consultan el estatuto y los estados contables; para saber qué actividades puede desarrollar la sociedad, el estatuto (objeto social). El registro de accionistas puede llevarlo la propia emisora, un banco o Caja de Valores.","Sobre las acciones hay tres reglas que el examen repite. Las acciones preferidas con preferencia patrimonial normalmente carecen de voto, pero lo recuperan mientras la sociedad esté en mora en el pago de los beneficios que constituyen su preferencia (art. 217 LGS). Una vez en el régimen de oferta pública no pueden emitirse acciones ordinarias de voto privilegiado (art. 216 LGS), salvo en casos de ajuste de capital. Y los aportes irrevocables a cuenta de futuras emisiones deben tener contrapartida en un rubro de alta liquidez y la asamblea debe tratar su capitalización dentro de los 6 meses.","La adquisición de acciones propias (art. 64 LMC) está reservada a las sociedades anónimas que hacen oferta pública de sus acciones y exige: acciones totalmente integradas, resolución fundada del directorio con informe del comité de auditoría y de la comisión fiscalizadora, que se haga con ganancias realizadas y líquidas o reservas libres, y que el total no exceda el 10% del capital social (o el porcentaje menor que fije la CNV). Las acciones deben enajenarse dentro de los tres años. El principio que rige toda la operatoria es el trato igualitario entre todos los accionistas, por lo que se compra en el mercado o mediante OPA. Completan el cuadro normativo el art. 146 del Código Civil y Comercial, que la guía asocia a la definición de la personalidad jurídica (enumera a las personas jurídicas públicas: Estado nacional, provincias, CABA, municipios, entidades autárquicas), y el art. 274 de la LGS, que hace responsables ilimitada y solidariamente a los directores frente a la sociedad, los accionistas y los terceros por mal desempeño, violación de la ley o el estatuto, dolo, abuso de facultades o culpa grave."],"puntos":["Documento básico para solicitar la oferta pública: el Prospecto.","Patrimonio neto negativo no impide el ingreso si los riesgos están explicados en el prospecto.","No colocar en plazo: la CNV cancela la autorización.","Designación de autoridades: informar a la CNV en 10 días hábiles. Asamblea ordinaria: dentro de los 4 meses del cierre.","Asambleas a distancia: previstas en el estatuto + instructivo presentado ante la CNV.","Preferidas con preferencia patrimonial: votan si hay mora en el cobro de la preferencia. Voto privilegiado: prohibido tras el ingreso a oferta pública, salvo ajuste de capital.","Aportes irrevocables: contrapartida en rubro de alta liquidez; asamblea en 6 meses.","Acciones propias: solo SA con oferta pública de acciones; tope 10% del capital; trato igualitario; art. 274 LGS responsabilidad de directores; art. 146 CCyC personalidad jurídica."]},{"titulo":"6. Prospecto, programas, emisor frecuente y colocación primaria","parrafos":["El prospecto es el documento de información de la oferta pública: contiene la información financiera, los factores de riesgo, las características de los valores ofrecidos, los datos del emisor y del destino de los fondos. El examen insiste en una idea: los factores de riesgo se incluyen siempre, aunque resulten incómodos. En una fusión por absorción financiada con emisión de acciones hay que exponer los riesgos de apalancamiento y liquidez y sus efectos; los préstamos de capital de trabajo próximos a vencer y garantizados con participaciones en subsidiarias son un factor de riesgo aunque estén por vencer; y en una sociedad holding el riesgo principal es que depende de los resultados de sus subsidiarias para cumplir sus obligaciones y pagar dividendos. Son responsables por el contenido del prospecto los emisores, los oferentes, las personas que lo firman y los expertos o terceros que opinan sobre ciertas partes de él (art. 119 LMC); los agentes colocadores responden por la revisión diligente de la información (art. 120).","En los programas globales de obligaciones negociables conviven tres documentos. El prospecto del programa describe al emisor y los términos generales. El suplemento de prospecto describe cada serie y se publica en la AIF cuando el programa está vigente y actualizado y el suplemento incorpora la información actualizada del prospecto del programa. La adenda es una modificación del prospecto que se exige cuando se cambian términos y condiciones, se prorroga la vigencia del programa o se aumenta su monto. La actualización del prospecto por la aprobación de los estados financieros de un nuevo ejercicio anual es optativa, pero si se hace debe acompañarse con un informe de contador público independiente que opine sobre la información contenida. Toda emisión de ON con oferta pública exige publicar el aviso de emisión en la AIF.","El Emisor Frecuente es un régimen para emisoras con trayectoria en la oferta pública que obtienen un Registro de Emisor Frecuente y mantienen su prospecto o suplemento actualizado en la AIF. Mientras conserven esa condición y su documentación al día, no necesitan informar previamente a la CNV cada nueva emisión ni ratificar periódicamente su condición. Una sociedad que ya está en oferta pública por acciones puede ser emisor frecuente de ON, pero debe ingresar como emisor de obligaciones negociables y cumplir los requisitos que fija la CNV para ese régimen. Las ON se rigen por la Ley 23.576, que habilita a emitirlas a sociedades por acciones, cooperativas, asociaciones civiles, sucursales de sociedades extranjeras y, en el régimen PyME, a las SRL, con beneficios impositivos cuando se colocan por oferta pública.","La colocación primaria (Título VI de las Normas) debe hacerse mediante formación de libro (book building), subasta o licitación pública, con un período de difusión previo que debe ser suficiente para garantizar el adecuado conocimiento de la oferta por parte del público inversor. En una refinanciación, el requisito de colocación por oferta pública se considera cumplido si los acreedores que integran con ON sin oferta pública o créditos preexistentes no superan el 30% del monto total efectivamente colocado y el resto se integra en efectivo o con ON u otros valores con oferta pública y listado en mercados autorizados por la CNV. Una emisión cuyos fondos van a un proyecto verde cumple los requisitos si se ajusta a los Lineamientos para la Emisión de Valores Negociables Sociales, Verdes y Sustentables y es admitida por un mercado."],"puntos":["Prospecto: información financiera, riesgos, características de los valores y datos del emisor.","Factores de riesgo: siempre se incluyen (apalancamiento en fusión, préstamos por vencer, dependencia de subsidiarias).","Responsables del prospecto (art. 119 LMC): emisores, oferentes, firmantes y expertos/terceros que opinan.","Adenda: cambio de términos y condiciones, prórroga de vigencia o aumento de monto del programa.","Actualización anual del prospecto: optativa, con informe de contador público independiente.","Emisor frecuente: sin aviso previo por emisión y sin ratificación periódica mientras mantenga condición y documentación.","Colocación primaria: formación de libro, subasta o licitación pública; difusión suficiente.","Refinanciación: hasta 30% con ON sin oferta pública o créditos preexistentes. ON: Ley 23.576. Bonos verdes: Lineamientos + admisión en un mercado."]},{"titulo":"7. Emisoras extranjeras, doble listado y CEDEAR","parrafos":["Una sociedad constituida en el exterior puede ingresar al régimen argentino de oferta pública. Si lo hace sin emitir ni vender acciones nuevas, solo para que sus acciones existentes se negocien localmente, se trata de una oferta pública secundaria. Para operar en el país suele constituir una sucursal bajo el art. 118 de la LGS. Cuando es una holding sin activos propios que vive de sus participaciones, el factor de riesgo principal a exponer es que depende de los resultados de sus subsidiarias para cumplir sus obligaciones contractuales y pagar dividendos.","El Régimen de Doble Listado es la vía más económica para una sociedad que ya lista sus acciones en un mercado del exterior y quiere además listarlas en Argentina: le permite apoyarse en la información y la supervisión del mercado de origen, con menores costos y requisitos que el ingreso ordinario. Es la recomendación correcta para una minera canadiense que cotiza en Toronto y quiere cotizar también en Argentina gastando lo menos posible.","Las emisoras extranjeras también tienen un tratamiento propio al retirarse. La regla general del retiro es formular una OPA por el total de las acciones, pero cuando la sociedad lista en otro mercado con liquidez igual o superior a la del mercado local y garantiza a los accionistas mantener sus tenencias o venderlas en los mercados donde continúa listando, la OPA no es obligatoria.","El CEDEAR es un Certificado de Depósito Argentino representativo de valores negociables extranjeros (acciones, ETF) que se negocia en el país en pesos o dólares, emitido por un depositario local contra los valores custodiados en el exterior. El Ratio CEDEAR, ahora definido en el Título I de las Normas, indica cuántos certificados equivalen a un valor subyacente. No hay que confundirlo con el ADR, que es el espejo inverso: certificado emitido en Estados Unidos que representa acciones de una empresa argentina."],"puntos":["Ingreso de una extranjera sin acciones nuevas = oferta pública secundaria.","Holding: riesgo principal = dependencia de los resultados de las subsidiarias.","Doble listado: para emisoras ya listadas en el exterior, con menores costos y requisitos.","Retiro de una extranjera: no hay OPA obligatoria si lista en otro mercado con liquidez igual o superior y garantiza tenencias o venta.","CEDEAR: certificado de depósito de valores extranjeros negociado en Argentina; Ratio CEDEAR en el Título I.","Sucursal de sociedad extranjera: art. 118 LGS."]},{"titulo":"8. Inversores calificados, inversores institucionales y régimen PyME","parrafos":["La categoría de inversor calificado es transversal: delimita quién puede recibir una oferta privada, quién puede comprar valores del régimen PyME CNV y quién accede a productos de mayor riesgo. Son inversores calificados, entre otros: el Estado Nacional, las Provincias y Municipalidades, las entidades autárquicas, las sociedades y empresas del Estado; los organismos internacionales y personas jurídicas de derecho público; los fondos comunes de inversión; los fideicomisos financieros con oferta pública; las entidades financieras; las compañías de seguros, de reaseguros y las aseguradoras de riesgos del trabajo; las cajas previsionales y fondos de jubilaciones; los agentes registrados; y las personas humanas o jurídicas que acrediten inversiones en valores negociables o depósitos por más de 350.000 UVA. La definición quedó unificada en el Título I de las Normas por la RG 1097/2025. El concepto de inversor institucional (seguros, FCI, bancos, cajas previsionales) viene del Decreto 1087/1993.","La Ley 24.467 es la ley marco de la pequeña y mediana empresa; su autoridad de aplicación es la SEPyME, que fija los parámetros de ventas anuales por sector y administra el Registro de Empresas MiPyME y el Certificado MiPyME. A los solos efectos del acceso al mercado de capitales, las Normas CNV definen PyME CNV como aquellas que cuentan con Certificado MiPyME y están inscriptas en ese Registro; es decir, para ser PyME CNV hay que cumplir los parámetros de la SEPyME. La misma ley regula a las Sociedades de Garantía Recíproca (SGR), cuyo objeto principal es otorgar garantías a sus socios partícipes mediante contratos de garantía recíproca, financiadas por el fondo de riesgo que aportan los socios protectores. La negociación de cheques de pago diferido de una PyME en el segmento avalado requiere el aval de una SGR.","Hay dos regímenes PyME en las Normas. En el régimen PyME CNV (simplificado) la emisora presenta menos información que una emisora general, pero sus valores negociables solo pueden ser adquiridos por inversores calificados de las categorías que fijan las Normas. En el régimen PyME CNV Garantizada la emisión está garantizada en su totalidad por una entidad de garantía (SGR, entidad financiera o fondo de garantía): la emisora no debe presentar estados contables una vez admitida a la oferta pública, su control societario sigue en el Registro Público de su jurisdicción (no pasa a la CNV) y su régimen informativo es menor que el de las PyME CNV. Las SRL que califican como PyME CNV pueden emitir ON con un tope máximo fijado por parámetros de la CNV y por resolución de su reunión de socios.","La transparencia de los instrumentos PyME se complementa con la RG 1054/2025: los Agentes de Custodia, Registro y Pago deben publicar la información de pagos de instrumentos PyME en plataformas de acceso libre, gratuito y actualizado, para reducir asimetrías informativas entre el emisor, el intermediario y el inversor."],"puntos":["Inversores calificados: Estado y entes públicos, organismos internacionales, FCI, fideicomisos con OP, entidades financieras, seguros/reaseguros/ART, cajas previsionales, agentes registrados, personas con más de 350.000 UVA invertidas.","Inversores institucionales: Decreto 1087/1993.","PyME CNV = Certificado MiPyME + inscripción en el Registro MiPyME (Ley 24.467, SEPyME).","Régimen PyME CNV: valores solo para inversores calificados.","PyME CNV Garantizada: sin EECC tras la admisión; control societario en el Registro Público; régimen informativo menor.","SGR: objeto principal = garantías a socios partícipes mediante contratos. CPD avalados: aval de SGR.","SRL PyME CNV: tope de emisión por parámetros CNV + resolución de reunión de socios.","ACRyP: plataformas de acceso libre y gratuito para pagos de instrumentos PyME (RG 1054/2025)."]},{"titulo":"9. OPA obligatoria: principios, deberes, procedimiento y sanciones","parrafos":["La oferta pública de adquisición (OPA) es la invitación pública que una persona dirige a los accionistas de una sociedad con oferta pública para comprarles sus acciones con derecho a voto a un precio y en condiciones determinadas. Puede ser voluntaria u obligatoria. La LMC (arts. 86 a 98) y el Título III de las Normas regulan tres OPA obligatorias: por toma de control (art. 87), por participaciones residuales (art. 91) y por retiro
